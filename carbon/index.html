<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>透光 · LIGHT THROUGH</title>
<style>
  :root {
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #dcd0bc;
    font-family: var(--serif);
    color: #2c2118;
    cursor: none;
    touch-action: none;
  }
  #gl, #ov {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #gl { z-index: 1; }
  #ov { z-index: 2; pointer-events: none; }
  #ui {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  /* 序幕：浮在毛玻璃上的浅霜片名 */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.5s ease, filter 1.5s ease, transform 1.6s ease;
  }
  #intro.gone {
    opacity: 0;
    filter: blur(14px);
    transform: scale(1.03);
  }
  .title-frost {
    font-size: clamp(44px, 7.6vw, 88px);
    font-weight: 400;
    letter-spacing: 0.46em;
    padding-left: 0.46em;
    color: rgba(58, 43, 30, 0.82);
    text-shadow:
      0 1px 0 rgba(255, 253, 247, 0.92),
      0 10px 28px rgba(92, 68, 42, 0.16);
  }
  .title-sub {
    margin-top: clamp(16px, 2.4vh, 26px);
    font-size: clamp(15px, 1.7vw, 21px);
    letter-spacing: 0.24em;
    padding-left: 0.24em;
    color: rgba(74, 56, 40, 0.74);
    text-shadow: 0 1px 10px rgba(255, 252, 245, 0.85);
  }
  .title-whisper {
    position: absolute;
    bottom: 13.5vh;
    font-size: clamp(13px, 1.3vw, 16px);
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: rgba(88, 66, 46, 0.62);
    animation: frostBreathe 3.2s ease-in-out infinite;
    text-shadow: 0 1px 8px rgba(255, 252, 245, 0.8);
  }
  @keyframes frostBreathe {
    0%, 100% { opacity: 0.34; }
    50% { opacity: 0.86; }
  }

  /* 逐幕短白话与迟疑微光提示 */
  #caption-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 3.4vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9vh;
    text-align: center;
    padding: 0 4vw;
  }
  #line {
    font-size: clamp(17px, 2.0vw, 24px);
    letter-spacing: 0.22em;
    padding-left: 0.22em;
    color: rgba(250, 243, 230, 0.95);
    text-shadow:
      0 1px 6px rgba(24, 15, 9, 0.88),
      0 2px 18px rgba(28, 18, 11, 0.72);
    opacity: 0;
    filter: blur(7px);
    transform: translateY(5px);
    transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease, color 1.4s ease, text-shadow 1.4s ease;
  }
  #line.on {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
  #line.dusk {
    color: rgba(247, 236, 216, 0.92);
    text-shadow:
      0 2px 16px rgba(18, 11, 7, 0.92),
      0 0 28px rgba(24, 15, 9, 0.78);
  }
  #hint {
    font-size: clamp(12.5px, 1.25vw, 15.5px);
    letter-spacing: 0.24em;
    padding-left: 0.24em;
    color: rgba(82, 60, 42, 0.66);
    text-shadow: 0 0 12px rgba(248, 242, 230, 0.95);
    opacity: 0;
    transition: opacity 1.1s ease, color 1.2s ease;
  }
  #hint.on { opacity: 1; }
  #hint.dusk {
    color: rgba(235, 212, 176, 0.66);
    text-shadow: 0 1px 12px rgba(16, 10, 6, 0.9);
  }

  /* 终章角落无边框纯文字留存入口 */
  #coda-links {
    position: fixed;
    right: 6.4vw;
    bottom: 3.3vh;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 1.8vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #coda-links.on {
    opacity: 1;
    pointer-events: auto;
  }
  #coda-links span.sep {
    color: rgba(232, 210, 178, 0.28);
    font-size: 13px;
  }
  .plain-link {
    background: none;
    border: none;
    outline: none;
    font-family: var(--serif);
    font-size: clamp(13px, 1.25vw, 16px);
    letter-spacing: 0.24em;
    color: rgba(236, 216, 186, 0.58);
    cursor: none;
    padding: 4px 2px;
    text-shadow: 0 1px 10px rgba(12, 8, 5, 0.85);
    transition: color 0.35s ease, opacity 0.35s ease;
  }
  .plain-link:hover {
    color: rgba(255, 244, 222, 0.98);
  }

  /* 角落极淡静音图标（全片唯一常驻控制点） */
  #mute {
    position: fixed;
    right: 2.2vw;
    bottom: 2.8vh;
    z-index: 6;
    width: 36px;
    height: 36px;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.38;
    cursor: none;
    transition: opacity 0.35s ease, color 1.4s ease;
    color: #4a3728;
  }
  #mute:hover { opacity: 0.85; }
  #mute.dusk { color: #e8d4b4; }
  #mute svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: inline; }

  #fallback {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: #efe6d5;
    color: #3a271c;
    font-size: 18px;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="ui">
  <div id="intro">
    <div class="title-frost">透 光</div>
    <div class="title-sub">玻璃，起初是一层雾。</div>
    <div class="title-whisper">轻触玻璃，迎进午后日光</div>
  </div>
  <div id="caption-wrap">
    <div id="line"></div>
    <div id="hint"></div>
  </div>
</div>
<div id="coda-links">
  <button class="plain-link" id="save-btn" type="button">留存此窗</button>
  <span class="sep">·</span>
  <button class="plain-link" id="again-btn" type="button">再做一扇</button>
</div>
<button id="mute" type="button" aria-label="静音" title="静音 (M)">
  <svg viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <g class="on">
      <path d="M15.5 9a4 4 0 0 1 0 6"/>
      <path d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/>
    </g>
    <g class="off">
      <path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </g>
  </svg>
</button>
<div id="fallback">需要支持 WebGL2 的现代浏览器打开此窗</div>

<script>
(() => {
'use strict';

/* ============================================================================
 * 0. 参数、确定性随机与数学工具
 * ============================================================================ */
const Q = new URLSearchParams(location.search);
const SPEED = Math.max(0.2, Math.min(8, parseFloat(Q.get('speed') || '1')));
const START_ACT = Q.has('act') ? parseInt(Q.get('act'), 10) : -1;

const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a || 1e-6), 0, 1);
  return t * t * (3 - 2 * t);
};
const easeInOut = (t) => -(Math.cos(Math.PI * clamp(t, 0, 1)) - 1) * 0.5;
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const TAU = Math.PI * 2;

const SEED = ((Math.random() * 1e9) | 0) ^ 0x5A39C1;
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(SEED);
const rand = (a = 0, b = 1) => a + (b - a) * rnd();

function hash1(n) {
  const s = Math.sin(n * 127.1 + (SEED % 4093) * 0.37) * 43758.5453123;
  return s - Math.floor(s);
}
function noise1(x, k = 0) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(hash1(i + k * 57.13), hash1(i + 1 + k * 57.13), u);
}
function fbm1(x, k = 0) {
  let v = 0, a = 0.5, fr = 1;
  for (let o = 0; o < 4; o++) {
    v += a * noise1(x * fr, k + o * 13.7);
    fr *= 2.03;
    a *= 0.5;
  }
  return v / 0.9375;
}

/* ============================================================================
 * 1. 花窗三维几何常量与统一相机矩阵
 *    - 平放态 (flip=0): 窗框平铺在桦木工作台 Y=0 上方
 *    - 立窗态 (flip=1): 窗框绕下沿立起在暮色木屋 Z=0 窗台上，斜阳穿窗投射满地彩色焦散
 * ============================================================================ */
const WIN = {
  inW: 1.44,
  inH: 1.00,
  frSide: 0.088,
  frTop: 0.088,
  frBot: 0.098,
  thick: 0.036
};
WIN.outW = WIN.inW + WIN.frSide * 2; // 1.616
WIN.outH = WIN.inH + WIN.frTop + WIN.frBot; // 1.186

const TEX_W = 1440;
const TEX_H = 1000;

const CAM = {
  pos: [0, 1.56, 0.14],
  target: [0, 0.02, -0.01],
  tanH: 0.42,
  flip: 0,       // 0 = 木案俯视, 1 = 3D 木屋立窗
  zoomPos: [0, 1.56, 0.14],
  zoomTarget: [0, 0.02, -0.01],
  sunAz: -0.18,  // 终章斜阳水平偏角（可由指针实时拨动）
  sunEl: 0.64,   // 终章斜阳仰角弧度 (~36.6°，令整扇窗焦散完整落在前景木地板上)
  roomDim: 0,    // 工坊顶光熄灭 -> 暮色木屋过渡
  latch: 0       // 第五幕右下角黄铜铭牌与窗闩合拢度
};

function winFrameBasis(flip) {
  const s = easeInOut(flip);
  const ang = s * (Math.PI * 0.5); // 0 -> 90°
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const pivot = [0, lerp(0.026, 0.39, s), lerp(WIN.outH * 0.5, 0.0, s)];
  const right = [1, 0, 0];
  const up = [0, sa, -ca];    // flip=0 -> (0,0,-1); flip=1 -> (0,1,0)
  const norm = [0, ca, sa];   // flip=0 -> (0,1,0);  flip=1 -> (0,0,1)
  return { pivot, right, up, norm, ang, s };
}

// 花窗内部 UV [0..1, 0..1] 转三维世界坐标
function uvToWorld(u, v, zOff = 0) {
  const B = winFrameBasis(CAM.flip);
  const lx = (u - 0.5) * WIN.inW;
  const ly = WIN.frBot + v * WIN.inH;
  return [
    B.pivot[0] + B.right[0] * lx + B.up[0] * ly + B.norm[0] * zOff,
    B.pivot[1] + B.right[1] * lx + B.up[1] * ly + B.norm[1] * zOff,
    B.pivot[2] + B.right[2] * lx + B.up[2] * ly + B.norm[2] * zOff
  ];
}

// 窗框局部坐标 (lx in [-outW/2..outW/2], ly in [0..outH]) 转三维世界坐标
function localWinToWorld(lx, ly, zOff = 0) {
  const B = winFrameBasis(CAM.flip);
  return [
    B.pivot[0] + B.right[0] * lx + B.up[0] * ly + B.norm[0] * zOff,
    B.pivot[1] + B.right[1] * lx + B.up[1] * ly + B.norm[1] * zOff,
    B.pivot[2] + B.right[2] * lx + B.up[2] * ly + B.norm[2] * zOff
  ];
}

const vSub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vDot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vCross = (a, b) => [
  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],
  a[0] * b[1] - a[1] * b[0]
];
const vNorm = (a) => {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
};

function getCamBasis() {
  const f = vNorm(vSub(CAM.target, CAM.pos));
  // 当接近垂直俯视时用 (0, 0, -1) 与 (0, 1, 0) 平滑混合作为 worldUp，彻底消除万向节跳变
  const upHint = vNorm([0, lerp(0.18, 1.0, CAM.flip), lerp(-1.0, 0.0, CAM.flip)]);
  const r = vNorm(vCross(f, upHint));
  const u = vCross(r, f);
  return { f, r, u };
}

let VW = window.innerWidth, VH = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

function worldToScreen(P) {
  const B = getCamBasis();
  const rel = vSub(P, CAM.pos);
  const cz = vDot(rel, B.f);
  if (cz <= 0.02) return null;
  const aspect = VW / Math.max(1, VH);
  const ndcX = vDot(rel, B.r) / (cz * CAM.tanH * aspect);
  const ndcY = vDot(rel, B.u) / (cz * CAM.tanH);
  return [
    (ndcX * 0.5 + 0.5) * VW,
    (0.5 - ndcY * 0.5) * VH,
    cz
  ];
}

function screenToWindowUV(sx, sy) {
  const B = getCamBasis();
  const aspect = VW / Math.max(1, VH);
  const ndcX = (sx / VW) * 2 - 1;
  const ndcY = 1 - (sy / VH) * 2;
  const dir = vNorm([
    B.f[0] + B.r[0] * ndcX * CAM.tanH * aspect + B.u[0] * ndcY * CAM.tanH,
    B.f[1] + B.r[1] * ndcX * CAM.tanH * aspect + B.u[1] * ndcY * CAM.tanH,
    B.f[2] + B.r[2] * ndcX * CAM.tanH * aspect + B.u[2] * ndcY * CAM.tanH
  ]);
  const WB = winFrameBasis(CAM.flip);
  const denom = vDot(dir, WB.norm);
  if (Math.abs(denom) < 1e-5) return null;
  const t = vDot(vSub(WB.pivot, CAM.pos), WB.norm) / denom;
  if (t <= 0) return null;
  const hit = [
    CAM.pos[0] + dir[0] * t - WB.pivot[0],
    CAM.pos[1] + dir[1] * t - WB.pivot[1],
    CAM.pos[2] + dir[2] * t - WB.pivot[2]
  ];
  const lx = vDot(hit, WB.right);
  const ly = vDot(hit, WB.up);
  const u = lx / WIN.inW + 0.5;
  const v = (ly - WIN.frBot) / WIN.inH;
  return { u, v, lx, ly };
}

/* ============================================================================
 * 2. WebGL2 初始化与全三维实时光学/焦散/丁达尔着色器
 * ============================================================================ */
const glCanvas = $('#gl');
const ovCanvas = $('#ov');
const octx = ovCanvas.getContext('2d');

const gl = glCanvas.getContext('webgl2', {
  alpha: false,
  antialias: false,
  depth: false,
  stencil: false,
  preserveDrawingBuffer: false,
  powerPreference: 'high-performance'
});

if (!gl) {
  $('#fallback').style.display = 'flex';
  throw new Error('WebGL2 unavailable');
}
const anisoExt = gl.getExtension('EXT_texture_filter_anisotropic');

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const info = gl.getShaderInfoLog(s);
    console.error('Shader error:\n', info);
    throw new Error(info);
  }
  return s;
}

function createProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  const u = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadVBO = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const VS_QUAD = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uPaneTex;   // RGB: 矿物琉璃透射色, A: 注彩清澈度 (0=磨砂海玻璃原片, 1=通透彩玻)
uniform sampler2D uMetalTex;  // R: 黄铜铅条遮罩, G: 锤纹高光脊, B: 熔融橙金热度, A: 铅条内阴影
uniform sampler2D uFrostTex;  // R: 金刚石刻霜银丝密度, G: 晶面闪烁相位
uniform sampler2D uDustTex;   // R: 第五幕石膏固封浮灰遮罩
uniform sampler2D uGrainTex;  // RGBA: 可平铺噪声纹理 (R=低频流云, G=中频砂粒, B=木纹条带, A=高频晶粒)

uniform vec3 uCamPos, uCamF, uCamR, uCamU;
uniform float uTanH, uAspect, uTime;
uniform vec3 uWinPivot, uWinRight, uWinUp, uWinNorm;
uniform vec4 uWinDim;     // x=inW, y=inH, z=outW, w=outH
uniform vec2 uFrOff;      // x=frSide, y=frBot
uniform float uFlip;      // 0=木案平放, 1=木屋立窗
uniform float uRoomDim;   // 0=午后工坊亮案, 1=暮色木屋
uniform vec3 uSunDir;     // 指向太阳的单位向量
uniform float uDustAmt;   // 第五幕浮灰总权重
uniform float uLatch;     // 右下角黄铜火漆铭牌嵌入度
uniform vec2 uPtrUV;      // 光标在花窗上的 UV

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

vec4 gNoise(vec2 p) {
  return texture(uGrainTex, p);
}

// 程序化温润桦木工坊桌面 (前五幕 #efe6d5 -> #cbbba0) 与深胡桃木拼接地板 (终章 #1c140e -> #2e1f15)
vec3 evalWoodFloor(vec2 xz, float duskMix, out float rough) {
  // 桦木案台纹理
  vec2 bUv = xz * vec2(0.42, 0.16);
  float bGrain = gNoise(bUv).b * 0.65 + gNoise(bUv * 2.7 + 0.31).r * 0.35;
  float bFine = gNoise(xz * vec2(3.2, 0.7)).g;
  vec3 birchLight = vec3(0.945, 0.906, 0.840);
  vec3 birchWarm  = vec3(0.855, 0.788, 0.682);
  vec3 birch = mix(birchWarm, birchLight, smoothstep(0.22, 0.82, bGrain));
  birch *= 0.96 + 0.07 * bFine;
  // 桌面柔和斜阳窗框暗角
  float benchVig = smoothstep(2.2, 0.35, length(xz * vec2(0.75, 0.95)));
  birch = mix(birch * vec3(0.81, 0.76, 0.69), birch, benchVig);

  // 终章深暖胡桃木拼接地板 (#1c140e 暖棕木蜡质感，绝无冷蓝)
  float plankW = 0.26;
  float pid = floor(xz.x / plankW);
  float px = fract(xz.x / plankW);
  float seam = smoothstep(0.0, 0.028, px) * smoothstep(1.0, 0.972, px);
  float endZ = fract(xz.y * 0.42 + hash21(vec2(pid, 3.7)));
  seam *= smoothstep(0.0, 0.012, endZ) * smoothstep(1.0, 0.988, endZ);

  vec2 wUv = vec2(xz.x * 1.4 + pid * 0.37, xz.y * 0.22 + hash21(vec2(pid, 9.1)));
  float wRing = sin((wUv.x * 9.0 + gNoise(wUv * 1.8).r * 4.5)) * 0.5 + 0.5;
  float wStr  = gNoise(vec2(xz.x * 5.0, xz.y * 0.65 + pid * 0.19)).b;
  float toneVar = 0.86 + 0.26 * hash21(vec2(pid, 1.3));
  vec3 walDark = vec3(0.112, 0.076, 0.052) * toneVar;
  vec3 walMid  = vec3(0.195, 0.132, 0.088) * toneVar;
  vec3 walnut = mix(walDark, walMid, wRing * 0.55 + wStr * 0.45);
  walnut *= 0.55 + 0.45 * seam;

  rough = mix(0.62, 0.36 + 0.18 * wStr, duskMix);
  return mix(birch, walnut, duskMix);
}

// 旧胡桃木窗框与四角锤纹黄铜包角 + 右下角手作黄铜铭牌
vec3 evalWindowFrame(vec2 loc, vec2 glassUV) {
  float hw = uWinDim.z * 0.5;
  float lx = loc.x, ly = loc.y;
  // 木框纹理沿边框方向走
  bool horzBar = (ly < uFrOff.y + 0.008) || (ly > uWinDim.w - (uWinDim.w - uWinDim.y - uFrOff.y) - 0.008);
  vec2 fUv = horzBar ? vec2(lx * 0.55, ly * 4.2) : vec2(ly * 0.55, lx * 4.2);
  float gr = gNoise(fUv).b * 0.6 + gNoise(fUv * 2.4 + 0.17).r * 0.4;
  vec3 wDark = vec3(0.145, 0.092, 0.060); // #24170f
  vec3 wMain = vec3(0.235, 0.155, 0.108); // #3a271c
  vec3 wHi   = vec3(0.368, 0.255, 0.182); // #5c402e
  vec3 wood = mix(wDark, wMain, smoothstep(0.18, 0.82, gr));

  // 内侧玻璃卡槽斜切倒角高光
  float dxIn = abs(lx) - uWinDim.x * 0.5;
  float dyBot = uFrOff.y - ly;
  float dyTop = ly - (uFrOff.y + uWinDim.y);
  float innerDist = max(dxIn, max(dyBot, dyTop));
  float bevel = exp(-max(innerDist, 0.0) / 0.014);
  wood = mix(wood, wHi, bevel * 0.58);

  // 外沿圆润暗边
  float outerDist = min(hw - abs(lx), min(ly, uWinDim.w - ly));
  wood *= 0.72 + 0.28 * smoothstep(0.0, 0.016, outerDist);

  // 四角手工锤纹黄铜 L 型包角
  float cx = hw - abs(lx);
  float cy = min(ly, uWinDim.w - ly);
  bool cornerL = (cx < 0.125 && cy < 0.036) || (cy < 0.125 && cx < 0.036);
  if (cornerL) {
    float dimple = gNoise(loc * 16.0).g;
    vec3 brass = mix(vec3(0.33, 0.24, 0.15), vec3(0.76, 0.59, 0.36), smoothstep(0.28, 0.78, dimple));
    // 铜铆钉小圆点
    vec2 rv = vec2(cx - 0.020, cy - 0.020);
    float rivet = smoothstep(0.006, 0.003, length(rv));
    brass = mix(brass, vec3(0.88, 0.72, 0.46), rivet * 0.7);
    wood = brass;
  }

  // 右下角第五幕嵌入的方形手作黄铜铭牌（前四幕保持温润完整木框，不露黑洞）
  vec2 plaqueC = vec2(uWinDim.x * 0.5 - 0.075, uFrOff.y * 0.50);
  vec2 pd = abs(loc - plaqueC);
  if (pd.x < 0.056 && pd.y < 0.024 && uLatch > 0.01) {
    float pDimple = gNoise(loc * 22.0 + 0.4).g;
    vec3 plate = mix(vec3(0.48, 0.35, 0.20), vec3(0.88, 0.71, 0.44), smoothstep(0.25, 0.8, pDimple));
    float rim = smoothstep(0.054, 0.049, pd.x) * smoothstep(0.022, 0.018, pd.y);
    plate *= 0.78 + 0.28 * rim;
    float engrave = step(abs(loc.y - plaqueC.y), 0.0032) * step(pd.x, 0.040) * step(0.35, fract(loc.x * 160.0));
    plate = mix(plate, vec3(0.24, 0.16, 0.09), engrave * 0.52);
    wood = mix(wood * 0.92, plate, clamp(uLatch, 0.0, 1.0));
  }
  return wood;
}

// 采样花窗玻璃光学属性：返回透射滤光色 transCol，以及表面反射色 surfCol
void sampleStainedGlass(vec2 uv, vec3 viewDir, vec3 sunDir, float duskMix, out vec3 surfCol, out vec3 transCol, out float opacity) {
  vec4 pane = texture(uPaneTex, uv);
  vec4 met  = texture(uMetalTex, uv);
  vec4 frs  = texture(uFrostTex, uv);
  float dust = texture(uDustTex, uv).r * uDustAmt;

  vec4 gn = gNoise(uv * vec2(3.6, 2.5));
  vec4 gnFine = gNoise(uv * vec2(19.0, 13.5));

  // 1. 未注釉处：半透明暖乳白磨砂海玻璃原片 (#f4efe4，细砂粒 + 微气泡感)
  vec3 frostedGlass = vec3(0.956, 0.935, 0.892) * (0.94 + 0.09 * gnFine.g);
  float glazeAmt = pane.a;

  // 2. 已注釉处：透明矿物琉璃色 + 吹制流云微起伏折射
  vec2 swirlOff = (gn.rg - 0.5) * 0.008;
  vec3 mineralRgb = mix(frostedGlass, pane.rgb, glazeAmt);
  // 铅条向玻璃内部投下的 2px 柔和立体斜影
  mineralRgb *= 1.0 - met.a * 0.26;

  // 3. 金刚石刻霜林木与芦苇 (#fffdf7 高折射冰晶银白 + #f5d89a 极淡暖金光晕)
  float frost = frs.r;
  float frostHalo = texture(uFrostTex, uv + vec2(0.0022, 0.0028)).r;
  float sparkle = 0.78 + 0.22 * sin(uTime * 2.6 + frs.g * 25.0 + gnFine.a * 12.0);
  vec3 frostTint = vec3(1.0, 0.992, 0.968) * sparkle;
  mineralRgb = mix(mineralRgb, mineralRgb + vec3(0.96, 0.85, 0.60) * 0.35, clamp(frostHalo - frost, 0.0, 1.0));
  mineralRgb = mix(mineralRgb, frostTint, frost * 0.92);

  // 4. 背光/斜阳穿透玻璃时的宝石透射辉光
  float sunAlign = pow(max(dot(-viewDir, sunDir), 0.0), 4.0);
  vec3 backlitBoost = mineralRgb * (1.08 + duskMix * (0.52 + 1.15 * sunAlign) * (0.35 + 0.65 * glazeAmt));
  // 刻霜在斜阳逆光下迸发金白碎光
  backlitBoost += vec3(1.0, 0.93, 0.74) * frost * duskMix * (0.45 + 0.85 * sunAlign);

  // 表面斜掠高光 (拭去浮灰后尤为清澈)
  float clean = 1.0 - dust * 0.85;
  float sheen = smoothstep(0.58, 0.95, sin(uv.x * 5.2 + uv.y * 3.6 + uCamPos.x * 1.5) * 0.5 + 0.5 + gn.r * 0.15);
  vec3 glassFinal = backlitBoost + vec3(1.0, 0.97, 0.90) * sheen * 0.08 * clean * (1.0 - duskMix * 0.4);

  // 第五幕薄暖白石膏固封浮灰 (使饱和度暂降 ~35%，擦拭后瞬间清亮通透)
  if (dust > 0.005) {
    float luma = dot(glassFinal, vec3(0.299, 0.587, 0.114));
    vec3 desat = mix(glassFinal, vec3(luma), 0.38);
    vec3 chalk = vec3(0.935, 0.910, 0.865) * (0.94 + 0.10 * gnFine.r);
    glassFinal = mix(glassFinal, mix(desat, chalk, 0.44), dust);
  }

  // 5. 黄铜嵌条（铅条）：冷却三层锤纹古铜 + 刚划出 0.6s 内的橙金熔融自发光
  float cameMask = met.r;
  if (cameMask > 0.01) {
    float ridgeHi = met.g;
    float molten  = met.b;
    float hammer  = gNoise(uv * vec2(42.0, 30.0)).g;
    vec3 cDark = vec3(0.137, 0.102, 0.078); // #231a14
    vec3 cBody = vec3(0.322, 0.243, 0.161); // #523e29
    vec3 cSpec = vec3(0.812, 0.659, 0.431); // #cfa86e
    vec3 brassCol = mix(cDark, cBody, smoothstep(0.08, 0.52, ridgeHi));
    brassCol = mix(brassCol, cSpec, smoothstep(0.58, 0.96, ridgeHi * (0.78 + 0.42 * hammer)));
    // 终章逆光下铜条呈温润深古铜剪影并泛金边
    brassCol *= mix(1.0, 0.48 + 0.35 * ridgeHi, duskMix);
    // 熔融态橙金发光 (#e89b48 -> #c87a28)
    vec3 hotCol = mix(vec3(0.784, 0.478, 0.157), vec3(0.98, 0.72, 0.32), molten);
    brassCol = mix(brassCol, hotCol * 1.25, smoothstep(0.02, 0.65, molten));
    glassFinal = mix(glassFinal, brassCol, cameMask);
  }

  // 指针贴近玻璃时的柔和暖光晕
  float dPtr = length((uv - uPtrUV) * vec2(1.44, 1.0));
  glassFinal += vec3(0.98, 0.86, 0.62) * exp(-dPtr * 13.0) * 0.065 * (1.0 - duskMix * 0.5);

  surfCol = glassFinal;

  // 光学透射率（供地板/桌面彩色焦散投射与丁达尔体积光采样！）
  // 铜条阻挡光线投下窗棂暗影；彩玻将阳光染成高通透矿物色；刻霜在焦散中折出亮金白丝光
  vec3 rawPane = mix(vec3(0.90, 0.86, 0.78), pane.rgb * 1.22, glazeAmt);
  rawPane = mix(rawPane, vec3(1.18, 1.08, 0.86), frost * 0.75);
  rawPane *= (1.0 - dust * 0.32);
  transCol = rawPane * (1.0 - cameMask * 0.94);
  opacity = mix(0.35, 0.18, glazeAmt) * (1.0 - cameMask) + cameMask;
}

// 窗外暮色夕阳天空（温暖琥珀晚霞，绝不用冷蓝夜空）
vec3 evalSunsetSky(vec3 rd, vec3 sunDir) {
  float h = clamp(rd.y, -0.05, 1.0);
  vec3 horCol = vec3(0.96, 0.66, 0.34); // 暖金珀地平线
  vec3 midCol = vec3(0.76, 0.44, 0.30); // 浅茜珀晚霞
  vec3 topCol = vec3(0.34, 0.24, 0.22); // 暖褐暮色天顶
  vec3 sky = h < 0.28
    ? mix(horCol, midCol, smoothstep(0.0, 0.28, h))
    : mix(midCol, topCol, smoothstep(0.28, 0.85, h));

  float sd = max(dot(rd, sunDir), 0.0);
  // 柔和层云受夕阳染金
  vec2 cUv = vec2(rd.x / (abs(rd.y) + 0.22) * 0.18 + uTime * 0.004, rd.y * 0.9);
  float cl = gNoise(cUv).r * 0.65 + gNoise(cUv * 2.3 + 0.4).g * 0.35;
  vec3 cloudCol = mix(vec3(0.45, 0.29, 0.22), vec3(1.05, 0.78, 0.46), pow(sd, 2.0) * 0.8 + 0.2);
  sky = mix(sky, cloudCol, smoothstep(0.42, 0.78, cl) * 0.45 * smoothstep(0.02, 0.25, h));

  // 夕阳暖冕与日轮
  sky += vec3(1.15, 0.82, 0.42) * (pow(sd, 7.0) * 0.45 + pow(sd, 48.0) * 0.85);
  sky += vec3(1.35, 1.12, 0.78) * smoothstep(0.9965, 0.9992, sd) * 1.1;

  // 窗外远处极淡暖黛山影
  float mtnH = 0.045 + 0.035 * sin(rd.x * 3.2 + 0.6) + 0.018 * sin(rd.x * 7.5);
  sky = mix(sky, vec3(0.26, 0.18, 0.14), smoothstep(mtnH + 0.006, mtnH - 0.006, rd.y));
  return sky;
}

// 计算世界空间任意受光点 P 经花窗平面后的实时彩色焦散透射光！
vec3 evalWindowCausticAt(vec3 P, vec3 sunDir, float duskMix) {
  float denom = dot(sunDir, uWinNorm);
  // 光线从点 P 朝太阳方向 uSunDir 逆向追溯，求交花窗所在平面
  // 注意 uWinNorm 在 flip=0 时为 (0,1,0)，uSunDir.y > 0 -> tHit > 0
  // 在 flip=1 时 uWinNorm 为 (0,0,1)，太阳在窗外 Z<0，所以 uSunDir.z < 0 -> denom < 0，从室内 Z>0 朝 Z=0 逆追 tHit > 0！
  if (abs(denom) < 1e-4) return vec3(1.0);
  float tHit = dot(uWinPivot - P, uWinNorm) / denom;
  if (tHit <= 0.0) return vec3(1.0 - duskMix * 0.82);

  vec3 H = P + sunDir * tHit;
  vec3 rel = H - uWinPivot;
  float lx = dot(rel, uWinRight);
  float ly = dot(rel, uWinUp);
  float hw = uWinDim.z * 0.5;

  // 在木屋模式下，窗框以外的墙体阻挡阳光（只留这扇花窗透光进屋！）
  bool inOuter = (abs(lx) <= hw) && (ly >= 0.0) && (ly <= uWinDim.w);
  if (!inOuter) {
    return mix(vec3(1.0), vec3(0.09, 0.064, 0.046), duskMix);
  }

  float u = lx / uWinDim.x + 0.5;
  float v = (ly - uFrOff.y) / uWinDim.y;
  bool inGlass = (u >= 0.0 && u <= 1.0 && v >= 0.0 && v <= 1.0);
  if (!inGlass) {
    // 实心胡桃木窗框投下扎实暗影
    return mix(vec3(0.52, 0.47, 0.41), vec3(0.065, 0.045, 0.032), duskMix);
  }

  // 采样花窗玻璃颜色并叠加水波状光学焦散微折射 (Caustic Shimmer)
  vec2 caustWarp = vec2(
    sin(u * 26.0 + v * 14.0 + uTime * 1.15) + sin(u * 48.0 - uTime * 0.85) * 0.5,
    cos(v * 24.0 - u * 16.0 + uTime * 0.95) + cos(v * 44.0 + uTime * 1.10) * 0.5
  ) * (0.0022 + 0.0042 * duskMix);

  vec2 suv = clamp(vec2(u, v) + caustWarp, 0.001, 0.999);
  vec4 pane = texture(uPaneTex, suv);
  vec4 met  = texture(uMetalTex, suv);
  vec4 frs  = texture(uFrostTex, suv);
  float dust = texture(uDustTex, suv).r * uDustAmt;

  // 焦散汇聚亮纹（玻璃吹制起伏使局部光线汇聚发亮）
  float nA = gNoise(suv * vec2(6.5, 4.8) + vec2(uTime * 0.018, -uTime * 0.012)).r;
  float nB = gNoise(suv * vec2(11.0, 8.2) - vec2(uTime * 0.014, uTime * 0.020)).g;
  float causticFocus = 0.78 + 0.68 * pow(clamp(nA * 0.6 + nB * 0.55, 0.0, 1.0), 2.2);

  vec3 clearWarm = vec3(0.96, 0.90, 0.80);
  vec3 tint = mix(clearWarm * 0.82, pane.rgb * 1.48, pane.a);
  // 刻霜林木在地板光斑中投出闪烁的金白晶丝
  tint += vec3(1.15, 0.98, 0.68) * frs.r * 0.85;
  tint *= (1.0 - dust * 0.36);
  // 黄铜铅条在地板上投出清晰的窗格暗线
  tint *= (1.0 - met.r * mix(0.55, 0.88, duskMix));

  // 边缘柔化色散（棱镜微红蓝边）
  float rShift = texture(uMetalTex, clamp(suv + vec2(0.0025, 0.0), 0.0, 1.0)).r;
  tint.r += (met.r - rShift) * 0.14 * duskMix;

  return mix(
    mix(vec3(0.95, 0.91, 0.85), tint * 1.02, 0.52),
    tint * causticFocus * 1.55,
    duskMix
  );
}

vec3 acesFilm(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 rd = normalize(uCamF + uCamR * (ndc.x * uTanH * uAspect) + uCamU * (ndc.y * uTanH));
  vec3 ro = uCamPos;
  float dusk = clamp(uRoomDim, 0.0, 1.0);

  // 1. 求最近场景交点：地板/桌面 (Y = 0) vs 木屋背景窗墙 (Z = -0.02, 仅立窗时渐显) vs 花窗实体平面
  float tBest = 1e9;
  int hitKind = 0; // 0=sky, 1=floor/bench, 2=window, 3=roomWall
  vec2 winLoc = vec2(0.0);

  // 地板 / 桦木工作台平面 Y = 0
  if (rd.y < -1e-4) {
    float tf = -ro.y / rd.y;
    if (tf > 0.0 && tf < tBest) {
      vec3 pf = ro + rd * tf;
      // 立窗模式下 Z < -0.02 是窗外天空，不画室内地板
      if (dusk < 0.5 || pf.z >= -0.02) {
        tBest = tf;
        hitKind = 1;
      }
    }
  }

  // 立窗模式下室内侧墙与窗下胡桃木护墙板：墙面 Z 坐标始终退在翻转中花窗的最远端之后，彻底杜绝翻转中途穿模！
  float backWallZ = min(uWinPivot.z + uWinUp.z * uWinDim.w, 0.0) - 0.022;
  if (dusk > 0.28) {
    if (abs(rd.z) > 1e-4) {
      float tw = (backWallZ - ro.z) / rd.z;
      if (tw > 0.0 && tw < tBest) {
        vec3 pw = ro + rd * tw;
        bool inOpening = (abs(pw.x) < uWinDim.x * 0.495)
          && (pw.y > uWinPivot.y + uFrOff.y * 0.85)
          && (pw.y < uWinPivot.y + uWinDim.w - 0.04);
        if (!inOpening && pw.y >= 0.0) {
          tBest = tw;
          hitKind = 3;
        }
      }
    }
    for (int s = -1; s <= 1; s += 2) {
      float wx = float(s) * 1.62;
      if (abs(rd.x) > 1e-4) {
        float ts = (wx - ro.x) / rd.x;
        if (ts > 0.0 && ts < tBest) {
          vec3 ps = ro + rd * ts;
          if (ps.y >= 0.0 && ps.z >= backWallZ) {
            tBest = ts;
            hitKind = 4;
          }
        }
      }
    }
  }

  // 花窗平面求交（含胡桃木外框与内部彩绘玻璃）
  float denomW = dot(rd, uWinNorm);
  if (abs(denomW) > 1e-5) {
    float tw = dot(uWinPivot - ro, uWinNorm) / denomW;
    if (tw > 0.0 && tw < tBest) {
      vec3 pw = ro + rd * tw;
      vec3 rel = pw - uWinPivot;
      float lx = dot(rel, uWinRight);
      float ly = dot(rel, uWinUp);
      if (abs(lx) <= uWinDim.z * 0.5 && ly >= 0.0 && ly <= uWinDim.w) {
        tBest = tw;
        hitKind = 2;
        winLoc = vec2(lx, ly);
      }
    }
  }

  vec3 col = vec3(0.0);

  if (hitKind == 0) {
    col = evalSunsetSky(rd, uSunDir);
  } else if (hitKind == 1) {
    vec3 P = ro + rd * tBest;
    float rough = 0.5;
    vec3 wood = evalWoodFloor(P.xz, dusk, rough);
    vec3 caust = evalWindowCausticAt(P, uSunDir, dusk);

    // 窗户暖光对周围深胡桃木地板的柔和漫反射照亮（呈现温润木纹而不死黑）
    float winBounce = exp(-length((P.xz - vec2(0.0, 1.15)) * vec2(0.75, 0.55)) * 0.95);
    vec3 amb = mix(vec3(0.98, 0.95, 0.90), vec3(0.20, 0.145, 0.105) + vec3(0.28, 0.19, 0.11) * winBounce, dusk);
    vec3 sunBeam = mix(vec3(0.14, 0.12, 0.09), vec3(2.15, 1.68, 1.12), dusk);
    vec3 caustGlow = max(caust - vec3(0.10), vec3(0.0));
    col = wood * amb * (0.65 + 0.55 * caust) + (wood * 0.62 + vec3(0.11, 0.08, 0.055)) * sunBeam * caustGlow;

    // 立窗模式下：深胡桃木地板对上方发光花窗的温润木蜡倒影！
    if (dusk > 0.15 && P.z > 0.02) {
      vec3 reflDir = normalize(vec3(rd.x, -rd.y, rd.z));
      float dR = dot(reflDir, uWinNorm);
      if (abs(dR) > 1e-4) {
        float tr = dot(uWinPivot - P, uWinNorm) / dR;
        if (tr > 0.0) {
          vec3 hr = P + reflDir * tr - uWinPivot;
          float rlx = dot(hr, uWinRight);
          float rly = dot(hr, uWinUp);
          float ru = rlx / uWinDim.x + 0.5;
          float rv = (rly - uFrOff.y) / uWinDim.y;
          if (ru > 0.0 && ru < 1.0 && rv > 0.0 && rv < 1.0) {
            vec2 blurJit = (gNoise(P.xz * 6.0).rg - 0.5) * 0.035;
            vec3 rPane = texture(uPaneTex, clamp(vec2(ru, rv) + blurJit, 0.01, 0.99)).rgb;
            float fres = pow(1.0 - clamp(-rd.y, 0.0, 1.0), 4.0);
            col += rPane * (0.07 + 0.16 * fres) * dusk * exp(-P.z * 0.45);
          }
        }
      }
    }
    float roomFade = exp(-max(length(P.xz) - 1.95, 0.0) * 0.38);
    col *= mix(1.0, roomFade, dusk);
  } else if (hitKind == 3 || hitKind == 4) {
    vec3 P = ro + rd * tBest;
    vec2 wUv = hitKind == 3 ? P.xy * vec2(0.6, 1.3) : P.zy * vec2(0.6, 1.3);
    float gr = gNoise(wUv).b * 0.6 + gNoise(wUv * 2.5).r * 0.4;
    vec3 wallBase = mix(vec3(0.155, 0.106, 0.074), vec3(0.235, 0.162, 0.112), gr);
    // 窗下竖向胡桃木护墙板槽线与凸出窗台沿
    if (hitKind == 3 && P.y < uWinPivot.y + 0.015) {
      float groove = smoothstep(0.0, 0.03, fract(P.x * 4.5 + 0.5)) * smoothstep(1.0, 0.97, fract(P.x * 4.5 + 0.5));
      wallBase *= 0.80 + 0.22 * groove;
      // 窗台板沿暖高光
      float sillEdge = exp(-abs(P.y - uWinPivot.y) / 0.018) * step(abs(P.x), uWinDim.z * 0.54);
      wallBase = mix(wallBase, vec3(0.42, 0.28, 0.18), sillEdge * 0.72);
    }
    // 踢脚线柔和暗过渡（无虚线伪影）
    wallBase *= 0.72 + 0.28 * smoothstep(0.0, 0.04, P.y);
    float winGlow = exp(-length((P - vec3(0.0, 0.85, 0.0)) * vec3(0.85, 0.75, 0.6)) * 1.15);
    vec3 caust = (hitKind == 4) ? evalWindowCausticAt(P, uSunDir, dusk) : vec3(0.0);
    col = wallBase * (vec3(0.22, 0.155, 0.11) + vec3(0.56, 0.36, 0.20) * winGlow + caust * 1.65 * float(hitKind == 4));
    col *= exp(-max(P.y - 1.65, 0.0) * 0.55);
  } else if (hitKind == 2) {
    float u = winLoc.x / uWinDim.x + 0.5;
    float v = (winLoc.y - uFrOff.y) / uWinDim.y;
    if (u >= 0.0 && u <= 1.0 && v >= 0.0 && v <= 1.0) {
      vec3 surfCol, transCol;
      float opac;
      sampleStainedGlass(vec2(u, v), rd, uSunDir, dusk, surfCol, transCol, opac);
      vec3 behindCol;
      if (dusk < 0.5) {
        vec3 pGlass = ro + rd * tBest;
        vec3 rdRefr = normalize(rd + vec3((gNoise(vec2(u, v) * 5.0).rg - 0.5) * 0.025, 0.0));
        float tb = -pGlass.y / min(rdRefr.y, -0.1);
        vec3 pb = pGlass + rdRefr * max(tb, 0.0);
        float rg;
        behindCol = evalWoodFloor(pb.xz, 0.0, rg) * 0.96;
      } else {
        behindCol = evalSunsetSky(rd, uSunDir);
      }
      if (dusk > 0.01) {
        // 立窗时夕阳从窗外穿透每一格矿物琉璃，如教堂彩窗般通透夺目
        float notCame = 1.0 - texture(uMetalTex, vec2(u, v)).r;
        vec3 litGlass = mix(surfCol, surfCol * 0.58 + behindCol * transCol * 1.48, dusk * notCame);
        col = mix(surfCol * 0.92 + behindCol * 0.10, litGlass, dusk);
      } else {
        col = mix(behindCol * surfCol * 1.04, surfCol, 0.62);
      }
    } else {
      vec3 fWood = evalWindowFrame(winLoc, vec2(u, v));
      float rim = pow(1.0 - abs(dot(rd, uWinNorm)), 2.0);
      fWood *= mix(1.04, 0.62 + 0.42 * rim, dusk);
      col = fWood;
    }
  }

  // 2. 终章：丝绒级三维体积丁达尔彩色光束 (Analytic Feathered Beam + Interleaved Gradient Noise，零阶梯伪影零颗粒噪点！)
  if (dusk > 0.08) {
    float maxDist = min(tBest, 4.4);
    int STEPS = 28;
    float dt = maxDist / float(STEPS);
    float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
    vec3 volAcc = vec3(0.0);
    float denomB = dot(uSunDir, uWinNorm);
    if (abs(denomB) > 1e-4) {
      for (int i = 0; i < 28; i++) {
        float tRay = (float(i) + ign) * dt;
        vec3 P = ro + rd * tRay;
        if (P.z > 0.0 && P.z < 3.1 && P.y > 0.0 && P.y < 1.62) {
          float tW = dot(uWinPivot - P, uWinNorm) / denomB;
          if (tW > 0.0) {
            vec3 rel = P + uSunDir * tW - uWinPivot;
            float bu = dot(rel, uWinRight) / uWinDim.x + 0.5;
            float bv = (dot(rel, uWinUp) - uFrOff.y) / uWinDim.y;
            float edge = smoothstep(-0.02, 0.07, bu) * smoothstep(1.02, 0.93, bu)
                       * smoothstep(-0.02, 0.07, bv) * smoothstep(1.02, 0.93, bv);
            if (edge > 0.002) {
              vec4 bp = texture(uPaneTex, clamp(vec2(bu, bv), 0.02, 0.98));
              vec3 beamTint = mix(vec3(0.95, 0.84, 0.64), bp.rgb * 1.35, bp.a * 0.85);
              float airWave = 0.82 + 0.28 * gNoise(P.xy * 1.1 + vec2(uTime * 0.02, -uTime * 0.015)).r;
              volAcc += beamTint * edge * airWave * exp(-tW * 0.48);
            }
          }
        }
      }
    }
    col += volAcc * dt * 0.095 * dusk;
  } else {
    // 前五幕工坊午后一束极其克制的斜阳暖雾掠过桌面
    float sunBand = exp(-pow((ndc.x * 0.65 + ndc.y * 0.55 - 0.12), 2.0) / 0.42);
    col += vec3(1.0, 0.93, 0.78) * sunBand * 0.038 * (1.0 - dusk);
  }

  // 柔和胶片色调映射与防色带微噪点
  col = mix(col, acesFilm(col * 1.06), 0.55 + 0.45 * dusk);
  float vig = smoothstep(1.65, 0.45, length(ndc * vec2(0.88, 1.0)));
  col *= mix(0.86, 1.0, vig);
  float dither = (hash21(gl_FragCoord.xy) - 0.5) / 255.0;
  fragColor = vec4(clamp(col + dither, 0.0, 1.0), 1.0);
}`;

const PROG = createProgram(VS_QUAD, FS_SCENE);

function makeTexture(w, h, linear = true, repeat = false) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, linear ? gl.LINEAR : gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, linear ? gl.LINEAR : gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}

// 生成 512x512 四通道无缝可平铺程序化纹理 (流云 / 砂粒 / 木纹 / 晶粒)
function buildSeamlessGrainTex() {
  const S = 512;
  const data = new Uint8Array(S * S * 4);
  const perNoise = (x, y, per, k) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const h = (a, b) => {
      const ma = ((a % per) + per) % per;
      const mb = ((b % per) + per) % per;
      return hash1(ma * 131.7 + mb * 313.9 + k * 71.3);
    };
    return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy);
  };
  const fbmTile = (u, v, px, py, oct, k) => {
    let s = 0, a = 0.5, norm = 0;
    for (let o = 0; o < oct; o++) {
      s += a * perNoise(u * px, v * py, Math.max(px, py), k + o * 17);
      norm += a;
      px *= 2; py *= 2; a *= 0.5;
    }
    return s / norm;
  };
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const idx = (y * S + x) * 4;
      const r = fbmTile(u, v, 6, 6, 4, 1);     // 低频吹制流云
      const g = fbmTile(u, v, 24, 24, 3, 2);   // 中频锤纹与砂粒
      const b = fbmTile(u, v, 32, 4, 4, 3);    // 各向异性木纹纤维
      const a = hash1(x * 19.3 + y * 97.1);    // 高频微晶粒
      data[idx]     = clamp(Math.round(r * 255), 0, 255);
      data[idx + 1] = clamp(Math.round(g * 255), 0, 255);
      data[idx + 2] = clamp(Math.round(b * 255), 0, 255);
      data[idx + 3] = clamp(Math.round(a * 255), 0, 255);
    }
  }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  if (anisoExt) {
    gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, 4);
  }
  return t;
}

const grainTex = buildSeamlessGrainTex();
const paneTex  = makeTexture(TEX_W, TEX_H, true, false);

// 离屏画布组（Y=0 在底部或上传时 UNPACK_FLIP_Y_WEBGL=true 自动对齐 UV v=0 在底、v=1 在顶！）
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return { c, x: c.getContext('2d') };
}

const CV = {

  meniscus: makeCanvas(TEX_W, TEX_H), // 预烘焙铜条边缘弯月面聚色场
  metal: makeCanvas(TEX_W, TEX_H),

};

// 初始化纹理空白态：磨砂原片 pane.a=0, 金属无, 刻霜无, 浮灰初始为 0（第五幕再蒙上）
CV.pane.x.clearRect(0, 0, TEX_W, TEX_H);
CV.metal.x.clearRect(0, 0, TEX_W, TEX_H);
CV.frost.x.clearRect(0, 0, TEX_W, TEX_H);

// 预烘焙一张丰富的手工吹制玻璃流云水波图（供第二幕各格不同角度/位移裁切叠加）
(function bakeBlownSwirlSheet() {
  const ctx = CV.swirl.x;
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, TEX_W, TEX_H);
  for (let i = 0; i < 240; i++) {
    const cx = rand(-100, TEX_W + 100);
    const cy = rand(-80, TEX_H + 80);
    const rx = rand(80, 340);
    const ry = rand(26, 95);
    const ang = rand(-0.55, 0.55);
    const bright = rnd() < 0.52;
    const al = rand(0.035, 0.095);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, bright ? `rgba(255,250,240,${al})` : `rgba(30,22,15,${al})`);
    g.addColorStop(0.65, bright ? `rgba(255,250,240,${al * 0.4})` : `rgba(30,22,15,${al * 0.4})`);
    g.addColorStop(1, 'rgba(128,128,128,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
})();

function syncTextures() {
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  if (CV.dirtyPane) {
    gl.bindTexture(gl.TEXTURE_2D, paneTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, CV.pane.c);
    CV.dirtyPane = false;
  }
  if (CV.dirtyMetal) {
    gl.bindTexture(gl.TEXTURE_2D, metalTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, CV.metal.c);
    CV.dirtyMetal = false;
  }
  if (CV.dirtyFrost) {
    gl.bindTexture(gl.TEXTURE_2D, frostTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, CV.frost.c);
    CV.dirtyFrost = false;
  }
  if (CV.dirtyDust) {
    gl.bindTexture(gl.TEXTURE_2D, dustTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, CV.dust.c);
    CV.dirtyDust = false;
  }
}

// 花窗 UV (u, v) -> 画布像素 (px, py)，因 UNPACK_FLIP_Y_WEBGL=true，v=1 对应 py=0，v=0 对应 py=TEX_H
const uvX = (u) => u * TEX_W;
const uvY = (v) => (1 - v) * TEX_H;

// 确保 frost 画布底色为不透明纯黑，便于 R 通道线性累加银白刻霜密度
