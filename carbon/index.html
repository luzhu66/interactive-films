<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灯影 · 青绿泥金宫灯互动短片</title>
<style>
  :root {
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "KaiTi", "STKaiti", "SimSun", Georgia, serif;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #140c08;
    font-family: var(--serif);
    color: #f4e8d2;
    cursor: none;
    touch-action: none;
  }
  #gl, #ov {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #gl { z-index: 1; }
  #ov { z-index: 2; pointer-events: none; }

  #ui {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  /* 序幕：浮在古旧熟绢中央的泥金题签 */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.45s ease, filter 1.45s ease, transform 1.5s ease;
  }
  #intro.gone {
    opacity: 0;
    filter: blur(14px);
    transform: scale(1.035);
    pointer-events: none;
  }
  .title-gold {
    font-size: clamp(48px, 8.2vw, 96px);
    font-weight: 500;
    letter-spacing: 0.48em;
    padding-left: 0.48em;
    color: #5b3b16;
    background: linear-gradient(175deg, #9c6e26 0%, #c8963e 36%, #6e481a 72%, #b5822e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 0 rgba(255, 245, 214, 0.72)) drop-shadow(0 8px 24px rgba(58, 36, 14, 0.24));
  }
  .title-sub {
    margin-top: clamp(16px, 2.5vh, 26px);
    font-size: clamp(15px, 1.75vw, 22px);
    letter-spacing: 0.26em;
    padding-left: 0.26em;
    color: rgba(68, 46, 26, 0.84);
    text-shadow: 0 1px 12px rgba(246, 236, 214, 0.85);
  }
  .title-whisper {
    position: absolute;
    bottom: 20.5vh;
    font-size: clamp(13.5px, 1.35vw, 16.5px);
    letter-spacing: 0.34em;
    padding-left: 0.34em;
    color: rgba(62, 38, 16, 0.90);
    text-shadow:
      0 0 12px rgba(244, 232, 208, 0.96),
      0 1px 4px rgba(244, 232, 208, 0.92);
    animation: silkBreathe 3.2s ease-in-out infinite;
  }
  @keyframes silkBreathe {
    0%, 100% { opacity: 0.52; }
    50% { opacity: 0.96; }
  }

  /* 逐幕诗意短句与极淡闲置提示（零 HUD） */
  #caption-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 3.6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.85vh;
    text-align: center;
    padding: 0 5vw;
  }
  #line {
    font-size: clamp(17px, 2.05vw, 24px);
    font-weight: 400;
    letter-spacing: 0.22em;
    padding-left: 0.22em;
    color: rgba(249, 239, 220, 0.94);
    text-shadow:
      0 1px 8px rgba(18, 10, 6, 0.92),
      0 2px 22px rgba(20, 11, 6, 0.78);
    opacity: 0;
    filter: blur(7px);
    transform: translateY(5px);
    transition: opacity 1.15s ease, filter 1.15s ease, transform 1.15s ease;
  }
  #line.on {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
  #hint {
    font-size: clamp(12.5px, 1.2vw, 15px);
    letter-spacing: 0.24em;
    padding-left: 0.24em;
    color: rgba(232, 206, 166, 0.68);
    text-shadow: 0 1px 12px rgba(16, 9, 5, 0.92);
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #hint.on { opacity: 1; }

  /* 终章右下角无边框纯文字操作 */
  #coda-links {
    position: fixed;
    right: 6.2vw;
    bottom: 3.3vh;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 1.5vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #coda-links.on {
    opacity: 1;
    pointer-events: auto;
  }
  #coda-links .sep {
    color: rgba(232, 205, 164, 0.32);
    font-size: 13px;
  }
  .plain-btn {
    background: none;
    border: none;
    outline: none;
    font-family: var(--serif);
    font-size: clamp(13px, 1.25vw, 16px);
    letter-spacing: 0.24em;
    color: rgba(238, 214, 176, 0.66);
    cursor: pointer;
    padding: 4px 2px;
    text-shadow: 0 1px 10px rgba(14, 8, 5, 0.92);
    transition: color 0.35s ease;
  }
  .plain-btn:hover, .plain-btn:focus-visible {
    color: rgba(255, 244, 218, 0.98);
  }

  /* 角落极淡静音图标 */
  #mute {
    position: fixed;
    right: 2.1vw;
    bottom: 2.7vh;
    z-index: 7;
    width: 36px;
    height: 36px;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.42;
    cursor: pointer;
    color: #e6cda5;
    transition: opacity 0.35s ease;
  }
  #mute:hover { opacity: 0.9; }
  #mute svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: inline; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="ui">
  <div id="intro">
    <div class="title-gold">灯 影</div>
    <div class="title-sub">绢是旧的，等一笔山水。</div>
    <div class="title-whisper">轻触熟绢，落笔开卷</div>
  </div>
  <div id="caption-wrap">
    <div id="line"></div>
    <div id="hint"></div>
  </div>
</div>

<div id="coda-links">
  <button class="plain-btn" id="save-btn" type="button">留存灯影</button>
  <span class="sep">·</span>
  <button class="plain-btn" id="again-btn" type="button">再制一灯</button>
</div>

<button id="mute" type="button" aria-label="静音" title="静音 (M)">
  <svg viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <g class="on">
      <path d="M15.5 9a4 4 0 0 1 0 6"/>
      <path d="M18.2 6.5a7.5 7.5 0 0 1 0 11"/>
    </g>
    <g class="off">
      <path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </g>
  </svg>
</button>

<script>
(() => {
'use strict';

/* ============================================================================
 * 0. 参数、确定性随机与数学工具
 * ============================================================================ */
const Q = new URLSearchParams(location.search);
const SPEED = Math.max(0.2, Math.min(10, parseFloat(Q.get('speed') || '1') || 1));
const START_ACT = Q.has('act') ? Math.max(0, Math.min(6, parseInt(Q.get('act'), 10) || 0)) : 0;
const START_MUTED = Q.get('muted') === '1' || Q.get('muted') === 'true';

const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => {
  const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1);
  return t * t * (3 - 2 * t);
};
const easeInOut = (t) => -(Math.cos(Math.PI * clamp(t, 0, 1)) - 1) * 0.5;
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  const x = clamp(t, 0, 1) - 1;
  return 1 + c3 * x * x * x + c1 * x * x;
};
const TAU = Math.PI * 2;
const wrap01 = (u) => ((u % 1) + 1) % 1;
const wrapX = (x, w) => ((x % w) + w) % w;

let SEED = ((Math.random() * 1e9) | 0) ^ 0x4D2A7E;
if (Q.has('seed')) SEED = (parseInt(Q.get('seed'), 10) || 1337) | 0;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(SEED);
const rand = (a = 0, b = 1) => a + (b - a) * rnd();

function hash1(n) {
  const s = Math.sin(n * 127.1 + (SEED % 3989) * 0.43) * 43758.5453123;
  return s - Math.floor(s);
}
function noise1(x, k = 0) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(hash1(i + k * 57.17), hash1(i + 1 + k * 57.17), u);
}
function noise1Per(u, period, k = 0) {
  const p = Math.max(1, Math.round(period));
  const x = wrap01(u) * p;
  const i0 = Math.floor(x) % p;
  const i1 = (i0 + 1) % p;
  const f = x - Math.floor(x);
  const s = f * f * (3 - 2 * f);
  return lerp(hash1(i0 + k * 59.3), hash1(i1 + k * 59.3), s);
}
function fbm1Per(u, basePeriod, oct = 4, k = 0) {
  let v = 0, a = 0.5, norm = 0, p = basePeriod;
  for (let o = 0; o < oct; o++) {
    v += a * noise1Per(u, p, k + o * 17.3);
    norm += a;
    p *= 2;
    a *= 0.5;
  }
  return v / norm;
}

const vSub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vAdd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vMul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vDot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vCross = (a, b) => [
  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],
  a[0] * b[1] - a[1] * b[0]
];
const vNorm = (a) => {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
};

/* ============================================================================
 * 1. 世界几何常量与统一相机（俯视紫檀画案 <-> 3D 走马宫灯）
 * ============================================================================ */
const SILK_W = 1600;
const SILK_H = 880;
const OPT_W = 800;
const OPT_H = 440;

const SILK_WORLD_W = 1.92;
const SILK_WORLD_H = 0.96;
const R_LANTERN = SILK_WORLD_W / TAU; // 0.30558
const Y_SILK_CENTER_3D = 0.84;
const Y_SILK_BOT = Y_SILK_CENTER_3D - SILK_WORLD_H * 0.5; // 0.36
const Y_SILK_TOP = Y_SILK_CENTER_3D + SILK_WORLD_H * 0.5; // 1.32

const GRID_N = 512; // 周期闭合山脉数组分辨率
const WASH_W = 128;
const WASH_H = 70;

let VW = window.innerWidth;
let VH = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

const CAM = {
  pos: [0, 1.62, 0.09],
  target: [0, 0.012, 0.02],
  tanH: 0.42,
  fold: 0,           // 0 = 俯视平铺熟绢, 1 = 3D 旋转走马宫灯
  lanternAngle: 0.0,
  lanternAngVel: 0.145,
  targetAngVel: 0.145,
  lightAmt: 0,       // 0..1 烛火亮度
  duskAmt: 0,        // 0..1 夜色漫起程度
  pendX: 0, pendVx: 0,
  pendZ: 0, pendVz: 0
};

function getCamBasis() {
  const f = vNorm(vSub(CAM.target, CAM.pos));
  const upHint = vNorm([0, lerp(0.14, 1.0, easeInOut(CAM.fold)), lerp(-1.0, 0.0, easeInOut(CAM.fold))]);
  const r = vNorm(vCross(f, upHint));
  const u = vCross(r, f);
  return { f, r, u };
}

function updateCamera(t) {
  const aspect = Math.max(0.65, VW / Math.max(1, VH));
  const flatDist = Math.max(1.56, 1.15 / (0.42 * aspect));
  const flatPos = [0, flatDist, 0.09];
  const flatTgt = [0, 0.012, 0.03];

  const studyDist = Math.max(2.36, 1.98 / (0.44 * aspect));
  const breatheX = Math.sin(t * 0.22) * 0.045;
  const breatheY = Math.cos(t * 0.18) * 0.018;
  const studyPos = [breatheX, 0.96 + breatheY, studyDist];
  const studyTgt = [0, 0.72, -0.04];

  const s = easeInOut(CAM.fold);
  // 过渡中途轻微弧线后拉，让卷合过程舒展大气
  const arcLift = Math.sin(s * Math.PI) * 0.26;
  CAM.pos = [
    lerp(flatPos[0], studyPos[0], s),
    lerp(flatPos[1], studyPos[1], s) + arcLift,
    lerp(flatPos[2], studyPos[2], s) + arcLift * 0.55
  ];
  CAM.target = [
    lerp(flatTgt[0], studyTgt[0], s),
    lerp(flatTgt[1], studyTgt[1], s),
    lerp(flatTgt[2], studyTgt[2], s)
  ];
  CAM.tanH = lerp(0.42, 0.44, s);
}

function worldToScreen(P) {
  const B = getCamBasis();
  const rel = vSub(P, CAM.pos);
  const cz = vDot(rel, B.f);
  if (cz <= 0.03) return null;
  const aspect = VW / Math.max(1, VH);
  const ndcX = vDot(rel, B.r) / (cz * CAM.tanH * aspect);
  const ndcY = vDot(rel, B.u) / (cz * CAM.tanH);
  return [(ndcX * 0.5 + 0.5) * VW, (0.5 - ndcY * 0.5) * VH, cz];
}

// 1:1 零视差鼠标拾取熟绢 UV（前五幕平铺在 y = 0.012）
function screenToSilkUV(sx, sy) {
  const B = getCamBasis();
  const aspect = VW / Math.max(1, VH);
  const ndcX = (sx / Math.max(1, VW)) * 2 - 1;
  const ndcY = 1 - (sy / Math.max(1, VH)) * 2;
  const rd = vNorm(vAdd(vAdd(B.f, vMul(B.r, ndcX * CAM.tanH * aspect)), vMul(B.u, ndcY * CAM.tanH)));
  if (Math.abs(rd[1]) < 1e-5) return null;
  const t = (0.012 - CAM.pos[1]) / rd[1];
  if (t <= 0) return null;
  const px = CAM.pos[0] + rd[0] * t;
  const pz = CAM.pos[2] + rd[2] * t;
  const u = px / SILK_WORLD_W + 0.5;
  const v = pz / SILK_WORLD_H + 0.5;
  return { u, v, inside: u >= 0 && u <= 1 && v >= 0 && v <= 1, wx: px, wz: pz };
}

/* ============================================================================
 * 2. 宋式青绿泥金画卷状态与程序化多图层 2D 画引擎
 * ============================================================================ */
const H_MAIN = new Float32Array(GRID_N);     // 主峰脊线高度 v in [0.16..0.68] (0=天顶, 1=水底)
const H_WEIGHT = new Float32Array(GRID_N);   // 0..1 该列已勾勒程度
const H_SPEED = new Float32Array(GRID_N);    // 0..1 该列笔速（快=飞白劲健，慢=泥金丰厚散金砂）
const H_FAR = new Float32Array(GRID_N);      // 远山
const H_BANK = new Float32Array(GRID_N);     // 近岸坡陀
const H_WRAP = new Float32Array(GRID_N);     // 周期闭合平滑后的主峰

let jumpedToAct6 = (START_ACT === 6);

const WASH = new Float32Array(WASH_W * WASH_H);
const WASH_TARGET = new Float32Array(WASH_W * WASH_H);

const STATE = {
  act: 0,             // 0 序幕, 1 勾金, 2 敷彩, 3 植春, 4 镂影, 5 燃灯, 6 终章
  actTime: 0,
  totalTime: 0,
  idleTime: 0,
  transitioning: false,
  foldStartTime: -1,
  foldProgress: 0,
  manualWork: 0,
  ghostWork: 0,
  // 统计
  ridgeCoverage: 0,
  washCoverage: 0,
  floraCount: 0,
  craneCount: 0,
  boatCount: 0,
  lit: false,
  litTime: -1,
  sealStamped: false,
  sealTime: -1,
  // 动态实体
  pines: [],
  peaches: [],
  willows: [],
  petals: [],
  clouds: [],
  cranes: [],
  boats: [],
  goldSparks: [],
  introDust: [],
  codaStage: 0,
  codaLinksShown: false,
  actDoneFired: false,
  hintShown: false,
  lastMusicU: -1,
  lastXiaoTime: -10,
  lastCraneNoteTime: -10,
  lastBellTime: -10
};

// 多图层离屏画布
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return { c, g: c.getContext('2d') };
}

const silkBase = makeCanvas(SILK_W, SILK_H);   // 古旧茶褐熟绢底（正交经纬丝缕 + 云母微光）
const layerWash = makeCanvas(SILK_W, SILK_H);  // 第二幕：四阶青绿重彩 + 杏霞 + 春水
const layerGold = makeCanvas(SILK_W, SILK_H);  // 第一幕：泥金山骨 + 披麻皴/小斧劈皴 + 金砂
const layerGoldMask = makeCanvas(OPT_W, OPT_H);// 泥金金属高光掩码（供 WebGL2 金属微闪）
const layerFlora = makeCanvas(SILK_W, SILK_H); // 第三幕：静态苍松与春桃
const bakedCanvas = makeCanvas(SILK_W, SILK_H);// 合并静态层缓存
const liveSilk = makeCanvas(SILK_W, SILK_H);   // 实时合成熟绢纹理（供 WebGL2）
const opticsCanvas = makeCanvas(OPT_W, OPT_H); // R: 镂空透光(鹤/舟灯), G: 泥金微闪, B: 颜料遮光密度

let staticDirty = true;
let washCanvasDirty = true;
let goldDirty = false;
let silkTexNeedsUpload = true;

// 绘制辅助：水平无缝周期镜像（保证 u=0 与 u=1 严丝合缝）
function drawWrapped(ctx, width, x, margin, fn) {
  const bx = wrapX(x, width);
  fn(bx);
  if (bx < margin) fn(bx + width);
  if (bx > width - margin) fn(bx - width);
}

/* ---------- 2.1 生成古旧茶褐熟绢底（#e8dbc3 -> #d4c2a3 + 经纬丝缕 + 云母微光） ---------- */
function generateSilkBase() {
  const g = silkBase.g;
  const W = SILK_W, H = SILK_H;
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0.0, '#e8dbc3');
  grad.addColorStop(0.32, '#e3d4b8');
  grad.addColorStop(0.72, '#dccaa9');
  grad.addColorStop(1.0, '#d4c2a3');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  // 古旧茶渍与柔和年代包浆（水平周期无缝）
  for (let i = 0; i < 65; i++) {
    const cx = rand(0, W), cy = rand(0, H);
    const rx = rand(90, 290), ry = rand(55, 190);
    const dark = rnd() < 0.62;
    const al = rand(0.018, 0.052);
    drawWrapped(g, W, cx, rx + 10, (px) => {
      const rg = g.createRadialGradient(px, cy, 4, px, cy, rx);
      rg.addColorStop(0, dark ? `rgba(128,94,54,${al})` : `rgba(255,248,232,${al * 1.15})`);
      rg.addColorStop(1, 'rgba(216,198,166,0)');
      g.fillStyle = rg;
      g.save();
      g.translate(px, cy);
      g.scale(1, ry / rx);
      g.beginPath();
      g.arc(0, 0, rx, 0, TAU);
      g.fill();
      g.restore();
    });
  }

  // 细腻正交经纬丝缕
  g.lineWidth = 1;
  for (let y = 0; y < H; y += 3) {
    const t = noise1(y * 0.19, 11);
    g.strokeStyle = t > 0.5
      ? `rgba(252,245,230,${0.06 + (t - 0.5) * 0.14})`
      : `rgba(125,96,60,${0.05 + (0.5 - t) * 0.12})`;
    g.beginPath();
    g.moveTo(0, y + 0.5);
    g.lineTo(W, y + 0.5);
    g.stroke();
  }
  for (let x = 0; x < W; x += 4) {
    const t = noise1Per(x / W, 160, 23);
    g.strokeStyle = t > 0.5
      ? `rgba(252,244,226,${0.05 + (t - 0.5) * 0.12})`
      : `rgba(116,88,54,${0.045 + (0.5 - t) * 0.11})`;
    g.beginPath();
    g.moveTo(x + 0.5, 0);
    g.lineTo(x + 0.5, H);
    g.stroke();
  }

  // 熟绢云母微光（极细微矿物星点）
  for (let i = 0; i < 420; i++) {
    const mx = rand(0, W), my = rand(0, H), r = rand(0.45, 1.25);
    g.fillStyle = `rgba(255, 249, 232, ${rand(0.14, 0.42)})`;
    g.beginPath();
    g.arc(mx, my, r, 0, TAU);
    g.fill();
  }
}

/* ---------- 2.2 周期山脊曲线数学：远山 / 主峦 / 近岸坡陀 ---------- */
function initDefaultRidges() {
  H_MAIN.fill(0.46);
  H_WEIGHT.fill(0);
  H_SPEED.fill(0.32);
  H_FAR.fill(0.32);
  H_BANK.fill(0.75);
  H_WRAP.fill(0.46);
}

// 将用户/幽灵画出的 H_MAIN 做周期闭合平滑，并自动衍生远山与近岸坡陀
function syncDerivedMountains() {
  // 先对未覆盖的列做周期插值，避免接缝断崖
  for (let i = 0; i < GRID_N; i++) {
    const u = i / GRID_N;
    const baseWave = 0.44
      - 0.12 * Math.sin(u * TAU * 2.0 + 0.6)
      - 0.08 * Math.cos(u * TAU * 3.0 - 0.4)
      - 0.05 * Math.sin(u * TAU * 5.0 + 1.2)
      + (fbm1Per(u, 8, 4, 31) - 0.5) * 0.11;
    const w = H_WEIGHT[i];
    H_WRAP[i] = lerp(clamp(baseWave, 0.22, 0.62), H_MAIN[i], w);
  }
  // 跨边界周期高斯滤波（确保 i=0 与 i=GRID_N-1 高度与斜率 100% 连续）
  const tmp = new Float32Array(GRID_N);
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < GRID_N; i++) {
      let s = 0, sw = 0;
      for (let k = -4; k <= 4; k++) {
        const j = (i + k + GRID_N) % GRID_N;
        const wt = Math.exp(-(k * k) / 6.0);
        s += H_WRAP[j] * wt;
        sw += wt;
      }
      tmp[i] = s / sw;
    }
    H_WRAP.set(tmp);
  }
  // 衍生远山（柔和抬高 + 相位错开）与近岸坡陀（低缓探入春江）
  for (let i = 0; i < GRID_N; i++) {
    const u = i / GRID_N;
    const shiftIdx = (i + Math.floor(GRID_N * 0.19)) % GRID_N;
    const farEcho = H_WRAP[shiftIdx] - 0.085 - 0.045 * Math.sin(u * TAU * 3.0 + 0.9) + (fbm1Per(u, 6, 3, 47) - 0.5) * 0.055;
    H_FAR[i] = clamp(Math.min(farEcho, H_WRAP[i] - 0.04), 0.13, 0.44);

    // 近岸坡陀：三四座错落低岸探入水面（水岸留出开阔江面放舟）
    const bankWave = 0.725
      - 0.068 * Math.pow(Math.max(0, Math.sin(u * TAU * 2.0 + 0.35)), 1.5)
      - 0.052 * Math.pow(Math.max(0, Math.cos(u * TAU * 3.0 - 0.85)), 1.6)
      + (fbm1Per(u, 10, 3, 61) - 0.5) * 0.032;
    H_BANK[i] = clamp(bankWave, 0.61, 0.78);
  }
}

function sampleArrPer(arr, u) {
  const f = wrap01(u) * GRID_N;
  const i0 = Math.floor(f) % GRID_N;
  const i1 = (i0 + 1) % GRID_N;
  return lerp(arr[i0], arr[i1], f - Math.floor(f));
}
function sampleSlopePer(arr, u) {
  const du = 1 / GRID_N;
  return (sampleArrPer(arr, u + du) - sampleArrPer(arr, u - du)) / (2 * du);
}

/* ---------- 2.3 连续变宽狼毫笔道（严禁 round-cap 圆珠串！） ---------- */
function drawTaperedRibbon(ctx, pts, wBase, color, alpha = 1.0) {
  if (pts.length < 2) return;
  const n = pts.length;
  const leftX = new Float32Array(n), leftY = new Float32Array(n);
  const rightX = new Float32Array(n), rightY = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const prev = pts[Math.max(0, i - 1)];
    const next = pts[Math.min(n - 1, i + 1)];
    let dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const nx = -dy, ny = dx;
    const t = i / (n - 1);
    const taper = Math.sin(Math.pow(t, 0.72) * Math.PI);
    const w = (p.w != null ? p.w : wBase) * (0.18 + 0.82 * taper);
    leftX[i] = p.x + nx * w;
    leftY[i] = p.y + ny * w;
    rightX[i] = p.x - nx * w;
    rightY[i] = p.y - ny * w;
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(leftX[0], leftY[0]);
  for (let i = 1; i < n; i++) ctx.lineTo(leftX[i], leftY[i]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(rightX[i], rightY[i]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 多股飞白泥金笔势：核心变宽丝带 + 高光细金线 + 随笔速裂开的飞白干笔毫
function drawGoldCalligraphyStroke(pts, speedNorm = 0.4, weightScale = 1.0) {
  if (pts.length < 2) return;
  const g = layerGold.g;
  const gm = layerGoldMask.g;
  const dry = clamp((speedNorm - 0.28) * 1.15, 0, 0.82);
  const baseW = lerp(4.2, 1.7, dry) * weightScale;

  const paintOn = (ctx, sx, sy, colCore, colHi, ox) => {
    const shifted = pts.map((p) => ({
      x: (p.x + ox) * sx,
      y: p.y * sy,
      w: (p.w != null ? p.w : baseW) * sx
    }));
    // 暗金底墨托骨
    drawTaperedRibbon(ctx, shifted, baseW * sx * 1.12, colCore, lerp(0.88, 0.56, dry));
    // 泥金高光线
    ctx.save();
    ctx.strokeStyle = colHi;
    ctx.lineWidth = Math.max(0.8, baseW * 0.44 * sx);
    ctx.lineJoin = 'round';
    ctx.globalAlpha = lerp(0.86, 0.48, dry);
    ctx.beginPath();
    ctx.moveTo(shifted[0].x, shifted[0].y - 0.7 * sy);
    for (let i = 1; i < shifted.length - 1; i++) {
      const mx = (shifted[i].x + shifted[i + 1].x) * 0.5;
      const my = (shifted[i].y + shifted[i + 1].y) * 0.5;
      ctx.quadraticCurveTo(shifted[i].x, shifted[i].y - 0.7 * sy, mx, my - 0.7 * sy);
    }
    const last = shifted[shifted.length - 1];
    ctx.lineTo(last.x, last.y - 0.7 * sy);
    ctx.stroke();

    // 笔速快时裂出细腻飞白毫丝
    const strands = dry > 0.25 ? 3 : 2;
    for (let s = 0; s < strands; s++) {
      const off = (s - (strands - 1) * 0.5) * baseW * 0.65 * sx;
      ctx.strokeStyle = s === 0 ? colHi : colCore;
      ctx.lineWidth = Math.max(0.55, 0.85 * sx);
      ctx.globalAlpha = lerp(0.32, 0.55, dry);
      ctx.beginPath();
      for (let i = 0; i < shifted.length; i++) {
        const px = shifted[i].x;
        const py = shifted[i].y + off + Math.sin(i * 0.42 + s * 2.1) * 0.8 * sy;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  };

  // 水平周期包裹绘制
  const offsets = [0];
  let minX = 1e9, maxX = -1e9;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
  }
  if (minX < 90) offsets.push(SILK_W);
  if (maxX > SILK_W - 90) offsets.push(-SILK_W);

  for (const ox of offsets) {
    paintOn(g, 1, 1, '#b8832d', '#f5d68a', ox);
    paintOn(gm, OPT_W / SILK_W, OPT_H / SILK_H, 'rgba(0,220,0,0.75)', 'rgba(0,255,0,0.9)', ox);
  }

  // 笔速慢时散落细腻金砂
  if (dry < 0.45) {
    const count = Math.min(18, Math.floor(pts.length * (1.2 - dry * 2.0)));
    for (let k = 0; k < count; k++) {
      const p = pts[Math.floor(rnd() * pts.length)];
      const gx = wrapX(p.x + rand(-18, 18), SILK_W);
      const gy = p.y + rand(-10, 26);
      const r = rand(0.6, 1.75);
      g.fillStyle = rnd() < 0.55 ? `rgba(245,214,138,${rand(0.45, 0.85)})` : `rgba(216,169,78,${rand(0.4, 0.78)})`;
      g.beginPath();
      g.arc(gx, gy, r, 0, TAU);
      g.fill();
      gm.fillStyle = 'rgba(0,240,0,0.7)';
      gm.fillRect((gx / SILK_W) * OPT_W, (gy / SILK_H) * OPT_H, 1.5, 1.5);
    }
  }
}

/* ---------- 2.4 重绘完整三层泥金山脉 + 披麻皴 & 小斧劈皴 ---------- */
function rebuildGoldMountainLayer() {
  syncDerivedMountains();
  const g = layerGold.g;
  const gm = layerGoldMask.g;
  g.clearRect(0, 0, SILK_W, SILK_H);
  gm.clearRect(0, 0, OPT_W, OPT_H);

  // 统计覆盖度
  let sumW = 0;
  for (let i = 0; i < GRID_N; i++) sumW += H_WEIGHT[i];
  STATE.ridgeCoverage = clamp(sumW / GRID_N, 0, 1);
  if (STATE.ridgeCoverage < 0.005) {
    staticDirty = true;
    return;
  }

  // 1) 远山细泥金轮廓（逐格平滑连续路径，彻底消除折线锯齿）
  g.save();
  g.lineWidth = 1.35;
  g.lineJoin = 'round';
  let farOpen = false;
  let farSumW = 0, farCnt = 0;
  for (let i = 0; i <= GRID_N; i++) {
    const idx = i % GRID_N;
    const w = H_WEIGHT[idx];
    const x = (i / GRID_N) * SILK_W;
    const y = H_FAR[idx] * SILK_H;
    if (w >= 0.08) {
      if (!farOpen) {
        g.beginPath();
        g.moveTo(x, y);
        farOpen = true;
        farSumW = w;
        farCnt = 1;
      } else {
        g.lineTo(x, y);
        farSumW += w;
        farCnt++;
      }
    } else if (farOpen) {
      g.strokeStyle = `rgba(196, 152, 74, ${0.34 * (farSumW / farCnt)})`;
      g.stroke();
      farOpen = false;
    }
  }
  if (farOpen) {
    g.strokeStyle = `rgba(196, 152, 74, ${0.34 * (farSumW / farCnt)})`;
    g.stroke();
  }
  // 远山轻柔披麻皴
  for (let i = 0; i < GRID_N; i += 14) {
    const w = H_WEIGHT[i];
    if (w <= 0.25) continue;
    const x0 = (i / GRID_N) * SILK_W;
    const y0 = H_FAR[i] * SILK_H;
    const sl = clamp(sampleSlopePer(H_FAR, i / GRID_N) * 0.22, -0.8, 0.8);
    const len = 26 + noise1Per(i / GRID_N, 24, 71) * 44;
    g.strokeStyle = `rgba(164, 122, 58, ${0.18 * w})`;
    g.lineWidth = 1.0;
    g.beginPath();
    g.moveTo(x0, y0 + 2);
    g.quadraticCurveTo(x0 + sl * len * 0.45, y0 + len * 0.48, x0 + sl * len * 0.9, y0 + len);
    g.stroke();
  }
  g.restore();

  // 2) 主峦泥金山骨（连续变宽曲线 + 次级分脊 + 披麻皴 & 小斧劈皴）
  // 找出连续已画段
  let seg = [];
  const flushMainSeg = (arr) => {
    if (arr.length < 2) return;
    // 暗金轮廓丝带
    drawTaperedRibbon(g, arr, 3.3, '#a97424', 0.84);
    // 亮泥金高光脊线
    g.save();
    g.strokeStyle = '#f5d68a';
    g.lineWidth = 1.65;
    g.lineJoin = 'round';
    g.globalAlpha = 0.88;
    g.beginPath();
    g.moveTo(arr[0].x, arr[0].y - 1.0);
    for (let k = 1; k < arr.length - 1; k++) {
      const mx = (arr[k].x + arr[k + 1].x) * 0.5;
      const my = (arr[k].y + arr[k + 1].y) * 0.5;
      g.quadraticCurveTo(arr[k].x, arr[k].y - 1.0, mx, my - 1.0);
    }
    const last = arr[arr.length - 1];
    g.lineTo(last.x, last.y - 1.0);
    g.stroke();
    g.restore();

    // 同步写入泥金微闪通道
    gm.save();
    gm.strokeStyle = 'rgba(0, 255, 0, 0.92)';
    gm.lineWidth = 2.4;
    gm.lineJoin = 'round';
    gm.beginPath();
    for (let k = 0; k < arr.length; k++) {
      const sx = (arr[k].x / SILK_W) * OPT_W;
      const sy = (arr[k].y / SILK_H) * OPT_H;
      if (k === 0) gm.moveTo(sx, sy);
      else gm.lineTo(sx, sy);
    }
    gm.stroke();
    gm.restore();
  };

  for (let i = 0; i <= GRID_N; i++) {
    const idx = i % GRID_N;
    const w = H_WEIGHT[idx];
    if (w > 0.08) {
      const u = i / GRID_N;
      const sl = Math.abs(sampleSlopePer(H_WRAP, u));
      const spd = H_SPEED[idx];
      // 笔速慢则泥金丰厚，笔速快则飞白瘦劲
      const ribW = clamp(lerp(4.4, 1.55, spd) + (1 - Math.min(sl * 0.35, 0.6)) * 1.1, 1.35, 5.1) * (0.4 + 0.6 * w);
      seg.push({ x: u * SILK_W, y: H_WRAP[idx] * SILK_H, w: ribW, spd });
    } else if (seg.length) {
      flushMainSeg(seg);
      seg = [];
    }
  }
  if (seg.length) flushMainSeg(seg);

  // 2B) 依据真实笔速补绘飞白干毫与慢笔金砂（永久保留笔意，不被重绘覆盖）
  for (let i = 0; i < GRID_N; i += 2) {
    const w = H_WEIGHT[i];
    if (w < 0.16) continue;
    const u = i / GRID_N;
    const x = u * SILK_W;
    const y = H_WRAP[i] * SILK_H;
    const spd = H_SPEED[i];
    if (spd > 0.48 && i % 4 === 0) {
      // 快笔飞白分毫
      const j = (i + 4) % GRID_N;
      const x2 = x + (4 / GRID_N) * SILK_W;
      const y2 = H_WRAP[j] * SILK_H;
      for (let s = -1; s <= 1; s += 2) {
        g.strokeStyle = `rgba(245, 214, 138, ${(0.28 + 0.35 * spd) * w})`;
        g.lineWidth = 0.85;
        g.beginPath();
        g.moveTo(x, y + s * 2.6);
        g.lineTo(x2, y2 + s * (2.2 + noise1Per(u, 40, 151 + s) * 2.2));
        g.stroke();
      }
    } else if (spd < 0.42 && i % 3 === 0) {
      // 慢笔泥金丰厚：沿脊线散落细腻金砂
      const nDust = spd < 0.25 ? 3 : 2;
      for (let k = 0; k < nDust; k++) {
        const dx = (hash1(i * 13.7 + k * 5.1) - 0.5) * 22;
        const dy = (hash1(i * 19.3 + k * 7.9) - 0.22) * 24;
        const r = 0.65 + hash1(i * 3.1 + k * 11.3) * 1.15;
        const gx = wrapX(x + dx, SILK_W);
        g.fillStyle = k % 2 === 0 ? `rgba(245, 214, 138, ${0.68 * w})` : `rgba(216, 169, 78, ${0.58 * w})`;
        g.beginPath();
        g.arc(gx, y + dy, r, 0, TAU);
        g.fill();
        gm.fillStyle = `rgba(0, 240, 0, ${0.62 * w})`;
        gm.fillRect((gx / SILK_W) * OPT_W, ((y + dy) / SILK_H) * OPT_H, 1.5, 1.5);
      }
    }
  }

  // 3) 披麻皴（顺坡势流畅长弯丝）+ 小斧劈皴（峭壁斜折短面）+ 山腰分脊线
  for (let i = 0; i < GRID_N; i += 3) {
    const w = H_WEIGHT[i];
    if (w < 0.14) continue;
    const u = i / GRID_N;
    const x = u * SILK_W;
    const yTop = H_WRAP[i] * SILK_H;
    const yBot = H_BANK[i] * SILK_H;
    const span = Math.max(40, yBot - yTop);
    const sl = sampleSlopePer(H_WRAP, u);
    const steep = Math.abs(sl);
    const nA = noise1Per(u, 32, 83);
    const nB = noise1Per(u, 64, 97);

    // 主峰分脊线（肩脉）
    if (i % 15 === 0 && nA > 0.34) {
      const dir = sl >= 0 ? 1 : -1;
      const fLen = span * (0.36 + nB * 0.38);
      const pts = [];
      for (let s = 0; s <= 7; s++) {
        const f = s / 7;
        const px = x + dir * f * fLen * 0.52 + Math.sin(f * Math.PI) * dir * 12;
        const py = yTop + 4 + f * fLen;
        pts.push({ x: px, y: py, w: lerp(2.2, 0.5, f) });
      }
      drawWrapped(g, SILK_W, x, 140, (bx) => {
        const dx = bx - x;
        const shifted = pts.map((p) => ({ x: p.x + dx, y: p.y, w: p.w }));
        drawTaperedRibbon(g, shifted, 1.8, '#c6923d', 0.42 * w);
      });
      drawWrapped(gm, OPT_W, (x / SILK_W) * OPT_W, 75, (bx) => {
        const dx = bx - (x / SILK_W) * OPT_W;
        gm.strokeStyle = `rgba(0, 210, 0, ${0.42 * w})`;
        gm.lineWidth = 1.2;
        gm.beginPath();
        pts.forEach((p, k) => {
          const px = (p.x / SILK_W) * OPT_W + dx;
          const py = (p.y / SILK_H) * OPT_H;
          if (k === 0) gm.moveTo(px, py); else gm.lineTo(px, py);
        });
        gm.stroke();
      });
    }

    // 披麻皴（细密顺坡柔和长笔，分暗赭与泥金两色）
    const numCun = nA > 0.42 ? 2 : 1;
    for (let c = 0; c < numCun; c++) {
      const y0 = yTop + 8 + (c * 0.28 + nB * 0.32) * span * 0.62;
      const len = span * (0.22 + noise1Per(u, 48, 101 + c * 9) * 0.34);
      const slant = clamp(sl * 0.38, -0.75, 0.75) * len;
      const bend = (nA - 0.5) * 24;
      const isGold = (i + c) % 3 === 0;
      const col = isGold
        ? `rgba(222, 178, 88, ${(0.24 + 0.22 * nB) * w})`
        : `rgba(118, 82, 40, ${(0.18 + 0.18 * nB) * w})`;
      drawWrapped(g, SILK_W, x, 90, (bx) => {
        g.strokeStyle = col;
        g.lineWidth = isGold ? 1.15 : 1.0;
        g.beginPath();
        g.moveTo(bx, y0);
        g.quadraticCurveTo(bx + slant * 0.48 + bend * 0.35, y0 + len * 0.52, bx + slant, y0 + len);
        g.stroke();
      });
    }

    // 小斧劈皴（峭坡侧向凌厉斜刮，呈现北宋山石棱角）
    if (steep > 0.55 && i % 6 === 0) {
      const side = sl > 0 ? 1 : -1;
      const y0 = yTop + 14 + nA * span * 0.45;
      const axW = 14 + nB * 22;
      const axH = 22 + nA * 32;
      drawWrapped(g, SILK_W, x, 60, (bx) => {
        g.fillStyle = `rgba(92, 64, 34, ${0.15 * w})`;
        g.beginPath();
        g.moveTo(bx, y0);
        g.lineTo(bx + side * axW, y0 + axH * 0.42);
        g.lineTo(bx + side * axW * 0.45, y0 + axH);
        g.lineTo(bx - side * 4, y0 + axH * 0.55);
        g.closePath();
        g.fill();
        g.strokeStyle = `rgba(232, 190, 102, ${0.32 * w})`;
        g.lineWidth = 0.9;
        g.beginPath();
        g.moveTo(bx, y0);
        g.lineTo(bx + side * axW, y0 + axH * 0.42);
        g.stroke();
      });
    }
  }

  // 4) 近岸坡陀泥金勾边（让前景江岸秀雅连贯）
  const bankPts = [];
  for (let i = 0; i <= GRID_N; i += 2) {
    const idx = i % GRID_N;
    if (H_WEIGHT[idx] > 0.1) {
      bankPts.push({ x: (i / GRID_N) * SILK_W, y: H_BANK[idx] * SILK_H, w: 2.1 });
    } else if (bankPts.length) {
      drawTaperedRibbon(g, bankPts, 2.0, '#b98738', 0.65);
      bankPts.length = 0;
    }
  }
  if (bankPts.length) drawTaperedRibbon(g, bankPts, 2.0, '#b98738', 0.65);

  staticDirty = true;
}

/* ---------- 2.5 第二幕：宋式青绿四阶矿物重彩层染 + 淡杏霞 + 春江 ---------- */
function paintWashBrush(u, v, radiusU = 0.085, strength = 0.42, isManual = true) {
  const cx = wrap01(u) * WASH_W;
  const cy = clamp(v, 0, 1) * WASH_H;
  const rx = radiusU * WASH_W;
  const ry = radiusU * (SILK_W / SILK_H) * WASH_H * 0.85;
  let delta = 0;
  for (let y = Math.max(0, Math.floor(cy - ry - 1)); y <= Math.min(WASH_H - 1, Math.ceil(cy + ry + 1)); y++) {
    const dy = (y + 0.5 - cy) / ry;
    const dy2 = dy * dy;
    if (dy2 >= 1) continue;
    for (let dxI = -Math.ceil(rx + 1); dxI <= Math.ceil(rx + 1); dxI++) {
      const gx = ((Math.floor(cx) + dxI) % WASH_W + WASH_W) % WASH_W;
      const dx = (dxI - (cx - Math.floor(cx)) + 0.5) / rx;
      const d2 = dx * dx + dy2;
      if (d2 >= 1) continue;
      const fall = Math.pow(1 - d2, 1.55) * strength;
      const idx = y * WASH_W + gx;
      const prev = WASH_TARGET[idx];
      const next = Math.min(1, prev + fall);
      if (next > prev) {
        WASH_TARGET[idx] = next;
        delta += (next - prev);
      }
    }
  }
  if (delta > 0.001) {
    if (isManual) STATE.manualWork += delta * 0.065;
    else STATE.ghostWork += delta * 0.065;
    washCanvasDirty = true;
  }
}

function stepWashDiffusion(dt) {
  let changed = false;
  let sum = 0;
  const rate = Math.min(1, dt * 3.4);
  for (let i = 0; i < WASH.length; i++) {
    const diff = WASH_TARGET[i] - WASH[i];
    if (Math.abs(diff) > 0.003) {
      WASH[i] += diff * rate;
      changed = true;
    } else if (diff !== 0) {
      WASH[i] = WASH_TARGET[i];
      changed = true;
    }
    sum += WASH[i];
  }
  // 极柔水晕横向与纵向毛细洇染
  if (changed) {
    for (let y = 1; y < WASH_H - 1; y++) {
      const row = y * WASH_W;
      for (let x = 0; x < WASH_W; x++) {
        const xl = (x - 1 + WASH_W) % WASH_W;
        const xr = (x + 1) % WASH_W;
        const avg = (WASH_TARGET[row + xl] + WASH_TARGET[row + xr] + WASH_TARGET[row - WASH_W + x] + WASH_TARGET[row + WASH_W + x]) * 0.25;
        if (avg > WASH_TARGET[row + x] + 0.04) {
          WASH_TARGET[row + x] = Math.min(1, WASH_TARGET[row + x] + (avg - WASH_TARGET[row + x]) * dt * 0.72);
        }
      }
    }
    washCanvasDirty = true;
  }
  STATE.washCoverage = clamp(sum / (WASH_W * WASH_H * 0.78), 0, 1);
}

// 将青绿四阶矿物层染精确绘制到 layerWash（对齐远山 / 主峰 / 近岸 / 江水 / 杏霞）
function sampleWashAt(u, v) {
  const fx = wrap01(u) * WASH_W - 0.5;
  const fy = clamp(v, 0, 1) * WASH_H - 0.5;
  const x0 = ((Math.floor(fx) % WASH_W) + WASH_W) % WASH_W;
  const x1 = (x0 + 1) % WASH_W;
  const y0 = clamp(Math.floor(fy), 0, WASH_H - 1);
  const y1 = clamp(y0 + 1, 0, WASH_H - 1);
  const tx = fx - Math.floor(fx);
  const ty = fy - Math.floor(fy);
  const a = lerp(WASH[y0 * WASH_W + x0], WASH[y0 * WASH_W + x1], tx);
  const b = lerp(WASH[y1 * WASH_W + x0], WASH[y1 * WASH_W + x1], tx);
  return lerp(a, b, ty);
}

// 构造逐 2px 平滑山脊闭合裁剪路径（彻底消除山脊与屏风投影的阶梯锯齿）
function buildRidgeClipPath(ctx, arr, w, h, yBottom, yOff = 0, stepPx = 2) {
  ctx.beginPath();
  for (let x = 0; x <= w; x += stepPx) {
    const u = x / w;
    const y = sampleArrPer(arr, u) * h + yOff;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(w, sampleArrPer(arr, 1) * h + yOff);
  ctx.lineTo(w, yBottom);
  ctx.lineTo(0, yBottom);
  ctx.closePath();
}

function rebuildWashLayer() {
  washCanvasDirty = false;
  const g = layerWash.g;
  const W = SILK_W, H = SILK_H;
  g.clearRect(0, 0, W, H);
  if (STATE.washCoverage < 0.004) {
    staticDirty = true;
    return;
  }

  const COLS = 320;
  const colW = W / COLS + 1.5;

  // 1) 高空淡暖杏霞（温和浸入熟绢，无硬切边）
  for (let c = 0; c < COLS; c++) {
    const u = (c + 0.5) / COLS;
    const x = (c / COLS) * W;
    const yFar = sampleArrPer(H_FAR, u) * H;
    const wSky = sampleWashAt(u, yFar / H * 0.55);
    if (wSky > 0.02) {
      const sg = g.createLinearGradient(0, 0, 0, Math.max(24, yFar + 36));
      sg.addColorStop(0, `rgba(232, 188, 134, ${0.34 * wSky})`);
      sg.addColorStop(0.58, `rgba(244, 214, 168, ${0.22 * wSky})`);
      sg.addColorStop(1, 'rgba(251, 245, 232, 0)');
      g.fillStyle = sg;
      g.fillRect(x, 0, colW, yFar + 38);
    }
  }

  // 2) 远山淡石青层染（以 2px 平滑曲线 clip，丝滑连绵零锯齿）
  g.save();
  buildRidgeClipPath(g, H_FAR, W, H, H, 0, 2);
  g.clip();
  for (let c = 0; c < COLS; c++) {
    const u = (c + 0.5) / COLS;
    const x = (c / COLS) * W;
    const yFar = sampleArrPer(H_FAR, u) * H;
    const yMain = sampleArrPer(H_WRAP, u) * H;
    const wFar = sampleWashAt(u, (yFar + yMain) * 0.5 / H);
    if (wFar > 0.02 && yMain > yFar - 4) {
      const fg = g.createLinearGradient(0, yFar - 2, 0, yMain + 28);
      fg.addColorStop(0.0, `rgba(46, 107, 130, ${0.58 * wFar})`);   // 二青
      fg.addColorStop(0.45, `rgba(92, 153, 123, ${0.42 * wFar})`);  // 淡石绿
      fg.addColorStop(0.85, `rgba(251, 245, 232, ${0.46 * wFar})`); // 山腰蛤粉云岚
      fg.addColorStop(1.0, 'rgba(251, 245, 232, 0)');
      g.fillStyle = fg;
      g.fillRect(x, yFar - 4, colW, Math.max(18, yMain - yFar + 34));
    }
  }
  g.restore();

  // 3) 主峦《千里江山图》四阶矿物层染（以 2px 平滑主峰曲线 clip，头青->头绿->二绿->赭石->蛤粉）
  g.save();
  buildRidgeClipPath(g, H_WRAP, W, H, H, 0, 2);
  g.clip();
  for (let c = 0; c < COLS; c++) {
    const u = (c + 0.5) / COLS;
    const x = (c / COLS) * W;
    const yMain = sampleArrPer(H_WRAP, u) * H;
    const yBank = sampleArrPer(H_BANK, u) * H;
    const wMain = Math.max(sampleWashAt(u, (yMain + 0.08 * H) / H), sampleWashAt(u, (yMain + yBank) * 0.5 / H));
    if (wMain > 0.02) {
      const bot = Math.max(yMain + 45, yBank + 16);
      const mg = g.createLinearGradient(0, yMain - 2, 0, bot);
      const slopeShade = clamp(sampleSlopePer(H_WRAP, u) * 0.28, -0.14, 0.14);
      const aM = clamp(wMain * (0.86 + slopeShade), 0, 0.96);
      mg.addColorStop(0.00, `rgba(30, 78, 99, ${0.92 * aM})`);    // 头青/石青 #1e4e63
      mg.addColorStop(0.18, `rgba(46, 107, 130, ${0.88 * aM})`);  // 二青 #2e6b82
      mg.addColorStop(0.42, `rgba(56, 120, 94, ${0.86 * aM})`);   // 头绿/石绿 #38785e
      mg.addColorStop(0.64, `rgba(92, 153, 123, ${0.80 * aM})`);  // 二绿 #5c997b
      mg.addColorStop(0.84, `rgba(143, 92, 56, ${0.74 * aM})`);   // 赭石山脚 #8f5c38
      mg.addColorStop(1.00, `rgba(251, 245, 232, ${0.52 * aM})`); // 融进蛤粉云雾 #fbf5e8
      g.fillStyle = mg;
      g.fillRect(x, yMain - 4, colW, bot - yMain + 6);
    }
  }
  g.restore();

  // 4) 近岸坡陀（2px 平滑岸线 clip，青绿草坡转暖赭土岸）
  g.save();
  buildRidgeClipPath(g, H_BANK, W, H, H, 0, 2);
  g.clip();
  for (let c = 0; c < COLS; c++) {
    const u = (c + 0.5) / COLS;
    const x = (c / COLS) * W;
    const yBank = sampleArrPer(H_BANK, u) * H;
    const wBank = sampleWashAt(u, (yBank + 0.05 * H) / H);
    if (wBank > 0.02) {
      const bH = Math.max(28, H * 0.095);
      const bg = g.createLinearGradient(0, yBank - 2, 0, yBank + bH);
      bg.addColorStop(0.0, `rgba(56, 120, 94, ${0.86 * wBank})`);
      bg.addColorStop(0.42, `rgba(92, 153, 123, ${0.76 * wBank})`);
      bg.addColorStop(0.78, `rgba(143, 92, 56, ${0.68 * wBank})`);
      bg.addColorStop(1.0, `rgba(143, 92, 56, ${0.06 * wBank})`);
      g.fillStyle = bg;
      g.fillRect(x, yBank - 4, colW, bH + 6);
    }
  }
  g.restore();

  // 5) 下方春江碧水（2px 平滑水际线 clip）
  g.save();
  buildRidgeClipPath(g, H_BANK, W, H, H, H * 0.044, 2);
  g.clip();
  for (let c = 0; c < COLS; c++) {
    const u = (c + 0.5) / COLS;
    const x = (c / COLS) * W;
    const yBank = sampleArrPer(H_BANK, u) * H;
    const waterTop = yBank + H * 0.044;
    const wRiv = sampleWashAt(u, clamp((yBank / H + 0.96) * 0.5, 0.72, 0.96));
    if (wRiv > 0.02 && waterTop < H) {
      const rg = g.createLinearGradient(0, waterTop - 2, 0, H);
      rg.addColorStop(0.0, `rgba(74, 134, 124, ${0.52 * wRiv})`);
      rg.addColorStop(0.28, `rgba(52, 114, 118, ${0.66 * wRiv})`);
      rg.addColorStop(0.68, `rgba(38, 92, 108, ${0.74 * wRiv})`);
      rg.addColorStop(1.0, `rgba(28, 72, 92, ${0.80 * wRiv})`);
      g.fillStyle = rg;
      g.fillRect(x, waterTop - 4, colW, H - waterTop + 6);
    }
  }
  g.restore();

  // 在山腰之间补几缕温润蛤粉晕染水痕（增强宣绢质感）
  g.save();
  for (let i = 0; i < 24; i++) {
    const u = (i + 0.37) / 24;
    const w = sampleWashAt(u, 0.56);
    if (w < 0.25) continue;
    const cx = u * W;
    const cy = lerp(sampleArrPer(H_WRAP, u), sampleArrPer(H_BANK, u), 0.78) * H;
    const rw = 85 + noise1Per(u, 12, 131) * 90;
    const rh = 18 + noise1Per(u, 16, 137) * 20;
    drawWrapped(g, W, cx, rw + 10, (px) => {
      const cg = g.createRadialGradient(px, cy, 2, px, cy, rw);
      cg.addColorStop(0, `rgba(251, 245, 232, ${0.38 * w})`);
      cg.addColorStop(1, 'rgba(251, 245, 232, 0)');
      g.fillStyle = cg;
      g.save();
      g.translate(px, cy);
      g.scale(1, rh / rw);
      g.beginPath();
      g.arc(0, 0, rw, 0, TAU);
      g.fill();
      g.restore();
    });
  }
  g.restore();

  staticDirty = true;
}

/* ---------- 2.6 第三幕：宋画虬曲苍松 / 灼灼春桃 / 临水垂柳（严禁直线火柴棍！） ---------- */
// 三次贝塞尔变宽曲干绘制器
function drawBezierTrunk(ctx, p0, c1, c2, p3, w0, w1, colorDark, colorLight, steps = 16) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    const x = mt * mt * mt * p0.x + 3 * mt * mt * t * c1.x + 3 * mt * t * t * c2.x + t * t * t * p3.x;
    const y = mt * mt * mt * p0.y + 3 * mt * mt * t * c1.y + 3 * mt * t * t * c2.y + t * t * t * p3.y;
    const wobble = Math.sin(t * Math.PI * 2.5) * 1.1;
    pts.push({ x: x + wobble, y, w: lerp(w0, w1, Math.pow(t, 0.85)) });
  }
  drawTaperedRibbon(ctx, pts, w0, colorDark, 0.94);
  // 受光侧赭石皮纹高光
  ctx.save();
  ctx.strokeStyle = colorLight;
  ctx.lineWidth = Math.max(0.8, w0 * 0.28);
  ctx.globalAlpha = 0.58;
  ctx.beginPath();
  pts.forEach((p, idx) => {
    if (idx === 0) ctx.moveTo(p.x - p.w * 0.32, p.y);
    else ctx.lineTo(p.x - p.w * 0.32, p.y);
  });
  ctx.stroke();
  ctx.restore();
  return pts[pts.length - 1];
}

// 宋画石绿扁平扇形松针团簇 + 泥金点苔
function drawSongPinePad(ctx, cx, cy, rx, ry, seed) {
  ctx.save();
  ctx.translate(cx, cy);
  // 底层深松绿剪影托垫（扁平月牙团簇）
  ctx.fillStyle = 'rgba(26, 62, 50, 0.88)';
  ctx.beginPath();
  ctx.ellipse(0, 2, rx * 0.95, ry * 0.82, 0, Math.PI, TAU);
  ctx.ellipse(0, 2, rx * 0.95, ry * 0.42, 0, 0, Math.PI);
  ctx.fill();

  // 放射状扇形松针笔触（头绿 + 二绿）
  const needles = Math.max(16, Math.round(rx * 0.85));
  for (let i = 0; i < needles; i++) {
    const f = i / (needles - 1);
    const ang = lerp(-Math.PI * 0.94, -Math.PI * 0.06, f);
    const nLen = (0.72 + 0.36 * Math.sin(f * Math.PI) + (hash1(seed + i * 3.1) - 0.5) * 0.24);
    const ex = Math.cos(ang) * rx * nLen;
    const ey = Math.sin(ang) * ry * 1.45 * nLen + 2;
    ctx.strokeStyle = i % 3 === 0 ? 'rgba(92, 153, 123, 0.88)' : 'rgba(44, 102, 78, 0.92)';
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo((f - 0.5) * rx * 0.48, 3);
    ctx.quadraticCurveTo(ex * 0.55, ey * 0.72, ex, ey);
    ctx.stroke();
  }

  // 上缘泥金点苔与高光针尖
  for (let k = 0; k < 7; k++) {
    const f = (k + 0.5) / 7;
    const px = lerp(-rx * 0.76, rx * 0.76, f) + (hash1(seed + k * 7.3) - 0.5) * 5;
    const py = -Math.sin(f * Math.PI) * ry * 0.95 + (hash1(seed + k * 11.7) - 0.5) * 4;
    ctx.fillStyle = k % 2 === 0 ? 'rgba(222, 176, 86, 0.78)' : 'rgba(245, 214, 138, 0.65)';
    ctx.beginPath();
    ctx.ellipse(px, py, 2.2, 1.35, -0.2, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function renderPineToFlora(pine) {
  const g = layerFlora.g;
  const gm = layerGoldMask.g;
  const drawOne = (bx) => {
    const { y, scale, lean, seed } = pine;
    const h = 68 * scale;
    const dir = lean >= 0 ? 1 : -1;
    const p0 = { x: bx, y };
    const pMid = { x: bx + dir * 16 * scale, y: y - h * 0.48 };
    const pTop = { x: bx - dir * 8 * scale + lean * 24 * scale, y: y - h };

    // 下段虬曲树干（S 形三次贝塞尔）
    drawBezierTrunk(
      g,
      p0,
      { x: bx - dir * 18 * scale, y: y - h * 0.16 },
      { x: bx + dir * 28 * scale, y: y - h * 0.34 },
      pMid,
      5.2 * scale, 3.6 * scale,
      '#2e1e14', '#8a5d39'
    );
    // 上段盘折树干
    drawBezierTrunk(
      g,
      pMid,
      { x: pMid.x + dir * 8 * scale, y: y - h * 0.68 },
      { x: pTop.x - dir * 18 * scale, y: y - h * 0.84 },
      pTop,
      3.5 * scale, 1.6 * scale,
      '#2e1e14', '#8a5d39'
    );

    // 3~4 支迎风横斜曲枝 + 扁平松针团簇
    const limbs = [
      { sx: pMid.x, sy: pMid.y + 4 * scale, ex: pMid.x + dir * 44 * scale, ey: pMid.y - 6 * scale, rx: 28 * scale, ry: 11 * scale },
      { sx: lerp(pMid.x, pTop.x, 0.45), sy: lerp(pMid.y, pTop.y, 0.45), ex: pMid.x - dir * 34 * scale, ey: lerp(pMid.y, pTop.y, 0.58), rx: 24 * scale, ry: 10 * scale },
      { sx: lerp(pMid.x, pTop.x, 0.78), sy: lerp(pMid.y, pTop.y, 0.78), ex: pTop.x + dir * 28 * scale, ey: pTop.y - 6 * scale, rx: 23 * scale, ry: 9.5 * scale },
      { sx: pTop.x, sy: pTop.y, ex: pTop.x - dir * 8 * scale, ey: pTop.y - 10 * scale, rx: 29 * scale, ry: 11.5 * scale }
    ];
    limbs.forEach((L, idx) => {
      const c1 = { x: lerp(L.sx, L.ex, 0.35), y: L.sy + 9 * scale };
      const c2 = { x: lerp(L.sx, L.ex, 0.72), y: L.ey - 5 * scale };
      drawBezierTrunk(g, { x: L.sx, y: L.sy }, c1, c2, { x: L.ex, y: L.ey }, 2.1 * scale, 0.8 * scale, '#2e1e14', '#7d5332', 10);
      drawSongPinePad(g, L.ex, L.ey - 2 * scale, L.rx, L.ry, seed + idx * 31);
      // 同步一点泥金点苔到光泽掩码
      gm.fillStyle = 'rgba(0, 175, 0, 0.45)';
      gm.fillRect((L.ex / SILK_W) * OPT_W - 6, ((L.ey - 5) / SILK_H) * OPT_H - 2, 12, 4);
    });
  };
  drawWrapped(g, SILK_W, pine.x, 120, drawOne);
  staticDirty = true;
}

// 五瓣丹砂粉白桃花单朵绘制
function drawFivePetalBlossom(ctx, x, y, r, rot, tint) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  const colOuter = tint < 0.45 ? 'rgba(216, 100, 72, 0.90)' : (tint < 0.78 ? 'rgba(236, 146, 122, 0.90)' : 'rgba(251, 245, 232, 0.92)');
  const colInner = tint < 0.45 ? 'rgba(244, 168, 146, 0.92)' : 'rgba(255, 248, 238, 0.96)';
  for (let k = 0; k < 5; k++) {
    const a = k * (TAU / 5);
    const px = Math.cos(a) * r * 0.56;
    const py = Math.sin(a) * r * 0.56;
    ctx.fillStyle = k % 2 === 0 ? colOuter : colInner;
    ctx.beginPath();
    ctx.ellipse(px, py, r * 0.48, r * 0.36, a, 0, TAU);
    ctx.fill();
  }
  // 细金花蕊
  ctx.fillStyle = '#f5d68a';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.85, r * 0.22), 0, TAU);
  ctx.fill();
  ctx.restore();
}

function renderPeachToFlora(peach) {
  const g = layerFlora.g;
  const drawOne = (bx) => {
    const { y, scale, lean, seed } = peach;
    const h = 58 * scale;
    const dir = lean >= 0 ? 1 : -1;
    const p0 = { x: bx, y };
    const pTop = { x: bx + dir * 24 * scale, y: y - h * 0.68 };

    // 柔美曲干
    drawBezierTrunk(
      g,
      p0,
      { x: bx - dir * 10 * scale, y: y - h * 0.25 },
      { x: bx + dir * 22 * scale, y: y - h * 0.45 },
      pTop,
      4.0 * scale, 1.8 * scale,
      '#3e2519', '#8a583c'
    );

    const twigAnchors = [];
    const branchSpecs = [
      { t: 0.48, dx: -36 * dir * scale, dy: -22 * scale },
      { t: 0.68, dx: 38 * dir * scale, dy: -26 * scale },
      { t: 0.88, dx: -18 * dir * scale, dy: -32 * scale },
      { t: 1.00, dx: 22 * dir * scale, dy: -22 * scale }
    ];

    branchSpecs.forEach((B, idx) => {
      const sx = lerp(p0.x, pTop.x, B.t) + Math.sin(B.t * Math.PI) * dir * 6 * scale;
      const sy = lerp(p0.y, pTop.y, B.t);
      const ex = sx + B.dx;
      const ey = sy + B.dy;
      const c1 = { x: sx + B.dx * 0.38, y: sy + B.dy * 0.12 - 6 * scale };
      const c2 = { x: sx + B.dx * 0.72, y: sy + B.dy * 0.88 };
      drawBezierTrunk(g, { x: sx, y: sy }, c1, c2, { x: ex, y: ey }, 1.9 * scale, 0.65 * scale, '#42281c', '#8f5c38', 10);

      for (let m = 0; m < 7; m++) {
        const ft = 0.25 + (m / 6) * 0.78;
        const mt = 1 - ft;
        const fx = mt * mt * mt * sx + 3 * mt * mt * ft * c1.x + 3 * mt * ft * ft * c2.x + ft * ft * ft * ex;
        const fy = mt * mt * mt * sy + 3 * mt * mt * ft * c1.y + 3 * mt * ft * ft * c2.y + ft * ft * ft * ey;
        twigAnchors.push({ x: fx, y: fy, s: seed + idx * 19 + m * 5.3 });
      }
    });

    // 淡春桃云雾底晕（让花簇丰盈不琐碎）
    for (let k = 0; k < twigAnchors.length; k += 3) {
      const a = twigAnchors[k];
      const rg = g.createRadialGradient(a.x, a.y, 1, a.x, a.y, 14 * scale);
      rg.addColorStop(0, 'rgba(232, 136, 114, 0.28)');
      rg.addColorStop(1, 'rgba(232, 136, 114, 0)');
      g.fillStyle = rg;
      g.beginPath();
      g.arc(a.x, a.y, 14 * scale, 0, TAU);
      g.fill();
    }

    // 26~34 朵五瓣丹砂粉白桃花
    for (const a of twigAnchors) {
      const ox = (hash1(a.s) - 0.5) * 14 * scale;
      const oy = (hash1(a.s + 1.9) - 0.5) * 12 * scale;
      const r = (3.1 + hash1(a.s + 4.1) * 2.4) * scale;
      const rot = hash1(a.s + 7.7) * TAU;
      const tint = hash1(a.s + 11.3);
      drawFivePetalBlossom(g, a.x + ox, a.y + oy, r, rot, tint);
      // 偶配两片嫩石绿小叶
      if (hash1(a.s + 15.1) < 0.34) {
        g.save();
        g.translate(a.x + ox + 4 * scale, a.y + oy + 2 * scale);
        g.rotate(rot);
        g.fillStyle = 'rgba(72, 136, 98, 0.85)';
        g.beginPath();
        g.ellipse(0, 0, 3.8 * scale, 1.3 * scale, 0, 0, TAU);
        g.fill();
        g.restore();
      }
    }
  };
  drawWrapped(g, SILK_W, peach.x, 110, drawOne);
  staticDirty = true;
}

function plantFloraAt(u, v, isManual = true, forcedType = null) {
  const wu = wrap01(u);
  const x = wu * SILK_W;
  const yMain = sampleArrPer(H_WRAP, wu);
  const yBank = sampleArrPer(H_BANK, wu);

  let type = forcedType;
  if (!type) {
    if (v < lerp(yMain, yBank, 0.42)) type = 'pine';
    else if (v < yBank - 0.015) type = 'peach';
    else type = 'willow';
    // 温和均衡，防止全堆成一种
    if (STATE.floraCount >= 3) {
      if (type === 'pine' && STATE.pines.length >= STATE.peaches.length + 3) type = 'peach';
      if (type === 'peach' && STATE.peaches.length >= STATE.willows.length + 3 && v > yMain + 0.14) type = 'willow';
    }
  }

  const seed = rand(1, 9999);
  if (type === 'pine') {
    const py = clamp(v, yMain + 0.015, lerp(yMain, yBank, 0.56)) * SILK_H;
    const pine = { x, y: py, scale: rand(0.76, 1.16), lean: rand(-0.7, 0.7), seed };
    STATE.pines.push(pine);
    renderPineToFlora(pine);
    AUDIO.playGuzheng(wu, 0.78, true);
  } else if (type === 'peach') {
    const py = clamp(v, lerp(yMain, yBank, 0.35), yBank + 0.025) * SILK_H;
    const peach = { x, y: py, scale: rand(0.78, 1.15), lean: rand(-0.65, 0.65), seed };
    STATE.peaches.push(peach);
    renderPeachToFlora(peach);
    // 生成随风飘落的桃花瓣
    for (let k = 0; k < 5; k++) {
      STATE.petals.push({
        x: wrapX(x + rand(-28, 28), SILK_W),
        y: py - rand(22, 56),
        vx: rand(9, 24),
        vy: rand(10, 22),
        rot: rand(0, TAU),
        vrot: rand(-2.2, 2.2),
        size: rand(2.2, 4.2),
        phase: rand(0, TAU),
        tint: rand(0, 1),
        floating: false,
        life: rand(0, 10)
      });
    }
    AUDIO.playGuzhengGliss(wu);
  } else {
    const py = (yBank + rand(0.005, 0.032)) * SILK_H;
    const strands = [];
    const nStrands = 9 + Math.floor(rnd() * 4); // 9~12 缕垂柳丝
    const lean = rand(-0.55, 0.55) || 0.35;
    for (let s = 0; s < nStrands; s++) {
      const f = s / (nStrands - 1);
      strands.push({
        ox: lerp(-34, 38, f) + rand(-4, 4),
        oy: -rand(46, 68) + Math.abs(f - 0.5) * 14,
        len: rand(44, 78),
        phase: rand(0, TAU),
        freq: rand(1.1, 1.7)
      });
    }
    const willow = { x, y: py, scale: rand(0.84, 1.12), lean, strands, seed };
    STATE.willows.push(willow);
    // 树干画入静态层，柳丝实时摆动绘制
    const drawTrunk = (bx) => {
      const h = 60 * willow.scale;
      const dir = lean >= 0 ? 1 : -1;
      drawBezierTrunk(
        layerFlora.g,
        { x: bx, y: py },
        { x: bx + dir * 10 * willow.scale, y: py - h * 0.35 },
        { x: bx + dir * 24 * willow.scale, y: py - h * 0.72 },
        { x: bx + dir * 16 * willow.scale, y: py - h },
        3.8 * willow.scale, 1.3 * willow.scale,
        '#3a281a', '#7c5c3d'
      );
    };
    drawWrapped(layerFlora.g, SILK_W, x, 90, drawTrunk);
    staticDirty = true;
    AUDIO.playGuzheng(wu, 0.42, false);
  }

  STATE.floraCount = STATE.pines.length + STATE.peaches.length + STATE.willows.length;
  if (isManual) STATE.manualWork += 1.0;
  else STATE.ghostWork += 1.0;
}

/* ---------- 2.7 第四幕：《瑞鹤图》飞鹤与江南乌篷轻舟（同步写入镂空透光通道！） ---------- */
function spawnCraneAt(u, v, dir = 1, isManual = true) {
  if (STATE.cranes.length >= 7) return false;
  const wu = wrap01(u);
  const yMax = Math.min(0.42, sampleArrPer(H_FAR, wu) + 0.04);
  const cy = clamp(v, 0.08, Math.max(0.16, yMax)) * SILK_H;
  STATE.cranes.push({
    x: wu * SILK_W,
    y: cy,
    baseY: cy,
    vx: (dir >= 0 ? 1 : -1) * rand(38, 58),
    scale: rand(0.95, 1.32),
    wingPhase: rand(0, TAU),
    wingSpeed: rand(4.2, 5.4),
    bobPhase: rand(0, TAU),
    born: STATE.totalTime
  });
  STATE.craneCount = STATE.cranes.length;
  if (isManual) STATE.manualWork += 1.4;
  else STATE.ghostWork += 1.4;
  AUDIO.playCraneCall(wu);
  return true;
}

function spawnBoatAt(u, v, isManual = true) {
  if (STATE.boats.length >= 2) {
    // 若已有两舟，轻点则轻推已有船只荡开波纹
    const b = STATE.boats[STATE.boats.length - 1];
    b.vx = (b.vx >= 0 ? 1 : -1) * rand(18, 28);
    AUDIO.playPaddle(wrap01(u));
    return false;
  }
  const wu = wrap01(u);
  const yBank = sampleArrPer(H_BANK, wu);
  const by = clamp(v, yBank + 0.085, 0.90) * SILK_H;
  const dir = STATE.boats.length === 0 ? 1 : -1;
  STATE.boats.push({
    x: wu * SILK_W,
    y: by,
    vx: dir * rand(14, 22),
    scale: rand(0.92, 1.12),
    bobPhase: rand(0, TAU),
    born: STATE.totalTime
  });
  STATE.boatCount = STATE.boats.length;
  if (isManual) STATE.manualWork += 1.6;
  else STATE.ghostWork += 1.6;
  AUDIO.playPaddle(wu);
  return true;
}

// 精绘《瑞鹤图》扇翅飞鹤（修长S颈 + 蛤粉白躯干 + 丹砂鹤顶 + 两段关节曲羽 + 泥金镂空线）
function drawRuheCrane(ctx, optCtx, cr, t) {
  const dir = cr.vx >= 0 ? 1 : -1;
  const s = cr.scale;
  const age = clamp((t - cr.born) / 0.85, 0, 1);
  const alpha = easeOutCubic(age);
  const ph = cr.wingPhase;
  const flapInner = Math.sin(ph);
  const flapOuter = Math.sin(ph - 0.78); // 外翼相位滞后，真实鸟类波浪式扑翼

  const drawSingle = (bx, targetCtx, isCutout) => {
    targetCtx.save();
    const sx = isCutout ? (OPT_W / SILK_W) : 1;
    const sy = isCutout ? (OPT_H / SILK_H) : 1;
    targetCtx.translate(bx * sx, cr.y * sy);
    targetCtx.scale(dir * s * sx, s * sy);
    targetCtx.globalAlpha = alpha;

    // 远侧翼（稍靠后上方，相位略差）
    const bY1 = -16 * Math.sin(ph + 0.35) - 6;
    const bY2 = bY1 - 15 * Math.sin(ph - 0.42);
    targetCtx.beginPath();
    targetCtx.moveTo(4, -2);
    targetCtx.quadraticCurveTo(-4, bY1 - 6, -18, bY1);
    targetCtx.quadraticCurveTo(-28, (bY1 + bY2) * 0.5, -36, bY2);
    targetCtx.quadraticCurveTo(-22, bY1 + 7, -6, 1);
    targetCtx.closePath();
    if (isCutout) {
      // 仅写入纯 R 镂空通道（绝不污染 G 泥金通道，绝不画实心大圆盘！）
      targetCtx.shadowColor = 'rgba(255, 0, 0, 0.55)';
      targetCtx.shadowBlur = 2.0;
      targetCtx.fillStyle = 'rgba(255, 0, 0, 0.85)';
      targetCtx.fill();
    } else {
      targetCtx.fillStyle = '#f2ead9';
      targetCtx.fill();
      targetCtx.strokeStyle = 'rgba(232, 188, 96, 0.88)';
      targetCtx.lineWidth = 1.1;
      targetCtx.stroke();
    }

    // 细长后伸双足（鹤足）
    targetCtx.strokeStyle = isCutout ? 'rgba(255, 0, 0, 0.72)' : '#3d2c20';
    targetCtx.lineWidth = isCutout ? 1.8 : 1.3;
    targetCtx.beginPath();
    targetCtx.moveTo(-14, 3);
    targetCtx.quadraticCurveTo(-26, 6, -38, 5);
    targetCtx.moveTo(-15, 5);
    targetCtx.quadraticCurveTo(-27, 8, -36, 9);
    targetCtx.stroke();

    // 流线型蛤粉白躯干 + 墨色尾羽梢
    targetCtx.beginPath();
    targetCtx.moveTo(14, -1);
    targetCtx.bezierCurveTo(6, -8, -8, -7, -19, 1);
    targetCtx.bezierCurveTo(-10, 8, 5, 7, 14, 1);
    targetCtx.closePath();
    if (isCutout) {
      targetCtx.fillStyle = 'rgba(255, 0, 0, 0.96)';
      targetCtx.fill();
    } else {
      targetCtx.fillStyle = '#fbf5e8';
      targetCtx.fill();
      // 黑色尾覆羽
      targetCtx.fillStyle = '#241e1a';
      targetCtx.beginPath();
      targetCtx.moveTo(-13, -1);
      targetCtx.quadraticCurveTo(-22, -2, -24, 2);
      targetCtx.quadraticCurveTo(-18, 5, -12, 3);
      targetCtx.closePath();
      targetCtx.fill();
      // 细泥金镂空轮廓
      targetCtx.strokeStyle = '#e8ba60';
      targetCtx.lineWidth = 1.3;
      targetCtx.stroke();
    }

    // 修长 S 形曲颈 + 鹤首 + 细喙 + 丹砂鹤顶
    targetCtx.beginPath();
    targetCtx.moveTo(11, -1);
    targetCtx.bezierCurveTo(21, -2, 24, -12, 33, -10);
    targetCtx.strokeStyle = isCutout ? 'rgba(255, 0, 0, 0.96)' : '#fbf5e8';
    targetCtx.lineWidth = isCutout ? 4.2 : 3.4;
    targetCtx.lineCap = 'round';
    targetCtx.stroke();
    if (isCutout) {
      // 鹤首与长喙真实镂空剪影
      targetCtx.fillStyle = 'rgba(255, 0, 0, 0.96)';
      targetCtx.beginPath();
      targetCtx.ellipse(34, -10, 4.6, 3.1, -0.1, 0, TAU);
      targetCtx.fill();
      targetCtx.strokeStyle = 'rgba(255, 0, 0, 0.85)';
      targetCtx.lineWidth = 1.8;
      targetCtx.beginPath();
      targetCtx.moveTo(37.5, -10.2);
      targetCtx.lineTo(45.5, -9.2);
      targetCtx.stroke();
    } else {
      targetCtx.strokeStyle = '#e8ba60';
      targetCtx.lineWidth = 0.8;
      targetCtx.stroke();
      // 鹤首
      targetCtx.fillStyle = '#fbf5e8';
      targetCtx.beginPath();
      targetCtx.ellipse(34, -10, 4.2, 2.8, -0.1, 0, TAU);
      targetCtx.fill();
      // 一点丹砂鹤顶 (#b52b22)
      targetCtx.fillStyle = '#b52b22';
      targetCtx.beginPath();
      targetCtx.arc(34.5, -12.1, 1.85, 0, TAU);
      targetCtx.fill();
      // 尖细长喙
      targetCtx.strokeStyle = '#5c4228';
      targetCtx.lineWidth = 1.35;
      targetCtx.beginPath();
      targetCtx.moveTo(37.5, -10.2);
      targetCtx.lineTo(45.5, -9.2);
      targetCtx.stroke();
    }

    // 近侧主翼：两段曲羽（肘关节 + 初级飞羽扇展）
    const wristX = -3;
    const wristY = -17 * flapInner - 4;
    const tipX = -27 - 5 * Math.abs(flapOuter);
    const tipY = wristY - 19 * flapOuter - 2;
    targetCtx.beginPath();
    targetCtx.moveTo(7, -1);
    targetCtx.quadraticCurveTo(3, wristY - 4, wristX, wristY);
    targetCtx.quadraticCurveTo((wristX + tipX) * 0.5, (wristY + tipY) * 0.5 - 5, tipX, tipY);
    // 羽梢微张弧线回收到身体
    targetCtx.quadraticCurveTo(tipX + 9, tipY + 9, wristX - 6, wristY + 10);
    targetCtx.quadraticCurveTo(-4, 5, 6, 3);
    targetCtx.closePath();
    if (isCutout) {
      // 精准飞鹤双翼镂空孔径（略微 1.8px 羽化柔边，完全消除大白圆盘！）
      targetCtx.fillStyle = 'rgba(255, 0, 0, 0.98)';
      targetCtx.fill();
      targetCtx.strokeStyle = 'rgba(255, 0, 0, 0.42)';
      targetCtx.lineWidth = 2.4;
      targetCtx.stroke();
      targetCtx.shadowBlur = 0;
    } else {
      targetCtx.fillStyle = '#fbf5e8';
      targetCtx.fill();
      // 墨色飞羽尖端（丹顶鹤标志性玄羽）
      targetCtx.fillStyle = 'rgba(32, 26, 22, 0.86)';
      targetCtx.beginPath();
      targetCtx.moveTo(tipX, tipY);
      targetCtx.lineTo(tipX + 10, tipY + 4);
      targetCtx.lineTo(tipX + 7, tipY + 10);
      targetCtx.closePath();
      targetCtx.fill();
      // 泥金镂空边
      targetCtx.strokeStyle = '#f5d68a';
      targetCtx.lineWidth = 1.45;
      targetCtx.stroke();
    }

    targetCtx.restore();
  };

  drawWrapped(ctx, SILK_W, cr.x, 70, (bx) => drawSingle(bx, ctx, false));
  drawWrapped(optCtx, OPT_W, (cr.x / SILK_W) * OPT_W, 45, (bx) => {
    // 传回世界坐标以复用同一几何
    drawSingle((bx / OPT_W) * SILK_W, optCtx, true);
  });
}

// 精绘江南乌篷轻舟（微翘深褐船身 + 编织竹篷 + 船头镂空舟灯 + 描金水纹）
function drawWupengBoat(ctx, optCtx, b, t) {
  const dir = b.vx >= 0 ? 1 : -1;
  const s = b.scale;
  const age = clamp((t - b.born) / 0.8, 0, 1);
  const alpha = easeOutCubic(age);
  const bobY = Math.sin(t * 2.1 + b.bobPhase) * 2.6;
  const tilt = Math.cos(t * 1.6 + b.bobPhase) * 0.032;
  const flicker = 0.88 + 0.12 * Math.sin(t * 13.7 + b.bobPhase) * Math.cos(t * 7.3);

  const drawSingle = (bx, targetCtx, isCutout) => {
    targetCtx.save();
    const sx = isCutout ? (OPT_W / SILK_W) : 1;
    const sy = isCutout ? (OPT_H / SILK_H) : 1;
    targetCtx.translate(bx * sx, (b.y + bobY) * sy);
    targetCtx.rotate(tilt);
    targetCtx.scale(dir * s * sx, s * sy);
    targetCtx.globalAlpha = alpha;

    if (!isCutout) {
      // 船尾描金水纹
      for (let r = 0; r < 3; r++) {
        const wOff = ((t * 18 + r * 16) % 48);
        const wa = (1 - wOff / 48) * 0.62;
        targetCtx.strokeStyle = `rgba(245, 214, 138, ${wa})`;
        targetCtx.lineWidth = 1.25;
        targetCtx.beginPath();
        targetCtx.moveTo(-26 - wOff, 6 + r * 2.6);
        targetCtx.quadraticCurveTo(-40 - wOff, 9 + r * 3.1, -54 - wOff, 5.5 + r * 2.4);
        targetCtx.stroke();
      }

      // 船头舟灯在水面的暖金倒影
      const wg = targetCtx.createRadialGradient(34, 10, 1, 34, 10, 26);
      wg.addColorStop(0, `rgba(255, 198, 92, ${0.52 * flicker})`);
      wg.addColorStop(1, 'rgba(255, 190, 85, 0)');
      targetCtx.fillStyle = wg;
      targetCtx.beginPath();
      targetCtx.ellipse(34, 11, 24, 7, 0, 0, TAU);
      targetCtx.fill();

      // 微翘深褐船身
      targetCtx.fillStyle = '#2d1a11';
      targetCtx.beginPath();
      targetCtx.moveTo(-36, -3);
      targetCtx.quadraticCurveTo(-24, 9, 0, 9);
      targetCtx.quadraticCurveTo(24, 9, 38, -5);
      targetCtx.quadraticCurveTo(26, 2, 0, 2.5);
      targetCtx.quadraticCurveTo(-24, 2, -36, -3);
      targetCtx.closePath();
      targetCtx.fill();
      targetCtx.strokeStyle = '#c8963e';
      targetCtx.lineWidth = 1.05;
      targetCtx.stroke();

      // 编织竹篷（乌篷拱棚 + 竹肋纹）
      targetCtx.fillStyle = '#3f281a';
      targetCtx.beginPath();
      targetCtx.moveTo(-18, 2);
      targetCtx.quadraticCurveTo(-15, -14, -2, -14);
      targetCtx.quadraticCurveTo(12, -14, 15, 2);
      targetCtx.closePath();
      targetCtx.fill();
      targetCtx.strokeStyle = '#b48342';
      targetCtx.lineWidth = 0.9;
      for (let k = -11; k <= 10; k += 5.5) {
        targetCtx.beginPath();
        targetCtx.moveTo(k, 2);
        targetCtx.quadraticCurveTo(k * 0.92, -13, k * 0.72, -13.5);
        targetCtx.stroke();
      }

      // 船尾摇橹细杆
      targetCtx.strokeStyle = '#5e3d24';
      targetCtx.lineWidth = 1.4;
      targetCtx.beginPath();
      targetCtx.moveTo(-22, -2);
      targetCtx.lineTo(-42, 11);
      targetCtx.stroke();

      // 船头灯架与一豆明亮暖金舟灯 (#ffbe55)
      targetCtx.strokeStyle = '#704b2a';
      targetCtx.lineWidth = 1.25;
      targetCtx.beginPath();
      targetCtx.moveTo(28, 0);
      targetCtx.quadraticCurveTo(30, -14, 34, -14);
      targetCtx.stroke();

      const lg = targetCtx.createRadialGradient(34, -9.5, 1, 34, -9.5, 16 * flicker);
      lg.addColorStop(0, 'rgba(255, 248, 218, 1.0)');
      lg.addColorStop(0.32, 'rgba(255, 194, 88, 0.88)');
      lg.addColorStop(1, 'rgba(232, 93, 42, 0)');
      targetCtx.fillStyle = lg;
      targetCtx.beginPath();
      targetCtx.arc(34, -9.5, 16 * flicker, 0, TAU);
      targetCtx.fill();
      targetCtx.fillStyle = '#fff6d6';
      targetCtx.beginPath();
      targetCtx.ellipse(34, -9.5, 2.9, 4.1, 0, 0, TAU);
      targetCtx.fill();
    } else {
      // 镂空通道：船头小巧柔和的暖灯透光点（纯 R 通道，绝不画硬边大白圆盘！）+ 乌篷船身遮光剪影（纯 B 通道）
      const lg = targetCtx.createRadialGradient(34, -9.5, 0.8, 34, -9.5, 9.5);
      lg.addColorStop(0.0, 'rgba(255, 0, 0, 0.92)');
      lg.addColorStop(0.42, 'rgba(255, 0, 0, 0.34)');
      lg.addColorStop(1.0, 'rgba(255, 0, 0, 0)');
      targetCtx.fillStyle = lg;
      targetCtx.beginPath();
      targetCtx.arc(34, -9.5, 9.5, 0, TAU);
      targetCtx.fill();
      // 船身与乌篷拱棚精确剪影（纯 B 通道）
      targetCtx.fillStyle = 'rgba(0, 0, 220, 0.92)';
      targetCtx.beginPath();
      targetCtx.moveTo(-36, -3);
      targetCtx.quadraticCurveTo(-24, 9, 0, 9);
      targetCtx.quadraticCurveTo(24, 9, 38, -5);
      targetCtx.quadraticCurveTo(26, 2, 0, 2.5);
      targetCtx.quadraticCurveTo(-24, 2, -36, -3);
      targetCtx.closePath();
      targetCtx.fill();
      targetCtx.beginPath();
      targetCtx.moveTo(-18, 2);
      targetCtx.quadraticCurveTo(-15, -14, -2, -14);
      targetCtx.quadraticCurveTo(12, -14, 15, 2);
      targetCtx.closePath();
      targetCtx.fill();
    }

    targetCtx.restore();
  };

  drawWrapped(ctx, SILK_W, b.x, 75, (bx) => drawSingle(bx, ctx, false));
  drawWrapped(optCtx, OPT_W, (b.x / SILK_W) * OPT_W, 45, (bx) => {
    drawSingle((bx / OPT_W) * SILK_W, optCtx, true);
  });
}

/* ---------- 2.8 第五幕：阳文朱砂印「灯影」(#b52b22，矢量篆意确保跨平台清晰) ---------- */
function drawCinnabarSeal(ctx, cx, cy, size, alpha = 1.0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.025);
  ctx.globalAlpha = alpha;

  const h = size * 0.5;
  const r = size * 0.08;
  // 轻微石印残边（兼容全浏览器圆角矩形路径）
  ctx.strokeStyle = '#b52b22';
  ctx.lineWidth = Math.max(2.2, size * 0.068);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-h + r, -h);
  ctx.lineTo(h - r, -h);
  ctx.quadraticCurveTo(h, -h, h, -h + r);
  ctx.lineTo(h, h - r);
  ctx.quadraticCurveTo(h, h, h - r, h);
  ctx.lineTo(-h + r, h);
  ctx.quadraticCurveTo(-h, h, -h, h - r);
  ctx.lineTo(-h, -h + r);
  ctx.quadraticCurveTo(-h, -h, -h + r, -h);
  ctx.closePath();
  ctx.stroke();

  // 阳文细朱文内框
  ctx.fillStyle = 'rgba(181, 43, 34, 0.07)';
  ctx.fillRect(-h + 2, -h + 2, size - 4, size - 4);

  // 阳文朱砂篆楷「灯影」（右「灯」左「影」，传统竖印章法）
  ctx.fillStyle = '#b52b22';
  ctx.font = `700 ${Math.round(size * 0.44)}px "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('灯', size * 0.21, -size * 0.02);
  ctx.fillText('影', -size * 0.21, size * 0.03);

  // 印泥微粒斑驳
  ctx.fillStyle = 'rgba(232, 219, 195, 0.28)';
  for (let k = 0; k < 14; k++) {
    const sx = (hash1(k * 7.1 + 3) - 0.5) * size * 0.88;
    const sy = (hash1(k * 13.3 + 9) - 0.5) * size * 0.88;
    ctx.fillRect(sx, sy, size * 0.03, size * 0.025);
  }
  ctx.restore();
}

/* ---------- 2.9 合成静态层 + 实时动态熟绢层 + 光学透光图 ---------- */
function initClouds() {
  STATE.clouds = [];
  for (let i = 0; i < 11; i++) {
    const u = (i + rand(0.1, 0.85)) / 11;
    STATE.clouds.push({
      u,
      vBase: rand(0.46, 0.68),
      rx: rand(110, 230),
      ry: rand(18, 34),
      speed: rand(0.0032, 0.0068),
      alpha: rand(0.32, 0.62),
      puffs: 3 + Math.floor(rnd() * 3),
      seed: rand(0, 100)
    });
  }
}

function bakeStaticPainting() {
  staticDirty = false;
  const g = bakedCanvas.g;
  g.clearRect(0, 0, SILK_W, SILK_H);
  g.drawImage(silkBase.c, 0, 0);
  // 青绿重彩乘融进熟绢丝缕
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = 0.84;
  g.drawImage(layerWash.c, 0, 0);
  g.restore();
  // 再轻覆一层正片矿物亮色，保持石青石绿透亮不发脏
  g.save();
  g.globalAlpha = 0.54;
  g.drawImage(layerWash.c, 0, 0);
  g.restore();
  // 泥金山骨与皴笔覆于其上，保留金属轮廓锐度
  g.drawImage(layerGold.c, 0, 0);
  // 宋画苍松与春桃
  g.drawImage(layerFlora.c, 0, 0);
  // 第五幕朱砂印「灯影」
  if (STATE.sealStamped) {
    const p = clamp((STATE.totalTime - STATE.sealTime) / 0.36, 0, 1);
    drawCinnabarSeal(g, SILK_W - 86, SILK_H - 78, 56, easeOutCubic(p));
    if (p < 1) staticDirty = true;
  }
}

function updateLiveSilkAndOptics(t, dt) {
  if (goldDirty) {
    goldDirty = false;
    rebuildGoldMountainLayer();
  }
  if (washCanvasDirty) {
    rebuildWashLayer();
  }
  if (staticDirty) {
    bakeStaticPainting();
  }

  const g = liveSilk.g;
  const og = opticsCanvas.g;

  g.drawImage(bakedCanvas.c, 0, 0);

  // 光学透光图底：G=泥金高光，B=颜料遮光密度（山峰越实遮光越清晰，空绢透暖光）
  og.clearRect(0, 0, OPT_W, OPT_H);
  // 山体与近岸遮光密度写入 B 通道（2px 平滑山脊曲线 clip，屏风投影如宋画般丝滑零阶梯！）
  if (STATE.ridgeCoverage > 0.05) {
    const COLS = 200;
    const cw = OPT_W / COLS + 1.4;
    const ridgeAlpha = clamp(STATE.ridgeCoverage * 1.15, 0, 1);
    const washBoost = 0.45 + 0.55 * STATE.washCoverage;

    // 远山轻柔半透影（平滑曲线 clip，消除屏风阶梯锯齿）
    og.save();
    buildRidgeClipPath(og, H_FAR, OPT_W, OPT_H, OPT_H, 0, 2);
    og.clip();
    og.fillStyle = `rgba(0, 0, 255, ${(0.28 * ridgeAlpha * washBoost).toFixed(3)})`;
    og.fillRect(0, 0, OPT_W, OPT_H);
    og.restore();

    // 主峰厚重青绿山影（2px 平滑曲线 clip，峰顶浓、山谷渐透云气）
    og.save();
    buildRidgeClipPath(og, H_WRAP, OPT_W, OPT_H, OPT_H, 0, 2);
    og.clip();
    for (let c = 0; c < COLS; c++) {
      const u = (c + 0.5) / COLS;
      const x = (c / COLS) * OPT_W;
      const yMain = sampleArrPer(H_WRAP, u) * OPT_H;
      const yBank = sampleArrPer(H_BANK, u) * OPT_H;
      const mg = og.createLinearGradient(0, yMain - 2, 0, yBank + 12);
      mg.addColorStop(0.0, `rgba(0, 0, 255, ${(0.84 * ridgeAlpha * washBoost).toFixed(3)})`);
      mg.addColorStop(0.62, `rgba(0, 0, 255, ${(0.58 * ridgeAlpha * washBoost).toFixed(3)})`);
      mg.addColorStop(1.0, `rgba(0, 0, 255, ${(0.16 * ridgeAlpha * washBoost).toFixed(3)})`);
      og.fillStyle = mg;
      og.fillRect(x, yMain - 3, cw, Math.max(12, yBank - yMain + 16));
    }
    og.restore();

    // 近岸坡影（平滑曲线 clip）
    og.save();
    buildRidgeClipPath(og, H_BANK, OPT_W, OPT_H, OPT_H, 0, 2);
    og.clip();
    for (let c = 0; c < COLS; c++) {
      const u = (c + 0.5) / COLS;
      const x = (c / COLS) * OPT_W;
      const yBank = sampleArrPer(H_BANK, u) * OPT_H;
      const bg = og.createLinearGradient(0, yBank - 1, 0, yBank + OPT_H * 0.065);
      bg.addColorStop(0.0, `rgba(0, 0, 255, ${(0.54 * ridgeAlpha * washBoost).toFixed(3)})`);
      bg.addColorStop(1.0, 'rgba(0, 0, 255, 0)');
      og.fillStyle = bg;
      og.fillRect(x, yBank - 2, cw, OPT_H * 0.068);
    }
    og.restore();
  }
  // 叠加泥金微闪 G 通道
  og.save();
  og.globalCompositeOperation = 'lighter';
  og.drawImage(layerGoldMask.c, 0, 0);
  og.restore();

  // 1) 流动的蛤粉云气（#fbf5e8，在山谷间舒卷）
  if (STATE.ridgeCoverage > 0.12) {
    const cloudVis = clamp((STATE.ridgeCoverage - 0.1) * 1.4, 0, 1);
    for (const cl of STATE.clouds) {
      cl.u = wrap01(cl.u + cl.speed * dt);
      const cx = cl.u * SILK_W;
      const yM = sampleArrPer(H_WRAP, cl.u) * SILK_H;
      const yB = sampleArrPer(H_BANK, cl.u) * SILK_H;
      const cy = lerp(yM + 40, yB - 12, (cl.vBase - 0.44) / 0.26);
      drawWrapped(g, SILK_W, cx, cl.rx + 20, (px) => {
        for (let p = 0; p < cl.puffs; p++) {
          const ox = (p - (cl.puffs - 1) * 0.5) * cl.rx * 0.42;
          const oy = Math.sin(p * 2.1 + cl.seed + t * 0.35) * 8;
          const pr = cl.rx * (0.58 + 0.16 * Math.sin(p + cl.seed));
          const rg = g.createRadialGradient(px + ox, cy + oy, 2, px + ox, cy + oy, pr);
          rg.addColorStop(0, `rgba(251, 245, 232, ${cl.alpha * cloudVis * 0.52})`);
          rg.addColorStop(0.55, `rgba(251, 245, 232, ${cl.alpha * cloudVis * 0.24})`);
          rg.addColorStop(1, 'rgba(251, 245, 232, 0)');
          g.fillStyle = rg;
          g.save();
          g.translate(px + ox, cy + oy);
          g.scale(1, cl.ry / pr);
          g.beginPath();
          g.arc(0, 0, pr, 0, TAU);
          g.fill();
          g.restore();
        }
      });
    }
  }

  // 2) 春江动态闪烁的描金水波纹
  if (STATE.washCoverage > 0.08) {
    const ripVis = clamp(STATE.washCoverage * 1.25, 0, 1);
    g.save();
    for (let i = 0; i < 42; i++) {
      const u = wrap01((i * 0.061803 + t * 0.004 * (i % 2 ? 1 : -0.6)));
      const yBank = sampleArrPer(H_BANK, u) * SILK_H;
      const rowF = ((i * 37) % 100) / 100;
      const ry = lerp(yBank + 36, SILK_H - 22, rowF);
      const len = lerp(24, 58, rowF);
      const shimmer = 0.28 + 0.52 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.2 + i * 1.9), 2);
      const x = u * SILK_W;
      drawWrapped(g, SILK_W, x, len + 10, (px) => {
        g.strokeStyle = `rgba(245, 214, 138, ${0.46 * shimmer * ripVis})`;
        g.lineWidth = lerp(0.9, 1.5, rowF);
        g.beginPath();
        g.moveTo(px - len * 0.5, ry);
        g.quadraticCurveTo(px, ry - 2.4 * Math.sin(t * 1.8 + i), px + len * 0.5, ry);
        g.stroke();
      });
      // 同步一点水波微闪到光学层
      if (shimmer > 0.62) {
        og.fillStyle = `rgba(48, 140, 0, ${0.26 * ripVis})`;
        og.fillRect((x / SILK_W) * OPT_W - 8, (ry / SILK_H) * OPT_H, 16, 1.5);
      }
    }
    g.restore();
  }

  // 3) 随微风轻摆的临水垂柳丝（每株 9~12 缕动态贝塞尔嫩绿丝条）
  for (const w of STATE.willows) {
    drawWrapped(g, SILK_W, w.x, 90, (bx) => {
      g.save();
      const s = w.scale;
      for (const st of w.strands) {
        const sx = bx + st.ox * s;
        const sy = w.y + st.oy * s;
        const sway = Math.sin(t * st.freq + st.phase) * 11 * s + 6 * s;
        const ex = sx + sway;
        const ey = sy + st.len * s;
        const cx = sx + sway * 0.42;
        const cy = sy + st.len * 0.56 * s;
        g.strokeStyle = 'rgba(72, 134, 96, 0.78)';
        g.lineWidth = 1.05 * s;
        g.beginPath();
        g.moveTo(sx, sy);
        g.quadraticCurveTo(cx, cy, ex, ey);
        g.stroke();

        // 嫩绿柳叶点缀
        for (let k = 1; k <= 6; k++) {
          const f = k / 6.5;
          const mt = 1 - f;
          const lx = mt * mt * sx + 2 * mt * f * cx + f * f * ex;
          const ly = mt * mt * sy + 2 * mt * f * cy + f * f * ey;
          g.fillStyle = k % 2 ? 'rgba(92, 153, 123, 0.86)' : 'rgba(136, 184, 134, 0.82)';
          g.beginPath();
          g.ellipse(lx + (k % 2 ? 2.2 : -2.2), ly, 3.3 * s, 1.05 * s, 0.45 + sway * 0.02, 0, TAU);
          g.fill();
        }
      }
      g.restore();
    });
  }

  // 4) 随风飘落江面的春桃花瓣
  for (const pt of STATE.petals) {
    pt.life += dt;
    const yWater = sampleArrPer(H_BANK, pt.x / SILK_W) * SILK_H + 42;
    if (!pt.floating) {
      pt.x = wrapX(pt.x + (pt.vx + Math.sin(t * 2.1 + pt.phase) * 14) * dt, SILK_W);
      pt.y += pt.vy * dt;
      pt.rot += pt.vrot * dt;
      if (pt.y >= yWater) {
        pt.floating = true;
        pt.y = yWater + rand(4, 34);
      }
    } else {
      pt.x = wrapX(pt.x + 11 * dt, SILK_W);
      pt.y += Math.sin(t * 1.6 + pt.phase) * 2.4 * dt;
      if (pt.life > 16) {
        // 循环新生落英，保持生机
        if (STATE.peaches.length) {
          const src = STATE.peaches[Math.floor(rnd() * STATE.peaches.length)];
          pt.x = wrapX(src.x + rand(-24, 24), SILK_W);
          pt.y = src.y - rand(24, 52);
          pt.floating = false;
          pt.life = 0;
        }
      }
    }
    g.save();
    g.translate(pt.x, pt.y);
    g.rotate(pt.rot);
    g.fillStyle = pt.tint < 0.5 ? 'rgba(226, 120, 96, 0.88)' : 'rgba(251, 236, 224, 0.90)';
    g.beginPath();
    g.ellipse(0, 0, pt.size, pt.size * 0.56, 0, 0, TAU);
    g.fill();
    g.restore();
  }

  // 5) 第四幕：展翅飞鹤（优雅两段扇翅 + 水平无缝环游 + 镂空透光通道！）
  og.save();
  og.globalCompositeOperation = 'lighter';
  for (const cr of STATE.cranes) {
    cr.x = wrapX(cr.x + cr.vx * dt, SILK_W);
    cr.wingPhase += cr.wingSpeed * dt;
    cr.y = cr.baseY + Math.sin(t * 1.2 + cr.bobPhase) * 8.5;
    drawRuheCrane(g, og, cr, t);
  }
  // 6) 第四幕：江南乌篷轻舟（船头明亮镂空舟灯 + 描金水纹）
  for (const b of STATE.boats) {
    b.x = wrapX(b.x + b.vx * dt, SILK_W);
    drawWupengBoat(g, og, b, t);
  }
  og.restore();

  // 7) 笔尖撒落的实时金粉微粒
  for (let i = STATE.goldSparks.length - 1; i >= 0; i--) {
    const sp = STATE.goldSparks[i];
    sp.life -= dt;
    if (sp.life <= 0) {
      STATE.goldSparks.splice(i, 1);
      continue;
    }
    sp.x = wrapX(sp.x + sp.vx * dt, SILK_W);
    sp.y += sp.vy * dt;
    const a = clamp(sp.life / sp.maxLife, 0, 1);
    g.fillStyle = `rgba(250, 224, 152, ${a * 0.92})`;
    g.beginPath();
    g.arc(sp.x, sp.y, sp.r * (0.4 + 0.6 * a), 0, TAU);
    g.fill();
  }

  silkTexNeedsUpload = true;
}

/* ============================================================================
 * 3. 纯正中式五声程序化 WebAudio（古琴 · 洞箫 · 古筝 · 玉佩宫铃 · 铜磬）
 * ============================================================================ */
const PENTATONIC_D = [
  146.83, 164.81, 185.00, 220.00, 246.94, // D3 E3 F#3 A3 B3
  293.66, 329.63, 369.99, 440.00, 493.88, // D4 E4 F#4 A4 B4
  587.33, 659.25, 739.99, 880.00          // D5 E5 F#5 A5
];

const AUDIO = {
  ctx: null,
  master: null,
  reverb: null,
  noiseBuf: null,
  muted: START_MUTED,
  ready: false,
  lastBrushSnd: 0,

  init() {
    if (this.ready || this.muted) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.72;
      this.master.connect(this.ctx.destination);

      // 木构书斋柔和混响（1.9 秒暖木脉冲响应）
      const sr = this.ctx.sampleRate;
      const len = Math.floor(sr * 1.9);
      const ir = this.ctx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, 2.6);
          const n = (Math.random() * 2 - 1) * env;
          lp = lp * 0.78 + n * 0.22;
          d[i] = lp * 0.58;
        }
      }
      this.reverb = this.ctx.createConvolver();
      this.reverb.buffer = ir;
      const wet = this.ctx.createGain();
      wet.gain.value = 0.38;
      this.reverb.connect(wet);
      wet.connect(this.master);

      // 2 秒白噪缓冲（供狼毫擦绢、洞箫气声、火折子与水声）
      const nLen = sr * 2;
      this.noiseBuf = this.ctx.createBuffer(1, nLen, sr);
      const nd = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;

      this.ready = true;
    } catch (_) {
      this.ready = false;
    }
  },

  unlock() {
    // 严格遵守 ?muted=1：静音锁定时绝不自动解禁发声！
    if (this.muted) return;
    if (!this.ready) this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  },

  setMuted(flag) {
    this.muted = !!flag;
    $('#mute').classList.toggle('muted', this.muted);
    if (!this.muted) {
      this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    }
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.72, this.ctx.currentTime, 0.04);
    }
  },

  canPlay() {
    if (this.muted) return false;
    if (!this.ready) this.init();
    if (!this.ready || !this.ctx || this.ctx.state !== 'running') return false;
    return true;
  },

  connectOut(node, panVal = 0) {
    if (this.ctx.createStereoPanner) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = clamp(panVal, -0.85, 0.85);
      node.connect(p);
      p.connect(this.master);
      p.connect(this.reverb);
    } else {
      node.connect(this.master);
      node.connect(this.reverb);
    }
  },

  // 1. 古琴清越泛音
  playGuqinHarmonic(freq, vol = 0.16, pan = 0, dur = 3.2) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.014);
    g.gain.exponentialRampToValueAtTime(vol * 0.34, now + 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    const o1 = this.ctx.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(freq * 1.003, now);
    o1.frequency.exponentialRampToValueAtTime(freq, now + 0.05);

    const o2 = this.ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2.0;
    const g2 = this.ctx.createGain();
    g2.gain.setValueAtTime(0.24, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.45);

    const o3 = this.ctx.createOscillator();
    o3.type = 'triangle';
    o3.frequency.value = freq * 3.0;
    const g3 = this.ctx.createGain();
    g3.gain.setValueAtTime(0.06, now);
    g3.gain.exponentialRampToValueAtTime(0.0008, now + 0.25);

    o1.connect(g);
    o2.connect(g2); g2.connect(g);
    o3.connect(g3); g3.connect(g);
    this.connectOut(g, pan);

    o1.start(now); o2.start(now); o3.start(now);
    o1.stop(now + dur + 0.05); o2.stop(now + dur + 0.05); o3.stop(now + 0.35);
  },

  // 2. 古琴按音低频滑弦
  playGuqinBass(freq, vol = 0.14, pan = 0) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq * 0.96, now);
    o.frequency.exponentialRampToValueAtTime(freq, now + 0.18);

    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1400, now);
    lp.frequency.exponentialRampToValueAtTime(340, now + 1.8);

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

    o.connect(lp); lp.connect(g);
    this.connectOut(g, pan);
    o.start(now); o.stop(now + 2.85);
  },

  // 3. 竹制洞箫呼吸长音
  playDongxiao(freq, vol = 0.11, pan = 0, dur = 3.6) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.65);
    g.gain.setValueAtTime(vol * 0.88, now + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    // 轻柔气息颤音
    const lfo = this.ctx.createOscillator();
