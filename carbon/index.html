/* ============================================================================
 * 3. Web Audio 纯算法物理建模声学引擎（零外部音频，支持 ?muted=1 静默自测）
 * ============================================================================ */
const AU = {
  ctx: null,
  muted: Q.get('muted') === '1',
  master: null,
  dry: null,
  rev: null,
  noiseBuf: null,
  solderLoop: null,
  glazeLoop: null,
  scribeLoop: null,
  wipeLoop: null,
  breezeLoop: null,
  lastNoteAt: 0
};
if (AU.muted) $('#mute').classList.add('muted');

const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
// D 大调 / D 五声温润音阶池
const PENTA_LOW  = [50, 52, 54, 57, 59, 62, 64, 66, 69]; // D3..A4 (焊山马林巴)
const PENTA_HIGH = [74, 76, 78, 81, 83, 86, 88, 90, 93]; // D5..A6 (刻霜冰晶与飞鸟)
const CHIME_POOL = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83]; // D4..B5 (山形黄铜风铃管)

function initAudio() {
  if (AU.ctx) {
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  let c;
  try { c = new AC(); } catch (_e) { return; }
  AU.ctx = c;

  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -15;
  comp.knee.value = 14;
  comp.ratio.value = 3.5;
  comp.attack.value = 0.008;
  comp.release.value = 0.25;

  const master = c.createGain();
  master.gain.value = AU.muted ? 0 : 0.82;
  comp.connect(master);
  master.connect(c.destination);
  AU.master = master;

  const dry = c.createGain();
  dry.gain.value = 0.85;
  dry.connect(comp);
  AU.dry = dry;

  // 温暖木屋工坊脉冲响应卷积混响 (2.7s)
  const conv = c.createConvolver();
  const sr = c.sampleRate;
  const irLen = Math.floor(sr * 2.7);
  const ir = c.createBuffer(2, irLen, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < irLen; i++) {
      const t = i / irLen;
      const w = Math.random() * 2 - 1;
      lp += (0.52 - 0.35 * t) * (w - lp);
      d[i] = lp * Math.pow(1 - t, 2.4) * (i < sr * 0.012 ? i / (sr * 0.012) : 1) * 0.62;
    }
  }
  conv.buffer = ir;
  const rev = c.createGain();
  rev.gain.value = 0.52;
  conv.connect(comp);
  rev.connect(conv);
  AU.rev = rev;

  // 4 秒双声道柔和粉白混合噪声基底
  const nb = c.createBuffer(2, sr * 4, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = nb.getChannelData(ch);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.992 * b0 + w * 0.045;
      b1 = 0.940 * b1 + w * 0.095;
      d[i] = clamp(b0 + b1 + w * 0.22, -1, 1);
    }
  }
  AU.noiseBuf = nb;

  const makeTexLoop = (type, freq, q, revSend = 0.25) => {
    const src = c.createBufferSource();
    src.buffer = nb;
    src.loop = true;
    const flt = c.createBiquadFilter();
    flt.type = type;
    flt.frequency.value = freq;
    flt.Q.value = q;
    const pan = c.createStereoPanner();
    const g = c.createGain();
    g.gain.value = 0;
    src.connect(flt);
    flt.connect(pan);
    pan.connect(g);
    g.connect(dry);
    if (revSend > 0) {
      const sg = c.createGain();
      sg.gain.value = revSend;
      g.connect(sg);
      sg.connect(rev);
    }
    src.start(0, Math.random() * 3);
    return { flt, pan, g };
  };

  // 四种手作物理连续摩擦声 + 终章穿堂晚风
  AU.solderLoop = makeTexLoop('bandpass', 1650, 1.3, 0.22); // 烙铁与熔锡滑过毛玻璃
  AU.glazeLoop  = makeTexLoop('bandpass', 620,  1.8, 0.45); // 粘稠琉璃釉液晕开
  AU.scribeLoop = makeTexLoop('bandpass', 4150, 2.4, 0.30); // 金刚石银针轻刻玻璃霜纹
  AU.wipeLoop   = makeTexLoop('bandpass', 920,  0.85, 0.18);// 亚麻布柔和拭灰
  AU.breezeLoop = makeTexLoop('bandpass', 380,  1.1, 0.55); // 终章窗台晚风
  AU.breezeLoop.g.gain.setTargetAtTime(0.012, c.currentTime, 1.2);
}

function setMuted(flag) {
  AU.muted = flag;
  $('#mute').classList.toggle('muted', flag);
  if (AU.ctx && AU.master) {
    AU.master.gain.setTargetAtTime(flag ? 0 : 0.82, AU.ctx.currentTime, 0.08);
  }
}

// 1. 焊山：温暖玻璃马林巴 / 金属泛音
function playGlassMarimba(midi, vel = 0.22, panVal = 0, when = 0) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = Math.max(c.currentTime, when || 0);
  const f = mtof(midi);
  const p = c.createStereoPanner();
  p.pan.value = clamp(panVal, -0.85, 0.85);
  p.connect(AU.dry);
  const sg = c.createGain();
  sg.gain.value = 0.55;
  p.connect(sg);
  sg.connect(AU.rev);

  [[1, 1.0, 1.45, 'sine'], [3.98, 0.28, 0.42, 'sine'], [2.0, 0.12, 0.85, 'triangle']].forEach(([ratio, amp, dur, type]) => {
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f * ratio, t);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel * amp, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(p);
    o.start(t);
    o.stop(t + dur + 0.04);
  });
}

// 2. 注彩：水晶玻璃杯共鸣泛音（暖色大三和弦泛音 / 冷色九和弦泛音）
function playCrystalResonance(isWarm, uPos = 0.5, vel = 0.14) {
  if (!AU.ctx) return;
  const c = AU.ctx, now = c.currentTime;
  if (now - AU.lastNoteAt < 0.065) return;
  AU.lastNoteAt = now;
  const chord = isWarm ? [62, 66, 69, 74, 78] : [64, 69, 71, 76, 81];
  const base = chord[(Math.random() * chord.length) | 0];
  const f = mtof(base);
  const p = c.createStereoPanner();
  p.pan.value = clamp((uPos - 0.5) * 1.4, -0.8, 0.8);
  p.connect(AU.dry);
  const sg = c.createGain();
  sg.gain.value = 0.85;
  p.connect(sg);
  sg.connect(AU.rev);

  [[1, 0.85, 2.1], [2.003, 0.32, 1.6]].forEach(([r, a, dur]) => {
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * r, now);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vel * a, now + 0.055);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(p);
    o.start(now);
    o.stop(now + dur + 0.05);
  });
}

// 3. 刻霜：高八度八音盒冰晶泛音 (D5–B5)
function playFrostSparkle(vHeight = 0.5, uPos = 0.5, vel = 0.11) {
  if (!AU.ctx) return;
  const c = AU.ctx, now = c.currentTime;
  if (now - AU.lastNoteAt < 0.075) return;
  AU.lastNoteAt = now;
  const idx = clamp(Math.round(vHeight * (PENTA_HIGH.length - 1)), 0, PENTA_HIGH.length - 1);
  const f = mtof(PENTA_HIGH[idx]);
  const p = c.createStereoPanner();
  p.pan.value = clamp((uPos - 0.5) * 1.4, -0.85, 0.85);
  p.connect(AU.dry);
  const sg = c.createGain();
  sg.gain.value = 0.78;
  p.connect(sg);
  sg.connect(AU.rev);

  [[1, 1.0, 1.2], [2.76, 0.24, 0.45], [5.4, 0.10, 0.22]].forEach(([r, a, d]) => {
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * r, now);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vel * a, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g);
    g.connect(p);
    o.start(now);
    o.stop(now + d + 0.04);
  });
}

// 4. 真实物理建模黄铜管钟风铃（Euler-Bernoulli 圆管非谐波泛音 1 : 2.756 : 5.404，余音 3.2s+）
function playBrassChime(midi, sustain = 3.4, vel = 0.18, panVal = 0, when = 0) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = Math.max(c.currentTime, when || 0);
  const f0 = mtof(midi);
  const p = c.createStereoPanner();
  p.pan.value = clamp(panVal, -0.85, 0.85);
  p.connect(AU.dry);
  const sg = c.createGain();
  sg.gain.value = 0.75;
  p.connect(sg);
  sg.connect(AU.rev);

  // 彩玻水滴风舌轻碰铜管瞬态微响
  const clickSrc = c.createBufferSource();
  clickSrc.buffer = AU.noiseBuf;
  const cf = c.createBiquadFilter();
  cf.type = 'bandpass';
  cf.frequency.value = 3100;
  cf.Q.value = 2.5;
  const cg = c.createGain();
  cg.gain.setValueAtTime(vel * 0.28, t);
  cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.018);
  clickSrc.connect(cf);
  cf.connect(cg);
  cg.connect(p);
  clickSrc.start(t, Math.random() * 2);
  clickSrc.stop(t + 0.025);

  // 黄铜圆管物理弯曲模态泛音列 + 轻微双偏振拍频 (beating)
  const modes = [
    [1.000, 1.00, sustain],
    [1.0018, 0.45, sustain * 0.92],
    [2.756, 0.36, sustain * 0.48],
    [5.404, 0.14, sustain * 0.22]
  ];
  for (const [r, a, dur] of modes) {
    if (f0 * r > 11000) continue;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0 * r, t);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel * a * 0.55, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(p);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
}

// 5. 胡桃木榫卯与黄铜窗闩合拢声 + 温暖五度和弦
function playWoodenLatchAndWarmPad() {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  // 木框闷实共振咔哒
  [[165, 58, 0.16, 0.55], [420, 180, 0.07, 0.32]].forEach(([fA, fB, dur, amp], idx) => {
    const s = t + idx * 0.065;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(fA, s);
    o.frequency.exponentialRampToValueAtTime(fB, s + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(amp, s);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g);
    g.connect(AU.dry);
    o.start(s);
    o.stop(s + dur + 0.03);
  });
  // 大提琴 / 簧风琴温厚五度暖和弦 (D2, A2, D3, F#3, A3)
  [38, 45, 50, 54, 57].forEach((m, i) => {
    playFeltNote(m, 5.2, 0.095 - i * 0.01, (i - 2) * 0.18, t + 0.18 + i * 0.06);
  });
}

// 6. 终章托底毛毡钢琴 (Felt Piano) 柔和分解音
function playFeltNote(midi, dur = 3.2, vel = 0.09, panVal = 0, when = 0) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = Math.max(c.currentTime, when || 0);
  const f = mtof(midi);
  const o1 = c.createOscillator();
  const o2 = c.createOscillator();
  o1.type = 'triangle';
  o2.type = 'sine';
  o1.frequency.setValueAtTime(f, t);
  o2.frequency.setValueAtTime(f * 2.001, t);

  const g2 = c.createGain();
  g2.gain.value = 0.16;

  const lp = c.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(1800, f * 3.8), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(220, f * 1.3), t + dur);

  const env = c.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(vel, t + 0.035);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  const p = c.createStereoPanner();
  p.pan.value = clamp(panVal, -0.75, 0.75);

  o1.connect(lp);
  o2.connect(g2);
  g2.connect(lp);
  lp.connect(env);
  env.connect(p);
  p.connect(AU.dry);
  const sg = c.createGain();
  sg.gain.value = 0.72;
  p.connect(sg);
  sg.connect(AU.rev);

  o1.start(t);
  o2.start(t);
  o1.stop(t + dur + 0.06);
  o2.stop(t + dur + 0.06);
}

function quietAllLoops() {
  if (!AU.ctx) return;
  const now = AU.ctx.currentTime;
  for (const lp of [AU.solderLoop, AU.glazeLoop, AU.scribeLoop, AU.wipeLoop]) {
    if (lp) lp.g.gain.setTargetAtTime(0, now, 0.06);
  }
}

/* ============================================================================
 * 4. 花窗五幕核心物理造物状态机与蒂凡尼流线型网格引擎
 * ============================================================================ */
const NX = 240;
const MTN = {
  def: new Float32Array(NX),
  raw: new Float32Array(NX),
  smooth: new Float32Array(NX),
  set: new Uint8Array(NX),
  byUser: new Uint8Array(NX),
  heat: new Float32Array(NX),   // 熔融态橙金温度 1 -> 0
  setCount: 0,
  userCount: 0,
  prevIdx: -1,
  prevV: 0.5,
  gridBuilt: false,
  gridAnim: 0,                  // 副铜条网格生长进度 0 -> 1
  noteAcc: 0
};

// 生成默认舒缓双峰山脊曲线（供未划满区间平滑衔接或幽灵手势参照）
(function initDefaultRidge() {
  const p1 = rand(0.27, 0.36), h1 = rand(0.16, 0.22);
  const p2 = rand(0.71, 0.80), h2 = rand(0.11, 0.17);
  const val = rand(0.52, 0.58);
  for (let i = 0; i < NX; i++) {
    const u = i / (NX - 1);
    let y = 0.44
      + h1 * Math.exp(-Math.pow((u - p1) / 0.17, 2))
      + h2 * Math.exp(-Math.pow((u - p2) / 0.16, 2))
      - 0.07 * Math.exp(-Math.pow((u - val) / 0.14, 2))
      + (fbm1(u * 4.5, 5) - 0.5) * 0.05;
    MTN.def[i] = clamp(y, 0.35, 0.72);
    MTN.raw[i] = MTN.def[i];
    MTN.smooth[i] = MTN.def[i];
  }
})();

function sampleRidge(u) {
  const f = clamp(u, 0, 1) * (NX - 1);
  const i0 = Math.floor(f), i1 = Math.min(NX - 1, i0 + 1);
  return lerp(MTN.smooth[i0], MTN.smooth[i1], f - i0);
}

// 蒂凡尼矿物琉璃色板（严格对应指导书四系天然矿物色）
const PALETTES = {
  skyUpper: [
    ['#e8a849', '#d9893d', '#9e532b'], // 蜜金
    ['#df7a3e', '#cf6538', '#8f3926'], // 暖杏珀
    ['#c85a48', '#b94e3f', '#7d2d25'], // 浅茜红
    ['#eab45c', '#df8f43', '#9d592a']
  ],
  skyLower: [
    ['#f0bc68', '#e39644', '#a15a29'],
    ['#e68b47', '#d1693c', '#8e3c27'],
    ['#d6684c', '#bc523f', '#7f2f26']
  ],
  farMtn: [
    ['#6ea1a8', '#4d7f88', '#2c4f57'], // 远黛冰青松石
    ['#4f887b', '#386b60', '#21443d'],
    ['#7a8d73', '#566d53', '#31422f']
  ],
  mainMtn: [
    ['#3b7a6c', '#2c6155', '#1a3f37'], // 松石绿
    ['#598c58', '#427042', '#264726'], // 青苔翠
    ['#8c6d46', '#6e5232', '#45311c']  // 茶晶褐
  ],
  foothill: [
    ['#4a8466', '#35684e', '#1f4230'],
    ['#6c8b52', '#516d3b', '#304421'],
    ['#96764c', '#755936', '#4a361e']
  ],
  stream: [
    ['#2b6578', '#1f4e5f', '#12313d'], // 孔雀蓝
    ['#264966', '#1c3850', '#0f2233'], // 深钴蓝
    ['#548e99', '#396f7a', '#1f444d']  // 浅冰青流纹
  ],
  bank: [
    ['#7d6342', '#5f492e', '#3b2c1a'],
    ['#4d7858', '#385c42', '#203827'],
    ['#3d6962', '#2b504a', '#18302c']
  ]
};

const CELLS = [];     // 约 38 个流线型弧面花窗格
const RIBBONS = [];   // 8 条横向流线层带曲线 R0..R7
const RIBS = [];      // 纵向弧线隔条
const JOINTS = [];    // 铜条 T 型圆润焊锡节点

function buildTiffanyGrid() {
  if (MTN.gridBuilt) return;
  MTN.gridBuilt = true;

  // 1. 补全未手绘列并做高斯平滑，使任何手势都化为优雅流畅的蒂凡尼山脊曲线
  let firstSet = -1, lastSet = -1;
  for (let i = 0; i < NX; i++) {
    if (MTN.set[i]) {
      if (firstSet < 0) firstSet = i;
      lastSet = i;
    }
  }
  for (let i = 0; i < NX; i++) {
    if (MTN.set[i]) continue;
    let l = i - 1, r = i + 1;
    while (l >= 0 && !MTN.set[l]) l--;
    while (r < NX && !MTN.set[r]) r++;
    if (l >= 0 && r < NX) {
      MTN.raw[i] = lerp(MTN.raw[l], MTN.raw[r], (i - l) / (r - l));
    } else if (l >= 0) {
      MTN.raw[i] = lerp(MTN.raw[l], MTN.def[i], sstep(0, 28, i - l));
    } else if (r < NX) {
      MTN.raw[i] = lerp(MTN.raw[r], MTN.def[i], sstep(0, 28, r - i));
    } else {
      MTN.raw[i] = MTN.def[i];
    }
  }
  const tmp = new Float32Array(NX);
  for (let pass = 0; pass < 3; pass++) {
    const src = pass === 0 ? MTN.raw : MTN.smooth;
    for (let i = 0; i < NX; i++) {
      let s = 0, w = 0;
      for (let k = -7; k <= 7; k++) {
        const j = clamp(i + k, 0, NX - 1);
        const wt = Math.exp(-(k * k) / 18);
        s += src[j] * wt;
        w += wt;
      }
      tmp[i] = clamp(s / w, 0.34, 0.74);
    }
    MTN.smooth.set(tmp);
  }

  // 2. 围绕主山脊 H_MAIN 派生 8 条流畅无交叠横向层带 R0(底)=0 .. R7(顶)=1
  RIBBONS.length = 0;
  for (let r = 0; r < 8; r++) RIBBONS.push(new Float32Array(NX));

  const streamPhase = rand(0, 3.14);
  for (let i = 0; i < NX; i++) {
    const u = i / (NX - 1);
    const hM = MTN.smooth[i];
    const r0 = 0.0;
    const r1 = clamp(0.085 + 0.042 * Math.sin(u * Math.PI * 1.6 + streamPhase), 0.05, 0.16);
    const r2 = clamp(r1 + 0.082 + 0.024 * Math.cos(u * Math.PI * 2.1 + streamPhase), r1 + 0.06, 0.26);
    const r3 = clamp(lerp(r2, hM, 0.48) + 0.025 * Math.sin(u * Math.PI * 2.4 + 1.1), r2 + 0.055, hM - 0.065);
    const r4 = hM; // 第一幕焊出的主山脊！
    const farLift = 0.085 + 0.055 * Math.sin(u * Math.PI * 1.8 + 2.2);
    const r5 = clamp(hM + farLift, hM + 0.055, 0.80);
    const r6 = clamp(lerp(r5, 1.0, 0.52) + 0.028 * Math.sin(u * Math.PI * 1.3 + 0.5), r5 + 0.06, 0.93);
    const r7 = 1.0;

    RIBBONS[0][i] = r0;
    RIBBONS[1][i] = r1;
    RIBBONS[2][i] = r2;
    RIBBONS[3][i] = r3;
    RIBBONS[4][i] = r4;
    RIBBONS[5][i] = r5;
    RIBBONS[6][i] = r6;
    RIBBONS[7][i] = r7;
  }

  const evalRibY = (bandIdx, u) => {
    const arr = RIBBONS[bandIdx];
    const f = clamp(u, 0, 1) * (NX - 1);
    const i0 = Math.floor(f), i1 = Math.min(NX - 1, i0 + 1);
    return lerp(arr[i0], arr[i1], f - i0);
  };

  // 3. 将 7 个层带切分为约 39 个流线型弧面玻璃格（S 形曲线隔条，零碎三角）
  const bandSpecs = [
    { b: 0, zone: 'bank',     cols: 5, skew:  0.030 },
    { b: 1, zone: 'stream',   cols: 6, skew: -0.042 },
    { b: 2, zone: 'foothill', cols: 6, skew:  0.036 },
    { b: 3, zone: 'mainMtn',  cols: 6, skew: -0.032 },
    { b: 4, zone: 'farMtn',   cols: 5, skew:  0.028 },
    { b: 5, zone: 'skyLower', cols: 6, skew: -0.035 },
    { b: 6, zone: 'skyUpper', cols: 5, skew:  0.030 }
  ];

  CELLS.length = 0;
  RIBS.length = 0;
  JOINTS.length = 0;

  for (const spec of bandSpecs) {
    const { b, zone, cols, skew } = spec;
    // 生成错落自然的分割点 uCuts
    const cutsBot = [0];
    const cutsTop = [0];
    for (let c = 1; c < cols; c++) {
      const base = c / cols + (hash1(b * 31 + c * 17) - 0.5) * (0.26 / cols);
      const uB = clamp(base, 0.06, 0.94);
      const uT = clamp(uB + skew * Math.sin(c * 1.7 + b), 0.06, 0.94);
      cutsBot.push(uB);
      cutsTop.push(uT);
    }
    cutsBot.push(1);
    cutsTop.push(1);

    // 记录内部纵向弧面隔条与焊锡圆点
    for (let c = 1; c < cols; c++) {
      const uB = cutsBot[c], uT = cutsTop[c];
      const vB = evalRibY(b, uB), vT = evalRibY(b + 1, uT);
      const bend = (hash1(b * 19 + c * 43) - 0.5) * 0.026;
      const pts = [];
      const NS = 16;
      for (let s = 0; s <= NS; s++) {
        const t = s / NS;
        const st = t * t * (3 - 2 * t);
        const u = lerp(uB, uT, st) + Math.sin(t * Math.PI) * bend;
        const v = lerp(evalRibY(b, u), evalRibY(b + 1, u), t);
        pts.push([u, v]);
      }
      RIBS.push({ pts, band: b });
      JOINTS.push([uB, vB]);
      JOINTS.push([uT, vT]);
    }

    // 构造每个弧面窗格的闭合多边形与物理玻璃属性
    const palList = PALETTES[zone];
    for (let c = 0; c < cols; c++) {
      const uB0 = cutsBot[c], uB1 = cutsBot[c + 1];
      const uT0 = cutsTop[c], uT1 = cutsTop[c + 1];
      const bendL = c === 0 ? 0 : (hash1(b * 19 + c * 43) - 0.5) * 0.026;
      const bendR = c + 1 === cols ? 0 : (hash1(b * 19 + (c + 1) * 43) - 0.5) * 0.026;

      const poly = [];
      const NB = 18, NV = 12;
      // 底边左 -> 右
      for (let s = 0; s <= NB; s++) {
        const t = s / NB;
        const u = lerp(uB0, uB1, t);
        poly.push([u, evalRibY(b, u)]);
      }
      // 右弧边下 -> 上
      for (let s = 1; s <= NV; s++) {
        const t = s / NV, st = t * t * (3 - 2 * t);
        const u = lerp(uB1, uT1, st) + Math.sin(t * Math.PI) * bendR;
        poly.push([u, lerp(evalRibY(b, u), evalRibY(b + 1, u), t)]);
      }
      // 顶边右 -> 左
      for (let s = 1; s <= NB; s++) {
        const t = 1 - s / NB;
        const u = lerp(uT0, uT1, t);
        poly.push([u, evalRibY(b + 1, u)]);
      }
      // 左弧边上 -> 下
      for (let s = 1; s < NV; s++) {
        const t = 1 - s / NV, st = t * t * (3 - 2 * t);
        const u = lerp(uB0, uT0, st) + Math.sin(t * Math.PI) * bendL;
        poly.push([u, lerp(evalRibY(b, u), evalRibY(b + 1, u), t)]);
      }

      // 计算包围盒与格心
      let minU = 1, maxU = 0, minV = 1, maxV = 0, sumU = 0, sumV = 0;
      for (const [pu, pv] of poly) {
        if (pu < minU) minU = pu;
        if (pu > maxU) maxU = pu;
        if (pv < minV) minV = pv;
        if (pv > maxV) maxV = pv;
        sumU += pu;
        sumV += pv;
      }
      const cu = sumU / poly.length, cv = sumV / poly.length;
      const pal = palList[(c + b * 2 + ((rnd() * 2) | 0)) % palList.length];

      // 预生成 4～6 颗手作微气泡 (Trapped Seeds)
      const seeds = [];
      const nSeeds = 3 + ((rnd() * 4) | 0);
      for (let k = 0; k < nSeeds; k++) {
        seeds.push([
          lerp(minU + 0.015, maxU - 0.015, rand(0.18, 0.82)),
          lerp(minV + 0.015, maxV - 0.015, rand(0.18, 0.82)),
          rand(0.9, 2.3)
        ]);
      }

      CELLS.push({
        id: CELLS.length,
        zone,
        poly,
        cu,
        cv,
        minU, maxU, minV, maxV,
        maxDiag: Math.hypot((maxU - minU) * TEX_W, (maxV - minV) * TEX_H) * 1.08,
        pal, // [lightCenter, midBody, meniscusEdge]
        isWarm: zone === 'skyUpper' || zone === 'skyLower',
        glaze: 0,       // 0 -> 1 釉液填充进度
        targetGlaze: 0,
        byUser: false,
        origin: [cu, cv],
        swirlOff: [rand(0, 260), rand(0, 180), rand(-0.28, 0.28)],
        seeds,
        painted: 0
      });
    }
  }
}

function pointInPoly(u, v, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    const intersect = ((yi > v) !== (yj > v)) && (u < ((xj - xi) * (v - yi)) / (yj - yi + 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

/* ============================================================================
 * 5. 四层物理细节玻璃绘制器 (边缘弯月面聚色 + 吹制流云纹 + 微气泡 + 三层锤纹铜条)
 * ============================================================================ */
function tracePolyPx(ctx, poly) {
  ctx.beginPath();
  for (let i = 0; i < poly.length; i++) {
    const px = uvX(poly[i][0]), py = uvY(poly[i][1]);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function renderCellGlaze(cell) {
  const ctx = CV.pane.x;
  const p = easeOutCubic(cell.glaze);
  if (p <= 0.002) return;

  const ox = uvX(cell.origin[0]), oy = uvY(cell.origin[1]);
  const rad = Math.max(4, cell.maxDiag * p);
  const cx = uvX(cell.cu), cy = uvY(cell.cv);

  ctx.save();
  tracePolyPx(ctx, cell.poly);
  ctx.clip();

  // 清空该格已画区域重新合成当前晕染半径
  ctx.clearRect(
    uvX(cell.minU) - 4,
    uvY(cell.maxV) - 4,
    (cell.maxU - cell.minU) * TEX_W + 8,
    (cell.maxV - cell.minV) * TEX_H + 8
  );

  // 若尚未满格，按液态晕染圆裁剪
  if (p < 0.995) {
    ctx.beginPath();
    ctx.arc(ox, oy, rad, 0, TAU);
    ctx.clip();
  }

  // 1) 透明矿物琉璃中心通透径向渐变
  const gMain = ctx.createRadialGradient(cx, cy - 10, 4, cx, cy, Math.max(45, cell.maxDiag * 0.62));
  gMain.addColorStop(0.0, cell.pal[0]);
  gMain.addColorStop(0.72, cell.pal[1]);
  gMain.addColorStop(1.0, cell.pal[2]);
  ctx.fillStyle = gMain;
  ctx.fillRect(uvX(cell.minU) - 4, uvY(cell.maxV) - 4, (cell.maxU - cell.minU) * TEX_W + 8, (cell.maxV - cell.minV) * TEX_H + 8);

  // 2) 吹制流云纹 (Domain-Warped Swirls)
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 0.68;
  ctx.translate(cx, cy);
  ctx.rotate(cell.swirlOff[2]);
  ctx.drawImage(CV.swirl.c, -cx - cell.swirlOff[0], -cy - cell.swirlOff[1]);
  ctx.restore();

  // 3) 边缘弯月面聚色 (Meniscus Inner Vignette：靠近铜条 6~12px 处釉色加深 25%+，中央更清亮)
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  tracePolyPx(ctx, cell.poly);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = cell.pal[2];
  ctx.globalAlpha = 0.28;
  ctx.lineWidth = 20;
  ctx.stroke();
  ctx.globalAlpha = 0.34;
  ctx.lineWidth = 8.5;
  ctx.stroke();
  ctx.restore();

  // 晕染水波前沿微亮液边
  if (p < 0.98) {
    ctx.strokeStyle = 'rgba(255, 248, 230, 0.48)';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.arc(ox, oy, Math.max(2, rad - 1.5), 0, TAU);
    ctx.stroke();
  }

  // 4) 手作微气泡 (Trapped Seeds：0.8px~2.2px 半透明圆环 + 左上角 1px 纯白高光点)
  for (const [su, sv, sr] of cell.seeds) {
    const bx = uvX(su), by = uvY(sv);
    if (p < 0.99 && Math.hypot(bx - ox, by - oy) > rad - 4) continue;
    ctx.strokeStyle = 'rgba(255, 253, 246, 0.42)';
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.arc(bx, by, sr, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
    ctx.fillRect(bx - sr * 0.48, by - sr * 0.48, 1.15, 1.15);
  }

  ctx.restore();
  cell.painted = p;
  CV.dirtyPane = true;
}

// 绘制黄铜嵌条网络（含第一幕实时焊山熔融橙金 -> 古铜冷却，及副网格流线展开 + 4 切面琉璃飞鸟铜箔）
const SWALLOWS = []; // 第四幕天空嵌入的切面琉璃飞鸟

function redrawMetalLayer() {
  const ctx = CV.metal.x;
  ctx.clearRect(0, 0, TEX_W, TEX_H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const strokeCameCurve = (pts, widthPx, heatArr = null, prog = 1) => {
    const maxI = Math.floor((pts.length - 1) * clamp(prog, 0, 1));
    if (maxI < 1) return;

    // Pass A: 向玻璃内部投下的 2px 柔和立体斜影 (R=0, A=0.68)
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.68)';
    ctx.lineWidth = widthPx + 3.2;
    ctx.beginPath();
    for (let i = 0; i <= maxI; i++) {
      const px = uvX(pts[i][0]) + 2.2, py = uvY(pts[i][1]) + 2.6;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // Pass B/C/D: 整条连续曲线一次成笔绘制，消除分段圆头串珠伪影！
    const hotByte = (!heatArr && prog < 0.99) ? Math.round((1 - prog) * 180) : 0;
    const baseLayers = [
      [widthPx, `rgba(255, 28, ${hotByte}, 1)`],
      [widthPx * 0.66, `rgba(255, 130, ${hotByte}, 1)`],
      [widthPx * 0.27, `rgba(255, 242, ${hotByte}, 1)`]
    ];
    for (const [lw, col] of baseLayers) {
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.beginPath();
      for (let i = 0; i <= maxI; i++) {
        const px = uvX(pts[i][0]), py = uvY(pts[i][1]);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    // 若存在刚焊下的高温段 (MTN.heat > 0.03)，仅在高温段叠绘熔融橙金光晕
    if (heatArr) {
      for (let i = 0; i < maxI; i++) {
        const idx0 = pts[i][2];
        const heat = MTN.heat[idx0] || 0;
        if (heat < 0.03) continue;
        const hByte = clamp(Math.round(heat * 255), 0, 255);
        const x0 = uvX(pts[i][0]), y0 = uvY(pts[i][1]);
        const x1 = uvX(pts[i + 1][0]), y1 = uvY(pts[i + 1][1]);
        ctx.strokeStyle = `rgba(255, 185, ${hByte}, 1)`;
        ctx.lineWidth = widthPx * 0.85;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }
  };

  // 1) 若副网格已触发，绘制横向层带 R1, R2, R3, R5, R6 与纵向弧线隔条 RIBS
  if (MTN.gridBuilt && MTN.gridAnim > 0.005) {
    const gp = easeOutCubic(MTN.gridAnim);
    for (const rIdx of [1, 2, 3, 5, 6]) {
      const pts = [];
      for (let i = 0; i < NX; i += 2) {
        pts.push([i / (NX - 1), RIBBONS[rIdx][i]]);
      }
      pts.push([1, RIBBONS[rIdx][NX - 1]]);
      strokeCameCurve(pts, rIdx === 2 ? 7.2 : 6.4, null, gp);
    }
    for (let k = 0; k < RIBS.length; k++) {
      const delay = (k / RIBS.length) * 0.45;
      const rp = clamp((gp - delay) / 0.55, 0, 1);
      if (rp > 0.01) strokeCameCurve(RIBS[k].pts, 5.8, null, rp);
    }
    // T 型交汇处圆润焊锡微凸点
    if (gp > 0.4) {
      const ja = clamp((gp - 0.4) / 0.6, 0, 1);
      for (const [ju, jv] of JOINTS) {
        const jx = uvX(ju), jy = uvY(jv);
        ctx.fillStyle = 'rgba(255, 65, 0, 1)';
        ctx.beginPath(); ctx.arc(jx, jy, 4.8 * ja, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255, 232, 0, 1)';
        ctx.beginPath(); ctx.arc(jx - 0.7, jy - 0.7, 2.2 * ja, 0, TAU); ctx.fill();
      }
    }
  }

  // 2) 绘制第一幕主山脊铜骨（分连续已焊段绘制，保留熔融橙金余温）
  let seg = [];
  for (let i = 0; i < NX; i++) {
    const on = MTN.gridBuilt || MTN.set[i];
    if (on) {
      const vVal = MTN.gridBuilt ? MTN.smooth[i] : MTN.raw[i];
      seg.push([i / (NX - 1), vVal, i]);
    } else if (seg.length > 1) {
      strokeCameCurve(seg, 9.2, true, 1);
      seg = [];
    } else {
      seg = [];
    }
  }
  if (seg.length > 1) strokeCameCurve(seg, 9.2, true, 1);

  // 3) 四周内框压边铜条
  ctx.strokeStyle = 'rgba(255, 95, 0, 1)';
  ctx.lineWidth = 8;
  ctx.strokeRect(2, 2, TEX_W - 4, TEX_H - 4);

  // 4) 第四幕嵌入的切面琉璃燕铜箔细边
  for (const sw of SWALLOWS) {
    drawSwallowMetal(ctx, sw);
  }

  CV.dirtyMetal = true;
}

/* ============================================================================
 * 6. 第三幕：金刚石刻霜（山坡分枝霜林 & 溪岸随风芦苇）
 * ============================================================================ */
let frostCount = 0, frostUserCount = 0, lastFrostUV = null;

function etchFrostAt(u, v, byUser) {
  if (u < 0.03 || u > 0.97 || v < 0.04 || v > 0.94) return;
  if (lastFrostUV && Math.hypot(u - lastFrostUV[0], v - lastFrostUV[1]) < 0.028) return;
  lastFrostUV = [u, v];

  const ctx = CV.frost.x;
  const hM = sampleRidge(u);
  const streamTop = RIBBONS.length ? RIBBONS[2][clamp(Math.round(u * (NX - 1)), 0, NX - 1)] : 0.22;

  ctx.save();
  ctx.lineCap = 'round';
  const phaseByte = (rnd() * 255) | 0;

  if (v < streamTop + 0.07) {
    // 低处溪岸：刻出随风微倾的银霜芦苇与芒穗 (5~8 株一簇)
    const baseV = clamp(v, 0.04, streamTop + 0.03);
    const nStems = 5 + ((rnd() * 4) | 0);
    for (let k = 0; k < nStems; k++) {
      const su = u + rand(-0.022, 0.022);
      const sv = baseV + rand(-0.012, 0.012);
      const h = rand(0.045, 0.095);
      const lean = rand(0.012, 0.038) * (rnd() < 0.75 ? 1 : -0.6);
      const x0 = uvX(su), y0 = uvY(sv);
      const xm = uvX(su + lean * 0.4), ym = uvY(sv + h * 0.55);
      const x1 = uvX(su + lean), y1 = uvY(sv + h);

      ctx.strokeStyle = `rgba(255, ${phaseByte}, 0, ${rand(0.58, 0.88)})`;
      ctx.lineWidth = rand(1.1, 2.0);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(xm, ym, x1, y1);
      ctx.stroke();

      // 芦花细羽穗
      for (let p = 0; p < 5; p++) {
        const ang = -Math.PI * 0.35 + rand(-0.45, 0.45);
        const pl = rand(5, 13);
        ctx.strokeStyle = `rgba(255, ${(phaseByte + p * 29) & 255}, 0, 0.52)`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + Math.cos(ang) * pl, y1 + Math.sin(ang) * pl);
        ctx.stroke();
      }
    }
  } else {
    // 山脊与山坡：刻出带细密针叶分枝的冰晶松柏 / 白桦霜树
    const rootV = clamp(v, streamTop + 0.04, Math.min(hM + 0.02, 0.72));
    const treeH = rand(0.065, 0.135);
    const x0 = uvX(u), y0 = uvY(rootV);
    const topX = x0 + rand(-8, 8), topY = uvY(rootV + treeH);

    // 主干晶痕
    ctx.strokeStyle = `rgba(255, ${phaseByte}, 0, 0.92)`;
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0 + topX) * 0.5 + rand(-4, 4), (y0 + topY) * 0.5, topX, topY);
    ctx.stroke();

    const isPine = v > hM - 0.14 || rnd() < 0.58;
    const tiers = isPine ? 7 + ((rnd() * 4) | 0) : 5 + ((rnd() * 3) | 0);
    for (let t = 1; t <= tiers; t++) {
      const f = t / (tiers + 0.5);
      const bx = lerp(x0, topX, f);
      const by = lerp(y0, topY, f);
      const span = (1 - f * 0.72) * treeH * TEX_H * (isPine ? 0.38 : 0.46);
      for (const dir of [-1, 1]) {
        const ang = isPine
          ? (dir > 0 ? -0.32 : Math.PI + 0.32) + rand(-0.14, 0.14)
          : (dir > 0 ? -0.78 : -Math.PI + 0.78) + rand(-0.18, 0.18);
        const ex = bx + Math.cos(ang) * span * rand(0.75, 1.1);
        const ey = by + Math.sin(ang) * span * rand(0.75, 1.1);
        ctx.strokeStyle = `rgba(255, ${(phaseByte + t * 23) & 255}, 0, ${rand(0.62, 0.88)})`;
        ctx.lineWidth = lerp(1.5, 0.85, f);
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // 二级冰晶针叶细芒
        for (let n = 1; n <= 3; n++) {
          const nf = n / 3.4;
          const nx = lerp(bx, ex, nf), ny = lerp(by, ey, nf);
          const na = ang + (n % 2 ? 0.55 : -0.55);
          const nl = span * 0.28;
          ctx.strokeStyle = `rgba(255, ${(phaseByte + n * 41) & 255}, 0, 0.48)`;
          ctx.lineWidth = 0.75;
          ctx.beginPath();
          ctx.moveTo(nx, ny);
          ctx.lineTo(nx + Math.cos(na) * nl, ny + Math.sin(na) * nl);
          ctx.stroke();
        }
      }
    }
  }
  ctx.restore();
  CV.dirtyFrost = true;
  frostCount++;
  if (byUser) frostUserCount++;
  playFrostSparkle(v, u, byUser ? 0.12 : 0.07);

  // 2D 前景飞散几粒极细冰晶碎屑
  const wp = uvToWorld(u, v, 0.004);
  const sp = worldToScreen(wp);
  if (sp) {
    for (let k = 0; k < 5; k++) {
      SPARKS.push({
        x: sp[0], y: sp[1],
        vx: rand(-36, 36), vy: rand(-48, -10),
        life: 0, max: rand(0.35, 0.65),
        col: 'rgba(255,252,240,', r: rand(1.0, 2.1)
      });
    }
  }
}

/* ============================================================================
 * 7. 第四幕：切面琉璃飞鸟 & 山形等高黄铜风铃管物理单摆系统
 * ============================================================================ */
let swallowUserCount = 0;

function getSwallowFacets(sw) {
  const { u, v, ang, scale } = sw;
  const c = Math.cos(ang), s = Math.sin(ang);
  const rot = (lx, ly) => [u + (lx * c - ly * s) * scale / 1.44, v + (lx * s + ly * c) * scale];

  // 舒展优雅的流线春燕剪影（修长掠翼 + 分叉剪刀尾，4 块蒂凡尼宝石切面）
  const beak   = rot( 0.044,  0.004);
  const head   = rot( 0.024,  0.011);
  const throat = rot( 0.020, -0.006);
  const center = rot(-0.002,  0.001);
  const wingTipU = rot(-0.018,  0.062);
  const wingMidU = rot( 0.008,  0.036);
  const wingTipD = rot( 0.002, -0.048);
  const rump   = rot(-0.022, -0.002);
  const forkU  = rot(-0.056,  0.016);
  const forkIn = rot(-0.036, -0.003);
  const forkD  = rot(-0.054, -0.020);

  return [
    { pts: [head, wingMidU, wingTipU, center],         col: '#f0b854' }, // 上掠长翼蜜金珀
    { pts: [beak, head, center, throat],               col: '#c85a48' }, // 燕首朱红珀
    { pts: [throat, center, rump, wingTipD],           col: '#df7a3e' }, // 下掠翼暖杏珀
    { pts: [center, forkU, forkIn, forkD, rump],       col: '#f6cf7d' }  // 剪刀燕尾明金珀
  ];
}

function drawSwallowMetal(ctx, sw) {
  const facets = getSwallowFacets(sw);
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (const f of facets) {
    tracePolyPx(ctx, f.pts);
    ctx.strokeStyle = 'rgba(255, 52, 0, 1)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 228, 0, 1)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }
  ctx.restore();
}

function addGlassSwallow(u, v, ang, byUser) {
  if (SWALLOWS.length >= 8) return false;
  const hM = sampleRidge(u);
  const sv = clamp(v, hM + 0.07, 0.93);
  const su = clamp(u, 0.09, 0.91);
  for (const ex of SWALLOWS) {
    if (Math.hypot(ex.u - su, ex.v - sv) < 0.095) return false;
  }
  const sw = {
    u: su,
    v: sv,
    ang: clamp(ang, -0.45, 0.45),
    scale: rand(1.12, 1.42),
    byUser
  };
  SWALLOWS.push(sw);
  if (byUser) swallowUserCount++;

  // 将 4 块几何切面琉璃绘入 pane 画布（使终章地板焦散也能投出红珀飞鸟！）
  const pctx = CV.pane.x;
  const facets = getSwallowFacets(sw);
  pctx.save();
  for (const f of facets) {
    tracePolyPx(pctx, f.pts);
    pctx.fillStyle = f.col;
    pctx.fill();
    pctx.strokeStyle = '#8f3926';
    pctx.lineWidth = 2.2;
    pctx.stroke();
  }
  pctx.restore();
  CV.dirtyPane = true;

  redrawMetalLayer();
  playFrostSparkle(0.88, su, 0.14);
  return true;
}

// 9 根檐下锤纹黄铜风铃管（管长与音高严格取自第一幕山脊高度场 H_MAIN[x]！）
const N_CHIMES = 9;
const CHIMES = [];
let chimesHungCount = 0, chimesUserCount = 0;

function initChimesFromMountain() {
  if (CHIMES.length) return;
  const catchCols = ['#e8a849', '#3b7a6c', '#c85a48', '#2b6578', '#598c58', '#df7a3e', '#6ea1a8', '#e8a849', '#3b7a6c'];
  for (let k = 0; k < N_CHIMES; k++) {
    const u = 0.12 + (k / (N_CHIMES - 1)) * 0.76;
    const h = sampleRidge(u); // 0.34..0.74
    const normH = clamp((h - 0.34) / 0.38, 0, 1);
    // 山越高 -> 黄铜音管越修长 -> 共鸣越温厚悠长（严格呼应台词「山有多高，风铃的音就有多长」）
    const lenWorld = 0.115 + normH * 0.165;
    // 音高映射进 D 五声谐和音列（长管沉稳低吟、短管清越明亮）
    const noteIdx = clamp(Math.round((1 - normH) * (CHIME_POOL.length - 1)), 0, CHIME_POOL.length - 1);
    const sustain = 2.6 + normH * 2.1;
    CHIMES.push({
      idx: k,
      u,
      lx: (u - 0.5) * WIN.inW,
      normH,
      len: lenWorld,
      midi: CHIME_POOL[noteIdx],
      sustain,
      catcherCol: catchCols[k % catchCols.length],
      hung: false,
      dropAnim: 0,
      theta: 0,
      omega: 0,
      glow: 0,
      lastStruck: -9
    });
  }
}

function hangChime(k, byUser) {
  initChimesFromMountain();
  const ch = CHIMES[k];
  if (!ch || ch.hung) return;
  ch.hung = true;
  ch.dropAnim = 0.01;
  ch.omega = rand(-1.8, 1.8);
  ch.glow = 1.0;
  chimesHungCount++;
  if (byUser) chimesUserCount++;
  playBrassChime(ch.midi, ch.sustain, byUser ? 0.19 : 0.13, (ch.u - 0.5) * 1.3);
}

function strikeChime(ch, impulse = 2.2, vel = 0.18) {
  if (!ch || !ch.hung) return;
  ch.omega = clamp(ch.omega + impulse, -4.5, 4.5);
  if (STATE.t - ch.lastStruck > 0.18) {
    ch.lastStruck = STATE.t;
    ch.glow = 1.0;
    playBrassChime(ch.midi, ch.sustain, vel, (ch.u - 0.5) * 1.3);
  }
}

/* ============================================================================
 * 8. 第五幕：石膏固封浮灰初始化与亚麻布打圈擦拭
 * ============================================================================ */
const DUST_GRID_W = 36, DUST_GRID_H = 25;
const dustCells = new Uint8Array(DUST_GRID_W * DUST_GRID_H);
let dustClearedCells = 0, dustUserCells = 0, dustActive = false;

function beginDustLayer() {
  dustActive = true;
  STATE.dustAmt = 0.01;
  dustCells.fill(1);
  dustClearedCells = 0;
  dustUserCells = 0;
  const ctx = CV.dust.x;
  ctx.fillStyle = '#eb0000';
  ctx.fillRect(0, 0, 720, 500);
  // 叠一点手作涂抹石膏纹理
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = `rgba(255, 0, 0, ${rand(0.05, 0.18)})`;
    ctx.beginPath();
    ctx.arc(rand(0, 720), rand(0, 500), rand(18, 65), 0, TAU);
    ctx.fill();
  }
  CV.dirtyDust = true;
}

function wipeDustAt(u, v, byUser, radius = 0.105) {
  if (!dustActive) return;
  const ctx = CV.dust.x;
  const x = u * 720, y = (1 - v) * 500;
  const rPx = radius * 720;
  const g = ctx.createRadialGradient(x, y, rPx * 0.18, x, y, rPx);
  g.addColorStop(0, 'rgba(0, 0, 0, 0.88)');
  g.addColorStop(0.65, 'rgba(0, 0, 0, 0.45)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, rPx, 0, TAU);
  ctx.fill();
  CV.dirtyDust = true;

  // 统计擦净比例
  const gx0 = clamp(Math.floor((u - radius * 0.75) * DUST_GRID_W), 0, DUST_GRID_W - 1);
  const gx1 = clamp(Math.floor((u + radius * 0.75) * DUST_GRID_W), 0, DUST_GRID_W - 1);
  const gy0 = clamp(Math.floor((v - radius * 0.75) * DUST_GRID_H), 0, DUST_GRID_H - 1);
  const gy1 = clamp(Math.floor((v + radius * 0.75) * DUST_GRID_H), 0, DUST_GRID_H - 1);
  for (let gy = gy0; gy <= gy1; gy++) {
    for (let gx = gx0; gx <= gx1; gx++) {
      const cu = (gx + 0.5) / DUST_GRID_W, cv = (gy + 0.5) / DUST_GRID_H;
      if (Math.hypot(cu - u, (cv - v) / 1.44) <= radius * 0.72) {
        const id = gy * DUST_GRID_W + gx;
        if (dustCells[id]) {
          dustCells[id] = 0;
          dustClearedCells++;
          if (byUser) dustUserCells++;
        }
      }
    }
  }
}

/* ============================================================================
 * 9. 导演时间轴、台词排期、五幕幽灵接力与终章山形风铃合奏
 * ============================================================================ */
const STATE = {
  started: false,
  act: 0,       // 0=序幕, 1=焊山, 2=注彩, 3=刻霜, 4=悬铃, 5=拭尘, 6=终章·透光
  t: 0,
  lt: 0,
  lastUserAt: -99,
  dustAmt: 0,
  ghostActive: false,
  ghostUV: [0.5, 0.5],
  timers: [],
  lineTimer: null,
  hintShown: false,
  hintText: '',
  doneFlag: false,
  doneAt: 0,
  chimeSeqIdx: 0,
  nextChimeAt: 0,
  nextPianoAt: 0
};

function schedule(delay, fn) {
  STATE.timers.push([STATE.t + delay / SPEED, fn]);
}

function showLine(text, holdSec = 3.2) {
  const el = $('#line');
  if (STATE.lineTimer) clearTimeout(STATE.lineTimer);
  el.classList.remove('on');
  setTimeout(() => {
    el.textContent = text;
    el.classList.add('on');
  }, 180);
  if (holdSec < 900) {
    STATE.lineTimer = setTimeout(() => {
      el.classList.remove('on');
    }, (holdSec + 1.2) * 1000 / Math.min(SPEED, 2.5));
  }
}

function setHint(text) {
  STATE.hintText = text;
  STATE.hintShown = false;
  $('#hint').classList.remove('on');
}

function hideHint() {
  STATE.hintText = '';
  STATE.hintShown = false;
  $('#hint').classList.remove('on');
}

// 前景微尘与焊花粒子
const MOTES = [];
const SPARKS = [];
for (let i = 0; i < 34; i++) {
  MOTES.push({
    x: rand(-0.9, 0.9),
    y: rand(0.06, 1.35),
    z: rand(-0.4, 2.4),
    vx: rand(-0.015, 0.022),
    vy: rand(-0.008, 0.012),
    ph: rand(0, TAU),
    sz: rand(1.1, 2.6)
  });
}

// 指针状态
const PTR = {
  x: VW * 0.5,
  y: VH * 0.5,
  down: false,
  inside: false,
  vx: 0,
  vy: 0,
  speed: 0,
  uv: [0.5, 0.5],
  prevUV: null,
  lastMoveMs: 0
};

const ACTS = [
  // 0: 序幕 · 雾窗
  {
    name: '序幕',
    enter() {
      CAM.zoomPos = [0, 1.56, 0.14];
      CAM.zoomTarget = [0, 0.02, -0.01];
    },
    update() {}
  },

  // 1: 第一幕 · 焊山
  {
    name: '焊山',
    maxDur: 34,
    enter() {
      STATE.doneFlag = false;
      CAM.zoomPos = [0, 1.50, 0.12];
      CAM.zoomTarget = [0, 0.02, -0.01];
      schedule(0.5, () => showLine('铜条走过的地方，有了山。', 3.4));
      schedule(3.2, () => {
        if (!STATE.doneFlag && STATE.t - STATE.lastUserAt > 2.8) {
          setHint('从左向右划，焊出山脊轮廓');
        }
      });
      this.ghostIdx = 0;
    },
    onStroke(u, v, byUser) {
      if (STATE.doneFlag) return;
      const wy = clamp(v, 0.35, 0.72);
      const idx = clamp(Math.round(u * (NX - 1)), 0, NX - 1);
      const i0 = MTN.prevIdx >= 0 ? MTN.prevIdx : idx;
      const v0 = MTN.prevIdx >= 0 ? MTN.prevV : wy;
      const span = Math.abs(idx - i0);
      if (span > 48 && byUser) {
        MTN.prevIdx = idx;
        MTN.prevV = wy;
        return;
      }
      for (let k = 0; k <= span; k++) {
        const ii = i0 + (idx >= i0 ? k : -k);
        const f = span ? k / span : 1;
        MTN.raw[ii] = lerp(v0, wy, f);
        MTN.heat[ii] = 1.0;
        if (!MTN.set[ii]) {
          MTN.set[ii] = 1;
          MTN.setCount++;
          if (byUser) {
            MTN.byUser[ii] = 1;
            MTN.userCount++;
          }
        }
      }
      MTN.prevIdx = idx;
      MTN.prevV = wy;
      redrawMetalLayer();

      // 焊山音高随山高触发 D 五声玻璃马林巴
      MTN.noteAcc += Math.abs(idx - i0) + 0.35;
      if (MTN.noteAcc > 14) {
        MTN.noteAcc = 0;
        const pIdx = clamp(Math.round(((wy - 0.35) / 0.37) * (PENTA_LOW.length - 1)), 0, PENTA_LOW.length - 1);
        playGlassMarimba(PENTA_LOW[pIdx], byUser ? 0.20 : 0.12, (u - 0.5) * 1.3);
      }

      // 烙铁微火星
      const sp = worldToScreen(uvToWorld(u, wy, 0.005));
      if (sp && rnd() < 0.55) {
        SPARKS.push({
          x: sp[0], y: sp[1],
          vx: rand(-28, 28), vy: rand(-42, -8),
          life: 0, max: rand(0.28, 0.52),
          col: 'rgba(244,174,78,', r: rand(1.1, 2.3)
        });
      }
    },
    finish() {
      if (STATE.doneFlag) return;
      STATE.doneFlag = true;
      STATE.doneAt = STATE.t;
      STATE.ghostActive = false;
      hideHint();
      quietAllLoops();
      buildTiffanyGrid();
      redrawMetalLayer();

      // 沿成型山脊依次奏响一串五声玻璃马林巴泛音
      for (let k = 0; k < 8; k++) {
        const u = k / 7;
        const h = sampleRidge(u);
        const pIdx = clamp(Math.round(((h - 0.35) / 0.37) * (PENTA_LOW.length - 1)), 0, PENTA_LOW.length - 1);
        playGlassMarimba(PENTA_LOW[pIdx], 0.15, (u - 0.5) * 1.3, AU.ctx ? AU.ctx.currentTime + 0.15 + k * 0.14 : 0);
      }
      schedule(0.7, () => showLine('山骨定了，等风也等颜色。', 3.0));
    },
    update(lt, dt) {
      // 焊条橙金熔融温度自然冷却为氧化古铜 (0.65s)
      let anyHot = false;
      for (let i = 0; i < NX; i++) {
        if (MTN.heat[i] > 0.005) {
          MTN.heat[i] = Math.max(0, MTN.heat[i] - dt * 1.55);
          anyHot = true;
        }
      }
      if (STATE.doneFlag && MTN.gridAnim < 1) {
        MTN.gridAnim = Math.min(1, MTN.gridAnim + dt * 0.52);
        anyHot = true;
      }
      if (anyHot) redrawMetalLayer();

      if (STATE.doneFlag) {
        if (STATE.t - STATE.doneAt > 4.2 / SPEED) gotoAct(2);
        return;
      }

      // 烙铁连续摩擦声随拖动速度调制
      if (AU.ctx && AU.solderLoop) {
        const active = PTR.down && STATE.t - STATE.lastUserAt < 0.2;
        AU.solderLoop.g.gain.setTargetAtTime(active ? clamp(PTR.speed * 0.00018, 0.03, 0.16) : 0, AU.ctx.currentTime, 0.05);
        AU.solderLoop.pan.pan.value = clamp((PTR.uv[0] - 0.5) * 1.4, -0.8, 0.8);
      }

      // 停留超 6 秒未动 -> 暖金日影幽灵手势从左向右温柔代焊
      const idle = STATE.t - STATE.lastUserAt;
      if (!PTR.down && ((lt > 6.0 / SPEED && idle > 5.2 / SPEED) || lt > 22 / SPEED)) {
        STATE.ghostActive = true;
        while (this.ghostIdx < NX && MTN.set[this.ghostIdx]) this.ghostIdx++;
        const stepCols = Math.max(1, Math.round(dt * 38 * SPEED));
        for (let s = 0; s < stepCols && this.ghostIdx < NX; s++, this.ghostIdx++) {
          if (!MTN.set[this.ghostIdx]) {
            const gu = this.ghostIdx / (NX - 1);
            const gv = MTN.def[this.ghostIdx];
            STATE.ghostUV = [gu, gv];
            this.onStroke(gu, gv, false);
          }
        }
      } else {
        STATE.ghostActive = false;
      }

      if (MTN.setCount >= NX * 0.90 || lt > 28 / SPEED) {
        this.finish();
      }
    }
  },

  // 2: 第二幕 · 注彩
  {
    name: '注彩',
    enter() {
      buildTiffanyGrid();
      MTN.gridAnim = 1;
      redrawMetalLayer();
      STATE.doneFlag = false;
      CAM.zoomPos = [0, 1.52, 0.13];
      CAM.zoomTarget = [0, 0.02, -0.01];
      schedule(0.5, () => showLine('把晚霞和溪水，封进格子里。', 3.4));
      schedule(3.2, () => setHint('滑过空白窗格，注入琉璃釉色'));
      this.nextAutoAt = 0;
    },
    glazeAt(u, v, byUser) {
      if (u < 0 || u > 1 || v < 0 || v > 1) return;
      for (const cell of CELLS) {
        if (cell.targetGlaze >= 1) continue;
        if (u >= cell.minU - 0.02 && u <= cell.maxU + 0.02 && v >= cell.minV - 0.02 && v <= cell.maxV + 0.02) {
          if (pointInPoly(u, v, cell.poly) || Math.hypot(u - cell.cu, v - cell.cv) < 0.055) {
            cell.targetGlaze = 1;
            cell.byUser = byUser;
            cell.origin = [clamp(u, cell.minU, cell.maxU), clamp(v, cell.minV, cell.maxV)];
            playCrystalResonance(cell.isWarm, cell.cu, byUser ? 0.14 : 0.08);
          }
        }
      }
    },
    finish() {
      if (STATE.doneFlag) return;
      STATE.doneFlag = true;
      STATE.doneAt = STATE.t;
      STATE.ghostActive = false;
      hideHint();
      quietAllLoops();
      for (const c of CELLS) c.targetGlaze = 1;
      schedule(0.6, () => showLine('颜色沉下来，光就有了形状。', 3.0));
    },
    update(lt, dt) {
      let filled = 0;
      for (const cell of CELLS) {
        if (cell.targetGlaze > cell.glaze) {
          cell.glaze = Math.min(1, cell.glaze + dt * 1.85 * SPEED);
          renderCellGlaze(cell);
        }
        if (cell.glaze >= 0.98) filled++;
      }

      if (AU.ctx && AU.glazeLoop) {
        const active = !STATE.doneFlag && STATE.t - STATE.lastUserAt < 0.18 && PTR.speed > 25;
        AU.glazeLoop.g.gain.setTargetAtTime(active ? clamp(PTR.speed * 0.00014, 0.02, 0.12) : 0, AU.ctx.currentTime, 0.07);
        AU.glazeLoop.pan.pan.value = clamp((PTR.uv[0] - 0.5) * 1.3, -0.8, 0.8);
      }

      if (STATE.doneFlag) {
        if (filled >= CELLS.length && STATE.t - STATE.doneAt > 3.6 / SPEED) gotoAct(3);
        return;
      }

      // 停留超 6 秒 -> 阳光斜掠窗格，由近及远自动浸染空白窗格
      const idle = STATE.t - STATE.lastUserAt;
      if ((lt > 6.0 / SPEED && idle > 5.0 / SPEED) || lt > 26 / SPEED) {
        if (STATE.t >= this.nextAutoAt) {
          this.nextAutoAt = STATE.t + (lt > 26 / SPEED ? 0.14 : 0.34) / SPEED;
          const rem = CELLS.filter((c) => c.targetGlaze < 1);
          if (rem.length) {
            rem.sort((a, b) => (a.cu + a.cv * 0.5) - (b.cu + b.cv * 0.5));
            const pick = rem[0];
            STATE.ghostActive = true;
            STATE.ghostUV = [pick.cu, pick.cv];
            this.glazeAt(pick.cu, pick.cv, false);
          }
        }
      } else {
        STATE.ghostActive = false;
      }

      if (filled >= CELLS.length * 0.94 || lt > 34 / SPEED) {
        this.finish();
      }
    }
  },

  // 3: 第三幕 · 刻霜
  {
    name: '刻霜',
    enter() {
      for (const cell of CELLS) {
        if (cell.glaze < 1) { cell.glaze = 1; cell.targetGlaze = 1; renderCellGlaze(cell); }
      }
      STATE.doneFlag = false;
      // 镜头轻微推近山脊与溪谷交界处
      CAM.zoomPos = [0, 1.30, 0.16];
      CAM.zoomTarget = [0, 0.02, 0.03];
      schedule(0.5, () => showLine('银针刮开薄雾，山坡长出树。', 3.4));
      schedule(3.2, () => setHint('沿山脊轻划，刻出霜林与芦苇'));
      this.nextAutoAt = 0;
    },
    finish() {
      if (STATE.doneFlag) return;
      STATE.doneFlag = true;
      STATE.doneAt = STATE.t;
      STATE.ghostActive = false;
      hideHint();
      quietAllLoops();
      schedule(0.5, () => showLine('每一道刻痕，都会替你留住光。', 3.0));
    },
    update(lt, dt) {
      if (AU.ctx && AU.scribeLoop) {
        const active = !STATE.doneFlag && STATE.t - STATE.lastUserAt < 0.16 && PTR.speed > 20;
        AU.scribeLoop.g.gain.setTargetAtTime(active ? clamp(PTR.speed * 0.00009, 0.015, 0.075) : 0, AU.ctx.currentTime, 0.05);
        AU.scribeLoop.pan.pan.value = clamp((PTR.uv[0] - 0.5) * 1.4, -0.8, 0.8);
      }

      if (STATE.doneFlag) {
        if (STATE.t - STATE.doneAt > 3.6 / SPEED) gotoAct(4);
        return;
      }

      const idle = STATE.t - STATE.lastUserAt;
      if ((lt > 6.0 / SPEED && idle > 4.8 / SPEED) || lt > 22 / SPEED) {
        if (STATE.t >= this.nextAutoAt) {
          this.nextAutoAt = STATE.t + 0.65 / SPEED;
          const gu = clamp(0.10 + (frostCount * 0.137 + rand(-0.04, 0.04)) % 0.82, 0.08, 0.92);
          const onBank = frostCount % 3 === 2;
          const gv = onBank
            ? RIBBONS[1][Math.round(gu * (NX - 1))] + 0.02
            : sampleRidge(gu) - rand(0.03, 0.11);
          STATE.ghostActive = true;
          STATE.ghostUV = [gu, gv];
          lastFrostUV = null;
          etchFrostAt(gu, gv, false);
        }
      } else {
        STATE.ghostActive = false;
      }

      if (frostCount >= 16 || lt > 28 / SPEED) {
        this.finish();
      }
    }
  },

  // 4: 第四幕 · 悬铃
  {
    name: '悬铃',
    enter() {
      initChimesFromMountain();
      STATE.doneFlag = false;
      // 视角拉远下移，完整露出天空区与窗框下沿垂落的整排黄铜风铃管
      CAM.zoomPos = [0, 1.84, 0.36];
      CAM.zoomTarget = [0, 0.02, 0.14];
      schedule(0.5, () => showLine('高处落飞鸟，檐下挂风铃。', 3.4));
      schedule(3.2, () => setHint('点亮天空飞鸟，拂过窗沿挂上铜铃'));
      this.nextAutoAt = 0;
    },
    interactAt(u, v, byUser) {
      if (v > 0.44 && u > 0.04 && u < 0.96) {
        const ang = Math.atan2(-PTR.vy, PTR.vx || 1) * 0.35;
        addGlassSwallow(u, v, ang, byUser);
      }
      if (v < 0.32) {
        for (let k = 0; k < CHIMES.length; k++) {
          const ch = CHIMES[k];
          if (Math.abs(u - ch.u) < 0.075) {
            if (!ch.hung) hangChime(k, byUser);
            else if (byUser) strikeChime(ch, clamp(PTR.vx * 0.004, -3.2, 3.2) || 1.8, 0.16);
          }
        }
      }
    },
    finish() {
      if (STATE.doneFlag) return;
      STATE.doneFlag = true;
      STATE.doneAt = STATE.t;
      STATE.ghostActive = false;
      hideHint();
      // 确保至少有 3 只琉璃燕与全部 9 根黄铜风铃挂齐
      while (SWALLOWS.length < 3) {
        const u = 0.24 + SWALLOWS.length * 0.24 + rand(-0.04, 0.04);
        addGlassSwallow(u, clamp(sampleRidge(u) + rand(0.14, 0.24), 0.62, 0.90), rand(-0.18, 0.22), false);
      }
      for (let k = 0; k < CHIMES.length; k++) {
        if (!CHIMES[k].hung) hangChime(k, false);
      }
      schedule(0.6, () => showLine('山有多高，风铃的音就有多长。', 3.2));
    },
    update(lt, dt) {
      if (STATE.doneFlag) {
        if (STATE.t - STATE.doneAt > 3.8 / SPEED) gotoAct(5);
        return;
      }
      const idle = STATE.t - STATE.lastUserAt;
      if ((lt > 6.0 / SPEED && idle > 4.8 / SPEED) || lt > 22 / SPEED) {
        if (STATE.t >= this.nextAutoAt) {
          this.nextAutoAt = STATE.t + 0.52 / SPEED;
          STATE.ghostActive = true;
          if (SWALLOWS.length < 4) {
            const gu = 0.22 + SWALLOWS.length * 0.19 + rand(-0.03, 0.03);
            const gv = clamp(sampleRidge(gu) + rand(0.14, 0.25), 0.62, 0.90);
            STATE.ghostUV = [gu, gv];
            addGlassSwallow(gu, gv, rand(-0.15, 0.22), false);
          } else {
            const nextCh = CHIMES.find((c) => !c.hung);
            if (nextCh) {
              STATE.ghostUV = [nextCh.u, -0.02];
              hangChime(nextCh.idx, false);
            }
          }
        }
      } else {
        STATE.ghostActive = false;
      }

      if ((SWALLOWS.length >= 3 && chimesHungCount >= N_CHIMES) || lt > 30 / SPEED) {
        this.finish();
      }
    }
  },

  // 5: 第五幕 · 拭尘
  {
    name: '拭尘',
    enter() {
      STATE.doneFlag = false;
      CAM.zoomPos = [0, 1.56, 0.15];
      CAM.zoomTarget = [0, 0.02, 0.0];
      beginDustLayer();
      schedule(0.5, () => showLine('擦去浮灰，让光穿过整扇窗。', 3.4));
      schedule(3.2, () => setHint('轻轻擦拭玻璃，拭净表面浮灰'));
      this.sweepAngle = 0;
    },
    finish() {
      if (STATE.doneFlag) return;
      STATE.doneFlag = true;
      STATE.doneAt = STATE.t;
      STATE.ghostActive = false;
      hideHint();
      quietAllLoops();

      // 彻底散尽余灰 + 右下角黄铜铭牌嵌入落锁
      CV.dust.x.fillStyle = '#000000';
      CV.dust.x.fillRect(0, 0, 720, 500);
      CV.dirtyDust = true;
      playWoodenLatchAndWarmPad();
      schedule(0.5, () => showLine('窗做好了。太阳正往西落。', 3.2));
    },
    update(lt, dt) {
      if (!STATE.doneFlag) {
        STATE.dustAmt = lerp(STATE.dustAmt, 1.0, Math.min(1, dt * 2.2));
      } else {
        STATE.dustAmt = Math.max(0, STATE.dustAmt - dt * 1.4);
        CAM.latch = Math.min(1, CAM.latch + dt * 2.4);
        if (STATE.t - STATE.doneAt > 3.8 / SPEED) gotoAct(6);
        return;
      }

      if (AU.ctx && AU.wipeLoop) {
        const active = STATE.t - STATE.lastUserAt < 0.18 && PTR.speed > 25;
        AU.wipeLoop.g.gain.setTargetAtTime(active ? clamp(PTR.speed * 0.00015, 0.02, 0.13) : 0, AU.ctx.currentTime, 0.06);
        AU.wipeLoop.pan.pan.value = clamp((PTR.uv[0] - 0.5) * 1.4, -0.8, 0.8);
      }

      const totalGrid = DUST_GRID_W * DUST_GRID_H;
      const ratioCleared = dustClearedCells / totalGrid;

      // 停留超 6 秒 -> 穿堂暖风吹散浮灰
      const idle = STATE.t - STATE.lastUserAt;
      if ((lt > 5.8 / SPEED && idle > 4.6 / SPEED) || lt > 19 / SPEED) {
        STATE.ghostActive = true;
        this.sweepAngle += dt * 2.8 * SPEED;
        const gu = 0.5 + Math.cos(this.sweepAngle) * (0.36 - lt * 0.006);
        const gv = 0.5 + Math.sin(this.sweepAngle * 1.35) * 0.34;
        STATE.ghostUV = [clamp(gu, 0.06, 0.94), clamp(gv, 0.06, 0.94)];
        wipeDustAt(STATE.ghostUV[0], STATE.ghostUV[1], false, 0.145);
      } else {
        STATE.ghostActive = false;
      }

      if (ratioCleared >= 0.75 || lt > 25 / SPEED) {
        this.finish();
      }
    }
  },

  // 6: 终章 · 透光（3D 立窗迎向斜阳 + 实时木地板彩色焦散 + 山形黄铜风铃现场合奏）
  {
    name: '透光',
    enter() {
      STATE.ghostActive = false;
      STATE.dustAmt = 0;
      CAM.latch = 1;
      hideHint();
      quietAllLoops();
      $('#line').classList.add('dusk');
      $('#hint').classList.add('dusk');
      $('#mute').classList.add('dusk');

      if (AU.ctx && AU.breezeLoop) {
        AU.breezeLoop.g.gain.setTargetAtTime(0.038, AU.ctx.currentTime, 2.0);
      }

      // 计算观众五幕真实手动参与占比 ratio
      const r1 = MTN.userCount / NX;
      const r2 = CELLS.length ? CELLS.filter((c) => c.byUser).length / CELLS.length : 0;
      const r3 = Math.min(1, frostUserCount / Math.max(1, Math.min(frostCount, 8)));
      const r4 = (Math.min(1, swallowUserCount / 2) + chimesUserCount / N_CHIMES) * 0.5;
      const r5 = Math.min(1, dustUserCells / (DUST_GRID_W * DUST_GRID_H * 0.65));
      const ratio = (r1 + r2 + r3 + r4 + r5) / 5;

      const endingLine = ratio >= 0.75
        ? '这扇窗的每一寸光，都出自主人的手。'
        : ratio >= 0.25
        ? '一半出自你手，一半交给了午后的风。'
        : '你安静看着，光自己走完了整扇窗。';

      schedule(2.6, () => showLine('光是借来的，影是留下的。', 4.0));
      schedule(8.4, () => showLine('风过窗台，替你的山响了一声。', 4.2));
      schedule(14.8, () => showLine(endingLine, 9999));
      schedule(17.5, () => $('#coda-links').classList.add('on'));

      STATE.chimeSeqIdx = 0;
      STATE.nextChimeAt = STATE.t + 2.8 / SPEED;
      STATE.nextPianoAt = STATE.t + 1.8 / SPEED;
    },
    update(lt, dt) {
      // 约 3.2 秒平滑完成 3D 立窗翻转与木屋斜阳推远
      const fp = clamp(lt / (3.2 / SPEED), 0, 1);
      CAM.flip = fp;
      CAM.roomDim = easeInOut(fp);

      // 立窗目标机位：上半画幅为迎光花窗与摇曳铜铃，下半画幅完整展现木地板彩色焦散长卷！
      const endPos = [0.15, 1.66, 4.12];
      const endTgt = [0.0, 0.55, 0.74];
      const s = easeInOut(fp);
      CAM.pos = [
        lerp(0, endPos[0], s) + (fp >= 1 ? Math.sin(lt * 0.22) * 0.045 : 0),
        lerp(1.56, endPos[1], s) + (fp >= 1 ? Math.sin(lt * 0.17) * 0.02 : 0),
        lerp(0.15, endPos[2], s)
      ];
      CAM.target = [
        lerp(0, endTgt[0], s),
        lerp(0.02, endTgt[1], s),
        lerp(0.0, endTgt[2], s)
      ];
      CAM.tanH = lerp(0.42, 0.43, s);

      // 终章交互不关停：移动指针实时改变夕阳入射方位角与高度，让满地彩色光斑随手流淌！
      const targetAz = PTR.inside ? lerp(-0.34, 0.34, PTR.x / Math.max(1, VW)) : -0.16 + Math.sin(lt * 0.25) * 0.14;
      const targetEl = PTR.inside ? lerp(0.58, 0.74, 1 - PTR.y / Math.max(1, VH)) : 0.65 + Math.sin(lt * 0.19) * 0.03;
      CAM.sunAz = lerp(CAM.sunAz, targetAz, Math.min(1, dt * 2.6));
      CAM.sunEl = lerp(CAM.sunEl, targetEl, Math.min(1, dt * 2.6));

      // 晚风穿窗自动按观众第一幕山形曲线依次敲响黄铜风铃主旋律
      if (fp > 0.75 && STATE.t >= STATE.nextChimeAt && CHIMES.length) {
        // 沿山脊从左向右再缓缓回荡，形成独属于这座山形的旋律线
        const wavePos = STATE.chimeSeqIdx % (N_CHIMES * 2 - 2);
        const k = wavePos < N_CHIMES ? wavePos : (N_CHIMES * 2 - 2 - wavePos);
        STATE.chimeSeqIdx++;
        const ch = CHIMES[k];
        strikeChime(ch, rand(1.1, 2.0) * (k % 2 ? 1 : -1), 0.14);
        STATE.nextChimeAt = STATE.t + rand(0.68, 1.35);
      }

      // 温暖毛毡钢琴分解和弦在底层轻柔托底
      if (fp > 0.5 && STATE.t >= STATE.nextPianoAt) {
        const progressions = [
          [50, 57, 62, 66], // Dmaj
          [47, 54, 59, 62], // Bm7
          [43, 50, 57, 62], // Gmaj9
          [45, 52, 57, 64]  // Asus4
        ];
        const chord = progressions[((lt / 5.5) | 0) % progressions.length];
        chord.forEach((m, idx) => {
          playFeltNote(m, 4.4, 0.065, (idx - 1.5) * 0.25, AU.ctx ? AU.ctx.currentTime + idx * 0.32 : 0);
        });
        STATE.nextPianoAt = STATE.t + 5.4;
      }
    }
  }
];

function gotoAct(k) {
  STATE.act = k;
  STATE.lt = 0;
  STATE.doneFlag = false;
  hideHint();
  quietAllLoops();
  if (ACTS[k] && ACTS[k].enter) ACTS[k].enter();
}

/* ============================================================================
 * 10. 交互事件绑定与 2D 精细物理前景层（风铃单摆、焊花、浮尘、匠人微光标）
 * ============================================================================ */
function startExperience(u, v) {
  if (STATE.started) return;
  STATE.started = true;
  initAudio();
  $('#intro').classList.add('gone');
  // 启幕轻触一声温润玻璃泛音
  playCrystalResonance(true, u, 0.16);
  const sp = worldToScreen(uvToWorld(u, v, 0.005));
  if (sp) {
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * TAU;
      SPARKS.push({
        x: sp[0], y: sp[1],
        vx: Math.cos(a) * rand(18, 52), vy: Math.sin(a) * rand(18, 52),
        life: 0, max: rand(0.55, 0.95),
        col: 'rgba(248,226,178,', r: rand(1.4, 2.8)
      });
    }
  }
  gotoAct(1);
}

function handleUserUV(u, v, isDownEvent) {
  STATE.lastUserAt = STATE.t;
  STATE.ghostActive = false;
  if ($('#hint').classList.contains('on')) $('#hint').classList.remove('on');

  if (STATE.act === 1 && PTR.down) {
    ACTS[1].onStroke(u, v, true);
  } else if (STATE.act === 2 && (PTR.down || PTR.speed > 35 || isDownEvent)) {
    ACTS[2].glazeAt(u, v, true);
  } else if (STATE.act === 3 && (PTR.down || PTR.speed > 40 || isDownEvent)) {
    if (isDownEvent) lastFrostUV = null;
    etchFrostAt(u, v, true);
  } else if (STATE.act === 4) {
    if (isDownEvent || PTR.down || v < 0.28) {
      ACTS[4].interactAt(u, v, true);
    }
  } else if (STATE.act === 5 && (PTR.down || PTR.speed > 30 || isDownEvent)) {
    wipeDustAt(u, v, true, 0.11);
  } else if (STATE.act === 6) {
    // 终章滑过窗下铜管可随时亲手拨响黄铜风铃！
    for (const ch of CHIMES) {
      if (!ch.hung) continue;
      const topP = worldToScreen(localWinToWorld(ch.lx, 0.01, 0.02));
      const botP = worldToScreen([
        localWinToWorld(ch.lx, 0.01, 0.02)[0] + Math.sin(ch.theta) * ch.len,
        localWinToWorld(ch.lx, 0.01, 0.02)[1] - Math.cos(ch.theta) * ch.len,
        localWinToWorld(ch.lx, 0.01, 0.02)[2]
      ]);
      if (topP && botP) {
        const mx = (topP[0] + botP[0]) * 0.5, my = (topP[1] + botP[1]) * 0.5;
        if (Math.hypot(PTR.x - mx, (PTR.y - my) * 0.55) < 26) {
          strikeChime(ch, clamp(PTR.vx * 0.0045, -3.5, 3.5) || 1.6, 0.18);
        }
      }
    }
  }
}

window.addEventListener('pointermove', (e) => {
  const now = performance.now();
  const dt = Math.max(4, now - (PTR.lastMoveMs || now - 16)) / 1000;
  PTR.vx = lerp(PTR.vx, (e.clientX - PTR.x) / dt, 0.45);
  PTR.vy = lerp(PTR.vy, (e.clientY - PTR.y) / dt, 0.45);
  PTR.speed = Math.hypot(PTR.vx, PTR.vy);
  PTR.x = e.clientX;
  PTR.y = e.clientY;
  PTR.lastMoveMs = now;
  PTR.inside = true;

  const hit = screenToWindowUV(PTR.x, PTR.y);
  if (hit) {
    PTR.uv = [hit.u, hit.v];
    if (STATE.started) handleUserUV(hit.u, hit.v, false);
  }
});

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button')) return;
  initAudio();
  PTR.x = e.clientX;
  PTR.y = e.clientY;
  PTR.down = true;
  PTR.inside = true;
  MTN.prevIdx = -1;

  const hit = screenToWindowUV(PTR.x, PTR.y);
  const u = hit ? clamp(hit.u, 0.05, 0.95) : 0.5;
  const v = hit ? clamp(hit.v, 0.05, 0.95) : 0.5;
  PTR.uv = [u, v];

  if (!STATE.started) {
    startExperience(u, v);
    return;
  }
  if (hit) handleUserUV(hit.u, hit.v, true);
});

const endPointer = () => {
  PTR.down = false;
  MTN.prevIdx = -1;
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', endPointer);
document.addEventListener('pointerleave', () => { PTR.inside = false; });

window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') setMuted(!AU.muted);
});
$('#mute').addEventListener('click', (e) => {
  e.stopPropagation();
  initAudio();
  setMuted(!AU.muted);
});
$('#again-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  location.reload();
});
$('#save-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  exportHighResWindowPNG();
});

// 物理更新并绘制 2D 前景层（山形黄铜风铃单摆、微尘、焊花、幽灵手势、工匠光标）
function updateAndDrawOverlay(dt) {
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.clearRect(0, 0, VW, VH);

  const dusk = CAM.roomDim;

  // 0) 第一幕未焊完时：左侧边缘浮现一枚微热的黄铜起始焊点与极淡横向引导虚线
  if (STATE.act === 1 && !STATE.doneFlag) {
    octx.save();
    octx.strokeStyle = 'rgba(138, 102, 62, 0.24)';
    octx.lineWidth = 1.25;
    octx.setLineDash([5, 7]);
    octx.beginPath();
    for (let i = 0; i < NX; i += 4) {
      const gu = i / (NX - 1);
      const sp = worldToScreen(uvToWorld(gu, MTN.def[i], 0.003));
      if (!sp) continue;
      if (i === 0) octx.moveTo(sp[0], sp[1]);
      else octx.lineTo(sp[0], sp[1]);
    }
    octx.stroke();
    octx.setLineDash([]);

    if (!MTN.set[0]) {
      const startP = worldToScreen(uvToWorld(0.015, MTN.def[0], 0.004));
      if (startP) {
        const pulse = 0.65 + 0.35 * Math.sin(STATE.t * 3.2);
        const rg = octx.createRadialGradient(startP[0], startP[1], 0, startP[0], startP[1], 18);
        rg.addColorStop(0, `rgba(232, 155, 72, ${0.75 * pulse})`);
        rg.addColorStop(0.5, `rgba(204, 126, 48, ${0.28 * pulse})`);
        rg.addColorStop(1, 'rgba(204, 126, 48, 0)');
        octx.fillStyle = rg;
        octx.beginPath(); octx.arc(startP[0], startP[1], 18, 0, TAU); octx.fill();
        octx.fillStyle = '#e89b48';
        octx.beginPath(); octx.arc(startP[0], startP[1], 4.2, 0, TAU); octx.fill();
      }
    }
    octx.restore();
  }

  // 1) 更新并绘制窗框下沿悬挂的 9 根锤纹黄铜风铃管
  if (STATE.act >= 4 && CHIMES.length) {
    // 窗下小铜钩
    for (const ch of CHIMES) {
      const hookW = localWinToWorld(ch.lx, WIN.frBot * 0.24, 0.014);
      const hp = worldToScreen(hookW);
      if (!hp) continue;
      octx.fillStyle = '#b99156';
      octx.beginPath();
      octx.arc(hp[0], hp[1], 2.4, 0, TAU);
      octx.fill();

      if (!ch.hung) continue;
      ch.dropAnim = Math.min(1, ch.dropAnim + dt * 2.8);
      ch.glow = Math.max(0, ch.glow - dt * 1.4);

      // 物理阻尼钟摆运动 + 晚风轻拂驱动力
      const windTorque = (STATE.act === 6 ? 0.55 : 0.14) * Math.sin(STATE.t * 1.35 + ch.idx * 0.72);
      const grav = 16.0 / Math.max(0.10, ch.len * 3.2);
      const alpha = -grav * Math.sin(ch.theta) - 1.45 * ch.omega + windTorque;
      ch.omega += alpha * dt;
      ch.theta = clamp(ch.theta + ch.omega * dt, -0.45, 0.45);

      const B = winFrameBasis(CAM.flip);
      // 平放时朝屏幕下方 (-Z的反方向即 +Z) 垂挂；立起时沿世界重力 -Y 自由垂挂摆动！
      const hangDown = vNorm([
        Math.sin(ch.theta),
        lerp(-0.15, -Math.cos(ch.theta), B.s),
        lerp(Math.cos(ch.theta), Math.sin(ch.theta * 0.35) * 0.12, B.s)
      ]);
      const dropScale = easeOutCubic(ch.dropAnim);
      const cordLen = 0.046 * dropScale;
      const tubeLen = ch.len * dropScale;
      const catcherLen = 0.048 * dropScale;

      const pTop = [
        hookW[0] + hangDown[0] * cordLen,
        hookW[1] + hangDown[1] * cordLen,
        hookW[2] + hangDown[2] * cordLen
      ];
      const pBot = [
        pTop[0] + hangDown[0] * tubeLen,
        pTop[1] + hangDown[1] * tubeLen,
        pTop[2] + hangDown[2] * tubeLen
      ];
      const pCatch = [
        pBot[0] + hangDown[0] * catcherLen,
        pBot[1] + hangDown[1] * catcherLen,
        pBot[2] + hangDown[2] * catcherLen
      ];

      const sTop = worldToScreen(pTop);
      const sBot = worldToScreen(pBot);
      const sCat = worldToScreen(pCatch);
      if (!sTop || !sBot || !sCat) continue;

      // 终章在木地板上同步投下摇曳的铜铃管长影
      if (dusk > 0.35 && pTop[1] > 0.02 && pBot[1] > 0.01) {
        const sunD = getSunDirection();
        const projFloor = (P) => {
          const tF = -P[1] / Math.min(-0.12, -sunD[1]);
          return worldToScreen([P[0] - sunD[0] * tF, 0.002, P[2] - sunD[2] * tF]);
        };
        const fA = projFloor(pTop), fB = projFloor(pBot);
        if (fA && fB) {
          octx.strokeStyle = `rgba(18, 11, 6, ${0.34 * dusk})`;
          octx.lineWidth = 4.2;
          octx.lineCap = 'round';
          octx.beginPath();
          octx.moveTo(fA[0], fA[1]);
          octx.lineTo(fB[0], fB[1]);
          octx.stroke();
        }
      }

      // 亚麻细绳
      octx.strokeStyle = dusk > 0.5 ? 'rgba(218, 198, 166, 0.62)' : 'rgba(110, 88, 62, 0.72)';
      octx.lineWidth = 1.15;
      octx.beginPath();
      octx.moveTo(hp[0], hp[1]);
      octx.lineTo(sCat[0], sCat[1]);
      octx.stroke();

      // 手工锤纹黄铜风铃圆管（三层金属高光立体渐变 + 敲响微暖亮泽）
      const tubeW = clamp(9.5 / sTop[2], 4.2, 8.2);
      const dx = sBot[0] - sTop[0], dy = sBot[1] - sTop[1];
      const lenPx = Math.hypot(dx, dy) || 1;
      const nx = -dy / lenPx, ny = dx / lenPx;

      const grad = octx.createLinearGradient(
        sTop[0] - nx * tubeW * 0.6, sTop[1] - ny * tubeW * 0.6,
        sTop[0] + nx * tubeW * 0.6, sTop[1] + ny * tubeW * 0.6
      );
      grad.addColorStop(0.0, '#2a1d12');
      grad.addColorStop(0.36, ch.glow > 0.05 ? '#f5cf86' : '#cfa86e');
      grad.addColorStop(0.68, '#7d5d38');
      grad.addColorStop(1.0, '#24180f');

      octx.strokeStyle = grad;
      octx.lineWidth = tubeW;
      octx.lineCap = 'butt';
      octx.beginPath();
      octx.moveTo(sTop[0], sTop[1]);
      octx.lineTo(sBot[0], sBot[1]);
      octx.stroke();

      // 管底水滴形彩玻风舌
      octx.save();
      octx.translate(sCat[0], sCat[1]);
      octx.rotate(Math.atan2(dy, dx) - Math.PI * 0.5);
      octx.fillStyle = ch.catcherCol;
      octx.strokeStyle = '#3d2b1c';
      octx.lineWidth = 1.1;
      octx.beginPath();
      octx.moveTo(0, -5.5);
      octx.quadraticCurveTo(4.6, 2.2, 0, 6.5);
      octx.quadraticCurveTo(-4.6, 2.2, 0, -5.5);
      octx.fill();
      octx.stroke();
      octx.restore();
    }
  }

  // 2) 阳光空气微尘粒子 (Dust Motes)
  for (const m of MOTES) {
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    if (m.x > 1.1) m.x = -1.1;
    if (m.x < -1.1) m.x = 1.1;
    if (m.y > 1.45) m.y = 0.06;
    if (m.y < 0.05) m.y = 1.42;
    const sp = worldToScreen([m.x, lerp(0.18 + m.y * 0.35, m.y, dusk), lerp(m.z * 0.25, m.z, dusk)]);
    if (!sp) continue;
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(STATE.t * 1.4 + m.ph));
    octx.fillStyle = `rgba(255, 236, 194, ${tw * lerp(0.28, 0.46, dusk)})`;
    octx.beginPath();
    octx.arc(sp[0], sp[1], m.sz, 0, TAU);
    octx.fill();
  }

  // 3) 瞬态焊花与冰晶微粒
  for (let i = SPARKS.length - 1; i >= 0; i--) {
    const s = SPARKS[i];
    s.life += dt;
    if (s.life >= s.max) {
      SPARKS.splice(i, 1);
      continue;
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 45 * dt;
    const al = (1 - s.life / s.max) * 0.85;
    octx.fillStyle = s.col + al.toFixed(3) + ')';
    octx.beginPath();
    octx.arc(s.x, s.y, s.r, 0, TAU);
    octx.fill();
  }

  // 4) 迟疑提示自动浮现检查
  if (STATE.hintText && !STATE.hintShown && !STATE.doneFlag && STATE.t - STATE.lastUserAt > 3.0 / SPEED) {
    STATE.hintShown = true;
    const hEl = $('#hint');
    hEl.textContent = STATE.hintText;
    hEl.classList.add('on');
  }

  // 5) 幽灵代笔微光痕迹（仅在观众停手由日影代劳时轻柔浮现）
  if (STATE.ghostActive) {
    const gp = worldToScreen(uvToWorld(STATE.ghostUV[0], STATE.ghostUV[1], 0.006));
    if (gp) {
      const g = octx.createRadialGradient(gp[0], gp[1], 0, gp[0], gp[1], 22);
      g.addColorStop(0, 'rgba(255, 224, 156, 0.58)');
      g.addColorStop(0.55, 'rgba(236, 178, 92, 0.18)');
      g.addColorStop(1, 'rgba(236, 178, 92, 0)');
      octx.fillStyle = g;
      octx.beginPath();
      octx.arc(gp[0], gp[1], 22, 0, TAU);
      octx.fill();
    }
  }

  // 6) 极克制的器物触点光标（绝不用圆圈准星靶子）
  if (PTR.inside) {
    const r = PTR.down ? 4.2 : 6.2;
    octx.strokeStyle = dusk > 0.5
      ? 'rgba(248, 228, 192, 0.62)'
      : 'rgba(72, 50, 32, 0.52)';
    octx.lineWidth = 1.2;
    octx.beginPath();
    octx.arc(PTR.x, PTR.y, r, 0, TAU);
    octx.stroke();
    if (PTR.down) {
      octx.fillStyle = STATE.act === 1 ? 'rgba(232, 155, 72, 0.75)' : 'rgba(255, 244, 218, 0.65)';
      octx.beginPath();
      octx.arc(PTR.x, PTR.y, 2.2, 0, TAU);
      octx.fill();
    }
  }
}

/* ============================================================================
 * 11. 高清纪念画幅导出（留存此窗：立窗 + 满地彩色焦散 + 风铃 + 右下角铜牌日期）
 * ============================================================================ */
function exportHighResWindowPNG() {
  try {
    const outW = 2400, outH = 1440;
    const exp = document.createElement('canvas');
    exp.width = outW;
    exp.height = outH;
    const ectx = exp.getContext('2d');

    // 先以高分辨率渲染当前 3D 立窗与木地板焦散主画面
    const oldW = glCanvas.width, oldH = glCanvas.height;
    glCanvas.width = outW;
    glCanvas.height = outH;
    renderGLScene(outW / outH);
    ectx.drawImage(glCanvas, 0, 0, outW, outH);
    glCanvas.width = oldW;
    glCanvas.height = oldH;
    renderGLScene(VW / Math.max(1, VH));

    // 叠加高清风铃层
    const oldVW = VW, oldVH = VH, oldDPR = DPR;
    VW = outW; VH = outH; DPR = 1;
    ovCanvas.width = outW; ovCanvas.height = outH;
    const savedInside = PTR.inside;
    PTR.inside = false;
    updateAndDrawOverlay(0);
    PTR.inside = savedInside;
    ectx.drawImage(ovCanvas, 0, 0, outW, outH);
    VW = oldVW; VH = oldVH; DPR = oldDPR;
    handleResize();

    // 右下角压印极克制的手作黄铜铭牌款识与日期
    const now = new Date();
    const ds = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
    ectx.save();
    ectx.font = '28px "Noto Serif SC", "Songti SC", Georgia, serif';
    ectx.fillStyle = 'rgba(238, 214, 176, 0.78)';
    ectx.textAlign = 'right';
    ectx.fillText(`透 光  ·  LIGHT THROUGH  ·  ${ds}`, outW - 68, outH - 54);
    ectx.restore();

    exp.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `透光-${ds}.png`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 2000);
    }, 'image/png');
  } catch (err) {
    console.warn('Export failed:', err);
  }
}

/* ============================================================================
 * 12. WebGL2 主绘制循环与自适应尺寸（支持 ?act= 快速跳幕联调验证）
 * ============================================================================ */
function getSunDirection() {
  if (CAM.roomDim < 0.02) {
    return vNorm([-0.26, 0.91, 0.31]);
  }
  const duskDir = vNorm([
    Math.sin(CAM.sunAz) * Math.cos(CAM.sunEl),
    Math.sin(CAM.sunEl),
    -Math.cos(CAM.sunAz) * Math.cos(CAM.sunEl)
  ]);
  const dayDir = vNorm([-0.26, 0.91, 0.31]);
  return vNorm([
    lerp(dayDir[0], duskDir[0], CAM.roomDim),
    lerp(dayDir[1], duskDir[1], CAM.roomDim),
    lerp(dayDir[2], duskDir[2], CAM.roomDim)
  ]);
}

function renderGLScene(aspect) {
  syncTextures();
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.useProgram(PROG.p);

  const CB = getCamBasis();
  const WB = winFrameBasis(CAM.flip);
  const sunDir = getSunDirection();
  const u = PROG.u;

  gl.uniform3fv(u.uCamPos, CAM.pos);
  gl.uniform3fv(u.uCamF, CB.f);
  gl.uniform3fv(u.uCamR, CB.r);
  gl.uniform3fv(u.uCamU, CB.u);
  gl.uniform1f(u.uTanH, CAM.tanH);
  gl.uniform1f(u.uAspect, aspect);
  gl.uniform1f(u.uTime, STATE.t);

  gl.uniform3fv(u.uWinPivot, WB.pivot);
  gl.uniform3fv(u.uWinRight, WB.right);
  gl.uniform3fv(u.uWinUp, WB.up);
  gl.uniform3fv(u.uWinNorm, WB.norm);
  gl.uniform4f(u.uWinDim, WIN.inW, WIN.inH, WIN.outW, WIN.outH);
  gl.uniform2f(u.uFrOff, WIN.frSide, WIN.frBot);
  gl.uniform1f(u.uFlip, CAM.flip);
  gl.uniform1f(u.uRoomDim, CAM.roomDim);
  gl.uniform3fv(u.uSunDir, sunDir);
  gl.uniform1f(u.uDustAmt, STATE.dustAmt);
  gl.uniform1f(u.uLatch, CAM.latch);
  gl.uniform2f(u.uPtrUV, PTR.uv[0], PTR.uv[1]);

  const bind = (unit, tex) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    return unit;
  };
  gl.uniform1i(u.uPaneTex,  bind(0, paneTex));
  gl.uniform1i(u.uMetalTex, bind(1, metalTex));
  gl.uniform1i(u.uFrostTex, bind(2, frostTex));
  gl.uniform1i(u.uDustTex,  bind(3, dustTex));
  gl.uniform1i(u.uGrainTex, bind(4, grainTex));

  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function handleResize() {
  VW = window.innerWidth || 1280;
  VH = window.innerHeight || 720;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const glScale = Math.min(DPR, 1.5);
  glCanvas.width = Math.max(2, Math.round(VW * glScale));
  glCanvas.height = Math.max(2, Math.round(VH * glScale));
  ovCanvas.width = Math.max(2, Math.round(VW * DPR));
  ovCanvas.height = Math.max(2, Math.round(VH * DPR));
}
window.addEventListener('resize', handleResize);
handleResize();

// 调试/验收跳幕支持 (?act=1..6 自动完成前置物理造物层)
if (START_ACT >= 1 && START_ACT <= 6) {
  STATE.started = true;
  $('#intro').style.display = 'none';
  if (START_ACT >= 2) {
    for (let i = 0; i < NX; i++) { MTN.set[i] = 1; MTN.byUser[i] = 1; MTN.userCount++; }
    buildTiffanyGrid();
    MTN.gridAnim = 1;
    redrawMetalLayer();
  }
  if (START_ACT >= 3) {
    for (const c of CELLS) { c.glaze = 1; c.targetGlaze = 1; c.byUser = true; renderCellGlaze(c); }
  }
  if (START_ACT >= 4) {
    for (let k = 0; k < 14; k++) {
      const u = 0.08 + (k / 13) * 0.84;
      lastFrostUV = null;
      etchFrostAt(u, k % 3 === 0 ? 0.14 : sampleRidge(u) - 0.05, true);
    }
  }
  if (START_ACT >= 5) {
    initChimesFromMountain();
    for (let k = 0; k < 4; k++) addGlassSwallow(0.20 + k * 0.19, 0.78 + (k % 2) * 0.06, 0.12, true);
    for (let k = 0; k < N_CHIMES; k++) hangChime(k, true);
  }
  gotoAct(START_ACT);
}

let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
  lastNow = now;
  const dt = rawDt * SPEED;

  STATE.t += dt;
  STATE.lt += dt;
  PTR.speed *= Math.pow(0.08, rawDt);

  // 触发排期定时回调
  for (let i = STATE.timers.length - 1; i >= 0; i--) {
    if (STATE.t >= STATE.timers[i][0]) {
      const fn = STATE.timers[i][1];
      STATE.timers.splice(i, 1);
      fn();
    }
  }

  // 前五幕相机平滑跟随各幕局部推拉；终章由 ACTS[6].update 驱动 3D 立窗轨迹
  if (STATE.act < 6) {
    const kLerp = Math.min(1, rawDt * 2.4);
    for (let j = 0; j < 3; j++) {
      CAM.pos[j] = lerp(CAM.pos[j], CAM.zoomPos[j], kLerp);
      CAM.target[j] = lerp(CAM.target[j], CAM.zoomTarget[j], kLerp);
    }
  }

  if (ACTS[STATE.act] && ACTS[STATE.act].update) {
    ACTS[STATE.act].update(STATE.lt, dt);
  }

  renderGLScene(VW / Math.max(1, VH));
  updateAndDrawOverlay(rawDt);
}
requestAnimationFrame(frame);

})();
</script>
