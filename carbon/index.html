    lfo.frequency.value = 4.6;
    const lfoG = this.ctx.createGain();
    lfoG.gain.value = freq * 0.0065;
    lfo.connect(lfoG);

    const o1 = this.ctx.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(freq * 0.988, now);
    o1.frequency.exponentialRampToValueAtTime(freq, now + 0.28);
    lfoG.connect(o1.frequency);

    const o3 = this.ctx.createOscillator();
    o3.type = 'sine';
    o3.frequency.value = freq * 3.0;
    const g3 = this.ctx.createGain();
    g3.gain.value = 0.075;

    // 箫口气鸣窄带噪声
    const ns = this.ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    ns.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq * 1.02;
    bp.Q.value = 11.0;
    const ng = this.ctx.createGain();
    ng.gain.value = 0.22;

    o1.connect(g);
    o3.connect(g3); g3.connect(g);
    ns.connect(bp); bp.connect(ng); ng.connect(g);
    this.connectOut(g, pan);

    lfo.start(now); o1.start(now); o3.start(now); ns.start(now);
    lfo.stop(now + dur + 0.05); o1.stop(now + dur + 0.05); o3.stop(now + dur + 0.05); ns.stop(now + dur + 0.05);
  },

  // 4. 古筝清脆拨弦与五声刮奏
  playGuzheng(uNorm, bright = 0.6, high = false) {
    if (!this.canPlay()) return;
    const idx = Math.floor(clamp(uNorm, 0, 0.999) * 5) + (high ? 6 : 3);
    const freq = PENTATONIC_D[clamp(idx, 0, PENTATONIC_D.length - 1)];
    const now = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);

    const o1 = this.ctx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq * 1.006, now);
    o1.frequency.exponentialRampToValueAtTime(freq, now + 0.035);

    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2800 * (0.6 + bright), now);
    lp.frequency.exponentialRampToValueAtTime(520, now + 1.4);

    // 拨甲瞬间微声
    const ns = this.ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'bandpass';
    hp.frequency.value = 3200;
    hp.Q.value = 2.4;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(0.06, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

    o1.connect(lp); lp.connect(g);
    ns.connect(hp); hp.connect(ng); ng.connect(g);
    this.connectOut(g, (uNorm - 0.5) * 1.2);
    o1.start(now); ns.start(now);
    o1.stop(now + 2.2); ns.stop(now + 0.04);
  },

  playGuzhengGliss(uNorm) {
    if (!this.canPlay()) return;
    const base = 5 + Math.floor(clamp(uNorm, 0, 0.99) * 4);
    for (let k = 0; k < 4; k++) {
      const f = PENTATONIC_D[clamp(base + k, 0, PENTATONIC_D.length - 1)];
      setTimeout(() => this.playGuqinHarmonic(f, 0.085, (uNorm - 0.5) * 1.1, 1.8), k * 58);
    }
  },

  // 5. 狼毫擦绢 / 水晕 / 金刀镂绢
  playBrushSilk(speed, mode = 'gold', uNorm = 0.5) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    if (now - this.lastBrushSnd < 0.085) return;
    this.lastBrushSnd = now;

    const ns = this.ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = mode === 'water' ? 980 : (mode === 'carve' ? 3900 : 2100 + clamp(speed * 600, 0, 1400));
    bp.Q.value = mode === 'carve' ? 5.5 : 2.8;

    const g = this.ctx.createGain();
    const peak = clamp(0.022 + speed * 0.032, 0.015, 0.062);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

    ns.connect(bp); bp.connect(g);
    this.connectOut(g, (uNorm - 0.5) * 1.1);
    ns.start(now, Math.random() * 1.5, 0.16);
  },

  // 6. 鹤鸣五度笙箫 & 乌篷木桨竹梆
  playCraneCall(uNorm) {
    if (!this.canPlay()) return;
    const pan = (uNorm - 0.5) * 1.2;
    this.playGuqinHarmonic(587.33, 0.12, pan, 2.6); // D5
    setTimeout(() => this.playGuqinHarmonic(880.0, 0.095, pan * 0.8, 2.9), 110); // A5
    this.playBrushSilk(0.9, 'carve', uNorm);
  },

  playPaddle(uNorm) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const pan = (uNorm - 0.5) * 1.2;
    // 竹梆轻响
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(420, now);
    o.frequency.exponentialRampToValueAtTime(240, now + 0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.11, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    o.connect(g); this.connectOut(g, pan);
    o.start(now); o.stop(now + 0.18);
    // 柔和水波
    this.playBrushSilk(0.7, 'water', uNorm);
    setTimeout(() => this.playGuqinHarmonic(293.66, 0.09, pan, 2.2), 140);
  },

  // 7. 第五幕：火折子燃灯 + 印石落绢 + 铜磬五度共鸣 (D2 + A2)
  playIgnite() {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const ns = this.ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(420, now);
    lp.frequency.exponentialRampToValueAtTime(1650, now + 0.09);
    lp.frequency.exponentialRampToValueAtTime(280, now + 0.55);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.24, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.62);
    ns.connect(lp); lp.connect(g); this.connectOut(g, 0);
    ns.start(now, 0, 0.65);

    // 细微烛芯爆花
    setTimeout(() => {
      if (!this.canPlay()) return;
      const t2 = this.ctx.currentTime;
      const s2 = this.ctx.createBufferSource();
      s2.buffer = this.noiseBuf;
      const hp = this.ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 3600;
      const g2 = this.ctx.createGain();
      g2.gain.setValueAtTime(0.08, t2);
      g2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.03);
      s2.connect(hp); hp.connect(g2); this.connectOut(g2, 0.08);
      s2.start(t2, 0.4, 0.04);
    }, 240);
  },

  playSealAndQing() {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    // 印石沉稳闷响
    const thud = this.ctx.createOscillator();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(118, now);
    thud.frequency.exponentialRampToValueAtTime(48, now + 0.14);
    const tg = this.ctx.createGain();
    tg.gain.setValueAtTime(0.001, now);
    tg.gain.linearRampToValueAtTime(0.26, now + 0.012);
    tg.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
    thud.connect(tg); this.connectOut(tg, 0.35);
    thud.start(now); thud.stop(now + 0.26);

    // 铜磬五度共鸣 (D2 = 73.42Hz + A2 = 110Hz + 钟磬泛音)
    const freqs = [
      [73.42, 0.19, 6.2],
      [110.00, 0.15, 5.8],
      [202.3, 0.065, 4.4],
      [293.66, 0.055, 4.8],
      [440.00, 0.035, 3.8]
    ];
    for (const [f, v, d] of freqs) {
      const o = this.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, now + 0.05);
      g.gain.linearRampToValueAtTime(v, now + 0.14);
      g.gain.exponentialRampToValueAtTime(0.0001, now + d);
      o.connect(g); this.connectOut(g, 0);
      o.start(now + 0.05); o.stop(now + d + 0.1);
    }
  },

  // 8. 终章灯下白玉环佩与流苏宫铃轻响
  playJadeBell(intensity = 0.5, pan = 0) {
    if (!this.canPlay()) return;
    const now = this.ctx.currentTime;
    const base = [1174.66, 1318.51, 1479.98, 1760.0][Math.floor(rnd() * 4)];
    const ratios = [1.0, 2.31, 3.84];
    const gains = [0.065, 0.032, 0.015];
    const vScale = clamp(intensity, 0.25, 1.15);
    ratios.forEach((r, idx) => {
      const o = this.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = base * r;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(gains[idx] * vScale, now + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 1.55 / (idx + 1));
      o.connect(g); this.connectOut(g, pan);
      o.start(now); o.stop(now + 1.65);
    });
  }
};

/* ============================================================================
 * 4. WebGL2 双通道引擎：
 *    Pass 1 (P_ROOM): 紫檀木案 + 三折斋屏 + 实时走马宫灯光学投射 + IGN 丁达尔气韵
 *    Pass 2 (P_MESH): 3D 变形熟绢画心/宫灯 + 紫檀镇尺 + 雕花灯冠/八柱/镂空高几 + 白玉环佩宫铃 + 烛火
 * ============================================================================ */
const glCanvas = $('#gl');
const ovCanvas = $('#ov');
const ovCtx = ovCanvas.getContext('2d');

const gl = glCanvas.getContext('webgl2', {
  antialias: true,
  alpha: false,
  depth: true,
  stencil: false,
  premultipliedAlpha: false,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});

const HAS_GL = !!gl;
let GL_RES = null;

function initWebGL() {
  if (!gl) return null;

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      console.error('GLSL compile error:', log);
      throw new Error(log);
    }
    return s;
  };

  const makeProg = (vsSrc, fsSrc) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(p);
      console.error('GLSL link error:', log);
      throw new Error(log);
    }
    const u = {};
    const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(p, i);
      u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
    }
    return { p, u };
  };

  /* ---------- Pass 1: 斋室环境 + 满室山河光学投射 + IGN 体积光 ---------- */
  const VS_ROOM = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vNdc;
void main() {
  vNdc = aPos;
  gl_Position = vec4(aPos, 0.9999, 1.0);
}
`;

  const FS_ROOM = `#version 300 es
precision highp float;
in vec2 vNdc;
out vec4 fragColor;

uniform sampler2D uSilkTex;
uniform sampler2D uOpticsTex;
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTanH, uAspect, uTime;
uniform float uFold, uLanternAngle, uLightAmt, uDuskAmt;
uniform vec3 uCandlePos;
uniform float uFlicker;
uniform float uPaperweightSlide;

const float TAU = 6.28318530718;
const float R_LANTERN = 0.30558;
const float Y_SILK_BOT = 0.36;
const float H_SILK = 0.96;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * vnoise(p);
    p = p * 2.04 + vec2(13.7, 7.3);
    a *= 0.5;
  }
  return v;
}

// Interleaved Gradient Noise (消锯齿、消丁达尔光束条纹)
float ign(vec2 fragCoord) {
  return fract(52.9829189 * fract(dot(fragCoord, vec2(0.06711056, 0.00583715))));
}

// 深紫檀木案纹理 (#140c08 / #24150e / #3b2316 / #633d28)
vec3 rosewoodColor(vec2 xz) {
  vec2 p = vec2(xz.x * 1.9, xz.y * 8.5);
  float warp = fbm(p * vec2(0.6, 0.35)) * 2.6;
  float grain = sin(p.y * 2.4 + warp * 5.2 + fbm(p * 1.4) * 3.2);
  float fine = vnoise(vec2(xz.x * 14.0, xz.y * 92.0));
  float g01 = clamp(grain * 0.5 + 0.5, 0.0, 1.0);
  vec3 cDark = vec3(0.115, 0.062, 0.038);
  vec3 cMid  = vec3(0.215, 0.125, 0.078);
  vec3 cWarm = vec3(0.355, 0.210, 0.132);
  vec3 col = mix(cDark, cMid, smoothstep(0.18, 0.82, g01));
  col = mix(col, cWarm, smoothstep(0.76, 0.98, g01) * 0.45 + fine * 0.08);
  // 细微拼板木缝
  float seam = smoothstep(0.006, 0.0, abs(fract(xz.y * 0.72 + 0.5) - 0.5));
  col *= (1.0 - seam * 0.28);
  return col;
}

// 核心光学引擎：从摇曳烛火发射光线，穿过旋转中的熟绢走马灯投射到桌面或折屏
vec3 projectLanternLight(vec3 P, float yScale, float blurScale, out float cutoutHit) {
  cutoutHit = 0.0;
  vec3 D = P - uCandlePos;
  float rXZ = length(D.xz);
  if (rXZ < R_LANTERN * 0.95) return vec3(0.0);

  float az = atan(D.x, D.z);
  float azLocal = az - uLanternAngle;
  float uCenter = fract(azLocal / TAU + 0.5);
  float yHit = uCandlePos.y + D.y * (R_LANTERN / rXZ) * yScale;
  float vCenter = 1.0 - (yHit - Y_SILK_BOT) / H_SILK;

  // 灯冠与底座遮光边界
  float vMask = smoothstep(-0.04, 0.045, vCenter) * (1.0 - smoothstep(0.955, 1.04, vCenter));
  if (vMask <= 0.001) return vec3(0.0);

  // 八角紫檀灯骨阴影（随旋转扫过全室，柔和半影）
  float ribDist = abs(fract(azLocal * 8.0 / TAU + 0.5) - 0.5);
  float ribSoft = 0.012 + clamp((rXZ - R_LANTERN) * 0.018, 0.0, 0.032);
  float ribMask = smoothstep(0.026, 0.026 + ribSoft, ribDist);
  // 上下雕花灯缘微镂空
  float trimShadow = mix(0.35, 1.0, smoothstep(0.01, 0.055, vCenter) * (1.0 - smoothstep(0.945, 0.99, vCenter)));

  // 5-tap 烛火软半影采样（丝绢柔和扩散，而镂空飞鹤 R 通道用紧致采样保持清晰鹤形剪影！）
  float br = blurScale * clamp((rXZ - R_LANTERN) * 0.011, 0.0016, 0.011);
  float brCut = br * 0.32;
  vec3 silkSum = vec3(0.0);
  vec2 optGBSum = vec2(0.0);
  float piercedSum = 0.0;
  const vec2 OFFS[5] = vec2[5](
    vec2(0.0, 0.0),
    vec2(1.0, 0.5),
    vec2(-1.0, 0.5),
    vec2(0.5, -1.0),
    vec2(-0.5, -1.0)
  );
  const float WTS[5] = float[5](0.40, 0.15, 0.15, 0.15, 0.15);
  for (int i = 0; i < 5; i++) {
    vec2 suv = vec2(fract(uCenter + OFFS[i].x * br), clamp(vCenter + OFFS[i].y * br, 0.002, 0.998));
    vec2 cuv = vec2(fract(uCenter + OFFS[i].x * brCut), clamp(vCenter + OFFS[i].y * brCut, 0.002, 0.998));
    silkSum += texture(uSilkTex, suv).rgb * WTS[i];
    optGBSum += texture(uOpticsTex, suv).gb * WTS[i];
    piercedSum += texture(uOpticsTex, cuv).r * WTS[i];
  }

  float pierced = piercedSum;   // 精准飞鹤双翼与小巧舟灯的镂空透光剪影
  float goldLine = optGBSum.x;  // 泥金山脊线
  float density = optGBSum.y;   // 青绿山峦遮光厚度

  // 提升青绿与朱砂在透光投射下的色彩饱和度，让折屏上浮现温润青绿山影与琥珀天光
  float lum = dot(silkSum, vec3(0.299, 0.587, 0.114));
  vec3 satSilk = clamp(mix(vec3(lum), silkSum, 1.85), 0.0, 1.3);

  // 透射光组成：暖琥珀绢底透光 + 青绿半透玉山剪影 + 泥金山脊微光 + 镂空飞鹤清晰暖金剪影
  vec3 candleWarm = vec3(1.0, 0.72, 0.34);
  float trans = mix(0.88, 0.22, smoothstep(0.08, 0.88, density));
  vec3 mountainTint = mix(vec3(1.0, 0.88, 0.68), satSilk * vec3(1.12, 1.48, 1.42), clamp(density * 1.15 + 0.22, 0.0, 1.0));
  vec3 baseProj = candleWarm * mountainTint * trans;
  // 泥金轮廓在光影中带一缕细金微光
  baseProj += vec3(1.0, 0.83, 0.44) * goldLine * 0.30;
  // 镂空飞鹤与乌篷舟灯：清晰灵动的暖金光影剪影扫过折屏与木案（不过曝成白斑）
  vec3 cutoutGlow = vec3(1.0, 0.84, 0.44) * pierced * 2.15;
  cutoutHit = pierced * ribMask * vMask;

  float dist = length(D);
  float atten = 1.65 / (0.38 + dist * dist * 0.62);
  return (baseProj + cutoutGlow) * vMask * ribMask * trimShadow * atten * uFlicker;
}

// 折屏三面板求交（中屏 z=-1.08，左右翼屏内折 30° 环抱紫檀案）
bool hitFoldingScreen(vec3 ro, vec3 rd, out float tOut, out vec3 pOut, out vec3 nOut, out float panelCoord, out float seamDist) {
  tOut = 1e9;
  bool hit = false;
  panelCoord = 0.0;
  seamDist = 1.0;

  // 1. 中屏: z = -1.08, |x| <= 1.02
  if (rd.z < -1e-4) {
    float t = (-1.08 - ro.z) / rd.z;
    if (t > 0.02 && t < tOut) {
      vec3 p = ro + rd * t;
      if (p.y >= 0.0 && abs(p.x) <= 1.02) {
        tOut = t; pOut = p; nOut = vec3(0.0, 0.0, 1.0);
        panelCoord = p.x;
        seamDist = min(abs(p.x + 1.02), abs(p.x - 1.02));
        hit = true;
      }
    }
  }
  // 2. 左翼屏: 铰链 (-1.02, 0, -1.08), 法线 (sin 30°, 0, cos 30°)
  vec3 nL = vec3(0.5, 0.0, 0.8660254);
  vec3 hingeL = vec3(-1.02, 0.0, -1.08);
  float denomL = dot(rd, nL);
  if (denomL < -1e-4) {
    float t = dot(hingeL - ro, nL) / denomL;
    if (t > 0.02 && t < tOut) {
      vec3 p = ro + rd * t;
      vec3 d = p - hingeL;
      float along = dot(d, vec3(-0.8660254, 0.0, 0.5));
      if (p.y >= 0.0 && along >= 0.0 && along <= 3.6) {
        tOut = t; pOut = p; nOut = nL;
        panelCoord = -1.02 - along;
        seamDist = min(along, abs(along - 1.12));
        hit = true;
      }
    }
  }
  // 3. 右翼屏: 铰链 (+1.02, 0, -1.08), 法线 (-sin 30°, 0, cos 30°)
  vec3 nR = vec3(-0.5, 0.0, 0.8660254);
  vec3 hingeR = vec3(1.02, 0.0, -1.08);
  float denomR = dot(rd, nR);
  if (denomR < -1e-4) {
    float t = dot(hingeR - ro, nR) / denomR;
    if (t > 0.02 && t < tOut) {
      vec3 p = ro + rd * t;
      vec3 d = p - hingeR;
      float along = dot(d, vec3(0.8660254, 0.0, 0.5));
      if (p.y >= 0.0 && along >= 0.0 && along <= 3.6) {
        tOut = t; pOut = p; nOut = nR;
        panelCoord = 1.02 + along;
        seamDist = min(along, abs(along - 1.12));
        hit = true;
      }
    }
  }
  return hit;
}

void main() {
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamF + uCamR * (vNdc.x * uTanH * uAspect) + uCamU * (vNdc.y * uTanH));

  // 背景保底：严守深紫檀暖棕 (#140c08 -> #261710)，绝不用冷蓝黑
  vec3 col = mix(vec3(0.078, 0.047, 0.031), vec3(0.145, 0.088, 0.058), clamp(rd.y * 0.6 + 0.4, 0.0, 1.0));
  float tHit = 12.0;

  // 1) 折屏斋壁求交
  float tScr; vec3 pScr, nScr; float pCoord, seamD;
  bool hasScr = hitFoldingScreen(ro, rd, tScr, pScr, nScr, pCoord, seamD);

  // 2) 紫檀木案平面 (y = 0) 求交
  float tDesk = 1e9;
  bool hasDesk = false;
  if (rd.y < -1e-4) {
    float td = -ro.y / rd.y;
    if (td > 0.02 && (!hasScr || td < tScr)) {
      tDesk = td;
      hasDesk = true;
    }
  }

  float lanternProjWeight = smoothstep(0.32, 0.92, uFold) * uLightAmt;

  if (hasDesk) {
    tHit = tDesk;
    vec3 P = ro + rd * tDesk;
    vec3 wood = rosewoodColor(P.xz);

    // 前五幕俯视案几柔和暖烛斜光（随入夜压暗成温润夜案）
    vec3 deskL = normalize(vec3(0.82, 1.12, 0.52) - P);
    float ndl = max(deskL.y, 0.0);
    float radFall = 1.0 / (1.0 + dot(P.xz, P.xz) * 0.24);
    float flatLight = mix(1.0, 0.34, uDuskAmt) * (1.0 - smoothstep(0.25, 0.95, uFold) * 0.82);
    vec3 amb = vec3(0.13, 0.078, 0.048) * (1.0 - uFold * 0.48);
    col = wood * (amb + vec3(1.18, 0.88, 0.58) * ndl * radFall * flatLight);

    // 平铺熟绢与镇尺在木案上的柔和接触阴影
    float flatShadowAmt = 1.0 - smoothstep(0.08, 0.55, uFold);
    if (flatShadowAmt > 0.01) {
      vec2 q = abs(P.xz) - vec2(0.96, 0.56);
      float boxD = length(max(q, 0.0));
      float scrollAO = 1.0 - 0.52 * exp(-boxD * 18.0) * flatShadowAmt;
      col *= scrollAO;
      // 镇尺投影
      float pwX = 1.015 + uPaperweightSlide;
      vec2 qpL = abs(P.xz - vec2(-pwX, 0.0)) - vec2(0.042, 0.44);
      vec2 qpR = abs(P.xz - vec2(pwX, 0.0)) - vec2(0.042, 0.44);
      float pwD = min(length(max(qpL, 0.0)), length(max(qpR, 0.0)));
      col *= 1.0 - 0.46 * exp(-pwD * 34.0) * flatShadowAmt;
    }

    // 第五幕烛火未卷灯前照亮案几周围
    if (uLightAmt > 0.01 && uFold < 0.7) {
      float preLit = uLightAmt * (1.0 - smoothstep(0.25, 0.72, uFold));
      float dc = length(P - uCandlePos);
      col += wood * vec3(1.25, 0.74, 0.30) * (0.48 / (0.18 + dc * dc)) * preLit * uFlicker;
    }

    // 终章：3D 走马宫灯在紫檀木案上的实时流转山水光影 + 温润清漆倒影！
    if (lanternProjWeight > 0.005) {
      float rDesk = length(P.xz);
      // 底座正下方的柔和环境光晕与四足接触阴影
      float centerGlow = exp(-rDesk * rDesk * 6.5) * 0.42;
      col += wood * vec3(1.0, 0.64, 0.26) * centerGlow * lanternProjWeight * uFlicker;
      // 宫灯投影到木案
      float cutH = 0.0;
      vec3 proj = projectLanternLight(P, 0.92, 0.95, cutH);
      col += mix(wood * 1.45, vec3(0.45, 0.28, 0.16), 0.32) * proj * 1.15 * lanternProjWeight;

      // 紫檀漆面菲涅尔清漆倒影（反射发光宫灯与内烛）
      vec3 refl = reflect(rd, vec3(0.0, 1.0, 0.0));
      float fres = 0.05 + 0.34 * pow(1.0 - max(-rd.y, 0.0), 4.0);
      // 反射射线与灯筒 (radius = R_LANTERN) 求交
      float aR = dot(refl.xz, refl.xz);
      float bR = dot(P.xz, refl.xz);
      float cR = dot(P.xz, P.xz) - R_LANTERN * R_LANTERN;
      float disc = bR * bR - aR * cR;
      if (disc > 0.0 && aR > 1e-4) {
        float tr = (-bR - sqrt(disc)) / aR;
        if (tr > 0.02) {
          vec3 rp = P + refl * tr;
          float rv = 1.0 - (rp.y - Y_SILK_BOT) / H_SILK;
          if (rv >= 0.0 && rv <= 1.0) {
            float raz = atan(rp.x, rp.z) - uLanternAngle;
            vec2 ruv = vec2(fract(raz / TAU + 0.5), rv);
            vec3 rSilk = texture(uSilkTex, ruv).rgb;
            vec3 rOpt = texture(uOpticsTex, ruv).rgb;
            vec3 rGlow = rSilk * vec3(1.15, 0.86, 0.52) * mix(0.85, 0.45, rOpt.b) + vec3(1.0, 0.85, 0.45) * rOpt.r * 1.6;
            float fadeR = exp(-tr * 0.55);
            col += rGlow * fres * fadeR * 0.72 * lanternProjWeight * uFlicker;
          }
        }
      }
      // 底座四足与中心玉佩微投影
      float standFootAO = smoothstep(0.32, 0.42, rDesk) * 0.22 + 0.78;
      col *= mix(1.0, standFootAO, smoothstep(0.45, 0.9, uFold));
    }

    // 远景柔暗暖棕暗角（保持视觉聚于案心）
    float edgeFade = smoothstep(3.8, 0.9, length(P.xz));
    col = mix(vec3(0.075, 0.044, 0.028), col, 0.35 + 0.65 * edgeFade);

  } else if (hasScr) {
    tHit = tScr;
    vec3 P = pScr;
    // 暖古绢素面折屏底色（深暖茶褐，受烛光后温润透亮）
    float weaveX = sin(pCoord * 130.0) * 0.5 + 0.5;
    float weaveY = sin(P.y * 150.0) * 0.5 + 0.5;
    float paperNoise = fbm(vec2(pCoord * 3.8, P.y * 3.8));
    vec3 panelBase = mix(vec3(0.18, 0.112, 0.072), vec3(0.27, 0.175, 0.112), paperNoise * 0.7 + weaveX * weaveY * 0.18);

    // 折屏紫檀木竖棂与下裙木板
    float isStile = smoothstep(0.036, 0.022, seamD);
    float isKick = smoothstep(0.15, 0.125, P.y);
    float isTopRail = smoothstep(1.92, 1.97, P.y);
    float woodMask = max(isStile, max(isKick, isTopRail));
    vec3 frameWood = rosewoodColor(vec2(pCoord, P.y)) * 0.78;
    // 屏框微弱暗金折页饰线
    float goldTrim = smoothstep(0.044, 0.038, seamD) * (1.0 - isStile) * 0.45;
    vec3 surf = mix(panelBase, frameWood, woodMask) + vec3(0.35, 0.23, 0.09) * goldTrim;

    // 斋室静谧基础暖棕环境光（绝不用冷蓝）
    col = surf * vec3(0.44, 0.33, 0.24);

    // 折屏主体高潮：360° 走马宫灯全景山水 + 镂空飞鹤光影投射！
    if (lanternProjWeight > 0.005) {
      float cutH = 0.0;
      vec3 proj = projectLanternLight(P, 1.36, 1.15, cutH);
      // 木框反射比素绢屏面略低，更有立体建筑层次
      float recv = mix(1.26, 0.42, woodMask);
      col += surf * proj * recv * 2.15 * lanternProjWeight;
      // 镂空飞鹤高光直接跃出暖金辉彩
      col += vec3(1.0, 0.84, 0.46) * cutH * (1.0 - woodMask * 0.65) * 0.62 * lanternProjWeight * uFlicker;

      // 烛火漫射暖晕（让整个折屏沉浸在琥珀烛光氛围 #4a2c18 中）
      float dC = length(P - uCandlePos);
      col += surf * vec3(0.72, 0.41, 0.18) * (0.62 / (0.55 + dC * dC)) * lanternProjWeight * uFlicker;
    }
  }

  // 3) 终章 IGN 抖动暖金丁达尔光束（从镂空飞鹤与灯面溢出在斋室空气中）
  if (lanternProjWeight > 0.04) {
    float tMax = min(tHit, 4.2);
    float tMin = 0.45;
    if (tMax > tMin) {
      const int STEPS = 16;
      float dt = (tMax - tMin) / float(STEPS);
      float jit = ign(gl_FragCoord.xy + fract(uTime * 1.37) * 64.0);
      vec3 rayAccum = vec3(0.0);
      for (int i = 0; i < STEPS; i++) {
        float ts = tMin + (float(i) + jit) * dt;
        vec3 Q = ro + rd * ts;
        if (Q.y < 0.02 || Q.y > 1.95) continue;
        float rQ = length(Q.xz);
        if (rQ <= R_LANTERN + 0.025 || rQ > 2.35) continue;
        vec3 D = Q - uCandlePos;
        float azL = atan(D.x, D.z) - uLanternAngle;
        float yH = uCandlePos.y + D.y * (R_LANTERN / rQ) * 1.12;
        float vv = 1.0 - (yH - Y_SILK_BOT) / H_SILK;
        if (vv < 0.0 || vv > 1.0) continue;
        float rib = smoothstep(0.024, 0.052, abs(fract(azL * 8.0 / TAU + 0.5) - 0.5));
        vec2 suv = vec2(fract(azL / TAU + 0.5), vv);
        vec3 opt = texture(uOpticsTex, suv).rgb;
        float openLight = mix(0.28, 0.05, opt.b) + opt.r * 1.45;
        float dist2 = dot(D, D) + 0.25;
        // 柔和前向散射
        float cosTh = dot(rd, normalize(D));
        float phase = 0.45 + 0.55 * pow(max(0.0, 0.5 + 0.5 * cosTh), 2.0);
        rayAccum += vec3(1.0, 0.74, 0.36) * (openLight * rib * phase / dist2) * dt;
      }
      col += rayAccum * 0.165 * lanternProjWeight * uFlicker;
    }
  }

  // 胶片暖色调映射（ACES 近似，保留暖金高光与深紫檀暗部层次）
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  fragColor = vec4(col, 1.0);
}
`;

  /* ---------- Pass 2: 统一 3D 网格着色器（熟绢/宫灯、紫檀木作、白玉宫铃流苏、瓷盏烛火） ---------- */
  const VS_MESH = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNorm;
layout(location=2) in vec2 aUv;
layout(location=3) in vec2 aExtra;

uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTanH, uAspect;
uniform float uRotY;
uniform vec3 uOffset;
uniform vec3 uScale;
uniform vec2 uPendTilt; // (angleX, angleZ) 玉佩宫铃摆动

out vec3 vWorldPos;
out vec3 vNorm;
out vec2 vUv;
out vec2 vExtra;

void main() {
  vec3 p = aPos * uScale;
  vec3 n = aNorm;

  // 若启用摆锤倾斜（白玉环佩与流苏宫铃绕悬挂点 (0, 0.355, 0) 摆动）
  if (abs(uPendTilt.x) > 1e-5 || abs(uPendTilt.y) > 1e-5) {
    float cx = cos(uPendTilt.x), sx = sin(uPendTilt.x);
    float cz = cos(uPendTilt.y), sz = sin(uPendTilt.y);
    // 绕 Z 轴左右摆
    vec3 p1 = vec3(p.x * cz - p.y * sz, p.x * sz + p.y * cz, p.z);
    vec3 n1 = vec3(n.x * cz - n.y * sz, n.x * sz + n.y * cz, n.z);
    // 绕 X 轴前后摆
    p = vec3(p1.x, p1.y * cx - p1.z * sx, p1.y * sx + p1.z * cx);
    n = vec3(n1.x, n1.y * cx - n1.z * sx, n1.y * sx + n1.z * cx);
  }

  // 绕 Y 轴旋转（走马宫灯自转）
  if (abs(uRotY) > 1e-5) {
    float cy = cos(uRotY), sy = sin(uRotY);
    p = vec3(p.x * cy + p.z * sy, p.y, -p.x * sy + p.z * cy);
    n = vec3(n.x * cy + n.z * sy, n.y, -n.x * sy + n.z * cy);
  }

  vec3 wPos = p + uOffset;
  vWorldPos = wPos;
  vNorm = normalize(n);
  vUv = aUv;
  vExtra = aExtra;

  vec3 rel = wPos - uCamPos;
  float rx = dot(rel, uCamR);
  float ry = dot(rel, uCamU);
  float rz = dot(rel, uCamF);

  float nearP = 0.05, farP = 18.0;
  float ndcX = rx / (uTanH * uAspect);
  float ndcY = ry / uTanH;
  float clipZ = (farP + nearP) / (farP - nearP) * rz - (2.0 * farP * nearP) / (farP - nearP);
  gl_Position = vec4(ndcX, ndcY, clipZ, rz);
}
`;

  const FS_MESH = `#version 300 es
precision highp float;
in vec3 vWorldPos;
in vec3 vNorm;
in vec2 vUv;
in vec2 vExtra;

out vec4 fragColor;

uniform sampler2D uSilkTex;
uniform sampler2D uOpticsTex;
uniform vec3 uCamPos;
uniform float uTime, uFold, uLightAmt, uDuskAmt, uFlicker;
uniform vec3 uCandlePos;
uniform int uMatType;   // 0=熟绢/灯面, 1=紫檀木作/镇尺, 2=白玉环佩/宫铃/流苏, 3=白瓷灯盏与蜡烛, 4=摇曳烛火
uniform float uAlpha;

float hash21(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 34.5);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}

vec3 toneMap(vec3 c) {
  c = (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);
  return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
}

void main() {
  vec3 V = normalize(uCamPos - vWorldPos);
  vec3 N = normalize(gl_FrontFacing ? vNorm : -vNorm);
  vec3 col = vec3(0.0);
  float outA = uAlpha;

  if (uMatType == 0) {
    // -------- 熟绢画心 + 上下宋锦绫边 --------
    // vUv.y in [-0.075 .. 1.075]，其中 [0..1] 为画心，两侧为深褐宋锦绫边
    bool isBorder = (vUv.y < 0.0 || vUv.y > 1.0);
    if (isBorder) {
      float brocX = sin(vUv.x * 260.0);
      float brocY = sin(vUv.y * 180.0);
      float diamond = smoothstep(0.35, 0.85, abs(brocX * brocY));
      vec3 broc = mix(vec3(0.22, 0.14, 0.085), vec3(0.36, 0.24, 0.13), diamond * 0.48);
      // 绫边与画心交界细泥金边线
      float edgeDist = min(abs(vUv.y), abs(vUv.y - 1.0));
      float goldPip = smoothstep(0.012, 0.002, edgeDist);
      broc = mix(broc, vec3(0.76, 0.58, 0.25), goldPip * 0.82);

      vec3 L = normalize(vec3(0.9, 1.15, 0.65) - vWorldPos);
      float diff = 0.52 + 0.48 * max(dot(N, L), 0.0);
      vec3 backL = vec3(0.95, 0.58, 0.22) * 0.34 * uFold * uLightAmt * uFlicker;
      col = broc * diff * mix(1.0, 0.45, uDuskAmt) + broc * backL;
      outA = uAlpha;
    } else {
      vec2 suv = vec2(fract(vUv.x), clamp(vUv.y, 0.001, 0.999));
      vec3 texCol = texture(uSilkTex, suv).rgb;
      // sRGB -> 线性近似
      vec3 albedo = pow(texCol, vec3(2.15));
      vec3 opt = texture(uOpticsTex, suv).rgb;
      float pierced = opt.r;
      float goldMask = opt.g;
      float density = opt.b;

      // 熟绢经纬丝缕微观法线扰动 + 云母微闪（严格无奇点切空间构造）
      float wX = sin(vUv.x * 920.0);
      float wY = sin(vUv.y * 540.0);
      vec3 upRef = abs(N.y) < 0.8 ? vec3(0.0, 1.0, 0.0) : vec3(0.0, 0.0, 1.0);
      vec3 T = normalize(cross(N, upRef));
      vec3 B = normalize(cross(N, T));
      vec3 Nsilk = normalize(N + T * (wX * 0.035) + B * (wY * 0.035));

      // 1) 前五幕案头斜烛暖光照明 + 泥金金属微闪
      vec3 Ldesk = normalize(vec3(1.15, 0.96, 0.68) - vWorldPos);
      vec3 Hdesk = normalize(Ldesk + V);
      float ndl = max(dot(Nsilk, Ldesk), 0.0);
      float specSilk = pow(max(dot(Nsilk, Hdesk), 0.0), 28.0) * 0.08;
      // 泥金金属高光（随细微笔触颗粒闪耀）
      float mica = smoothstep(0.62, 0.96, vnoise(vUv * vec2(320.0, 190.0)));
      float specGold = pow(max(dot(Nsilk, Hdesk), 0.0), 42.0) * goldMask * (0.75 + 0.85 * mica);
      float flatRoom = 1.0 - smoothstep(0.25, 0.9, uFold) * 0.85;
      float duskScale = mix(1.0, 0.44, uDuskAmt);
      vec3 flatLit = albedo * (vec3(0.56, 0.51, 0.44) + vec3(0.76, 0.64, 0.48) * ndl) * duskScale * flatRoom;
      flatLit += vec3(1.0, 0.86, 0.52) * (specSilk * (1.0 - density * 0.5) + specGold * 1.15) * flatRoom;

      // 第五幕平铺时，瓷盏烛火在熟绢上漾开的暖橘晕光
      if (uLightAmt > 0.01 && uFold < 0.75) {
        float preF = uLightAmt * (1.0 - smoothstep(0.25, 0.75, uFold));
        float d2 = dot(vWorldPos - uCandlePos, vWorldPos - uCandlePos);
        vec3 warmPool = vec3(1.0, 0.66, 0.28) * (0.42 / (0.08 + d2 * 1.4)) * preF * uFlicker;
        flatLit += albedo * warmPool * 1.25 + vec3(1.0, 0.82, 0.42) * goldMask * warmPool * 0.95;
      }

      // 2) 终章 3D 走马宫灯内部透光（物理半透明熟绢 + 泥金箔高光 + 镂空飞鹤强暖金透亮！）
      vec3 candleVec = uCandlePos - vWorldPos;
      float cDist = length(candleVec);
      vec3 Lc = candleVec / max(cDist, 0.001);
      float cAtten = 1.28 / (0.14 + cDist * cDist * 1.9);

      // 饱和青绿颜料透射着色（避免发白洗色）
      float alLum = dot(albedo, vec3(0.299, 0.587, 0.114));
      vec3 richAlbedo = clamp(mix(vec3(alLum), albedo, 1.38), 0.0, 1.0);
      float sssTrans = mix(1.12, 0.44, density * 0.85);
      vec3 candleCol = vec3(1.0, 0.72, 0.34);

      // 侧缘切向微光，让圆柱宫灯立体温润
      float rim = pow(1.0 - max(dot(N, V), 0.0), 2.2);
      vec3 lanternLit = richAlbedo * candleCol * sssTrans * cAtten * (1.18 - rim * 0.28);
      // 泥金山脊在烛火下绽放金箔光泽
      float goldRim = goldMask * (0.45 + 0.65 * pow(max(dot(Nsilk, normalize(V + vec3(0.2, 0.3, 0.2))), 0.0), 16.0));
      lanternLit += vec3(1.0, 0.84, 0.44) * goldRim * cAtten * 0.72;
      // 镂空飞鹤与乌篷舟灯：温润透亮的金线白鹤透光感（保鹤形与丹砂顶细节，绝不爆白成圆斑）
      lanternLit += vec3(1.0, 0.86, 0.52) * pierced * (0.68 + 0.22 * uFlicker) * cAtten;
      lanternLit *= uFlicker;

      // 背面内壁（透过前层半透熟绢隐约看见的对侧山河）
      if (!gl_FrontFacing) {
        lanternLit *= 0.68;
      }

      float lBlend = smoothstep(0.22, 0.88, uFold) * uLightAmt;
      col = mix(flatLit, lanternLit + flatLit * 0.16, lBlend);
      // 终章前层略具真实熟绢半透感（约 0.86 不透明），隐约透出内烛暖晕
      if (uFold > 0.35 && gl_FrontFacing) {
        outA = mix(uAlpha, mix(0.84, 0.95, density), smoothstep(0.35, 0.9, uFold));
      }
    }

  } else if (uMatType == 1) {
    // -------- 深紫檀木作（灯冠飞檐、八柱、四足镂空高几、案上镇尺） --------
    float g1 = sin(vWorldPos.y * 38.0 + vWorldPos.x * 22.0 + vnoise(vWorldPos.xz * 12.0) * 5.0) * 0.5 + 0.5;
    vec3 wood = mix(vec3(0.085, 0.045, 0.026), vec3(0.22, 0.125, 0.074), smoothstep(0.2, 0.85, g1));

    // vExtra.x > 0.5 标记暗金错丝纹饰（镇尺云纹 / 灯冠鎏金细线）
    float goldInlay = vExtra.x;
    if (goldInlay > 0.1) {
      // 镇尺顶面精细回纹暗金错丝
      float pat = 0.0;
      if (goldInlay > 0.75) {
        float bx = abs(vUv.x - 0.5) * 2.0;
        float by = abs(vUv.y - 0.5) * 2.0;
        float borderLine = smoothstep(0.03, 0.0, abs(max(bx, by) - 0.82));
        float fret = smoothstep(0.06, 0.0, abs(fract(vUv.y * 12.0) - 0.5) - 0.18) * step(bx, 0.58) * step(0.14, bx);
        pat = clamp(borderLine + fret * 0.65, 0.0, 1.0);
      } else {
        pat = goldInlay;
      }
      wood = mix(wood, vec3(0.76, 0.56, 0.24), pat * 0.85);
    }

    vec3 L1 = normalize(vec3(1.1, 1.4, 0.9));
    vec3 H1 = normalize(L1 + V);
    float diff1 = max(dot(N, L1), 0.0);
    float spec1 = pow(max(dot(N, H1), 0.0), 36.0);

    // 内烛暖红边缘反光（照亮灯冠内檐与紫檀八柱内侧）
    vec3 Lc = uCandlePos - vWorldPos;
    float dC = length(Lc);
    vec3 Lcn = Lc / max(dC, 0.001);
    float diffC = max(dot(N, Lcn), 0.0) + 0.22;
    float specC = pow(max(dot(N, normalize(Lcn + V)), 0.0), 26.0);
    float cAtt = 0.92 / (0.14 + dC * dC * 1.45);

    vec3 amb = wood * vec3(0.32, 0.22, 0.16) * mix(1.0, 0.45, uFold);
    vec3 deskShade = wood * vec3(0.92, 0.74, 0.54) * diff1 * (1.0 - uFold * 0.72) + vec3(0.55, 0.36, 0.22) * spec1 * 0.28 * (1.0 - uFold * 0.6);
    vec3 candleShade = (wood * vec3(1.35, 0.78, 0.34) * diffC + vec3(0.85, 0.56, 0.28) * specC * 0.45) * cAtt * uLightAmt * uFlicker;

    col = amb + deskShade + candleShade;

  } else if (uMatType == 2) {
    // -------- 白玉环佩 (vExtra.x < 0.3) / 鎏金宫铃 (0.3..0.7) / 朱红流苏 (> 0.7) --------
    vec3 Lc = normalize(uCandlePos - vWorldPos);
    vec3 Hc = normalize(Lc + V);
    float diff = 0.35 + 0.65 * max(dot(N, Lc), 0.0);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5);

    if (vExtra.x < 0.33) {
      // 羊脂白玉环佩：温润透光次表面暖玉色
      vec3 jade = vec3(0.88, 0.84, 0.74);
      float sss = pow(max(0.0, dot(-V, Lc) * 0.5 + 0.5), 2.0) * 0.55 + 0.35;
      float spec = pow(max(dot(N, Hc), 0.0), 54.0);
      col = jade * (vec3(0.38, 0.32, 0.25) + vec3(1.15, 0.86, 0.52) * diff * 0.75 + vec3(1.0, 0.78, 0.44) * sss * 0.55) * uFlicker;
      col += vec3(1.0, 0.94, 0.82) * spec * 0.65 + vec3(0.95, 0.76, 0.48) * rim * 0.32;
    } else if (vExtra.x < 0.66) {
      // 鎏金宫铃与细丝绳
      vec3 gold = vec3(0.85, 0.64, 0.28);
      float spec = pow(max(dot(N, Hc), 0.0), 42.0);
      col = gold * (0.35 + 0.95 * diff) * uFlicker + vec3(1.0, 0.90, 0.62) * spec * 0.95;
    } else {
      // 朱红丝线流苏（纵向细丝光泽）
      float strand = sin(vUv.x * 160.0) * 0.5 + 0.5;
      vec3 silkRed = mix(vec3(0.46, 0.11, 0.08), vec3(0.74, 0.22, 0.14), strand * 0.6 + vUv.y * 0.3);
      float sheen = pow(max(dot(N, Hc), 0.0), 14.0) * (0.4 + 0.6 * strand);
      col = silkRed * (0.32 + 0.92 * diff) * uFlicker + vec3(0.95, 0.62, 0.34) * sheen * 0.35;
    }

  } else if (uMatType == 3) {
    // -------- 白瓷灯盏 (vExtra.x < 0.5) 与 暖白蜡柱 (>= 0.5) --------
    vec3 Lc = normalize(uCandlePos - vWorldPos);
    vec3 Hc = normalize(Lc + V);
    float diff = 0.38 + 0.62 * max(dot(N, Lc), 0.0);
    if (vExtra.x < 0.5) {
      vec3 porcelain = mix(vec3(0.86, 0.83, 0.76), vec3(0.98, 0.82, 0.58), uLightAmt * 0.55);
      float spec = pow(max(dot(N, Hc), 0.0), 64.0);
      float bowlGlow = exp(-length(vWorldPos.xz - uCandlePos.xz) * 16.0) * uLightAmt;
      col = porcelain * (vec3(0.42, 0.36, 0.30) + vec3(1.25, 0.82, 0.40) * diff * (0.45 + 0.95 * uLightAmt)) * uFlicker;
      col += vec3(1.0, 0.74, 0.32) * bowlGlow * 0.85 * uFlicker + vec3(1.0, 0.94, 0.82) * spec * 0.75;
    } else {
      // 半透蜡烛柱（近烛芯处炽暖透橘）
      float topGlow = smoothstep(0.2, 1.0, vUv.y) * uLightAmt;
      vec3 wax = mix(vec3(0.84, 0.76, 0.64), vec3(1.0, 0.62, 0.22), topGlow * 0.78);
      col = wax * (0.42 + 0.75 * diff + topGlow * 0.85) * uFlicker;
    }

  } else if (uMatType == 4) {
    // -------- 摇曳烛火 (#fff6d6 -> #ffbe55 -> #e85d2a) --------
    // vUv.y: 0=烛底, 1=焰尖
    float h = clamp(vUv.y, 0.0, 1.0);
    float center = abs(dot(N, V));
    float core = smoothstep(0.32, 0.88, center) * (1.0 - smoothstep(0.45, 0.92, h));
    vec3 cCore = vec3(1.0, 0.965, 0.84);
    vec3 cMid  = vec3(1.0, 0.745, 0.33);
    vec3 cTip  = vec3(0.91, 0.365, 0.165);
    col = mix(cTip, cMid, smoothstep(0.95, 0.25, h));
    col = mix(col, cCore, core);
    col *= (1.45 + 0.45 * uFlicker);
    outA = uAlpha * smoothstep(0.0, 0.16, h) * (1.0 - smoothstep(0.78, 1.0, h) * 0.35);
    fragColor = vec4(toneMap(col), outA);
    return;
  }

  fragColor = vec4(toneMap(col), outA);
}
`;

  const P_ROOM = makeProg(VS_ROOM, FS_ROOM);
  const P_MESH = makeProg(VS_MESH, FS_MESH);

  // 全屏大三角形 VAO
  const roomVAO = gl.createVertexArray();
  gl.bindVertexArray(roomVAO);
  const rb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, rb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  // 通用 Mesh 建造器：每顶点 10 float (pos3, norm3, uv2, extra2)
  function createMeshBuilder() {
    const verts = [];
    const idx = [];
    const addVert = (x, y, z, nx, ny, nz, u, v, e0 = 0, e1 = 0) => {
      const id = verts.length / 10;
      verts.push(x, y, z, nx, ny, nz, u, v, e0, e1);
      return id;
    };
    const addTri = (a, b, c) => { idx.push(a, b, c); };
    const addQuad = (a, b, c, d) => { idx.push(a, b, c, a, c, d); };
    const addBox = (cx, cy, cz, sx, sy, sz, e0 = 0, topE0 = null) => {
      const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
      const faces = [
        { n: [0, 1, 0], pts: [[-hx, hy, -hz], [-hx, hy, hz], [hx, hy, hz], [hx, hy, -hz]], e: topE0 != null ? topE0 : e0 },
        { n: [0, -1, 0], pts: [[-hx, -hy, hz], [-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz]], e: e0 },
        { n: [0, 0, 1], pts: [[-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]], e: e0 },
        { n: [0, 0, -1], pts: [[hx, -hy, -hz], [-hx, -hy, -hz], [-hx, hy, -hz], [hx, hy, -hz]], e: e0 },
        { n: [1, 0, 0], pts: [[hx, -hy, hz], [hx, -hy, -hz], [hx, hy, -hz], [hx, hy, hz]], e: e0 },
        { n: [-1, 0, 0], pts: [[-hx, -hy, -hz], [-hx, -hy, hz], [-hx, hy, hz], [-hx, hy, -hz]], e: e0 }
      ];
      const uvs = [[0, 0], [0, 1], [1, 1], [1, 0]];
      for (const f of faces) {
        const ids = f.pts.map((p, k) => addVert(cx + p[0], cy + p[1], cz + p[2], f.n[0], f.n[1], f.n[2], uvs[k][0], uvs[k][1], f.e, 0));
        addQuad(ids[0], ids[1], ids[2], ids[3]);
      }
    };
    const addLathe = (profile, segs = 24, e0 = 0, phaseOff = 0) => {
      // profile: [[r, y], ...]
      const rows = profile.length;
      const startId = verts.length / 10;
      for (let j = 0; j < rows; j++) {
        const [r, y] = profile[j];
        const prev = profile[Math.max(0, j - 1)];
        const next = profile[Math.min(rows - 1, j + 1)];
        const dr = next[0] - prev[0];
        const dy = next[1] - prev[1];
        const nLen = Math.hypot(dr, dy) || 1;
        const nr = dy / nLen, ny = -dr / nLen;
        const v = j / Math.max(1, rows - 1);
        for (let i = 0; i <= segs; i++) {
          const u = i / segs;
          const a = u * TAU + phaseOff;
          const ca = Math.cos(a), sa = Math.sin(a);
          addVert(r * sa, y, r * ca, nr * sa, ny, nr * ca, u, v, e0, 0);
        }
      }
      const stride = segs + 1;
      for (let j = 0; j < rows - 1; j++) {
        for (let i = 0; i < segs; i++) {
          const a = startId + j * stride + i;
          const b = a + 1;
          const c = a + stride;
          const d = c + 1;
          addQuad(a, b, d, c);
        }
      }
    };
    const addTorus = (cx, cy, cz, majorR, minorR, segU = 32, segV = 16, e0 = 0) => {
      // 玉环正面向 Z（站在 XY 平面）
      const startId = verts.length / 10;
      for (let i = 0; i <= segU; i++) {
        const u = i / segU, phi = u * TAU;
        const cp = Math.cos(phi), sp = Math.sin(phi);
        for (let j = 0; j <= segV; j++) {
          const v = j / segV, th = v * TAU;
          const ct = Math.cos(th), st = Math.sin(th);
          const rr = majorR + minorR * ct;
          const x = cx + rr * cp;
          const y = cy + rr * sp;
          const z = cz + minorR * st;
          addVert(x, y, z, ct * cp, ct * sp, st, u, v, e0, 0);
        }
      }
      const stride = segV + 1;
      for (let i = 0; i < segU; i++) {
        for (let j = 0; j < segV; j++) {
          const a = startId + i * stride + j;
          const b = a + stride;
          const c = a + 1;
          const d = b + 1;
          addQuad(a, b, d, c);
        }
      }
    };
    const upload = (dynamic = false) => {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      const vArr = new Float32Array(verts);
      gl.bufferData(gl.ARRAY_BUFFER, vArr, dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      const iArr = new Uint16Array(idx);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, iArr, gl.STATIC_DRAW);
      const STRIDE = 40;
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, STRIDE, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, STRIDE, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, STRIDE, 24);
      gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 2, gl.FLOAT, false, STRIDE, 32);
      gl.bindVertexArray(null);
      return { vao, vbo, ibo, count: idx.length, vArr };
    };
    return { addVert, addTri, addQuad, addBox, addLathe, addTorus, upload };
  }

  /* 1. 熟绢动态变形网格（96 x 28，含上下宋锦绫边） */
  const SEG_U = 96, SEG_V = 28;
  const silkB = createMeshBuilder();
  for (let j = 0; j <= SEG_V; j++) {
    const vRaw = lerp(-0.075, 1.075, j / SEG_V);
    for (let i = 0; i <= SEG_U; i++) {
      silkB.addVert(0, 0, 0, 0, 1, 0, i / SEG_U, vRaw, 0, 0);
    }
  }
  const sStride = SEG_U + 1;
  for (let j = 0; j < SEG_V; j++) {
    for (let i = 0; i < SEG_U; i++) {
      const a = j * sStride + i;
      const b = a + 1;
      const c = a + sStride;
      const d = c + 1;
      // (a, c, b) 与 (b, c, d) 保证平铺态(+Y)与圆柱态(+R)均正面朝外
      silkB.addTri(a, c, b);
      silkB.addTri(b, c, d);
    }
  }
  const silkMesh = silkB.upload(true);
  let lastFoldBuilt = -1;

  function updateSilkGeometry(fold) {
    if (Math.abs(fold - lastFoldBuilt) < 1e-4) return;
    lastFoldBuilt = fold;
    const sTilt = easeInOut(clamp((fold - 0.08) / 0.66, 0, 1));
    const sCurl = easeInOut(clamp((fold - 0.14) / 0.80, 0, 1));
    const centerY = lerp(0.012, Y_SILK_CENTER_3D, easeInOut(clamp((fold - 0.06) / 0.74, 0, 1)));
    const thetaMax = Math.max(1e-4, sCurl * TAU);
    const Rc = SILK_WORLD_W / thetaMax;
    const halfTh = thetaMax * 0.5;
    const sincHalf = halfTh < 1e-3 ? (1 - halfTh * halfTh / 6) : Math.sin(halfTh) / halfTh;
    const beta = (1 - sTilt) * (Math.PI * 0.5);
    const cb = Math.cos(beta), sb = Math.sin(beta);

    const arr = silkMesh.vArr;
    let ptr = 0;
    for (let j = 0; j <= SEG_V; j++) {
      const vRaw = lerp(-0.075, 1.075, j / SEG_V);
      // 终章卷灯时微收绫边高度，优雅贴合上下紫檀灯圈
      const vEff = lerp(vRaw, clamp(vRaw, -0.025, 1.025), sCurl);
      const ly = (0.5 - vEff) * SILK_WORLD_H;
      for (let i = 0; i <= SEG_U; i++) {
        const u = i / SEG_U;
        const phi = (u - 0.5) * thetaMax;
        const sp = Math.sin(phi), cp = Math.cos(phi);
        const lx = Rc * sp;
        const lz = Rc * cp - Rc * sincHalf;
        const wy = centerY + ly * cb + lz * sb;
        const wz = -ly * sb + lz * cb;
        const nx = sp;
        const ny = cp * sb;
        const nz = cp * cb;
        arr[ptr] = lx;
        arr[ptr + 1] = wy;
        arr[ptr + 2] = wz;
        arr[ptr + 3] = nx;
        arr[ptr + 4] = ny;
        arr[ptr + 5] = nz;
        ptr += 10;
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, silkMesh.vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
  }
  updateSilkGeometry(0);

  /* 2. 两方紫檀木镇尺（带暗金错丝纹饰） */
  const pwB = createMeshBuilder();
  pwB.addBox(0, 0.017, 0, 0.068, 0.032, 0.88, 0.0, 0.92);
  pwB.addBox(0, 0.035, 0, 0.056, 0.006, 0.84, 0.15, 0.95);
  const paperweightMesh = pwB.upload();

  /* 3. 旋转走马宫灯木构（八根紫檀立柱 + 上下灯圈 + 八角雕花翘檐灯冠 + 顶珠） */
  const lWoodB = createMeshBuilder();
  // 八根纤细紫檀立柱
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * TAU;
    const rx = Math.sin(a) * (R_LANTERN + 0.008);
    const rz = Math.cos(a) * (R_LANTERN + 0.008);
    lWoodB.addBox(rx, Y_SILK_CENTER_3D, rz, 0.018, H_SILK_PLUS(), 0.018, 0.12);
    // 翘角飞檐饰件（八角灯冠微挑出檐）
    const ex = Math.sin(a) * (R_LANTERN + 0.088);
    const ez = Math.cos(a) * (R_LANTERN + 0.088);
    lWoodB.addBox((rx + ex) * 0.5, Y_SILK_TOP + 0.068, (rz + ez) * 0.5, 0.022, 0.016, 0.022, 0.45);
    lWoodB.addBox(ex, Y_SILK_TOP + 0.084, ez, 0.018, 0.026, 0.018, 0.65);
  }
  function H_SILK_PLUS() { return SILK_WORLD_H + 0.05; }
  // 上下紫檀灯圈（八角阶梯线脚）
  lWoodB.addLathe([
    [R_LANTERN - 0.015, Y_SILK_BOT - 0.026],
    [R_LANTERN + 0.034, Y_SILK_BOT - 0.022],
    [R_LANTERN + 0.042, Y_SILK_BOT - 0.004],
    [R_LANTERN + 0.024, Y_SILK_BOT + 0.014],
    [R_LANTERN - 0.008, Y_SILK_BOT + 0.014]
  ], 8, 0.14);
  lWoodB.addLathe([
    [R_LANTERN - 0.008, Y_SILK_TOP - 0.012],
    [R_LANTERN + 0.028, Y_SILK_TOP - 0.010],
    [R_LANTERN + 0.046, Y_SILK_TOP + 0.012],
    [R_LANTERN + 0.086, Y_SILK_TOP + 0.062], // 八角飞檐裙边
    [R_LANTERN + 0.048, Y_SILK_TOP + 0.072],
    [R_LANTERN - 0.022, Y_SILK_TOP + 0.118], // 雕花冠颈
    [0.145, Y_SILK_TOP + 0.132],
    [0.175, Y_SILK_TOP + 0.155],
    [0.068, Y_SILK_TOP + 0.195],
    [0.022, Y_SILK_TOP + 0.215],
    [0.036, Y_SILK_TOP + 0.242], // 莲花顶珠
    [0.004, Y_SILK_TOP + 0.278]
  ], 8, 0.16);
  // 内置承托烛盏的纤细横梁
  lWoodB.addBox(0, 0.505, 0, R_LANTERN * 1.92, 0.014, 0.020, 0.2);
  lWoodB.addBox(0, 0.505, 0, 0.020, 0.014, R_LANTERN * 1.92, 0.2);
  const lanternWoodMesh = lWoodB.upload();

  /* 4. 静止落案的紫檀四足镂空高几底座（中央通透，正好衬出白玉环佩与流苏宫铃！） */
  const standB = createMeshBuilder();
  // 上托环
  standB.addLathe([
    [R_LANTERN - 0.006, 0.312],
    [R_LANTERN + 0.034, 0.312],
    [R_LANTERN + 0.038, 0.342],
    [R_LANTERN - 0.006, 0.342]
  ], 32, 0.12);
  // 四根优雅斜撇紫檀高足（位于 ±45°, ±135°，正面中轴完全通透！）
  for (let k = 0; k < 4; k++) {
    const a = (k * 0.5 + 0.25) * Math.PI;
    const sa = Math.sin(a), ca = Math.cos(a);
    const segs = 10;
    for (let s = 0; s < segs; s++) {
      const f = (s + 0.5) / segs;
      const y = lerp(0.014, 0.326, f);
      const r = lerp(0.375, R_LANTERN + 0.016, f) + Math.sin(f * Math.PI) * 0.032;
      standB.addBox(r * sa, y, r * ca, 0.032, 0.042, 0.032, 0.08);
    }
    // 莲瓣底足
    standB.addBox(0.382 * sa, 0.014, 0.382 * ca, 0.056, 0.028, 0.056, 0.22);
  }
  const standMesh = standB.upload();

  /* 5. 下悬白玉环佩 + 鎏金宫铃 + 朱红流苏（局部原点在悬挂点 y=0，渲染时挂于 (0, 0.355, 0)） */
  const pendB = createMeshBuilder();
  // 金丝挂绳
  pendB.addLathe([[0.004, 0.0], [0.004, -0.048]], 10, 0.5);
  // 白玉环佩（温润羊脂白玉璧）
  pendB.addTorus(0, -0.095, 0, 0.046, 0.0145, 32, 16, 0.1);
  // 玉环下挂金扣与鎏金宫铃
  pendB.addLathe([
    [0.005, -0.140],
    [0.016, -0.156],
    [0.024, -0.178],
    [0.028, -0.196],
    [0.014, -0.198]
  ], 18, 0.5);
  // 飘逸朱红丝线流苏
  pendB.addLathe([
    [0.012, -0.196],
    [0.018, -0.225],
    [0.025, -0.268],
    [0.029, -0.305],
    [0.003, -0.312]
  ], 22, 0.9);
  const pendantMesh = pendB.upload();

  /* 6. 白瓷灯盏 + 蜡柱 + 摇曳烛火 */
  const dishB = createMeshBuilder();
  // 白瓷圆盘
  dishB.addLathe([
    [0.001, 0.0],
    [0.065, 0.0],
    [0.086, 0.016],
    [0.094, 0.032],
    [0.082, 0.034],
    [0.062, 0.016],
    [0.001, 0.014]
  ], 28, 0.1);
  // 温润蜡柱
  dishB.addLathe([
    [0.032, 0.014],
    [0.031, 0.165],
    [0.026, 0.185],
    [0.005, 0.182]
  ], 20, 0.85);
  const candleDishMesh = dishB.upload();

  // 3D 水滴形烛火
  const flameB = createMeshBuilder();
  flameB.addLathe([
    [0.002, 0.0],
    [0.017, 0.018],
    [0.021, 0.044],
    [0.015, 0.078],
    [0.006, 0.112],
    [0.0005, 0.138]
  ], 18, 0.0);
  const flameMesh = flameB.upload();

  /* 纹理创建（liveSilkTex + opticsTex） */
  function createDynTex() {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }
  const silkTex = createDynTex();
  const opticsTex = createDynTex();

  return {
    P_ROOM, P_MESH, roomVAO,
    silkMesh, updateSilkGeometry,
    paperweightMesh, lanternWoodMesh, standMesh, pendantMesh, candleDishMesh, flameMesh,
    silkTex, opticsTex
  };
}

try {
  GL_RES = initWebGL();
} catch (err) {
  console.error('WebGL2 init fallback:', err);
  GL_RES = null;
}

function getCandlePos(t) {
  const s = easeInOut(CAM.fold);
  const fx = Math.sin(t * 9.3) * 0.005 + Math.cos(t * 15.1) * 0.003;
  const fz = Math.cos(t * 8.1) * 0.004;
  // 第五幕在画心偏下 (0, 0.14, 0.24)，终章移入宫灯内芯 (0, 0.78, 0)
  return [
    fx,
    lerp(0.14, 0.78, s) + Math.sin(t * 11.4) * 0.004,
    lerp(0.24, 0.0, s) + fz
  ];
}

function getFlicker(t) {
  return 0.93 + 0.045 * Math.sin(t * 8.3) + 0.028 * Math.sin(t * 19.7) + 0.015 * Math.cos(t * 31.3);
}

function renderWebGL(renderW, renderH) {
  if (!GL_RES) return;
  const R = GL_RES;
  const t = STATE.totalTime;
  const aspect = renderW / Math.max(1, renderH);
  const B = getCamBasis();
  const cPos = getCandlePos(t);
  const flicker = getFlicker(t);
  const pwSlide = easeInOut(clamp(CAM.fold / 0.28, 0, 1)) * 0.56;

  if (silkTexNeedsUpload) {
    silkTexNeedsUpload = false;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, R.silkTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, liveSilk.c);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, R.opticsTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, opticsCanvas.c);
  }

  R.updateSilkGeometry(CAM.fold);

  gl.viewport(0, 0, renderW, renderH);
  gl.clearColor(0.078, 0.047, 0.031, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* ---------- Pass 1: 紫檀木案 + 折屏 + 实时光影投射 + 丁达尔气韵 ---------- */
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.BLEND);
  gl.disable(gl.CULL_FACE);

  gl.useProgram(R.P_ROOM.p);
  const ur = R.P_ROOM.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.silkTex); gl.uniform1i(ur.uSilkTex, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.opticsTex); gl.uniform1i(ur.uOpticsTex, 1);
  gl.uniform3fv(ur.uCamPos, CAM.pos);
  gl.uniform3fv(ur.uCamR, B.r);
  gl.uniform3fv(ur.uCamU, B.u);
  gl.uniform3fv(ur.uCamF, B.f);
  gl.uniform1f(ur.uTanH, CAM.tanH);
  gl.uniform1f(ur.uAspect, aspect);
  gl.uniform1f(ur.uTime, t);
  gl.uniform1f(ur.uFold, CAM.fold);
  gl.uniform1f(ur.uLanternAngle, CAM.lanternAngle);
  gl.uniform1f(ur.uLightAmt, CAM.lightAmt);
  gl.uniform1f(ur.uDuskAmt, CAM.duskAmt);
  gl.uniform3fv(ur.uCandlePos, cPos);
  gl.uniform1f(ur.uFlicker, flicker);
  gl.uniform1f(ur.uPaperweightSlide, pwSlide);

  gl.bindVertexArray(R.roomVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---------- Pass 2: 3D 网格绘制 ---------- */
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.useProgram(R.P_MESH.p);
  const um = R.P_MESH.u;
  gl.uniform1i(um.uSilkTex, 0);
  gl.uniform1i(um.uOpticsTex, 1);
  gl.uniform3fv(um.uCamPos, CAM.pos);
  gl.uniform3fv(um.uCamR, B.r);
  gl.uniform3fv(um.uCamU, B.u);
  gl.uniform3fv(um.uCamF, B.f);
  gl.uniform1f(um.uTanH, CAM.tanH);
  gl.uniform1f(um.uAspect, aspect);
  gl.uniform1f(um.uTime, t);
  gl.uniform1f(um.uFold, CAM.fold);
  gl.uniform1f(um.uLightAmt, CAM.lightAmt);
  gl.uniform1f(um.uDuskAmt, CAM.duskAmt);
  gl.uniform1f(um.uFlicker, flicker);
  gl.uniform3fv(um.uCandlePos, cPos);

  const drawMesh = (mesh, matType, opts = {}) => {
    gl.uniform1i(um.uMatType, matType);
    gl.uniform1f(um.uRotY, opts.rotY || 0);
    gl.uniform3fv(um.uOffset, opts.offset || [0, 0, 0]);
    gl.uniform3fv(um.uScale, opts.scale || [1, 1, 1]);
    gl.uniform2fv(um.uPendTilt, opts.pendTilt || [0, 0]);
    gl.uniform1f(um.uAlpha, opts.alpha != null ? opts.alpha : 1.0);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  };

  // 2A. 紫檀镇尺（前五幕压住画心，转场时优雅退至两侧）
  const pwVis = 1.0 - smoothstep(0.18, 0.38, CAM.fold);
  if (pwVis > 0.01) {
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    const px = 1.015 + pwSlide;
    const py = lerp(0.0, -0.04, 1 - pwVis);
    drawMesh(R.paperweightMesh, 1, { offset: [-px, py, 0], alpha: pwVis });
    drawMesh(R.paperweightMesh, 1, { offset: [px, py, 0], alpha: pwVis });
  }

  // 2B. 终章紫檀四足镂空高几底座 + 下悬白玉环佩与流苏宫铃
  const lArchVis = easeOutCubic(clamp((CAM.fold - 0.42) / 0.54, 0, 1));
  if (lArchVis > 0.01) {
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    const sc = lerp(0.86, 1.0, lArchVis);
    drawMesh(R.standMesh, 1, { offset: [0, (lArchVis - 1) * 0.14, 0], scale: [sc, sc, sc] });
    drawMesh(R.pendantMesh, 2, {
      offset: [0, 0.352 + (lArchVis - 1) * 0.14, 0],
      scale: [sc, sc, sc],
      rotY: CAM.lanternAngle * 0.18,
      pendTilt: [CAM.pendZ, CAM.pendX]
    });
  }

  // 2C. 熟绢背面（终章卷成灯筒后先画半透明内壁）
  const silkRot = CAM.lanternAngle * smoothstep(0.55, 1.0, CAM.fold);
  if (CAM.fold > 0.25) {
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.FRONT);
    gl.disable(gl.BLEND);
    drawMesh(R.silkMesh, 0, { rotY: silkRot, alpha: 1.0 });
    gl.disable(gl.CULL_FACE);
  }

  // 2D. 白瓷灯盏 + 蜡柱 + 摇曳烛火（第五幕现身，终章移入灯芯）
  const dishVis = STATE.act >= 5 ? easeOutCubic(clamp((STATE.act === 5 ? STATE.actTime : 5) / 1.1, 0, 1)) : 0;
  if (dishVis > 0.01) {
    const sF = easeInOut(CAM.fold);
    const dishBase = [0, lerp(0.014, 0.515, sF), lerp(0.24, 0.0, sF)];
    const dSc = lerp(0.68, 0.92, sF) * dishVis;
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    drawMesh(R.candleDishMesh, 3, { offset: dishBase, scale: [dSc, dSc, dSc] });

    if (CAM.lightAmt > 0.01) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      const flamePos = [
        dishBase[0] + Math.sin(t * 10.2) * 0.004,
        dishBase[1] + 0.184 * dSc,
        dishBase[2] + Math.cos(t * 9.1) * 0.003
      ];
      const fScaleY = dSc * CAM.lightAmt * (0.94 + 0.14 * Math.sin(t * 14.5) + 0.08 * Math.cos(t * 23.1));
      const fScaleXZ = dSc * CAM.lightAmt * (0.96 + 0.07 * Math.cos(t * 17.3));
      drawMesh(R.flameMesh, 4, {
        offset: flamePos,
        scale: [fScaleXZ * 1.15, fScaleY * 1.25, fScaleXZ * 1.15],
        alpha: 0.96
      });
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }
  }

  // 2E. 熟绢正面（平铺时全不透，终章呈物理半透熟绢，内烛微光柔和透出）
  if (CAM.fold > 0.25) {
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawMesh(R.silkMesh, 0, { rotY: silkRot, alpha: 1.0 });
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
  } else {
    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
    drawMesh(R.silkMesh, 0, { rotY: 0, alpha: 1.0 });
  }

  // 2F. 走马宫灯八根紫檀立柱与雕花飞檐灯冠（随灯体同步旋转）
  if (lArchVis > 0.01) {
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    const crownDrop = (1 - lArchVis) * 0.22;
    drawMesh(R.lanternWoodMesh, 1, {
      rotY: silkRot,
      offset: [0, crownDrop, 0],
      scale: [lerp(0.92, 1.0, lArchVis), 1.0, lerp(0.92, 1.0, lArchVis)]
    });
  }
}

function smoothstep(a, b, x) {
  return sstep(a, b, x);
}

/* ---------- 极端环境无 WebGL2 时的优雅 2D 兜底渲染 ---------- */
let fallbackCtx = null;
function renderFallback2D() {
  if (!fallbackCtx) fallbackCtx = glCanvas.getContext('2d');
  if (!fallbackCtx) return;
  const c = fallbackCtx;
  const W = glCanvas.width, H = glCanvas.height;
  c.fillStyle = '#1c110b';
  c.fillRect(0, 0, W, H);
  if (CAM.fold < 0.5) {
    const padX = W * 0.09, padY = H * 0.11;
    const sw = W - padX * 2, sh = H - padY * 2;
    c.fillStyle = '#2d1a10';
    c.fillRect(padX - 18, padY - 12, sw + 36, sh + 24);
    c.drawImage(liveSilk.c, padX, padY, sw, sh);
  } else {
    // 2.5D 走马宫灯 + 墙面投射投影兜底
    const g = c.createRadialGradient(W * 0.5, H * 0.45, 20, W * 0.5, H * 0.45, W * 0.58);
    g.addColorStop(0, 'rgba(130, 78, 34, 0.72)');
    g.addColorStop(1, '#140c08');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    // 墙面流转山水投影
    c.save();
    c.globalAlpha = 0.26;
    const shiftPx = wrap01(CAM.lanternAngle / TAU) * W;
    c.drawImage(liveSilk.c, -shiftPx, H * 0.08, W, H * 0.62);
    c.drawImage(liveSilk.c, W - shiftPx, H * 0.08, W, H * 0.62);
    c.restore();

    // 宫灯本体
    const lw = Math.min(W * 0.26, H * 0.44);
    const lh = lw * 1.48;
    const lx = (W - lw) * 0.5, ly = H * 0.18;
    c.fillStyle = '#2c180f';
    c.fillRect(lx - 14, ly - 24, lw + 28, 26);
    c.fillRect(lx - 10, ly + lh, lw + 20, 18);
    const u0 = wrap01(-CAM.lanternAngle / TAU);
    const sx = u0 * SILK_W;
    const swSrc = SILK_W * 0.36;
    c.save();
    c.beginPath();
    c.rect(lx, ly, lw, lh);
    c.clip();
    c.drawImage(liveSilk.c, sx, 0, swSrc, SILK_H, lx, ly, lw, lh);
    if (sx + swSrc > SILK_W) {
      const rem = sx + swSrc - SILK_W;
      c.drawImage(liveSilk.c, 0, 0, rem, SILK_H, lx + lw * (1 - rem / swSrc), ly, lw * (rem / swSrc), lh);
    }
    c.restore();
    // 玉佩与流苏
    c.strokeStyle = '#efe7d6';
    c.lineWidth = 6;
    c.beginPath();
    c.arc(W * 0.5, ly + lh + 48, 16, 0, TAU);
    c.stroke();
    c.fillStyle = '#b52b22';
    c.fillRect(W * 0.5 - 5, ly + lh + 72, 10, 44);
  }
}

/* ============================================================================
 * 5. 前景 2D 诗意叠层（光标、第一幕泥金墨珠引导、第五幕灯芯微芒、开卷散金粉）
 * ============================================================================ */
const PTR = {
  x: VW * 0.5,
  y: VH * 0.5,
  down: false,
  inside: false,
  lastU: 0,
  lastV: 0,
  lastX: 0,
  lastY: 0,
  strokePts: [],
  dragVelX: 0,
  overUI: false
};

const GHOST = {
  active: false,
  u: 0.08,
  v: 0.45,
  phase: 0,
  cooldown: 0
};

function spawnIntroGoldDust() {
  const cx = VW * 0.5, cy = VH * 0.48;
  for (let i = 0; i < 110; i++) {
    const a = rand(0, TAU);
    const sp = rand(28, 180);
    STATE.introDust.push({
      x: cx + rand(-140, 140),
      y: cy + rand(-60, 60),
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - rand(10, 45),
      r: rand(1.1, 3.2),
      life: rand(0.9, 1.9),
      maxLife: 1.9
    });
  }
}

function renderOverlay(t, dt) {
  const c = ovCtx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, VW, VH);

  // 1) 序幕金粉散入熟绢粒子
  for (let i = STATE.introDust.length - 1; i >= 0; i--) {
    const p = STATE.introDust[i];
    p.life -= dt;
    if (p.life <= 0) { STATE.introDust.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.24, dt);
    p.vy *= Math.pow(0.28, dt);
    const a = clamp(p.life / p.maxLife, 0, 1);
    c.fillStyle = `rgba(245, 214, 138, ${a * 0.92})`;
    c.beginPath();
    c.arc(p.x, p.y, p.r * (0.4 + 0.6 * a), 0, TAU);
    c.fill();
  }

  // 2) 第一幕：左侧泥金墨珠与极淡游丝引导线（未动笔或覆盖率低时显示）
  if (STATE.act === 1 && STATE.ridgeCoverage < 0.22 && !STATE.actDoneFired) {
    const fade = clamp(1 - STATE.ridgeCoverage / 0.22, 0, 1) * clamp(STATE.actTime / 0.9, 0, 1);
    const pStart = worldToScreen([-SILK_WORLD_W * 0.44, 0.016, -SILK_WORLD_H * 0.02]);
    if (pStart) {
      const pulse = 0.72 + 0.28 * Math.sin(t * 2.8);
      // 极淡游丝弧线
      c.save();
      c.strokeStyle = `rgba(216, 169, 78, ${0.28 * fade})`;
      c.lineWidth = 1.2;
      c.setLineDash([4, 7]);
      c.beginPath();
      for (let k = 0; k <= 36; k++) {
        const f = k / 36;
        const wx = lerp(-SILK_WORLD_W * 0.44, SILK_WORLD_W * 0.42, f);
        const wz = (-0.04 - 0.11 * Math.sin(f * Math.PI * 2.1) - 0.05 * Math.cos(f * Math.PI * 4.2)) * SILK_WORLD_H;
        const sp = worldToScreen([wx, 0.016, wz]);
        if (sp) {
          if (k === 0) c.moveTo(sp[0], sp[1]);
          else c.lineTo(sp[0], sp[1]);
        }
      }
      c.stroke();
      c.setLineDash([]);

      // 温润泥金墨珠
      const rg = c.createRadialGradient(pStart[0], pStart[1], 1, pStart[0], pStart[1], 24 * pulse);
      rg.addColorStop(0, `rgba(255, 236, 178, ${0.95 * fade})`);
      rg.addColorStop(0.35, `rgba(216, 169, 78, ${0.65 * fade})`);
      rg.addColorStop(1, 'rgba(216, 169, 78, 0)');
      c.fillStyle = rg;
      c.beginPath();
      c.arc(pStart[0], pStart[1], 24 * pulse, 0, TAU);
      c.fill();
      c.fillStyle = `rgba(255, 246, 214, ${0.95 * fade})`;
      c.beginPath();
      c.arc(pStart[0], pStart[1], 4.2, 0, TAU);
      c.fill();
      c.restore();
    }
  }

  // 3) 第五幕灯芯：未点前柔波引导；点燃后绘制鲜活摇曳的泪滴形双层暖金烛火（随卷灯丝滑移交 3D 烛火）
  if (STATE.act >= 5 && CAM.fold < 0.72) {
    const sF = easeInOut(CAM.fold);
    const pWick = worldToScreen([0, lerp(0.142, 0.69, sF), lerp(0.24, 0.0, sF)]);
    if (pWick) {
      if (!STATE.lit && STATE.act === 5) {
        const pulse = 0.78 + 0.22 * Math.sin(t * 3.4);
        const rg = c.createRadialGradient(pWick[0], pWick[1], 1, pWick[0], pWick[1], 28 * pulse);
        rg.addColorStop(0, 'rgba(255, 224, 152, 0.88)');
        rg.addColorStop(0.42, 'rgba(232, 132, 56, 0.38)');
        rg.addColorStop(1, 'rgba(232, 93, 42, 0)');
        c.fillStyle = rg;
        c.beginPath();
        c.arc(pWick[0], pWick[1], 28 * pulse, 0, TAU);
        c.fill();
        c.strokeStyle = `rgba(255, 226, 160, ${0.46 * pulse})`;
        c.lineWidth = 1.1;
        c.beginPath();
        c.arc(pWick[0], pWick[1], 13 + 8 * (1 - pulse), 0, TAU);
        c.stroke();
      } else if (STATE.lit) {
        const flameFade = (1 - smoothstep(0.22, 0.70, CAM.fold)) * clamp(CAM.lightAmt * 1.35, 0, 1);
        if (flameFade > 0.01) {
          const flk = getFlicker(t);
          const sway = Math.sin(t * 8.4) * 3.4 + Math.cos(t * 14.9) * 1.8;
          const stretch = 1.0 + Math.sin(t * 12.6) * 0.09 + Math.cos(t * 21.3) * 0.05;
          const sc = Math.min(VW, VH) / 720;
          const fx = pWick[0], fy = pWick[1];

          c.save();
          c.globalAlpha = flameFade;

          // 外层朱橘暖金光晕 (#e85d2a -> #ffbe55)
          const haloR = 88 * sc * flk;
          const hg = c.createRadialGradient(fx + sway * 0.3, fy - 12 * sc, 2, fx, fy - 10 * sc, haloR);
          hg.addColorStop(0.0, 'rgba(255, 246, 214, 0.72)');
          hg.addColorStop(0.24, 'rgba(255, 190, 85, 0.44)');
          hg.addColorStop(0.56, 'rgba(232, 93, 42, 0.18)');
          hg.addColorStop(1.0, 'rgba(232, 93, 42, 0)');
          c.fillStyle = hg;
          c.beginPath();
          c.arc(fx, fy - 10 * sc, haloR, 0, TAU);
          c.fill();

          // 烛芯细碳柱
          c.strokeStyle = 'rgba(54, 28, 14, 0.85)';
          c.lineWidth = 2.0 * sc;
          c.beginPath();
          c.moveTo(fx, fy + 4 * sc);
          c.lineTo(fx + sway * 0.12, fy - 5 * sc);
          c.stroke();

          // 中层泪滴形暖琥珀外焰 (#e85d2a -> #ffbe55)
          const fh = 42 * sc * stretch;
          const fw = 15.5 * sc * (0.94 + 0.06 * flk);
          const og = c.createLinearGradient(fx, fy + 2 * sc, fx + sway, fy - fh);
          og.addColorStop(0.0, '#e85d2a');
          og.addColorStop(0.32, '#ff9838');
          og.addColorStop(0.76, '#ffbe55');
          og.addColorStop(1.0, 'rgba(255, 232, 168, 0.85)');
          c.fillStyle = og;
          c.beginPath();
          c.moveTo(fx, fy + 2 * sc);
          c.bezierCurveTo(fx - fw, fy - 4 * sc, fx - fw * 0.78 + sway * 0.45, fy - fh * 0.62, fx + sway, fy - fh);
          c.bezierCurveTo(fx + fw * 0.78 + sway * 0.45, fy - fh * 0.62, fx + fw, fy - 4 * sc, fx, fy + 2 * sc);
          c.closePath();
          c.fill();

          // 内层亮白黄泪滴火芯 (#fff8dc)
          const ih = 25 * sc * stretch;
          const iw = 8.4 * sc;
          const ig = c.createLinearGradient(fx, fy, fx + sway * 0.55, fy - ih);
          ig.addColorStop(0.0, '#ffdf8c');
          ig.addColorStop(0.45, '#fff8dc');
          ig.addColorStop(1.0, 'rgba(255, 250, 230, 0.94)');
          c.fillStyle = ig;
          c.beginPath();
          c.moveTo(fx, fy - 1 * sc);
          c.bezierCurveTo(fx - iw, fy - 5 * sc, fx - iw * 0.65 + sway * 0.28, fy - ih * 0.65, fx + sway * 0.55, fy - ih);
          c.bezierCurveTo(fx + iw * 0.65 + sway * 0.28, fy - ih * 0.65, fx + iw, fy - 5 * sc, fx, fy - 1 * sc);
          c.closePath();
          c.fill();

          // 飘升的微弱烛火花粒
          for (let k = 0; k < 4; k++) {
            const cyc = (t * 0.95 + k * 0.27) % 1;
            const ex = fx + sway * (0.4 + cyc * 0.8) + Math.sin(t * 5 + k * 2.1) * 7 * sc;
            const ey = fy - fh * 0.6 - cyc * 38 * sc;
            const ea = Math.sin(cyc * Math.PI) * 0.75;
            c.fillStyle = `rgba(255, 224, 148, ${ea})`;
            c.beginPath();
            c.arc(ex, ey, (1.6 - cyc * 0.9) * sc, 0, TAU);
            c.fill();
          }

          c.restore();
        }
      }
    }
  }

  // 4) 幽灵画师轻灵微光笔影（闲置接力时柔和可见）
  if (GHOST.active && STATE.act >= 1 && STATE.act <= 4) {
    const gx = (GHOST.u - 0.5) * SILK_WORLD_W;
    const gz = (GHOST.v - 0.5) * SILK_WORLD_H;
    const gp = worldToScreen([gx, 0.018, gz]);
    if (gp) {
      const rg = c.createRadialGradient(gp[0], gp[1], 1, gp[0], gp[1], 20);
      rg.addColorStop(0, 'rgba(255, 238, 188, 0.75)');
      rg.addColorStop(0.45, 'rgba(216, 169, 78, 0.26)');
      rg.addColorStop(1, 'rgba(216, 169, 78, 0)');
      c.fillStyle = rg;
      c.beginPath();
      c.arc(gp[0], gp[1], 20, 0, TAU);
      c.fill();
    }
  }

  // 5) 雅致自定义笔尖光标
  if (PTR.inside && !PTR.overUI) {
    c.save();
    c.translate(PTR.x, PTR.y);
    const r = PTR.down ? 7.5 : 11;
    let strokeCol = 'rgba(245, 214, 138, 0.85)';
    let coreCol = 'rgba(245, 214, 138, 0.9)';
    if (STATE.act === 2) {
      strokeCol = 'rgba(92, 178, 152, 0.85)';
      coreCol = 'rgba(64, 148, 136, 0.9)';
    } else if (STATE.act === 3) {
      strokeCol = 'rgba(228, 130, 102, 0.85)';
      coreCol = 'rgba(116, 174, 128, 0.92)';
    } else if (STATE.act === 5 && !STATE.lit) {
      strokeCol = 'rgba(255, 190, 85, 0.92)';
      coreCol = 'rgba(255, 246, 214, 0.98)';
    }
    c.strokeStyle = strokeCol;
    c.lineWidth = 1.3;
    c.beginPath();
    c.arc(0, 0, r, 0, TAU);
    c.stroke();

    c.fillStyle = coreCol;
    c.beginPath();
    c.arc(0, 0, PTR.down ? 3.2 : 2.2, 0, TAU);
    c.fill();

    // 第四幕金刀微芒十字
    if (STATE.act === 4) {
      c.strokeStyle = 'rgba(255, 232, 168, 0.72)';
      c.lineWidth = 1.0;
      c.beginPath();
      c.moveTo(-15, 0); c.lineTo(-6, 0);
      c.moveTo(6, 0); c.lineTo(15, 0);
      c.moveTo(0, -15); c.lineTo(0, -6);
      c.moveTo(0, 6); c.lineTo(0, 15);
      c.stroke();
    }
    c.restore();
  }
}

/* ---------- 写入第一幕泥金山脊（含周期闭合支持） ---------- */
function applyRidgeSegment(u0, v0, u1, v1, speedNorm, isManual = true) {
  const c0 = clamp(v0, 0.17, 0.62);
  const c1 = clamp(v1, 0.17, 0.62);
  let du = u1 - u0;
  if (du > 0.5) du -= 1;
  if (du < -0.5) du += 1;
  const steps = Math.max(2, Math.ceil(Math.abs(du) * GRID_N * 1.4));
  let gained = 0;
  for (let s = 0; s <= steps; s++) {
    const f = s / steps;
    const u = wrap01(u0 + du * f);
    const v = lerp(c0, c1, f);
    const center = Math.floor(u * GRID_N) % GRID_N;
    const rad = 14;
    for (let k = -rad; k <= rad; k++) {
      const idx = (center + k + GRID_N) % GRID_N;
      const wAdd = Math.exp(-(k * k) / 48) * 0.45;
      const prevW = H_WEIGHT[idx];
      const nextW = Math.min(1, prevW + wAdd);
      const blend = wAdd / Math.max(0.05, nextW);
      H_MAIN[idx] = prevW < 0.02 ? v : lerp(H_MAIN[idx], v, clamp(blend * 0.65, 0.12, 0.72));
      H_SPEED[idx] = lerp(H_SPEED[idx], clamp(speedNorm, 0, 1), clamp(blend * 0.7, 0.18, 0.8));
      H_WEIGHT[idx] = nextW;
      gained += (nextW - prevW);
    }
  }
  if (gained > 0.002) {
    if (isManual) STATE.manualWork += gained * 0.032;
    else STATE.ghostWork += gained * 0.032;
  }
  goldDirty = true;

  // 即时撒落细微金砂动态粒子
  const sx = wrap01(u1) * SILK_W;
  const sy = c1 * SILK_H;
  if (STATE.goldSparks.length < 90 && rnd() < 0.65) {
    STATE.goldSparks.push({
      x: sx + rand(-10, 10),
      y: sy + rand(-8, 12),
      vx: rand(-14, 14),
      vy: rand(6, 22),
      r: rand(0.9, 2.2),
      life: rand(0.5, 1.15),
      maxLife: 1.15
    });
  }
}
