/* ---------- 补齐周期画卷（进入后续幕或卷灯前，确保 360° 无空白断层） ---------- */
function ensureFullPeriodicLandscape() {
  for (let i = 0; i < GRID_N; i++) {
    if (H_WEIGHT[i] < 0.92) {
      const u = i / GRID_N;
      const proc = 0.43
        - 0.13 * Math.sin(u * TAU * 2.0 + 0.55)
        - 0.09 * Math.cos(u * TAU * 3.0 - 0.35)
        - 0.055 * Math.sin(u * TAU * 5.0 + 1.1)
        + (fbm1Per(u, 8, 4, 31) - 0.5) * 0.09;
      H_MAIN[i] = lerp(clamp(proc, 0.20, 0.60), H_MAIN[i], H_WEIGHT[i]);
      H_WEIGHT[i] = 1.0;
    }
  }
  rebuildGoldMountainLayer();
}

function ensureFullMineralWash() {
  for (let i = 0; i < WASH.length; i++) {
    WASH_TARGET[i] = Math.max(WASH_TARGET[i], 0.92);
    WASH[i] = Math.max(WASH[i], 0.92);
  }
  STATE.washCoverage = 1.0;
  rebuildWashLayer();
}

/* ---------- 高艺术完成度程序化预绘（供 ?act=2..6 跳幕调试，直接呈现博物馆级成品！） ---------- */
function prebakeThroughAct(targetAct) {
  initDefaultRidges();
  initClouds();

  // Act 1 预绘：连绵周期北宋青绿泥金主峰 + 披麻皴 & 小斧劈皴
  if (targetAct >= 2) {
    for (let i = 0; i < GRID_N; i++) {
      const u = i / GRID_N;
      const peak = 0.43
        - 0.145 * Math.sin(u * TAU * 2.0 + 0.45)
        - 0.095 * Math.cos(u * TAU * 3.0 - 0.55)
        - 0.058 * Math.sin(u * TAU * 5.0 + 1.35)
        - 0.032 * Math.cos(u * TAU * 7.0 - 0.2)
        + (fbm1Per(u, 10, 4, 29) - 0.5) * 0.075;
      H_MAIN[i] = clamp(peak, 0.18, 0.60);
      H_WEIGHT[i] = 1.0;
    }
    rebuildGoldMountainLayer();
    // 叠加几笔主峰游丝泥金亮线
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const u = i / 128;
      pts.push({ x: u * SILK_W, y: sampleArrPer(H_WRAP, u) * SILK_H, w: 3.1 });
    }
    drawGoldCalligraphyStroke(pts, 0.32, 0.95);
    STATE.ridgeCoverage = 1.0;
  }

  // Act 2 预绘：四阶石青石绿赭石矿物重彩 + 杏霞 + 春江
  if (targetAct >= 3) {
    ensureFullMineralWash();
  }

  // Act 3 预绘：均衡宋画苍松(5) + 灼灼春桃(5) + 临水垂柳(4)
  if (targetAct >= 4) {
    const pineUs = [0.09, 0.29, 0.48, 0.68, 0.87];
    for (const u of pineUs) {
      const vM = sampleArrPer(H_WRAP, u);
      plantFloraAt(u, vM + 0.07, false, 'pine');
    }
    const peachUs = [0.16, 0.36, 0.56, 0.76, 0.94];
    for (const u of peachUs) {
      const vB = sampleArrPer(H_BANK, u);
      plantFloraAt(u, vB - 0.055, false, 'peach');
    }
    const willowUs = [0.22, 0.44, 0.63, 0.84];
    for (const u of willowUs) {
      const vB = sampleArrPer(H_BANK, u);
      plantFloraAt(u, vB + 0.015, false, 'willow');
    }
  }

  // Act 4 预绘：5 只《瑞鹤图》扇翅飞鹤 + 2 叶江南乌篷轻舟（含镂空发光舟灯）
  if (targetAct >= 5) {
    const craneSpecs = [
      [0.14, 0.15, 1],
      [0.32, 0.19, 1],
      [0.52, 0.13, 1],
      [0.71, 0.21, 1],
      [0.88, 0.16, 1]
    ];
    for (const [u, v, d] of craneSpecs) spawnCraneAt(u, v, d, false);
    spawnBoatAt(0.28, 0.84, false);
    spawnBoatAt(0.74, 0.87, false);
  }

  // Act 5 -> 6 预绘：点亮烛火、落阳文朱砂印「灯影」、直接展开 3D 旋转走马宫灯与满室光影！
  if (targetAct >= 6) {
    STATE.lit = true;
    STATE.litTime = -10;
    STATE.sealStamped = true;
    STATE.sealTime = -10;
    CAM.lightAmt = 1.0;
    CAM.duskAmt = 1.0;
    CAM.fold = 1.0;
    STATE.foldProgress = 1.0;
    CAM.lanternAngle = 0.22;
    STATE.manualWork = 8;
    STATE.ghostWork = 8;
    staticDirty = true;
    bakeStaticPainting();
  }
}

/* ---------- 幽灵画师自动推进（停手 > 5.5s 自动丝滑接力） ---------- */
function stepGhostPainter(dt) {
  if (STATE.act < 1 || STATE.act > 5 || STATE.actDoneFired) {
    GHOST.active = false;
    return;
  }
  const idleLimit = 5.5 / SPEED;
  if (STATE.idleTime < idleLimit) {
    GHOST.active = false;
    return;
  }
  GHOST.active = true;
  GHOST.phase += dt * SPEED;

  if (STATE.act === 1) {
    // 找尚未画满的列平稳自左向右勾勒连绵泥金山骨
    let targetU = GHOST.u;
    if (sampleArrPer(H_WEIGHT, targetU) > 0.78) {
      let found = -1;
      for (let i = 0; i < GRID_N; i++) {
        if (H_WEIGHT[i] < 0.72) { found = i / GRID_N; break; }
      }
      if (found >= 0) targetU = found;
    }
    const nextU = wrap01(targetU + dt * 0.12 * SPEED);
    const procV = 0.43
      - 0.14 * Math.sin(nextU * TAU * 2.0 + 0.5)
      - 0.09 * Math.cos(nextU * TAU * 3.0 - 0.45)
      - 0.055 * Math.sin(nextU * TAU * 5.0 + 1.2);
    const v0 = clamp(GHOST.v, 0.18, 0.62);
    const v1 = clamp(procV, 0.18, 0.60);
    applyRidgeSegment(targetU, v0, nextU, v1, 0.35, false);
    if (Math.random() < dt * 2.5) {
      AUDIO.playBrushSilk(0.45, 'gold', nextU);
      const nIdx = clamp(Math.round((1 - (v1 - 0.18) / 0.44) * 8), 0, 8);
      AUDIO.playGuqinHarmonic(PENTATONIC_D[nIdx], 0.09, (nextU - 0.5) * 1.1, 2.5);
    }
    GHOST.u = nextU;
    GHOST.v = v1;

  } else if (STATE.act === 2) {
    // 宽幅舒展扫染青绿山峦与春江
    const u = wrap01(GHOST.phase * 0.14);
    const band = Math.floor(GHOST.phase * 0.14) % 3;
    const vBase = band === 0 ? 0.34 : (band === 1 ? 0.58 : 0.82);
    const v = clamp(vBase + Math.sin(GHOST.phase * 1.7) * 0.12, 0.08, 0.94);
    GHOST.u = u;
    GHOST.v = v;
    paintWashBrush(u, v, 0.115, dt * 1.45 * SPEED, false);
    if (Math.random() < dt * 1.6) {
      AUDIO.playBrushSilk(0.35, 'water', u);
    }
    if (STATE.totalTime - STATE.lastXiaoTime > 4.2 / SPEED) {
      STATE.lastXiaoTime = STATE.totalTime;
      const f = PENTATONIC_D[2 + Math.floor(rnd() * 6)];
      AUDIO.playDongxiao(f, 0.09, (u - 0.5) * 0.9, 3.6);
    }

  } else if (STATE.act === 3) {
    GHOST.cooldown -= dt * SPEED;
    if (GHOST.cooldown <= 0 && STATE.floraCount < 13) {
      GHOST.cooldown = 1.55;
      const u = wrap01(0.08 + STATE.floraCount * 0.217 + rand(-0.04, 0.04));
      let type = 'pine';
      if (STATE.peaches.length < STATE.pines.length) type = 'peach';
      else if (STATE.willows.length < Math.min(4, STATE.peaches.length)) type = 'willow';
      const v = type === 'pine'
        ? sampleArrPer(H_WRAP, u) + 0.06
        : (type === 'peach' ? sampleArrPer(H_BANK, u) - 0.05 : sampleArrPer(H_BANK, u) + 0.015);
      GHOST.u = u;
      GHOST.v = v;
      plantFloraAt(u, v, false, type);
    }

  } else if (STATE.act === 4) {
    GHOST.cooldown -= dt * SPEED;
    if (GHOST.cooldown <= 0) {
      GHOST.cooldown = 1.9;
      if (STATE.craneCount < 4) {
        const u = wrap01(0.15 + STATE.craneCount * 0.23);
        const v = rand(0.12, 0.23);
        GHOST.u = u; GHOST.v = v;
        spawnCraneAt(u, v, 1, false);
      } else if (STATE.boatCount < 2) {
        const u = STATE.boatCount === 0 ? 0.30 : 0.72;
        const v = 0.85;
        GHOST.u = u; GHOST.v = v;
        spawnBoatAt(u, v, false);
      }
    }

  } else if (STATE.act === 5) {
    if (!STATE.lit) {
      triggerIgnite(false);
    }
  }
}

/* ---------- 幕间推进判定与终章「山河入曲」动态配乐 ---------- */
function stepActStateMachine(dt) {
  const sDt = dt * SPEED;
  STATE.actTime += sDt;
  STATE.idleTime += dt;

  // 第 1~5 幕 3 秒未动弹出极淡闲置提示
  if (STATE.act >= 1 && STATE.act <= 5 && !STATE.actDoneFired && !STATE.hintShown) {
    if (STATE.idleTime >= 3.0 / SPEED) {
      STATE.hintShown = true;
      showHint(COPY[STATE.act].hint);
    }
  }

  // 检查各幕完成条件（需至少停留 10 秒，或自然时长上限兜底）
  const minStay = 10.0;
  if (!STATE.actDoneFired) {
    if (STATE.act === 1) {
      if ((STATE.ridgeCoverage >= 0.78 && STATE.actTime >= minStay) || STATE.actTime >= 34) {
        ensureFullPeriodicLandscape();
        STATE.actDoneFired = true;
        showHint('');
        showLine(COPY[1].done);
        AUDIO.playGuqinHarmonic(440.0, 0.14, 0, 3.8);
        setTimeout(() => { if (STATE.act === 1) enterAct(2); }, 3200 / SPEED);
      }
    } else if (STATE.act === 2) {
      if ((STATE.washCoverage >= 0.74 && STATE.actTime >= minStay) || STATE.actTime >= 38) {
        ensureFullMineralWash();
        STATE.actDoneFired = true;
        showHint('');
        showLine(COPY[2].done);
        AUDIO.playDongxiao(369.99, 0.11, 0, 3.8);
        setTimeout(() => { if (STATE.act === 2) enterAct(3); }, 3200 / SPEED);
      }
    } else if (STATE.act === 3) {
      if ((STATE.floraCount >= 9 && STATE.actTime >= minStay) || STATE.actTime >= 35) {
        // 保证松桃柳齐全
        if (STATE.pines.length === 0) plantFloraAt(0.25, 0.40, false, 'pine');
        if (STATE.peaches.length === 0) plantFloraAt(0.55, 0.64, false, 'peach');
        if (STATE.willows.length === 0) plantFloraAt(0.75, 0.74, false, 'willow');
        STATE.actDoneFired = true;
        showHint('');
        showLine(COPY[3].done);
        AUDIO.playGuzhengGliss(0.6);
        setTimeout(() => { if (STATE.act === 3) enterAct(4); }, 3200 / SPEED);
      }
    } else if (STATE.act === 4) {
      if ((STATE.craneCount >= 3 && STATE.boatCount >= 1 && STATE.actTime >= minStay) || STATE.actTime >= 35) {
        if (STATE.craneCount < 3) {
          for (let k = STATE.craneCount; k < 3; k++) spawnCraneAt(0.2 + k * 0.28, 0.16, 1, false);
        }
        if (STATE.boatCount < 1) spawnBoatAt(0.36, 0.85, false);
        STATE.actDoneFired = true;
        showHint('');
        showLine(COPY[4].done);
        AUDIO.playCraneCall(0.5);
        setTimeout(() => { if (STATE.act === 4) enterAct(5); }, 3200 / SPEED);
      }
    } else if (STATE.act === 5) {
      if (STATE.lit) {
        const sinceLit = (STATE.totalTime - STATE.litTime) * SPEED;
        CAM.lightAmt = clamp(sinceLit / 0.85, 0, 1);
        CAM.duskAmt = clamp(sinceLit / 1.35, 0, 1);
        if (sinceLit >= 1.15 && !STATE.sealStamped) {
          triggerSealAndFold();
          setTimeout(() => { if (STATE.act === 5) enterAct(6); }, 2500 / SPEED);
        }
      }
    }
  } else if (STATE.act === 5 && STATE.lit) {
    CAM.lightAmt = clamp(CAM.lightAmt + dt * 1.4, 0, 1);
    CAM.duskAmt = clamp(CAM.duskAmt + dt * 0.9, 0, 1);
  }

  // 终章 · 灯影（3.4 秒丝滑卷灯运镜 + 旋转物理 + 山河入曲 + 旁白题跋）
  if (STATE.act === 6) {
    CAM.lightAmt = clamp(CAM.lightAmt + dt * 1.5, 0, 1);
    CAM.duskAmt = clamp(CAM.duskAmt + dt * 1.2, 0, 1);

    if (CAM.fold < 1) {
      CAM.fold = clamp(CAM.fold + (dt * SPEED) / 3.4, 0, 1);
      STATE.foldProgress = CAM.fold;
    } else {
      STATE.foldProgress = 1.0;
    }

    // 旋转惯性阻尼回到优雅热力自转速度（约 43 秒一圈）
    const prevVel = CAM.lanternAngVel;
    if (!PTR.down) {
      const restVel = CAM.lanternAngVel >= 0 ? 0.145 : -0.145;
      CAM.lanternAngVel = lerp(CAM.lanternAngVel, restVel, Math.min(1, dt * 1.25));
    }
    CAM.lanternAngle = (CAM.lanternAngle + CAM.lanternAngVel * dt) % TAU;
    const angAccel = (CAM.lanternAngVel - prevVel) / Math.max(dt, 0.004);

    // 灯下白玉环佩与流苏宫铃二轴阻尼单摆物理
    const windX = Math.sin(STATE.totalTime * 1.35) * 0.12 + Math.cos(STATE.totalTime * 2.1) * 0.05;
    const windZ = Math.cos(STATE.totalTime * 1.1) * 0.06;
    const accX = -19.0 * CAM.pendX - 2.6 * CAM.pendVx + clamp(angAccel * 0.35, -3.2, 3.2) + windX;
    const accZ = -19.0 * CAM.pendZ - 2.6 * CAM.pendVz + windZ;
    CAM.pendVx += accX * dt;
    CAM.pendVz += accZ * dt;
    CAM.pendX = clamp(CAM.pendX + CAM.pendVx * dt, -0.45, 0.45);
    CAM.pendZ = clamp(CAM.pendZ + CAM.pendVz * dt, -0.35, 0.35);

    // 终章「山河入曲」：灯面山脊、松林、飞鹤转过正前方烛火时实时奏响五声古琴与洞箫
    if (CAM.fold >= 0.95) {
      const frontU = wrap01(0.5 - CAM.lanternAngle / TAU);
      if (STATE.lastMusicU < 0) STATE.lastMusicU = frontU;
      const dU = Math.abs(frontU - STATE.lastMusicU);
      if (dU > 0.075 && dU < 0.5) {
        STATE.lastMusicU = frontU;
        const elev = 1 - clamp((sampleArrPer(H_WRAP, frontU) - 0.18) / 0.44, 0, 1);
        const noteIdx = clamp(Math.round(elev * 9), 0, 9);
        AUDIO.playGuqinHarmonic(PENTATONIC_D[noteIdx], 0.105, Math.sin(frontU * TAU) * 0.35, 3.4);

        // 检查是否有飞鹤恰掠过灯前正中
        for (const cr of STATE.cranes) {
          const cu = wrap01(cr.x / SILK_W);
          const diff = Math.min(Math.abs(cu - frontU), 1 - Math.abs(cu - frontU));
          if (diff < 0.055 && STATE.totalTime - STATE.lastCraneNoteTime > 2.4) {
            STATE.lastCraneNoteTime = STATE.totalTime;
            AUDIO.playGuqinHarmonic(PENTATONIC_D[10 + (noteIdx % 4)], 0.085, 0.15, 2.8);
            break;
          }
        }
      }
      if (STATE.totalTime - STATE.lastXiaoTime > 6.8) {
        STATE.lastXiaoTime = STATE.totalTime;
        const elev = 1 - clamp((sampleArrPer(H_WRAP, frontU) - 0.18) / 0.44, 0, 1);
        AUDIO.playDongxiao(PENTATONIC_D[clamp(Math.round(elev * 5), 0, 5)], 0.08, -0.25, 4.4);
      }
    }

    // 终章三段式诗意旁白与收束题跋（进入终章 2.8s 内即柔和浮现「留存灯影 · 再制一灯」）
    const sinceSettled = jumpedToAct6 ? STATE.actTime : Math.max(0, STATE.actTime - 3.4);
    if (CAM.fold >= 0.96) {
      if (STATE.codaStage === 0 && sinceSettled >= 0.35) {
        STATE.codaStage = 1;
        showLine('一灯燃起，满室山河皆动。');
      } else if (STATE.codaStage === 1 && sinceSettled >= 5.6) {
        STATE.codaStage = 2;
        showLine('风过灯檐，替你的山河响了一声。');
        AUDIO.playJadeBell(0.75, 0.1);
      } else if (STATE.codaStage === 2 && sinceSettled >= 10.8) {
        STATE.codaStage = 3;
        showLine(getColophonText());
      }
      if (!STATE.codaLinksShown && sinceSettled >= 2.8) {
        STATE.codaLinksShown = true;
        elCodaLinks.classList.add('on');
      }
    }
  }
}

/* ============================================================================
 * 7. 鼠标 / 触控交互（零视差作画 + 拨灯旋转 + 留存灯影 2400×1440 PNG + 再制一灯）
 * ============================================================================ */
function handlePointerDown(e) {
  if (e.target.closest && (e.target.closest('#coda-links') || e.target.closest('#mute'))) return;
  AUDIO.unlock();
  PTR.down = true;
  PTR.inside = true;
  PTR.x = e.clientX;
  PTR.y = e.clientY;
  PTR.lastX = e.clientX;
  PTR.lastY = e.clientY;
  PTR.strokePts = [];
  STATE.idleTime = 0;

  if (STATE.act === 0) {
    PTR.down = false;
    spawnIntroGoldDust();
    AUDIO.playGuqinHarmonic(293.66, 0.18, 0, 3.8);
    enterAct(1);
    return;
  }

  if (STATE.act >= 1 && STATE.act <= 5) {
    const hit = screenToSilkUV(e.clientX, e.clientY);
    if (!hit) return;
    PTR.lastU = clamp(hit.u, 0, 1);
    PTR.lastV = clamp(hit.v, 0, 1);
    showHint('');

    if (STATE.act === 1 && hit.inside) {
      PTR.strokePts = [{ x: hit.u * SILK_W, y: hit.v * SILK_H }];
      applyRidgeSegment(hit.u, hit.v, wrap01(hit.u + 0.008), hit.v, 0.25, true);
      AUDIO.playBrushSilk(0.4, 'gold', hit.u);
      const elev = 1 - clamp((hit.v - 0.18) / 0.44, 0, 1);
      AUDIO.playGuqinHarmonic(PENTATONIC_D[clamp(Math.round(elev * 8), 0, 8)], 0.13, (hit.u - 0.5) * 1.1, 2.8);
    } else if (STATE.act === 2 && hit.inside) {
      paintWashBrush(hit.u, hit.v, 0.095, 0.42, true);
      AUDIO.playBrushSilk(0.4, 'water', hit.u);
      AUDIO.playDongxiao(PENTATONIC_D[2 + Math.floor(clamp(1 - hit.v, 0, 0.99) * 6)], 0.095, (hit.u - 0.5) * 1.0, 3.2);
    } else if (STATE.act === 3 && hit.inside) {
      plantFloraAt(hit.u, hit.v, true);
    } else if (STATE.act === 4 && hit.inside) {
      const yBank = sampleArrPer(H_BANK, hit.u);
      if (hit.v >= yBank - 0.02) {
        spawnBoatAt(hit.u, hit.v, true);
      } else {
        spawnCraneAt(hit.u, hit.v, 1, true);
      }
    } else if (STATE.act === 5 && !STATE.lit) {
      // 点击灯盏附近或画心任意处即可点亮灯芯
      const pWick = worldToScreen([0, 0.145, 0.24]);
      const dWick = pWick ? Math.hypot(e.clientX - pWick[0], e.clientY - pWick[1]) : 0;
      if (dWick < Math.max(150, VW * 0.24) || hit.inside) {
        triggerIgnite(true);
      }
    }
  }
}

let act1NoteCooldown = 0;
let act3DragDist = 0;
let act4DragDist = 0;

function handlePointerMove(e) {
  PTR.inside = true;
  PTR.x = e.clientX;
  PTR.y = e.clientY;
  PTR.overUI = !!(e.target.closest && (e.target.closest('#coda-links') || e.target.closest('#mute')));

  const dx = e.clientX - PTR.lastX;
  const dy = e.clientY - PTR.lastY;
  const distPx = Math.hypot(dx, dy);

  // 第五幕悬停划过灯芯也可轻燃烛火
  if (STATE.act === 5 && !STATE.lit && distPx > 4) {
    const pWick = worldToScreen([0, 0.145, 0.24]);
    if (pWick && Math.hypot(e.clientX - pWick[0], e.clientY - pWick[1]) < 46) {
      STATE.idleTime = 0;
      triggerIgnite(true);
    }
  }

  if (PTR.down && STATE.act === 6) {
    // 终章左右轻拨/拖拽走马宫灯：加速、反转或抚停，并拂响灯下白玉流苏宫铃！
    STATE.idleTime = 0;
    const angImpulse = (dx / Math.max(320, VW)) * 4.8;
    CAM.lanternAngle = (CAM.lanternAngle + angImpulse) % TAU;
    CAM.lanternAngVel = clamp(angImpulse * 36.0, -3.4, 3.4);
    CAM.pendVx += clamp(angImpulse * 18.0, -2.5, 2.5);
    if (Math.abs(dx) > 10 && STATE.totalTime - STATE.lastBellTime > 0.36) {
      STATE.lastBellTime = STATE.totalTime;
      AUDIO.playJadeBell(clamp(Math.abs(dx) / 28, 0.32, 1.05), clamp((e.clientX / VW - 0.5) * 1.4, -0.8, 0.8));
    }
  } else if (PTR.down && STATE.act >= 1 && STATE.act <= 4 && distPx > 1.5) {
    STATE.idleTime = 0;
    const hit = screenToSilkUV(e.clientX, e.clientY);
    if (hit && hit.inside) {
      const speedNorm = clamp(distPx / 34, 0, 1);

      if (STATE.act === 1) {
        applyRidgeSegment(PTR.lastU, PTR.lastV, hit.u, hit.v, speedNorm, true);
        PTR.strokePts.push({ x: hit.u * SILK_W, y: hit.v * SILK_H });
        if (PTR.strokePts.length >= 6) {
          drawGoldCalligraphyStroke(PTR.strokePts, speedNorm, 0.9);
          PTR.strokePts = PTR.strokePts.slice(-2);
        }
        AUDIO.playBrushSilk(speedNorm, 'gold', hit.u);
        if (STATE.totalTime - act1NoteCooldown > 0.22) {
          act1NoteCooldown = STATE.totalTime;
          const elev = 1 - clamp((hit.v - 0.18) / 0.44, 0, 1);
          AUDIO.playGuqinHarmonic(PENTATONIC_D[clamp(Math.round(elev * 8), 0, 8)], 0.105, (hit.u - 0.5) * 1.1, 2.6);
        }
      } else if (STATE.act === 2) {
        paintWashBrush(hit.u, hit.v, lerp(0.095, 0.068, speedNorm), 0.34, true);
        AUDIO.playBrushSilk(speedNorm, 'water', hit.u);
        if (STATE.totalTime - STATE.lastXiaoTime > 2.6) {
          STATE.lastXiaoTime = STATE.totalTime;
          AUDIO.playDongxiao(PENTATONIC_D[2 + Math.floor(clamp(1 - hit.v, 0, 0.99) * 6)], 0.09, (hit.u - 0.5) * 0.9, 3.0);
        }
      } else if (STATE.act === 3) {
        act3DragDist += distPx;
        if (act3DragDist > 74) {
          act3DragDist = 0;
          plantFloraAt(hit.u, hit.v, true);
        }
      } else if (STATE.act === 4) {
        act4DragDist += distPx;
        if (STATE.goldSparks.length < 95 && rnd() < 0.65) {
          STATE.goldSparks.push({
            x: hit.u * SILK_W,
            y: hit.v * SILK_H,
            vx: rand(-18, 18),
            vy: rand(-16, 16),
            r: rand(1.0, 2.3),
            life: rand(0.4, 0.9),
            maxLife: 0.9
          });
        }
        AUDIO.playBrushSilk(speedNorm, 'carve', hit.u);
        if (act4DragDist > 92) {
          act4DragDist = 0;
          const yBank = sampleArrPer(H_BANK, hit.u);
          if (hit.v < yBank - 0.04) {
            spawnCraneAt(hit.u, hit.v, dx >= 0 ? 1 : -1, true);
          } else {
            spawnBoatAt(hit.u, hit.v, true);
          }
        }
      }
      PTR.lastU = hit.u;
      PTR.lastV = hit.v;
    }
  }

  PTR.lastX = e.clientX;
  PTR.lastY = e.clientY;
}

function handlePointerUp() {
  if (PTR.down && STATE.act === 1 && PTR.strokePts.length >= 2) {
    drawGoldCalligraphyStroke(PTR.strokePts, 0.3, 0.9);
  }
  PTR.down = false;
  PTR.strokePts = [];
  act3DragDist = 0;
  act4DragDist = 0;
}

window.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove);
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);
window.addEventListener('pointerleave', () => { PTR.inside = false; PTR.down = false; });

// 角落静音按钮与 M 快捷键
$('#mute').classList.toggle('muted', AUDIO.muted);
$('#mute').addEventListener('click', (e) => {
  e.stopPropagation();
  AUDIO.setMuted(!AUDIO.muted);
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') {
    AUDIO.setMuted(!AUDIO.muted);
  }
});

/* ---------- 留存灯影：导出 2400×1440 高清纯净 PNG（含雅致朱砂小印，无 UI） ---------- */
function exportSnapshot(triggerDownload = true) {
  const EXP_W = 2400, EXP_H = 1440;
  const exp = document.createElement('canvas');
  exp.width = EXP_W;
  exp.height = EXP_H;
  const ec = exp.getContext('2d');

  if (GL_RES) {
    const prevW = glCanvas.width, prevH = glCanvas.height;
    glCanvas.width = EXP_W;
    glCanvas.height = EXP_H;
    renderWebGL(EXP_W, EXP_H);
    ec.drawImage(glCanvas, 0, 0, EXP_W, EXP_H);
    // 立即恢复主画布分辨率并重绘，零闪烁
    glCanvas.width = prevW;
    glCanvas.height = prevH;
    renderWebGL(prevW, prevH);
  } else {
    ec.drawImage(glCanvas, 0, 0, EXP_W, EXP_H);
  }

  // 右下角极雅致的阳文朱砂小印「灯影」
  drawCinnabarSeal(ec, EXP_W - 102, EXP_H - 96, 68, 0.92);

  const dataUrl = exp.toDataURL('image/png');
  if (triggerDownload) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = '灯影.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  return { width: EXP_W, height: EXP_H, dataUrl };
}

/* ---------- 再制一灯：彻底重置全部画布、粒子与状态，回到序幕素绢 ---------- */
function resetExperience() {
  SEED = ((Math.random() * 1e9) | 0) ^ 0x4D2A7E;
  rnd = mulberry32(SEED);
  jumpedToAct6 = false;

  initDefaultRidges();
  WASH.fill(0);
  WASH_TARGET.fill(0);
  layerWash.g.clearRect(0, 0, SILK_W, SILK_H);
  layerGold.g.clearRect(0, 0, SILK_W, SILK_H);
  layerGoldMask.g.clearRect(0, 0, OPT_W, OPT_H);
  layerFlora.g.clearRect(0, 0, SILK_W, SILK_H);
  generateSilkBase();
  initClouds();

  STATE.actTime = 0;
  STATE.idleTime = 0;
  STATE.foldProgress = 0;
  STATE.manualWork = 0;
  STATE.ghostWork = 0;
  STATE.ridgeCoverage = 0;
  STATE.washCoverage = 0;
  STATE.floraCount = 0;
  STATE.craneCount = 0;
  STATE.boatCount = 0;
  STATE.lit = false;
  STATE.litTime = -1;
  STATE.sealStamped = false;
  STATE.sealTime = -1;
  STATE.pines = [];
  STATE.peaches = [];
  STATE.willows = [];
  STATE.petals = [];
  STATE.cranes = [];
  STATE.boats = [];
  STATE.goldSparks = [];
  STATE.introDust = [];
  STATE.codaStage = 0;
  STATE.codaLinksShown = false;
  STATE.actDoneFired = false;
  STATE.hintShown = false;
  STATE.lastMusicU = -1;

  CAM.fold = 0;
  CAM.lanternAngle = 0;
  CAM.lanternAngVel = 0.145;
  CAM.lightAmt = 0;
  CAM.duskAmt = 0;
  CAM.pendX = 0; CAM.pendVx = 0;
  CAM.pendZ = 0; CAM.pendVz = 0;

  staticDirty = true;
  washCanvasDirty = false;
  goldDirty = false;
  elCodaLinks.classList.remove('on');
  enterAct(0);
}

$('#save-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  exportSnapshot(true);
});
$('#again-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  resetExperience();
});

/* ============================================================================
 * 8. 自动化诊断只读探针 window.__DENGYING__
 * ============================================================================ */
Object.defineProperty(window, '__DENGYING__', {
  configurable: true,
  enumerable: true,
  value: {
    get act() { return STATE.act; },
    get foldProgress() { return Number(STATE.foldProgress.toFixed(4)); },
    get lanternAngle() { return Number(CAM.lanternAngle.toFixed(4)); },
    get manualRatio() { return Number(getManualRatio().toFixed(4)); },
    get stats() {
      return {
        ridgeCoverage: Number(STATE.ridgeCoverage.toFixed(4)),
        washCoverage: Number(STATE.washCoverage.toFixed(4)),
        floraCount: STATE.floraCount,
        craneCount: STATE.craneCount,
        boatCount: STATE.boatCount,
        lit: STATE.lit
      };
    },
    exportSnapshot: () => exportSnapshot(false)
  }
});

/* ============================================================================
 * 9. 启动初始化与 60fps 主渲染循环
 * ============================================================================ */
function resize() {
  VW = window.innerWidth;
  VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  glCanvas.width = Math.max(1, Math.round(VW * DPR));
  glCanvas.height = Math.max(1, Math.round(VH * DPR));
  ovCanvas.width = Math.max(1, Math.round(VW * DPR));
  ovCanvas.height = Math.max(1, Math.round(VH * DPR));
}
window.addEventListener('resize', resize);
resize();

generateSilkBase();
initDefaultRidges();
initClouds();

if (START_ACT > 0) {
  prebakeThroughAct(START_ACT);
  enterAct(START_ACT);
} else {
  enterAct(0);
}

bakeStaticPainting();
updateLiveSilkAndOptics(0, 0.016);
updateCamera(0);

let lastNow = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
  lastNow = now;
  STATE.totalTime += rawDt;

  stepGhostPainter(rawDt);
  stepWashDiffusion(rawDt);
  stepActStateMachine(rawDt);
  updateCamera(STATE.totalTime);
  updateLiveSilkAndOptics(STATE.totalTime, rawDt);

  if (GL_RES) {
    renderWebGL(glCanvas.width, glCanvas.height);
  } else {
    renderFallback2D();
  }
  renderOverlay(STATE.totalTime, rawDt);
}

requestAnimationFrame(loop);
})();
</script>
