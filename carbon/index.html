  // =========================================================================
  // 5. 几何碰撞辅助与 3D 天球圆环投影工具
  // =========================================================================
  function pointSegDist2(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const wx = px - ax, wy = py - ay;
    const l2 = vx * vx + vy * vy;
    if (l2 < 1e-4) return dist2(px, py, ax, ay);
    const t = clamp((wx * vx + wy * vy) / l2, 0, 1);
    const cx = ax + t * vx, cy = ay + t * vy;
    return dist2(px, py, cx, cy);
  }

  function ccw(ax, ay, bx, by, cx, cy) {
    return (cy - ay) * (bx - ax) > (by - ay) * (cx - ax);
  }

  function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
    return (ccw(ax, ay, cx, cy, dx, dy) !== ccw(bx, by, cx, cy, dx, dy)) &&
           (ccw(ax, ay, bx, by, cx, cy) !== ccw(ax, ay, bx, by, dx, dy));
  }

  function angleDiff(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  // 将圆环局部角 theta 投影到银幕世界坐标 (带前后景深 z)
  function projectRingPoint(ring, theta, cx, cy, radiusScale = 1) {
    const r = ring.r * radiusScale;
    const lx = Math.cos(theta) * r;
    const ly = Math.sin(theta) * r * Math.cos(ring.tiltX);
    const lz = Math.sin(theta) * r * Math.sin(ring.tiltX);
    const cz = Math.cos(ring.tiltZ), sz = Math.sin(ring.tiltZ);
    const persp = 1 + lz / 1100;
    return {
      x: cx + (lx * cz - ly * sz) * persp,
      y: cy + (lx * sz + ly * cz) * persp,
      z: lz
    };
  }

  // =========================================================================
  // 6. 实例化视听引擎与五幕物理/叙事主模拟步进
  // =========================================================================
  const stageEl = document.getElementById('stage');
  const glCanvas = document.getElementById('gl-canvas');
  const sceneCanvas = document.getElementById('scene-canvas');
  const ctx = sceneCanvas.getContext('2d');

  const glSky = new SkyWaterRenderer(glCanvas);
  const sound = new SoundEngine();

  function getActIndex(t) {
    if (t < 34) return 0;
    if (t < 70) return 1;
    if (t < 108) return 2;
    if (t < 144) return 3;
    return 4;
  }

  function updateWorld(dt) {
    const t = state.filmTime;
    const amb = state.ambientTime;
    state.actIdx = getActIndex(t);

    if (state.agencyTimer > 0) {
      state.agencyTimer = Math.max(0, state.agencyTimer - dt);
    }

    // 1) 计算五幕全局镜头、海平面、天体坐标与色调演进
    let targetSeaY = 700;
    let targetSunX = 1380;
    let targetSunY = 250;
    let targetSunR = 78;
    let targetStorm = 0;
    let targetDawn = 0;

    if (!state.started) {
      targetSeaY = 705;
      targetSunX = 1360;
      targetSunY = 255;
      targetSunR = 76;
    } else if (t < 34) {
      // 第一幕：镜海启航
      const p = t / 34;
      targetSeaY = lerp(705, 735, smoothstep(0.65, 1.0, p));
      targetSunX = lerp(1360, 1180, p);
      targetSunY = lerp(255, 225, p);
      targetSunR = 78;
    } else if (t < 70) {
      // 第二幕：风碑长峡，海面退向谷底，镜头仰望千丈石阵
      const p = (t - 34) / 36;
      targetSeaY = lerp(735, 935, smoothstep(0.0, 0.45, p));
      targetSunX = lerp(1180, 990, p);
      targetSunY = lerp(225, 210, p);
      targetSunR = lerp(78, 102, p);
      targetStorm = smoothstep(0.72, 1.0, p) * 0.35;
    } else if (t < 108) {
      // 第三幕：碎时涡流，高天风暴与三道铜环
      const p = (t - 70) / 38;
      targetSeaY = 1140;
      targetSunX = 960;
      targetSunY = 395;
      targetSunR = 118;
      const calmFactor = state.ringsAligned * 0.22;
      targetStorm = clamp(0.88 - calmFactor + Math.sin(t * 1.5) * 0.08, 0.18, 1.0);
      if (p > 0.86) targetStorm *= lerp(1, 0.15, (p - 0.86) / 0.14);
    } else if (t < 144) {
      // 第四幕：太初日心，万籁俱寂 -> 金缮合拢 -> 138s 破晓爆发后镜头徐徐降回海面
      targetSeaY = lerp(1140, 740, smoothstep(139, 144, t));
      targetSunX = 960;
      targetSunY = lerp(395, 355, smoothstep(108, 138, t));
      targetSunR = lerp(122, 184, smoothstep(108, 116, t));
      if (t >= 138) {
        targetSunR = lerp(184, 126, smoothstep(138, 144, t));
        targetDawn = smoothstep(138, 142.5, t);
      }
      targetStorm = 0;
    } else {
      // 第五幕：重返人间千檐港，晨曦满海
      const p = clamp((t - 144) / 24, 0, 1);
      targetSeaY = lerp(740, 706, smoothstep(0.0, 0.25, p));
      targetSunX = lerp(960, 1220, smoothstep(0.0, 0.85, p));
      targetSunY = lerp(355, 275, smoothstep(0.0, 0.85, p));
      targetSunR = lerp(126, 96, smoothstep(0.0, 0.6, p));
      targetDawn = 1.0;
    }

    const kLerp = 1 - Math.exp(-dt * 4.2);
    state.seaWorldY = lerp(state.seaWorldY, targetSeaY, kLerp);
    state.sunWX = lerp(state.sunWX, targetSunX, kLerp);
    state.sunWY = lerp(state.sunWY, targetSunY, kLerp);
    state.sunRadius = lerp(state.sunRadius, targetSunR, kLerp);
    state.stormAmt = lerp(state.stormAmt, targetStorm, kLerp);
    state.dawnAmt = lerp(state.dawnAmt, targetDawn, 1 - Math.exp(-dt * 2.8));

    const targetWarmth = clamp(
      state.embersGathered * 0.08 + state.windowsLit * 0.015 + state.kintsugiRatio * 0.55,
      0, 1
    );
    const targetEmerald = clamp(
      state.stringsPlucked * 0.075 + state.windStrokesCount * 0.05,
      0, 1
    );
    state.warmthAmt = lerp(state.warmthAmt, targetWarmth, kLerp);
    state.emeraldAmt = lerp(state.emeraldAmt, targetEmerald, kLerp);

    state.lightningFlash = Math.max(0, state.lightningFlash - dt * 2.6);
    state.shake = Math.max(0, state.shake - dt * 24);

    // 138.0 秒：第零次黎明爆发事件
    if (state.started && state.prevFilmTime < 138.0 && t >= 138.0 && !state.dawnTriggered) {
      triggerDawnClimax();
    }
    if (state.dawnShockwave >= 0) {
      state.dawnShockwave += dt * 980;
      if (state.dawnShockwave > 2600) state.dawnShockwave = -1;
    }

    // 2) 更新小晷木舟轨迹与物理姿态
    let boatTargetX = 460;
    let boatTargetY = state.seaWorldY - 4;
    if (!state.started) {
      boatTargetX = 460 + Math.sin(amb * 0.6) * 8;
      boatTargetY = state.seaWorldY - 3 + Math.sin(amb * 1.4) * 3;
      boat.oarPhase += dt * 0.7;
    } else if (t < 34) {
      const p = t / 34;
      const speedBoost = Math.min(110, state.embersGathered * 12);
      boatTargetX = lerp(460, 860 + speedBoost, smoothstep(0, 1, p));
      boatTargetY = state.seaWorldY - 3 + Math.sin(t * 2.1) * 4;
      boat.oarPhase += dt * (2.1 + Math.min(1.2, state.embersGathered * 0.12));
      if (Math.sin(boat.oarPhase) > 0.96 && Math.random() < 0.35) {
        spawnRipple(boat.x - 18, state.seaWorldY + 3, 52, 0.35, 'silver');
      }
    } else if (t < 70) {
      const p = (t - 34) / 36;
      // 扁舟乘峡谷雾流徐徐升起，在石碑群中央穿行
      boatTargetX = lerp(890, 960, p) + Math.sin((t - 34) * 0.65) * 75;
      boatTargetY = lerp(732, 575, smoothstep(0.0, 0.95, p)) + Math.sin(t * 1.8) * 8;
      boat.oarPhase += dt * 1.2;
    } else if (t < 108) {
      // 风暴中心下方逆风稳住舟身
      boatTargetX = 960 + Math.sin((t - 70) * 0.85) * 95;
      boatTargetY = lerp(575, 785, smoothstep(70, 76, t)) + Math.cos(t * 1.25) * 16;
      boat.oarPhase += dt * 0.9;
    } else if (t < 144) {
      // 悬停于太初日心正下方，举杖归还昼火
      boatTargetX = 960;
      boatTargetY = lerp(785, 702, smoothstep(108, 118, t)) + Math.sin(t * 1.3) * 5;
    } else {
      // 归港破晓，平缓驶入苏醒的千檐港湾
      const p = clamp((t - 144) / 24, 0, 1);
      boatTargetX = lerp(960, 745, smoothstep(0, 0.88, p));
      boatTargetY = state.seaWorldY - 3 + Math.sin(amb * 1.6) * 3.5;
      // 若观众曾伸出援手，小晷在 153 秒后向屏幕深深作揖致意
      const totalHelp = state.embersGathered + state.stringsPlucked + state.shardsDeflected + state.ringsAligned * 3 + (state.kintsugiRatio > 0.3 ? 5 : 0);
      if (t >= 153 && totalHelp >= 3) {
        const bowWave = Math.sin(clamp((t - 153) / 7.5, 0, 1) * Math.PI);
        boat.bowAmount = lerp(boat.bowAmount, bowWave, dt * 4);
      } else {
        boat.bowAmount = lerp(boat.bowAmount, 0, dt * 4);
      }
    }

    // 章节切换时若舟横坐标跨度较大则平滑过渡，避免瞬移突兀
    const prevX = boat.x;
    boat.x = lerp(boat.x, boatTargetX, 1 - Math.exp(-dt * 2.6));
    boat.y = lerp(boat.y, boatTargetY, 1 - Math.exp(-dt * 3.4));
    boat.vx = (boat.x - prevX) / Math.max(dt, 0.001);
    boat.hitRecoil = Math.max(0, boat.hitRecoil - dt * 2.8);
    const desiredTilt = clamp(boat.vx * 0.00055, -0.14, 0.14) + Math.sin(amb * 1.9) * 0.025 - boat.hitRecoil * 0.12;
    boat.tilt = lerp(boat.tilt, desiredTilt, 1 - Math.exp(-dt * 6));

    const targetLantern = clamp(0.28 + state.embersGathered * 0.095 + state.dawnAmt * 0.35 - boat.hitRecoil * 0.1, 0.18, 1.25);
    boat.lanternPower = lerp(boat.lanternPower, targetLantern, dt * 3.5);

    // 更新船帆与斗篷 Verlet 柔体链
    const windX = (state.actIdx === 1 ? 36 : state.actIdx === 2 ? -52 : 22) + Math.sin(amb * 2.3) * 14 - boat.vx * 0.12;
    const windY = state.actIdx === 1 ? -14 : 6;
    updateRibbonChain(boat.sailNodes, boat.x - 4, boat.y - 76, windX, windY, 9.5, dt);
    updateRibbonChain(boat.cloakNodes, boat.x + 14, boat.y - 31, windX * 0.72, 12, 6.5, dt);

    // 3) 分幕核心互动与世界实体模拟
    if (!state.started || t < 36 || t >= 142) {
      updateHarborAct(dt, t);
    }
    if (state.started && t >= 31 && t < 73) {
      updateCanyonAct(dt, t);
    }
    if (state.started && t >= 68 && t < 111) {
      updateTempestAct(dt, t);
    }
    if (state.started && t >= 106 && t < 144) {
      updateKintsugiAct(dt, t);
    }
    if (state.started && t >= 140) {
      updateEpilogueAct(dt, t);
    }

    // 4) 更新全局粒子与涟漪
    updateParticlesAndRipples(dt, amb);
  }

  function updateRibbonChain(nodes, anchorX, anchorY, fx, fy, segLen, dt) {
    if (!nodes.length) return;
    nodes[0].x = anchorX;
    nodes[0].y = anchorY;
    const step2 = dt * dt * 28;
    for (let i = 1; i < nodes.length; i++) {
      const n = nodes[i];
      const vx = (n.x - n.ox) * 0.90;
      const vy = (n.y - n.oy) * 0.90;
      n.ox = n.x;
      n.oy = n.y;
      n.x += vx + fx * step2;
      n.y += vy + fy * step2;
    }
    for (let iter = 0; iter < 3; iter++) {
      nodes[0].x = anchorX;
      nodes[0].y = anchorY;
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i], b = nodes[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = (d - segLen) / d;
        if (i === 0) {
          b.x -= dx * diff;
          b.y -= dy * diff;
        } else {
          a.x += dx * diff * 0.5;
          a.y += dy * diff * 0.5;
          b.x -= dx * diff * 0.5;
          b.y -= dy * diff * 0.5;
        }
      }
    }
  }

  // 第一幕互动：拂水生澜、唤醒千檐窗火、向上牵引水底沉昼
  function updateHarborAct(dt, t) {
    const isAct1 = state.started && t < 34.5;
    const isAct5 = state.started && t >= 142;
    const camShift = isAct1 ? lerp(0, -240, t / 34) : (isAct5 ? -110 : 0);

    // 光标掠过海面激起涟漪
    if (pointer.inside && !pointer.overUI && pointer.wy > state.seaWorldY - 12 && pointer.speed > 140) {
      if (Math.random() < 0.38) {
        spawnRipple(pointer.wx, clamp(pointer.wy, state.seaWorldY + 2, 1060), 64, 0.42, state.dawnAmt > 0.5 ? 'gold' : 'silver');
      }
    }

    // 唤醒千檐木楼灯火
    for (let i = 0; i < harborHouses.length; i++) {
      const h = harborHouses[i];
      const hx = h.bx + camShift * h.depth;
      const topY = h.yBase - h.stiltH - h.h;
      for (let w = 0; w < h.wins.length; w++) {
        const win = h.wins[w];
        if (isAct5 && (state.warmthAmt > 0.25 || win.autoLit)) {
          win.lit = Math.min(1, win.lit + dt * 0.9);
        }
        if (pointer.inside && !pointer.overUI && win.lit < 0.85) {
          const wx = hx + win.rx * h.w * 0.78;
          const wy = topY + win.ry * h.h;
          if (dist2(pointer.wx, pointer.wy, wx, wy) < 48 * 48) {
            if (win.lit < 0.2) {
              state.windowsLit++;
              sound.playWindowChime(win.id);
              notifyAgency('点亮千檐灯火');
              for (let k = 0; k < 5; k++) {
                spawnParticle({
                  x: wx, y: wy,
                  vx: (Math.random() - 0.5) * 45,
                  vy: -20 - Math.random() * 45,
                  size: 8 + Math.random() * 8,
                  life: 0.9 + Math.random() * 0.5,
                  maxLife: 1.4,
                  sprite: 'warm'
                });
              }
            }
            win.lit = 1;
          }
        }
      }
    }

    if (!isAct1) return;

    // 水下沉昼碎金物理与牵引
    for (let i = 0; i < sunkenEmbers.length; i++) {
      const e = sunkenEmbers[i];
      if (e.state === 'captured') continue;

      if (e.state === 'sunken') {
        e.phase += dt * 2.2;
        e.x = e.baseX + camShift * 0.75 + Math.sin(e.phase) * 14;
        e.y += Math.sin(e.phase * 0.8) * dt * 10;

        // 观众零操作保底：小晷途中自然拾起 2 缕浮光，保证叙事流畅自洽
        if (t >= e.autoCatchAt) {
          e.state = 'rising';
          e.vy = -150;
        }

        // 观众光标靠近或点击/向上牵引水底碎金
        if (pointer.inside && !pointer.overUI) {
          const dSq = dist2(pointer.wx, pointer.wy, e.x, e.y);
          const pullR = pointer.down ? 165 : 105;
          if (dSq < pullR * pullR) {
            const pullStrength = pointer.down ? 420 : (pointer.vy < -60 ? 360 : 210);
            e.y -= pullStrength * dt;
            e.x = lerp(e.x, pointer.wx, dt * 3.5);
            if (e.y <= state.seaWorldY + 26 || pointer.down) {
              e.state = 'rising';
              e.vy = -210;
              notifyAgency('牵引沉昼出水');
            }
          }
        }
      } else if (e.state === 'rising') {
        e.vy -= 260 * dt;
        e.y += e.vy * dt;
        if (e.y <= state.seaWorldY) {
          e.state = 'homing';
          sound.playEmberSplash();
          spawnRipple(e.x, state.seaWorldY + 2, 92, 0.75, 'gold');
          for (let k = 0; k < 12; k++) {
            const ang = -Math.PI * (0.12 + Math.random() * 0.76);
            const spd = 70 + Math.random() * 140;
            spawnParticle({
              x: e.x,
              y: state.seaWorldY,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              gy: 260,
              size: 9 + Math.random() * 10,
              life: 0.75 + Math.random() * 0.45,
              maxLife: 1.2,
              sprite: 'gold'
            });
          }
        }
      } else if (e.state === 'homing') {
        const tx = boat.x + 22;
        const ty = boat.y - 52;
        const dx = tx - e.x, dy = ty - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const spd = 460 + (1 - clamp(d / 500, 0, 1)) * 260;
        e.x += (dx / d) * spd * dt;
        e.y += (dy / d) * spd * dt - Math.sin(clamp(d / 360, 0, 1) * Math.PI) * 140 * dt;
        if (Math.random() < 0.75) {
          spawnParticle({
            x: e.x, y: e.y,
            vx: (Math.random() - 0.5) * 24,
            vy: (Math.random() - 0.5) * 24,
            size: 11,
            life: 0.45,
            maxLife: 0.45,
            sprite: 'gold'
          });
        }
        if (d < 26) {
          e.state = 'captured';
          state.embersGathered++;
          boat.orbitEmbers.push({
            ang: Math.random() * TAU,
            speed: 1.8 + Math.random() * 1.6,
            orbitR: 12 + Math.random() * 18,
            yOff: (Math.random() - 0.5) * 14
          });
          sound.playEmberAbsorb(state.embersGathered);
          notifyAgency(`昼火归灯 · 第 ${state.embersGathered} 缕`);
          for (let k = 0; k < 14; k++) {
            const a = (k / 14) * TAU;
            spawnParticle({
              x: tx, y: ty,
              vx: Math.cos(a) * (45 + Math.random() * 65),
              vy: Math.sin(a) * (45 + Math.random() * 65),
              size: 14,
              life: 0.7,
              maxLife: 0.7,
              sprite: 'gold'
            });
          }
        }
      }
    }
  }

  // 第二幕互动：拨动风碑古弦催开春花、手绘流风轨托帆直上
  function updateCanyonAct(dt, t) {
    const localP = clamp((t - 34) / 36, 0, 1);
    const scrollX = lerp(120, -210, localP);

    for (let i = 0; i < monoliths.length; i++) {
      const m = monoliths[i];
      m.x = m.baseX + scrollX * m.depth;
      m.runeGlow = Math.max(0, m.runeGlow - dt * 0.45);
    }

    // 悬弦 Verlet 物理与光标扫弦检测
    const canPluck = pointer.inside && !pointer.overUI && (pointer.speed > 45 || pointer.down);
    for (let s = 0; s < canyonStrings.length; s++) {
      const st = canyonStrings[s];
      st.cooldown = Math.max(0, st.cooldown - dt);
      st.energy = Math.max(0, st.energy - dt * 0.65);

      const mA = monoliths[st.mA];
      const mB = monoliths[st.mB];
      const ax = mA.x, ay = st.yA;
      const bx = mB.x, by = st.yB;
      const pts = st.pts;
      const last = pts.length - 1;
      const restLen = Math.hypot(bx - ax, by - ay) / last * 1.035;

      pts[0].x = ax; pts[0].y = ay;
      pts[last].x = bx; pts[last].y = by;

      for (let i = 1; i < last; i++) {
        const p = pts[i];
        const vx = (p.x - p.ox) * 0.945;
        const vy = (p.y - p.oy) * 0.945;
        p.ox = p.x;
        p.oy = p.y;
        p.x += vx + Math.sin(t * 2.2 + s) * 0.08;
        p.y += vy + 240 * dt * dt;

        if (canPluck && st.cooldown <= 0) {
          const crossed = segmentsIntersect(pointer.pwx, pointer.pwy, pointer.wx, pointer.wy, pts[i - 1].x, pts[i - 1].y, p.x, p.y);
          const near = pointSegDist2(pointer.wx, pointer.wy, pts[i - 1].x, pts[i - 1].y, p.x, p.y) < 22 * 22;
          if (crossed || near) {
            st.cooldown = 0.24;
            st.energy = 1.0;
            st.pluckedCount++;
            state.stringsPlucked++;
            mA.runeGlow = 1.0;
            mB.runeGlow = 1.0;

            const impX = clamp(pointer.vx * 0.032, -26, 26);
            const impY = clamp(pointer.vy * 0.032, -32, 32) || -20;
            p.x += impX;
            p.y += impY;
            if (i > 1) pts[i - 1].y += impY * 0.6;
            if (i < last - 1) pts[i + 1].y += impY * 0.6;

            sound.playGuzhengPluck(st.id);
            notifyAgency('抚弦唤醒绝壁春花');

            // 在两侧石碑催开荧光春花
            const pickM = Math.random() < 0.5 ? mA : mB;
            const edgeX = pickM.x + (Math.random() < 0.5 ? -pickM.w * 0.44 : pickM.w * 0.44);
            const edgeY = clamp((ay + by) * 0.5 + (Math.random() - 0.5) * 150, pickM.topY + 35, 760);
            spawnCliffBlossom(edgeX, edgeY, 0.85 + Math.random() * 0.45);

            for (let k = 0; k < 10; k++) {
              spawnParticle({
                x: p.x, y: p.y,
                vx: (Math.random() - 0.5) * 130,
                vy: (Math.random() - 0.5) * 130 - 25,
                size: 11 + Math.random() * 9,
                life: 0.85 + Math.random() * 0.4,
                maxLife: 1.25,
                sprite: k % 3 === 0 ? 'rose' : 'cyan'
              });
            }
          }
        }
      }

      for (let iter = 0; iter < 4; iter++) {
        pts[0].x = ax; pts[0].y = ay;
        pts[last].x = bx; pts[last].y = by;
        for (let i = 0; i < last; i++) {
          const p1 = pts[i], p2 = pts[i + 1];
          const dx = p2.x - p1.x, dy = p2.y - p1.y;
          const d = Math.hypot(dx, dy) || 0.001;
          const diff = (d - restLen) / d;
          if (i === 0) {
            p2.x -= dx * diff; p2.y -= dy * diff;
          } else if (i + 1 === last) {
            p1.x += dx * diff; p1.y += dy * diff;
          } else {
            p1.x += dx * diff * 0.5; p1.y += dy * diff * 0.5;
            p2.x -= dx * diff * 0.5; p2.y -= dy * diff * 0.5;
          }
        }
      }
    }

    // 绝壁春花生长动画
    for (let i = 0; i < cliffBlossoms.length; i++) {
      cliffBlossoms[i].grow = Math.min(1, cliffBlossoms[i].grow + dt * 1.45);
    }

    // 按住拖曳绘出流风丝带
    if (pointer.down && pointer.inside && !pointer.overUI && pointer.speed > 65) {
      let cur = windRibbons[windRibbons.length - 1];
      if (!cur || !cur.active || cur.pts.length > 46) {
        cur = { pts: [], life: 1.0, active: true };
        windRibbons.push(cur);
        state.windStrokesCount++;
        notifyAgency('绘出长风托举孤帆');
      }
      const lastPt = cur.pts[cur.pts.length - 1];
      if (!lastPt || dist2(lastPt.x, lastPt.y, pointer.wx, pointer.wy) > 14 * 14) {
        cur.pts.push({ x: pointer.wx, y: pointer.wy });
        sound.playWindBrush(clamp(pointer.speed / 1400, 0, 1));
        boat.x += clamp(pointer.vx * dt * 0.06, -9, 14);
        boat.y += clamp(pointer.vy * dt * 0.05, -12, 8);
        if (Math.random() < 0.6) {
          spawnParticle({
            x: pointer.wx, y: pointer.wy,
            vx: pointer.vx * 0.12 + (Math.random() - 0.5) * 30,
            vy: pointer.vy * 0.12 + (Math.random() - 0.5) * 30,
            size: 12,
            life: 0.75,
            maxLife: 0.75,
            sprite: 'cyan'
          });
        }
      }
    } else if (windRibbons.length && windRibbons[windRibbons.length - 1].active) {
      windRibbons[windRibbons.length - 1].active = false;
    }

    for (let i = windRibbons.length - 1; i >= 0; i--) {
      const r = windRibbons[i];
      if (!r.active) r.life -= dt * 0.48;
      for (let k = 0; k < r.pts.length; k++) {
        r.pts[k].x += 22 * dt;
        r.pts[k].y -= 8 * dt;
      }
      if (r.life <= 0) windRibbons.splice(i, 1);
    }

    // 峡谷漂浮风雪微尘
    if (Math.random() < 0.45) {
      spawnParticle({
        x: -60 + Math.random() * 2040,
        y: 60 + Math.random() * 820,
        vx: 45 + Math.random() * 55,
        vy: -14 - Math.random() * 24,
        size: 6 + Math.random() * 6,
        life: 2.2,
        maxLife: 2.2,
        sprite: state.emeraldAmt > 0.25 ? 'cyan' : 'silver'
      });
    }
  }

  // 第三幕互动：撑起折光护盾击碎蚀影风雹 + 拖曳校准三道 3D 铜环
  function updateTempestAct(dt, t) {
    const cx = state.sunWX, cy = state.sunWY;

    // 铜环旋转、拖拽与归位锁定
    for (let i = 0; i < celestialRings.length; i++) {
      const ring = celestialRings[i];
      ring.hover = Math.max(0, ring.hover - dt * 4);
      if (ring.locked) {
        ring.angle = lerp(ring.angle, ring.targetAngle, 1 - Math.exp(-dt * 10));
        ring.lockGlow = Math.min(1, ring.lockGlow + dt * 2.2);
        continue;
      }

      if (pointer.dragRingIdx === i && pointer.down) {
        const curAng = Math.atan2(pointer.wy - cy, pointer.wx - cx);
        const dAng = angleDiff(pointer.dragPrevAng, curAng);
        ring.angle += dAng * 1.15;
        pointer.dragPrevAng = curAng;
        ring.hover = 1;
      } else {
        // 未被按住时，检查光标是否掠过铜环上的宝石节点，轻扫亦可推动
        const keyPt = projectRingPoint(ring, ring.angle, cx, cy);
        const dKey = Math.hypot(pointer.wx - keyPt.x, pointer.wy - keyPt.y);
        if (pointer.inside && !pointer.overUI && dKey < 58) {
          ring.hover = 1;
          if (pointer.speed > 80) {
            const diffToTarget = angleDiff(ring.angle, ring.targetAngle);
            ring.angVel += Math.sign(diffToTarget || 1) * 1.8 * dt;
          }
        }
        ring.angle += (ring.driftSpeed * (1 - ring.hover * 0.7) + ring.angVel) * dt;
        ring.angVel *= Math.pow(0.25, dt);
      }

      // 判断是否对准黄金缺口
      if (Math.abs(angleDiff(ring.angle, ring.targetAngle)) < 0.20) {
        ring.locked = true;
        ring.angle = ring.targetAngle;
        if (pointer.dragRingIdx === i) pointer.dragRingIdx = -1;
        state.ringsAligned++;
        state.lightningFlash = 0.55;
        sound.playRingLock(i);
        notifyAgency(`天晷铜环归位 (${state.ringsAligned}/3)`);

        const lockPt = projectRingPoint(ring, ring.targetAngle, cx, cy);
        for (let k = 0; k < 22; k++) {
          const a = (k / 22) * TAU;
          spawnParticle({
            x: lockPt.x, y: lockPt.y,
            vx: Math.cos(a) * (60 + Math.random() * 110),
            vy: Math.sin(a) * (60 + Math.random() * 110),
            size: 15,
            life: 0.9,
            maxLife: 0.9,
            sprite: 'gold'
          });
        }
      }
    }

    // 生成袭向木舟的蚀影风雹
    const spawnChance = (0.048 - state.ringsAligned * 0.011) * (t < 104 ? 1 : 0.25);
    if (shadowShards.length < 18 && Math.random() < spawnChance) {
      const fromAng = -Math.PI * (0.12 + Math.random() * 0.76);
      const sx = cx + Math.cos(fromAng) * (140 + Math.random() * 260);
      const sy = cy + Math.sin(fromAng) * (90 + Math.random() * 140);
      const aimX = boat.x + (Math.random() - 0.5) * 70;
      const aimY = boat.y - 36;
      const dx = aimX - sx, dy = aimY - sy;
      const d = Math.hypot(dx, dy) || 1;
      const spd = 250 + Math.random() * 145;
      shadowShards.push({
        x: sx, y: sy,
        vx: (dx / d) * spd,
        vy: (dy / d) * spd,
        rot: Math.atan2(dy, dx),
        len: 20 + Math.random() * 14
      });
      if (Math.random() < 0.22) state.lightningFlash = 0.42;
    }

    // 折光护盾角度：由木舟指向观众光标
    const shieldCenterX = boat.x + 8;
    const shieldCenterY = boat.y - 42;
    const shieldAng = pointer.inside
      ? Math.atan2(pointer.wy - shieldCenterY, pointer.wx - shieldCenterX)
      : -Math.PI * 0.5;
    const shieldActive = pointer.inside && !pointer.overUI;
    const shieldR = 96;

    for (let i = shadowShards.length - 1; i >= 0; i--) {
      const sh = shadowShards[i];
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;

      let blocked = false;
      if (shieldActive) {
        // 判定 1：撞上舟前折光穹盾圆弧
        const dBoat = Math.hypot(sh.x - shieldCenterX, sh.y - shieldCenterY);
        const sAng = Math.atan2(sh.y - shieldCenterY, sh.x - shieldCenterX);
        if (dBoat > shieldR - 24 && dBoat < shieldR + 24 && Math.abs(angleDiff(sAng, shieldAng)) < 0.85) {
          blocked = true;
        }
        // 判定 2：光标直接挥击拦截风雹
        if (!blocked && dist2(sh.x, sh.y, pointer.wx, pointer.wy) < 58 * 58) {
          blocked = true;
        }
      }

      if (blocked) {
        state.shardsDeflected++;
        sound.playShieldShatter();
        notifyAgency('折光护盾击碎蚀影');
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * TAU;
          const sp = 55 + Math.random() * 130;
          spawnParticle({
            x: sh.x, y: sh.y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            size: 11 + Math.random() * 8,
            life: 0.55 + Math.random() * 0.3,
            maxLife: 0.85,
            sprite: k % 2 === 0 ? 'gold' : 'cyan'
          });
        }
        shadowShards.splice(i, 1);
        continue;
      }

      // 命中木舟（静观模式下亦只震落外层浮火，绝不卡关）
      if (dist2(sh.x, sh.y, shieldCenterX, shieldCenterY) < 34 * 34) {
        boat.hitRecoil = 0.85;
        state.shake = 7;
        for (let k = 0; k < 7; k++) {
          spawnParticle({
            x: sh.x, y: sh.y,
            vx: (Math.random() - 0.5) * 110,
            vy: -20 - Math.random() * 80,
            size: 10,
            life: 0.5,
            maxLife: 0.5,
            sprite: 'warm'
          });
        }
        shadowShards.splice(i, 1);
        continue;
      }

      if (sh.y > 1150 || sh.x < -200 || sh.x > 2120) {
        shadowShards.splice(i, 1);
      }
    }
  }

  // 第四幕互动：流金修补破碎太初日心 (金缮补天)
  function updateKintsugiAct(dt, t) {
    const cx = state.sunWX, cy = state.sunWY, r = state.sunRadius;

    // 静观保底：小晷举起灯杖，微光缓缓注入中央主裂隙 (至 138s 约自动弥合 18%)
    if (t >= 111 && t < 138) {
      for (let i = 0; i < sunCracks.length; i++) {
        const c = sunCracks[i];
        if (c.isCore) {
          c.mended = Math.min(1, c.mended + dt * 0.036);
        }
      }
      if (Math.random() < 0.35) {
        spawnParticle({
          x: boat.x + 20 + (Math.random() - 0.5) * 14,
          y: boat.y - 68,
          vx: (cx - boat.x) * 0.35 + (Math.random() - 0.5) * 35,
          vy: -150 - Math.random() * 70,
          size: 11,
          life: 1.3,
          maxLife: 1.3,
          sprite: 'gold'
        });
      }
    }

    // 观众拂过或按住日心裂痕：倾注流金快速熔接天裂
    if (t < 138.5 && pointer.inside && !pointer.overUI) {
      const brushR = pointer.down ? 62 : 44;
      let weldedNow = false;
      for (let i = 0; i < sunCracks.length; i++) {
        const c = sunCracks[i];
        if (c.mended >= 1) continue;
        const ax = cx + c.x1 * r, ay = cy + c.y1 * r;
        const bx = cx + c.x2 * r, by = cy + c.y2 * r;
        const dSq = pointSegDist2(pointer.wx, pointer.wy, ax, ay, bx, by);
        if (dSq < brushR * brushR) {
          const rate = pointer.down ? 2.6 : (pointer.speed > 35 ? 1.85 : 0.9);
          c.mended = Math.min(1, c.mended + dt * rate);
          weldedNow = true;
          if (Math.random() < 0.55) {
            const mx = (ax + bx) * 0.5, my = (ay + by) * 0.5;
            spawnParticle({
              x: mx, y: my,
              vx: (Math.random() - 0.5) * 75,
              vy: (Math.random() - 0.5) * 75 - 15,
              size: 12 + Math.random() * 8,
              life: 0.7,
              maxLife: 0.7,
              sprite: 'gold'
            });
          }
        }
      }
      if (weldedNow) {
        sound.playKintsugiWeld(state.kintsugiRatio);
        notifyAgency(`金缮修补日心 · ${Math.round(state.kintsugiRatio * 100)}%`);
      }
    }

    let sum = 0;
    for (let i = 0; i < sunCracks.length; i++) sum += sunCracks[i].mended;
    state.kintsugiRatio = sunCracks.length ? sum / sunCracks.length : 0;
  }

  function triggerDawnClimax() {
    state.dawnTriggered = true;
    state.dawnShockwave = 10;
    state.shake = 10;
    const richness = clamp(state.warmthAmt * 0.6 + state.kintsugiRatio * 0.7, 0, 1);
    sound.playDawnEruption(richness);

    for (let k = 0; k < 65; k++) {
      const a = (k / 65) * TAU + Math.random() * 0.08;
      const sp = 120 + Math.random() * 340;
      spawnParticle({
        x: state.sunWX,
        y: state.sunWY,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        size: 16 + Math.random() * 18,
        life: 1.2 + Math.random() * 0.9,
        maxLife: 2.1,
        sprite: richness > 0.32 ? 'gold' : 'silver'
      });
    }

    // 破晓后为港湾预生成首批飞舞白鹭与祈愿天灯
    const birdCount = richness > 0.3 ? 9 : 3;
    for (let i = 0; i < birdCount; i++) {
      spawnCrane(180 + Math.random() * 1560, 220 + Math.random() * 320);
    }
    if (richness > 0.35 || state.emeraldAmt > 0.3) {
      for (let i = 0; i < 10; i++) {
        spawnSkyLantern(220 + Math.random() * 1480, 620 + Math.random() * 90, false);
      }
    }
  }

  // 第五幕互动：破晓港湾天灯升空与白鹭齐飞
  function updateEpilogueAct(dt, _t) {
    const rich = state.warmthAmt + state.emeraldAmt;
    if (rich > 0.45 && Math.random() < 0.035) {
      spawnSkyLantern(180 + Math.random() * 1560, 650 + Math.random() * 50, false);
    }
    if (Math.random() < 0.015) {
      spawnCrane(Math.random() < 0.5 ? -40 : 1960, 180 + Math.random() * 300);
    }

    for (let i = skyLanterns.length - 1; i >= 0; i--) {
      const l = skyLanterns[i];
      l.phase += dt * 1.8;
      l.x += (l.vx + Math.sin(l.phase) * 12) * dt;
      l.y += l.vy * dt;
      l.alpha = Math.min(1, l.alpha + dt * 1.2);
      if (l.y < -80) skyLanterns.splice(i, 1);
    }

    for (let i = cranes.length - 1; i >= 0; i--) {
      const c = cranes[i];
      c.flap += dt * 7.2;
      c.x += c.vx * dt;
      c.y += (c.vy + Math.sin(c.flap * 0.5) * 8) * dt;
      if (c.x < -160 || c.x > 2080 || c.y < -90) cranes.splice(i, 1);
    }
  }

  function updateParticlesAndRipples(dt, amb) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
        continue;
      }
      if (p.gy) p.vy += p.gy * dt;
      p.x += (p.vx + Math.sin(amb * 2 + i) * 4) * dt;
      p.y += p.vy * dt;
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt * 0.72;
      r.r = lerp(r.maxR, 6, r.life * r.life);
      if (r.life <= 0) ripples.splice(i, 1);
    }

    for (let i = 0; i < boat.orbitEmbers.length; i++) {
      boat.orbitEmbers[i].ang += boat.orbitEmbers[i].speed * dt;
    }
  }

  // =========================================================================
  // 7. 高清 2D 银幕画卷渲染管线 (千檐港、风碑、天晷、金缮日心、小晷与倒影)
  // =========================================================================
  function renderScene() {
    const w = view.w, h = view.h;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.save();
    const sx = state.shake > 0.1 ? (Math.random() - 0.5) * state.shake : 0;
    const sy = state.shake > 0.1 ? (Math.random() - 0.5) * state.shake : 0;
    ctx.translate(w * 0.5 + sx, h * 0.5 + sy);
    ctx.scale(view.scale, view.scale);
    ctx.translate(-960, -540);

    const t = state.filmTime;

    // 远景天体核心：第三幕蚀日、第四幕金缮日心、第五幕破晓新日
    renderCelestialCore(t);

    // 第二幕：风碑长峡、悬弦与绝壁春花 (含入场与退场平滑透明度)
    if (state.started && t >= 30 && t < 75) {
      const alpha = smoothstep(30, 35, t) * (1 - smoothstep(68, 74, t));
      renderCanyonLayer(alpha);
    }

    // 第一幕与第五幕：千檐港高脚楼建筑群与水中倒影
    if (!state.started || t < 37 || t >= 141) {
      const alpha = !state.started
        ? 1
        : (t < 37 ? 1 - smoothstep(32, 36.5, t) : smoothstep(141, 146, t));
      renderHarborLayer(alpha, t);
    }

    // 第三幕：前景铜环半弧与蚀影风雹、折光护盾
    if (state.started && t >= 67 && t < 112) {
      const alpha = smoothstep(67, 72, t) * (1 - smoothstep(106, 111.5, t));
      renderTempestFront(alpha);
    }

    // 第五幕：祈愿天灯与白鹭群
    if (state.started && t >= 139) {
      renderCranesAndLanterns(smoothstep(139, 144, t));
    }

    // 水面涟漪与水下沉昼碎金
    renderWaterDetails(t);

    // 主角小晷、木舟与水面镜像倒影
    if (state.seaWorldY < 980) {
      renderBoatReflection();
    }
    renderBoatAndXiaoGui(t);

    // 全局发光粒子与破晓冲击波光环
    renderParticlesAndShockwave();

    // 自定义星盘折光游标
    if (pointer.inside && !pointer.overUI && state.started) {
      renderCustomCursor();
    }

    ctx.restore();
  }

  function renderCelestialCore(t) {
    const cx = state.sunWX, cy = state.sunWY, r = state.sunRadius;
    const inTempest = state.started && t >= 67 && t < 112;
    const tempAlpha = inTempest ? smoothstep(67, 72, t) * (1 - smoothstep(106, 111.5, t)) : 0;

    // 第三幕与第五幕（若守火校晷结局）：后景半圈 3D 铜环
    if (tempAlpha > 0.01) {
      for (let i = celestialRings.length - 1; i >= 0; i--) {
        drawArmillaryHalf(celestialRings[i], cx, cy, 1, false, tempAlpha);
      }
    } else if (t >= 142 && state.ringsAligned > 0) {
      const crownA = smoothstep(142, 148, t) * (0.28 + state.ringsAligned * 0.14);
      for (let i = celestialRings.length - 1; i >= 0; i--) {
        if (celestialRings[i].locked) {
          drawArmillaryHalf(celestialRings[i], cx, cy, 0.72, false, crownA);
        }
      }
    }

    // 绘制日体本身
    ctx.save();
    if (!state.started || t < 68) {
      // 第一、二幕：清冷残缺古月日轮
      drawGlow(ctx, SPRITES.silver, cx, cy, r * 2.2, 0.35);
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.56, 0, TAU);
      ctx.fillStyle = 'rgba(218, 230, 248, 0.22)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(232, 240, 255, 0.42)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    } else if (t < 138) {
      // 第三、四幕：蚀日黑曜瓷核 + 金缮熔金裂痕
      const mend = state.kintsugiRatio;
      drawGlow(ctx, mend > 0.2 ? SPRITES.gold : SPRITES.silver, cx, cy, r * (1.75 + mend * 1.1), 0.38 + mend * 0.5);

      // 裂隙透射出的金色佛光束
      if (t >= 106 && mend > 0.03) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 14; i++) {
          const ang = (i / 14) * TAU + state.ambientTime * 0.06;
          const rayLen = r * (1.35 + mend * 1.9 * (0.6 + 0.4 * Math.sin(i * 3.1 + state.ambientTime)));
          const grad = ctx.createLinearGradient(cx, cy, cx + Math.cos(ang) * rayLen, cy + Math.sin(ang) * rayLen);
          grad.addColorStop(0, `rgba(255, 224, 142, ${0.28 * mend})`);
          grad.addColorStop(1, 'rgba(255, 190, 90, 0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 8 + mend * 18;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(ang) * rayLen, cy + Math.sin(ang) * rayLen);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 暗色残损日核圆盘
      const coreGrad = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, r * 0.08, cx, cy, r);
      coreGrad.addColorStop(0, '#182030');
      coreGrad.addColorStop(0.78, '#0c101b');
      coreGrad.addColorStop(1, '#25324a');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.fillStyle = coreGrad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(248, 220, 158, ${0.35 + mend * 0.55})`;
      ctx.stroke();

      // 第四幕绘制可修补的瓷裂星脉
      if (t >= 104) {
        const crackAlpha = smoothstep(104, 110, t);
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r - 1, 0, TAU);
        ctx.clip();

        for (let i = 0; i < sunCracks.length; i++) {
          const c = sunCracks[i];
          const x1 = cx + c.x1 * r, y1 = cy + c.y1 * r;
          const x2 = cx + c.x2 * r, y2 = cy + c.y2 * r;

          // 未修补的暗银裂纹呼吸提示
          const pulse = 0.32 + 0.18 * Math.sin(state.ambientTime * 2.8 + c.order);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = `rgba(175, 198, 232, ${pulse * crackAlpha})`;
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          ctx.stroke();

          // 已注入的金缮熔金脉络
          if (c.mended > 0.01) {
            const mx = lerp(x1, x2, c.mended);
            const my = lerp(y1, y2, c.mended);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(mx, my);
            ctx.strokeStyle = `rgba(255, 224, 132, ${0.95 * crackAlpha})`;
            ctx.lineWidth = 3.2 + c.mended * 2.4;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(mx, my);
            ctx.strokeStyle = `rgba(255, 252, 235, ${0.88 * crackAlpha})`;
            ctx.lineWidth = 1.4;
            ctx.stroke();

            drawGlow(ctx, SPRITES.gold, mx, my, 18 * c.mended, 0.42 * crackAlpha);
          }
        }
        ctx.restore();

        // 光标靠近裂痕时绘制倾注而入的流金丝弧
        if (pointer.inside && !pointer.overUI && t < 138) {
          const dCur = Math.hypot(pointer.wx - cx, pointer.wy - cy);
          if (dCur < r * 1.45) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            const midX = (pointer.wx + cx) * 0.5 + Math.sin(state.ambientTime * 5) * 14;
            const midY = (pointer.wy + cy) * 0.5 - 18;
            ctx.moveTo(pointer.wx, pointer.wy);
            ctx.quadraticCurveTo(midX, midY, lerp(pointer.wx, cx, 0.42), lerp(pointer.wy, cy, 0.42));
            ctx.strokeStyle = pointer.down ? 'rgba(255, 232, 148, 0.78)' : 'rgba(255, 218, 130, 0.42)';
            ctx.lineWidth = pointer.down ? 2.8 : 1.6;
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    } else {
      // 138s 破晓之后：圆满重铸的新生旭日（保留淡淡金缮纹理印记）
      const rich = clamp(state.warmthAmt * 0.6 + state.kintsugiRatio * 0.7, 0, 1);
      drawGlow(ctx, rich > 0.3 ? SPRITES.gold : SPRITES.silver, cx, cy, r * 3.4, 0.85);
      const sunG = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
      if (rich > 0.3) {
        sunG.addColorStop(0, '#fffdf5');
        sunG.addColorStop(0.65, '#ffe39e');
        sunG.addColorStop(1, 'rgba(255, 182, 92, 0.88)');
      } else {
        sunG.addColorStop(0, '#ffffff');
        sunG.addColorStop(0.7, '#dce8f8');
        sunG.addColorStop(1, 'rgba(170, 198, 235, 0.82)');
      }
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.82, 0, TAU);
      ctx.fillStyle = sunG;
      ctx.fill();

      // 日面金缮纪念金丝
      ctx.save();
      ctx.globalAlpha = 0.42;
      for (let i = 0; i < sunCracks.length; i++) {
        const c = sunCracks[i];
        if (c.mended < 0.2) continue;
        ctx.beginPath();
        ctx.moveTo(cx + c.x1 * r * 0.8, cy + c.y1 * r * 0.8);
        ctx.lineTo(cx + c.x2 * r * 0.8, cy + c.y2 * r * 0.8);
        ctx.strokeStyle = rich > 0.3 ? '#fff9e2' : '#eef5ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();

    // 第五幕前景天晷金冠半弧
    if (t >= 142 && state.ringsAligned > 0 && tempAlpha <= 0.01) {
      const crownA = smoothstep(142, 148, t) * (0.28 + state.ringsAligned * 0.14);
      for (let i = 0; i < celestialRings.length; i++) {
        if (celestialRings[i].locked) {
          drawArmillaryHalf(celestialRings[i], cx, cy, 0.72, true, crownA);
        }
      }
    }
  }

  function drawArmillaryHalf(ring, cx, cy, scale, frontHalf, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const steps = 64;
    ctx.beginPath();
    let penDown = false;
    for (let s = 0; s <= steps; s++) {
      const th = (s / steps) * TAU;
      const pt = projectRingPoint(ring, th, cx, cy, scale);
      const isFront = pt.z >= 0;
      if (isFront === frontHalf) {
        if (!penDown) {
          ctx.moveTo(pt.x, pt.y);
          penDown = true;
        } else {
          ctx.lineTo(pt.x, pt.y);
        }
      } else {
        penDown = false;
      }
    }

    const strokeCol = ring.locked
      ? 'rgba(255, 224, 140, 0.92)'
      : (ring.hover > 0.1 ? 'rgba(248, 214, 138, 0.85)' : 'rgba(196, 168, 116, 0.58)');
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = (ring.locked ? 4.2 : 3.0) * scale;
    ctx.stroke();

    // 铜环十二辰刻度文字与对准机关（仅在前景或对应半区绘制）
    for (let g = 0; g < 12; g++) {
      const th = ring.angle + (g / 12) * TAU;
      const pt = projectRingPoint(ring, th, cx, cy, scale);
      if ((pt.z >= 0) !== frontHalf) continue;
      if (scale > 0.85 && g % 2 === 0) {
        ctx.font = '12px "Songti SC", "STSong", serif';
        ctx.fillStyle = ring.locked ? 'rgba(255, 236, 182, 0.88)' : 'rgba(214, 192, 150, 0.55)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(STEMS[g], pt.x, pt.y - 10);
      }
    }

    // 目标黄金缺口 ◇
    const targetPt = projectRingPoint(ring, ring.targetAngle, cx, cy, scale);
    if ((targetPt.z >= 0) === frontHalf && scale > 0.85) {
      drawGlow(ctx, SPRITES.gold, targetPt.x, targetPt.y, ring.locked ? 34 : 22, ring.locked ? 0.8 : 0.45);
      ctx.save();
      ctx.translate(targetPt.x, targetPt.y);
      ctx.rotate(Math.PI * 0.25);
      ctx.strokeStyle = '#ffeab8';
      ctx.lineWidth = 2;
      ctx.strokeRect(-8, -8, 16, 16);
      ctx.restore();

      if (ring.locked) {
        ctx.beginPath();
        ctx.moveTo(targetPt.x, targetPt.y);
        ctx.lineTo(cx, cy);
        ctx.strokeStyle = 'rgba(255, 230, 156, 0.35)';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }
    }

    // 可拖动的铜环指针宝石 ◆
    if (!ring.locked && scale > 0.85) {
      const keyPt = projectRingPoint(ring, ring.angle, cx, cy, scale);
      if ((keyPt.z >= 0) === frontHalf) {
        drawGlow(ctx, SPRITES.warm, keyPt.x, keyPt.y, 26 + ring.hover * 10, 0.75);
        ctx.save();
        ctx.translate(keyPt.x, keyPt.y);
        ctx.rotate(Math.PI * 0.25);
        ctx.fillStyle = '#ffd984';
        ctx.fillRect(-6.5, -6.5, 13, 13);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function renderTempestFront(alpha) {
    const cx = state.sunWX, cy = state.sunWY;
    for (let i = 0; i < celestialRings.length; i++) {
      drawArmillaryHalf(celestialRings[i], cx, cy, 1, true, alpha);
    }

    // 绘制袭来的蚀影风雹
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < shadowShards.length; i++) {
      const sh = shadowShards[i];
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.rot);
      const g = ctx.createLinearGradient(-sh.len, 0, sh.len * 0.6, 0);
      g.addColorStop(0, 'rgba(30, 38, 65, 0)');
      g.addColorStop(0.65, 'rgba(130, 165, 225, 0.75)');
      g.addColorStop(1, '#eef6ff');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sh.len * 0.65, 0);
      ctx.lineTo(-sh.len * 0.4, -4.5);
      ctx.lineTo(-sh.len, 0);
      ctx.lineTo(-sh.len * 0.4, 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 绘制舟前折光护盾圆弧
    if (pointer.inside && !pointer.overUI) {
      const scx = boat.x + 8, scy = boat.y - 42;
      const ang = Math.atan2(pointer.wy - scy, pointer.wx - scx);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(scx, scy, 96, ang - 0.78, ang + 0.78);
      ctx.strokeStyle = 'rgba(255, 228, 152, 0.72)';
      ctx.lineWidth = 4.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(scx, scy, 102, ang - 0.62, ang + 0.62);
      ctx.strokeStyle = 'rgba(132, 236, 226, 0.48)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function renderHarborLayer(alpha, t) {
    const isAct5 = state.started && t >= 141;
    const camShift = (!state.started) ? 0 : (t < 37 ? lerp(0, -240, clamp(t / 34, 0, 1)) : -110);
    const seaY = state.seaWorldY;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 水下残存古拱门暗影 (第一幕体现“沉没的旧白昼城池”)
    if (!isAct5) {
      ctx.fillStyle = 'rgba(8, 17, 34, 0.42)';
      for (let i = 0; i < 6; i++) {
        const ax = 210 + i * 290 + camShift * 0.55;
        const ay = seaY + 26;
        ctx.beginPath();
        ctx.rect(ax - 36, ay, 14, 130);
        ctx.rect(ax + 22, ay, 14, 130);
        ctx.fill();
      }
    }

    for (let i = 0; i < harborHouses.length; i++) {
      const h = harborHouses[i];
      const hx = h.bx + camShift * h.depth;
      if (hx < -450 || hx > 2380) continue;

      const bodyBottom = seaY - h.stiltH + (h.depth - 0.6) * 16;
      const bodyTop = bodyBottom - h.h;

      // 建筑剪影色随远近景深与破晓光感自然过渡
      const shade = Math.round(lerp(10, 26, 1 - h.depth) + state.dawnAmt * 18);
      const silhouette = `rgb(${shade}, ${shade + 5}, ${shade + 15})`;

      // 木桩高脚
      ctx.strokeStyle = silhouette;
      ctx.lineWidth = Math.max(2, 3.2 * h.scale);
      const legs = [-0.38, 0, 0.38];
      for (let l = 0; l < legs.length; l++) {
        const lx = hx + legs[l] * h.w;
        ctx.beginPath();
        ctx.moveTo(lx, bodyBottom - 2);
        ctx.lineTo(lx, seaY + 14);
        ctx.stroke();
      }

      // 楼阁主体与飞檐翘角
      ctx.fillStyle = silhouette;
      ctx.fillRect(hx - h.w * 0.5, bodyTop, h.w, h.h);

      drawCurvedRoof(ctx, hx, bodyTop, h.w + h.roofOverhang * 2, 20 * h.scale, silhouette, state.dawnAmt);
      if (h.tiers === 2) {
        const midY = bodyTop + h.h * 0.48;
        drawCurvedRoof(ctx, hx, midY, h.w + h.roofOverhang * 1.6, 15 * h.scale, silhouette, state.dawnAmt);
      }

      // 窗棂与暖色灯火 + 水中窗影
      for (let w = 0; w < h.wins.length; w++) {
        const win = h.wins[w];
        const wx = hx + win.rx * h.w * 0.78;
        const wy = bodyTop + win.ry * h.h;
        if (win.lit > 0.04) {
          ctx.fillStyle = `rgba(255, 214, 132, ${0.88 * win.lit})`;
          ctx.fillRect(wx - win.w * 0.5, wy - win.h * 0.5, win.w, win.h);
          drawGlow(ctx, SPRITES.warm, wx, wy, 22 * h.scale, 0.45 * win.lit);

          // 镜海倒影中的摇曳窗火
          const reflY = seaY + (seaY - wy) * 0.52;
          if (reflY < 1090) {
            const waveX = Math.sin(state.ambientTime * 3.1 + wx * 0.05) * 5;
            drawGlow(ctx, SPRITES.warm, wx + waveX, reflY, 18 * h.scale, 0.24 * win.lit);
          }
        } else {
          ctx.fillStyle = 'rgba(130, 156, 196, 0.12)';
          ctx.fillRect(wx - win.w * 0.5, wy - win.h * 0.5, win.w, win.h);
        }
      }

      // 若第二幕唤醒过绝壁生春，第五幕归港时屋檐旁亦绽放春花枝条
      if (isAct5 && state.emeraldAmt > 0.22 && h.bloomSeed > 0.42) {
        drawGlow(ctx, h.bloomSeed > 0.7 ? SPRITES.rose : SPRITES.cyan, hx + h.w * 0.48, bodyTop + 12, 26 * h.scale, 0.55);
      }
    }

    // 启航长栈桥（第一幕左岸）
    if (!isAct5) {
      const pierX = 395 + camShift * 0.92;
      ctx.fillStyle = '#0a0f1c';
      ctx.fillRect(pierX - 420, seaY - 18, 430, 8);
      for (let p = 0; p < 7; p++) {
        ctx.fillRect(pierX - p * 64, seaY - 18, 5, 34);
      }
    }

    ctx.restore();
  }

  function drawCurvedRoof(ctx, cx, bottomY, totalW, roofH, color, dawnRim) {
    const hw = totalW * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - hw, bottomY + 3);
    ctx.quadraticCurveTo(cx - hw * 0.45, bottomY - roofH * 0.35, cx, bottomY - roofH);
    ctx.quadraticCurveTo(cx + hw * 0.45, bottomY - roofH * 0.35, cx + hw, bottomY + 3);
    ctx.lineTo(cx - hw, bottomY + 3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    if (dawnRim > 0.15) {
      ctx.beginPath();
      ctx.moveTo(cx, bottomY - roofH);
      ctx.quadraticCurveTo(cx + hw * 0.45, bottomY - roofH * 0.35, cx + hw, bottomY + 3);
      ctx.strokeStyle = `rgba(255, 212, 138, ${0.42 * dawnRim})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  function renderCanyonLayer(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;

    // 耸立石碑与发光古铭文
    for (let i = 0; i < monoliths.length; i++) {
      const m = monoliths[i];
      const grad = ctx.createLinearGradient(m.x - m.w * 0.5, m.topY, m.x + m.w * 0.5, 980);
      grad.addColorStop(0, m.depth > 0.8 ? '#0d1424' : '#131e33');
      grad.addColorStop(1, '#070b14');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(m.x - m.w * 0.52, 1080);
      ctx.lineTo(m.x - m.w * 0.44, m.topY + 28);
      ctx.lineTo(m.x + m.notchOffset, m.topY);
      ctx.lineTo(m.x + m.w * 0.44, m.topY + 34);
      ctx.lineTo(m.x + m.w * 0.52, 1080);
      ctx.closePath();
      ctx.fill();

      // 碑身几何符文
      const glow = 0.14 + m.runeGlow * 0.78;
      ctx.strokeStyle = `rgba(116, 235, 216, ${glow})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(m.x, m.topY + 55);
      ctx.lineTo(m.x, m.topY + 290);
      ctx.stroke();
      for (let r = 0; r < 4; r++) {
        const ry = m.topY + 90 + r * 52;
        ctx.strokeRect(m.x - 9, ry - 9, 18, 18);
      }
      if (m.runeGlow > 0.05) {
        drawGlow(ctx, SPRITES.cyan, m.x, m.topY + 170, 58, m.runeGlow * 0.36);
      }
    }

    // 绝壁绽放的荧光花枝
    for (let i = 0; i < cliffBlossoms.length; i++) {
      const b = cliffBlossoms[i];
      for (let k = 0; k < b.branches.length; k++) {
        const br = b.branches[k];
        const len = br.len * b.grow;
        const ex = b.x + Math.cos(br.ang) * len;
        const ey = b.y + Math.sin(br.ang) * len;
        const cx = (b.x + ex) * 0.5 - Math.sin(br.ang) * len * br.curve;
        const cy = (b.y + ey) * 0.5 + Math.cos(br.ang) * len * br.curve;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.quadraticCurveTo(cx, cy, ex, ey);
        ctx.strokeStyle = 'rgba(156, 224, 198, 0.72)';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        drawGlow(ctx, br.hue === 'rose' ? SPRITES.rose : SPRITES.cyan, ex, ey, 16 * b.grow, 0.78);
      }
    }

    // 10 根可拨奏古铜丝弦与风铎
    for (let s = 0; s < canyonStrings.length; s++) {
      const st = canyonStrings[s];
      const pts = st.pts;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = st.energy > 0.05
        ? `rgba(255, 232, 162, ${0.55 + st.energy * 0.45})`
        : 'rgba(186, 206, 228, 0.42)';
      ctx.lineWidth = 1.5 + st.energy * 2.0;
      ctx.stroke();

      // 弦心悬挂古铜风铃
      const mid = pts[Math.floor(pts.length * 0.5)];
      ctx.fillStyle = st.energy > 0.1 ? '#ffe59e' : '#8ea2bc';
      ctx.beginPath();
      ctx.moveTo(mid.x, mid.y);
      ctx.lineTo(mid.x - 5, mid.y + 13);
      ctx.lineTo(mid.x + 5, mid.y + 13);
      ctx.closePath();
      ctx.fill();
      if (st.energy > 0.08) {
        drawGlow(ctx, SPRITES.gold, mid.x, mid.y + 6, 28, st.energy * 0.65);
      }
    }

    // 观众手绘的流风丝带
    for (let i = 0; i < windRibbons.length; i++) {
      const r = windRibbons[i];
      if (r.pts.length < 2) continue;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 1; k < r.pts.length; k++) {
        const taper = Math.sin((k / r.pts.length) * Math.PI);
        ctx.beginPath();
        ctx.moveTo(r.pts[k - 1].x, r.pts[k - 1].y);
        ctx.lineTo(r.pts[k].x, r.pts[k].y);
        ctx.strokeStyle = `rgba(148, 245, 230, ${0.58 * r.life * taper})`;
        ctx.lineWidth = 1.5 + taper * 6.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.restore();
  }

  function renderWaterDetails(t) {
    // 水面椭圆涟漪
    for (let i = 0; i < ripples.length; i++) {
      const rp = ripples[i];
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.24, 0, 0, TAU);
      const col = rp.hue === 'gold' ? '255, 222, 145' : '185, 212, 245';
      ctx.strokeStyle = `rgba(${col}, ${rp.alpha * rp.life})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // 第一幕水下与腾空中的沉昼碎金
    if (state.started && t < 35) {
      for (let i = 0; i < sunkenEmbers.length; i++) {
        const e = sunkenEmbers[i];
        if (e.state === 'captured' || e.x < -120 || e.x > 2040) continue;
        const pulse = 0.72 + 0.28 * Math.sin(e.phase * 2);
        if (e.state === 'sunken') {
          // 水下竖直微光折射柱
          const beamG = ctx.createLinearGradient(e.x, state.seaWorldY, e.x, e.y);
          beamG.addColorStop(0, 'rgba(255, 214, 125, 0.22)');
          beamG.addColorStop(1, 'rgba(255, 214, 125, 0.02)');
          ctx.strokeStyle = beamG;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(e.x, state.seaWorldY + 2);
          ctx.lineTo(e.x, e.y);
          ctx.stroke();
          drawGlow(ctx, SPRITES.gold, e.x, e.y, 28 * pulse, 0.68);
        } else {
          drawGlow(ctx, SPRITES.gold, e.x, e.y, 34, 0.95);
        }

        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(Math.PI * 0.25 + Math.sin(e.phase) * 0.2);
        ctx.fillStyle = '#fff6da';
        ctx.fillRect(-4.5, -4.5, 9, 9);
        ctx.restore();
      }
    }
  }

  function renderBoatReflection() {
    const seaY = state.seaWorldY;
    if (boat.y > seaY + 35) return;
    const distAbove = Math.max(0, seaY - boat.y);
    const reflAlpha = clamp(1 - distAbove / 180, 0, 1) * 0.42;
    if (reflAlpha <= 0.02) return;

    ctx.save();
    ctx.translate(boat.x, seaY * 2 - boat.y + 6);
    ctx.scale(1, -0.68);
    ctx.globalAlpha = reflAlpha;

    drawGlow(ctx, SPRITES.gold, 22, -52, 68 * boat.lanternPower, 0.65);
    ctx.beginPath();
    ctx.moveTo(-54, 0);
    ctx.quadraticCurveTo(0, 18, 58, -6);
    ctx.quadraticCurveTo(10, 6, -54, 0);
    ctx.fillStyle = '#090e1a';
    ctx.fill();
    ctx.restore();
  }

  function renderCranesAndLanterns(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;

    // 祈愿天灯及其海面倒影
    for (let i = 0; i < skyLanterns.length; i++) {
      const l = skyLanterns[i];
      const s = l.size;
      drawGlow(ctx, SPRITES.warm, l.x, l.y, s * 2.8, 0.65 * l.alpha);
      ctx.fillStyle = `rgba(255, 224, 152, ${0.92 * l.alpha})`;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(l.x - s * 0.38, l.y - s * 0.5, s * 0.76, s, 3);
      } else {
        ctx.rect(l.x - s * 0.38, l.y - s * 0.5, s * 0.76, s);
      }
      ctx.fill();

      if (l.y < state.seaWorldY && state.seaWorldY < 900) {
        const ry = state.seaWorldY + (state.seaWorldY - l.y) * 0.45;
        if (ry < 1080) drawGlow(ctx, SPRITES.warm, l.x, ry, s * 1.8, 0.18 * l.alpha);
      }
    }

    // 展翅白鹭剪影
    ctx.strokeStyle = 'rgba(255, 250, 240, 0.88)';
    ctx.lineWidth = 2.1;
    ctx.lineCap = 'round';
    for (let i = 0; i < cranes.length; i++) {
      const c = cranes[i];
      const wingY = Math.sin(c.flap) * c.span * 0.48;
      const dir = Math.sign(c.vx) || 1;
      ctx.beginPath();
      ctx.moveTo(c.x - c.span * 0.7 * dir, c.y - wingY);
      ctx.quadraticCurveTo(c.x - c.span * 0.2 * dir, c.y - wingY * 0.3 - 4, c.x, c.y);
      ctx.quadraticCurveTo(c.x + c.span * 0.25 * dir, c.y - wingY * 0.3 - 4, c.x + c.span * 0.75 * dir, c.y - wingY * 0.85);
      ctx.stroke();
    }

    ctx.restore();
  }

  function renderParticlesAndShockwave() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const a = clamp(p.life / p.maxLife, 0, 1);
      const spr = SPRITES[p.sprite] || SPRITES.gold;
      drawGlow(ctx, spr, p.x, p.y, p.size * (0.5 + 0.5 * a), a * 0.88);
    }

    if (state.dawnShockwave >= 0) {
      const p = clamp(state.dawnShockwave / 2200, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(state.sunWX, state.sunWY, state.dawnShockwave, 0, TAU);
      ctx.strokeStyle = `rgba(255, 232, 168, ${(1 - p) * 0.65})`;
      ctx.lineWidth = 26 * (1 - p) + 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function renderCustomCursor() {
    const x = pointer.wx, y = pointer.wy;
    const r = pointer.down ? 19 : 14;
    drawGlow(ctx, state.actIdx === 1 ? SPRITES.cyan : SPRITES.gold, x, y, 28, 0.52);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(state.ambientTime * 0.8);
    ctx.strokeStyle = 'rgba(255, 236, 188, 0.82)';
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (r - 3), Math.sin(a) * (r - 3));
      ctx.lineTo(Math.cos(a) * (r + 4), Math.sin(a) * (r + 4));
      ctx.stroke();
    }
    ctx.fillStyle = '#fff9e6';
    ctx.beginPath();
    ctx.arc(0, 0, 2.3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function evaluateEnding() {
    const mend = state.kintsugiRatio;
    const bloomScore = state.stringsPlucked * 1.4 + state.windStrokesCount * 1.2 + state.windowsLit * 0.5;
    const shieldScore = state.ringsAligned * 4.5 + state.shardsDeflected * 0.9;
    const totalAgency = state.embersGathered + bloomScore + shieldScore + (mend > 0.28 ? mend * 12 : 0);

    if (totalAgency < 3.2) {
      return {
        key: 'witness',
        title: '静默观星',
        seal: ['静', '默', '观', '星'],
        poem: '你未曾拨乱一缕海风，只以温柔的目光目送孤舟渡夜。小晷凭一星孤火叩开银白微明——被静静看见，亦是旅途的回响。'
      };
    }
    if (mend >= 0.52 && (state.embersGathered >= 3 || totalAgency >= 14)) {
      return {
        key: 'kintsugi',
        title: '金缮满昼',
        seal: ['金', '缮', '满', '昼'],
        poem: '你自深海捧起沉没的碎金，又以流金亲手弥合苍穹的裂痕。破碎百年的白昼因金缮而愈发璀璨，千檐万户皆沐赤金暖阳。'
      };
    }
    if (shieldScore >= bloomScore && (state.ringsAligned >= 2 || state.shardsDeflected >= 6)) {
      return {
        key: 'aegis',
        title: '守火孤盾',
        seal: ['守', '火', '校', '晷'],
        poem: '碎时风暴最烈之处，你化作舟前不灭的折光穹盾，拨正失序的天干铜环。澄澈苍穹重归法度，自此人间晨昏永固。'
      };
    }
    return {
      key: 'bloom',
      title: '万物生春',
      seal: ['万', '物', '生', '春'],
      poem: '你的指尖拂亮沉睡的千家窗火，拨响风碑古弦，令荒寒绝壁重绽芳华。黎明乘着你绘出的长风归来，海湾万象更新。'
    };
  }

  function formatTime(sec) {
    const s = Math.floor(clamp(sec, 0, FILM_DURATION));

    const r = s % 60;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;

  function updateHUD() {
    if (!state.started) return;
    const t = state.filmTime;
    const act = ACTS[state.actIdx];

    if (chapterTag.textContent !== act.tag) {
      chapterTag.textContent = act.tag;
    }
    chapterTag.classList.add('visible');

    // 顶部实时手势反馈胶囊
    if (state.agencyTimer > 0) {
      if (agencyPill.textContent !== state.agencyText) {
        agencyPill.textContent = state.agencyText;
      }
      agencyPill.classList.add('active');
    } else {
      agencyPill.classList.remove('active');
    }

    // 匹配当前时间轴字幕
    let activeLine = '';
    for (let i = 0; i < SUBTITLES.length; i++) {
      const sub = SUBTITLES[i];
      if (t >= sub.start && t <= sub.end) {
        activeLine = sub.text();
        break;
      }
    }
    if (activeLine !== lastSubtitleStr) {
      lastSubtitleStr = activeLine;
      if (activeLine) {
        subtitleMain.textContent = activeLine;
        subtitleMain.classList.add('visible');
      } else {
        subtitleMain.classList.remove('visible');
      }
    }

    // 每幕开场前 6.5 秒浮现极克制的金色操作提示，随后自然隐去不遮画面
    const inActIntro = (t - act.start) >= 0.8 && (t - act.start) <= 7.4;
    const desiredHint = inActIntro ? act.hint : '';
    if (desiredHint !== lastHintStr) {
      lastHintStr = desiredHint;
      if (desiredHint) {
        subtitleHint.textContent = desiredHint;
        subtitleHint.classList.add('visible');
      } else {
        subtitleHint.classList.remove('visible');
      }
    }

    // 进度条与时间读数
    const pct = clamp((t / FILM_DURATION) * 100, 0, 100).toFixed(2) + '%';
    timelineFill.style.width = pct;
    timelineHead.style.left = pct;
    timeReadout.textContent = `${formatTime(t)} / 02:48`;

    // 抵达 02:48 呈现终章印记卡（背景世界依然持续鲜活可互动）
    if (t >= FILM_DURATION && !state.ended) {
      state.ended = true;
      presentEndingCard();
    }
  }

  function presentEndingCard() {
    const info = evaluateEnding();
    state.endingKey = info.key;
    endingTitle.textContent = info.title;
    endingPoem.textContent = info.poem;
    endingSeal.innerHTML = info.seal.map((ch) => `<span>${ch}</span>`).join('');

    statEmbers.textContent = `${state.embersGathered} 缕`;
    statBloom.textContent = `${state.windowsLit + state.stringsPlucked + state.windStrokesCount} 处`;
    statShield.textContent = `${state.shardsDeflected + state.ringsAligned} 次`;
    statMend.textContent = `${Math.max(18, Math.round(state.kintsugiRatio * 100))}%`;

    if (!state.cardDismissed) {
      endingCard.classList.add('visible');
      reopenCardBtn.classList.remove('show');
    }
  }

  function seekTo(targetSec) {
    if (!state.started) startFilm();
    const clamped = clamp(targetSec, 0, FILM_DURATION);
    state.filmTime = clamped;
    state.prevFilmTime = clamped;
    state.actIdx = getActIndex(clamped);

    if (clamped < FILM_DURATION) {
      state.ended = false;
      endingCard.classList.remove('visible');
      reopenCardBtn.classList.remove('show');
    }

    if (clamped < 138.0) {
      state.dawnTriggered = false;
      state.dawnAmt = 0;
      state.dawnShockwave = -1;
    } else {
      if (!state.dawnTriggered) {
        state.dawnTriggered = true;
        if (cranes.length === 0) {
          for (let i = 0; i < 6; i++) spawnCrane(220 + i * 240, 220 + (i % 3) * 70);
        }
      }
      state.dawnAmt = 1;
    }

    // 同步木舟锚点并重置柔体链，防止跨章节跳转产生布料拉扯
    if (clamped < 34) {
      boat.x = lerp(460, 840, clamped / 34);
      boat.y = 705;
    } else if (clamped < 70) {
      boat.x = lerp(840, 960, (clamped - 34) / 36);
      boat.y = lerp(725, 565, (clamped - 34) / 36);
    } else if (clamped < 108) {
      boat.x = 960;
      boat.y = 775;
    } else if (clamped < 144) {
      boat.x = 960;
      boat.y = 700;
    } else {
      boat.x = 760;
      boat.y = 704;
    }
    initBoatChains();
    updateHUD();
  }

  function startFilm() {
    if (state.started) return;
    sound.unlock();
    state.started = true;
    introOverlay.classList.add('hidden');
    updateHUD();
  }

  function restartFilm() {
    sound.unlock();
    endingCard.classList.remove('visible');
    reopenCardBtn.classList.remove('show');
    resetWorldState();
    state.started = true;
    lastSubtitleStr = '';
    lastHintStr = '';
    subtitleMain.classList.remove('visible');
    subtitleHint.classList.remove('visible');
    updateHUD();
  }

  // =========================================================================
  // 9. 事件监听、自适应缩放与 60fps 主循环
  // =========================================================================
  function resizeAll() {
    view.w = Math.max(320, window.innerWidth || 1920);
    view.h = Math.max(240, window.innerHeight || 1080);
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);

    // 兼顾 1920x1080 全屏、笔记本屏幕与多模型并排分屏窗口 (如 960x1080)
    const refW = view.w < view.h * 1.35 ? 1520 : 1920;
    view.scale = Math.min(view.w / refW, view.h / 1080);

    sceneCanvas.width = Math.floor(view.w * view.dpr);
    sceneCanvas.height = Math.floor(view.h * view.dpr);
    glSky.resize(view.w, view.h, view.dpr);
  }

  function updatePointerCoords(clientX, clientY) {
    pointer.sx = clientX;
    pointer.sy = clientY;
    pointer.wx = screenToWorldX(clientX);
    pointer.wy = screenToWorldY(clientY);
    if (!pointer.inside) {
      pointer.pwx = pointer.wx;
      pointer.pwy = pointer.wy;
      pointer.inside = true;
    }
  }

  window.addEventListener('resize', resizeAll);

  stageEl.addEventListener('pointermove', (e) => {
    const onUI = Boolean(e.target.closest('.letterbox, #ending-card, #intro-overlay'));
    pointer.overUI = onUI;
    stageEl.classList.toggle('ui-cursor', onUI || !state.started);
    updatePointerCoords(e.clientX, e.clientY);
  });

  stageEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.letterbox, #ending-card')) return;
    if (!state.started) {
      startFilm();
      return;
    }
    sound.unlock();
    updatePointerCoords(e.clientX, e.clientY);
    pointer.pwx = pointer.wx;
    pointer.pwy = pointer.wy;
    pointer.down = true;

    // 第三幕按下：优先拾取最近的未锁定天干铜环进行旋转校准
    if (state.actIdx === 2) {
      const cx = state.sunWX, cy = state.sunWY;
      let bestIdx = -1;
      let bestDist = 88;
      for (let i = 0; i < celestialRings.length; i++) {
        const ring = celestialRings[i];
        if (ring.locked) continue;
        // 检测与椭圆环轨迹的最近距离
        for (let s = 0; s < 32; s++) {
          const pt = projectRingPoint(ring, (s / 32) * TAU, cx, cy);
          const d = Math.hypot(pointer.wx - pt.x, pointer.wy - pt.y);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }
      }
      if (bestIdx >= 0) {
        pointer.dragRingIdx = bestIdx;
        pointer.dragPrevAng = Math.atan2(pointer.wy - cy, pointer.wx - cx);
        notifyAgency('旋转铜环对准黄金缺口');
      }
    }

    // 第五幕（含片尾留驻状态）：轻点晨空放飞祈愿天灯与白鹭
    if (state.filmTime >= 140) {
      state.epilogueLanterns++;
      spawnSkyLantern(pointer.wx, pointer.wy, true);
      if (state.epilogueLanterns % 2 === 1) {
        spawnCrane(pointer.wx - 35, pointer.wy - 18);
      }
      sound.playLanternBell();
      notifyAgency('放飞晨曦祈愿灯');
    }
  });

  window.addEventListener('pointerup', () => {
    pointer.down = false;
    pointer.dragRingIdx = -1;
  });

  window.addEventListener('pointerleave', () => {
    pointer.inside = false;
    pointer.down = false;
    pointer.dragRingIdx = -1;
  });

  introOverlay.addEventListener('click', (e) => {
    e.stopPropagation();
    startFilm();
  });
  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startFilm();
  });

  function toggleMute() {
    sound.setMuted(!sound.muted);
    const isMuted = sound.muted;
    muteLabel.textContent = isMuted ? '已静音' : '声音：开';
    iconSoundOn.style.display = isMuted ? 'none' : 'block';
    iconSoundOff.style.display = isMuted ? 'block' : 'none';
  }

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMute();
    if (state.started && !sound.muted) {
      sound.unlock();
    }
  });

  timelineTrack.addEventListener('click', (e) => {
    e.stopPropagation();
    const rect = timelineTrack.getBoundingClientRect();
    if (rect.width <= 0) return;
    const ratio = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    seekTo(ratio * FILM_DURATION);
  });

  replayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    restartFilm();
  });

  lingerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.cardDismissed = true;
    endingCard.classList.remove('visible');
    reopenCardBtn.classList.add('show');
    notifyAgency('轻点晨空继续放飞天灯');
  });

  reopenCardBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.cardDismissed = false;
    endingCard.classList.add('visible');
    reopenCardBtn.classList.remove('show');
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') {
      toggleMute();
    } else if (e.key === ' ' && !state.started) {
      e.preventDefault();
      startFilm();
    }
  });

  // 主帧循环
  let lastNow = performance.now();

  function frame(now) {
    const rawDt = (now - lastNow) / 1000;
    lastNow = now;
    const dt = clamp(rawDt, 0.001, 0.05);
    const filmStep = Math.min(Math.max(rawDt, 0), 0.1);

    state.ambientTime += dt;
    if (state.started && state.filmTime < FILM_DURATION) {
      state.prevFilmTime = state.filmTime;
      state.filmTime = Math.min(FILM_DURATION, state.filmTime + filmStep);
    } else {
      state.prevFilmTime = state.filmTime;
    }

    // 逐帧精确光标速度与完整扫掠线段（确保高速拂过古弦、水面与裂痕不漏判）
    const instVx = (pointer.wx - pointer.pwx) / dt;
    const instVy = (pointer.wy - pointer.pwy) / dt;
    pointer.vx = lerp(pointer.vx * 0.72, instVx, 0.68);
    pointer.vy = lerp(pointer.vy * 0.72, instVy, 0.68);
    pointer.speed = Math.hypot(pointer.vx, pointer.vy);

    updateWorld(dt);
    pointer.pwx = pointer.wx;
    pointer.pwy = pointer.wy;

    sound.update(state.filmTime, state.started, state.stormAmt, state.dawnAmt, state.warmthAmt);

    // 渲染第 1 层：WebGL2 实时天穹与镜海着色器
    const seaScreenRatio = clamp(worldToScreenY(state.seaWorldY) / Math.max(view.h, 1), -0.25, 1.35);
    const sunUVX = worldToScreenX(state.sunWX) / Math.max(view.w, 1);
    const sunUVY = worldToScreenY(state.sunWY) / Math.max(view.h, 1);
    const boatUVX = worldToScreenX(boat.x + 32) / Math.max(view.w, 1);
    const boatUVY = worldToScreenY(boat.y - 48) / Math.max(view.h, 1);

    glSky.render({
      time: state.ambientTime,
      seaLevel: seaScreenRatio,
      storm: state.stormAmt,
      dawn: state.dawnAmt,
      warmth: state.warmthAmt,
      emerald: state.emeraldAmt,
      sunX: sunUVX,
      sunY: sunUVY,
      sunMend: state.kintsugiRatio,
      mx: clamp(pointer.sx / Math.max(view.w, 1), 0, 1),
      my: clamp(pointer.sy / Math.max(view.h, 1), 0, 1),
      mVel: clamp(pointer.speed / 1800, 0, 1),
      mDown: pointer.down ? 1.0 : 0.0,
      bx: boatUVX,
      by: boatUVY,
      bLight: clamp(boat.lanternPower * 0.85, 0.15, 1.2),
      flash: state.lightningFlash
    });

    // 渲染第 2 层：高清 2D 叙事世界与交互实体
    renderScene();

    // 刷新字幕、章节与终章印记
    updateHUD();

    requestAnimationFrame(frame);
  }

  // 启动初始化
  resizeAll();
  resetWorldState();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
