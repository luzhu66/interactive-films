<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>留白 · 一卷由你落笔的水墨短片</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12100e;}
body{font-family:"KaiTi","STKaiti","Kaiti SC","楷体","BiauKai","FangSong",serif;color:#1d1a17;user-select:none;-webkit-user-select:none;cursor:none;}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
#title{position:absolute;inset:0;transition:opacity 1.6s ease,filter 1.6s ease;}
#title.gone{opacity:0;filter:blur(14px);}
.t-main{position:absolute;left:54%;top:50%;transform:translate(-50%,-56%);writing-mode:vertical-rl;font-size:min(17vh,15vw);letter-spacing:.18em;color:#1b1816;text-shadow:0 0 1px rgba(0,0,0,.35);}
.t-seal{position:absolute;left:calc(54% - min(9vh,8vw));top:calc(50% + min(10vh,9vw));width:min(5.4vh,5vw);height:min(5.4vh,5vw);background:#b3261e;border-radius:3px;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;color:#f3ead8;font-size:min(2.1vh,1.9vw);line-height:1;box-shadow:0 0 0 1px rgba(150,20,15,.4);transform:rotate(-2deg);opacity:.92;writing-mode:vertical-rl;}
.t-sub{position:absolute;left:calc(54% - min(15vh,13vw));top:50%;transform:translateY(-62%);writing-mode:vertical-rl;font-size:min(2.6vh,2.4vw);letter-spacing:.42em;color:rgba(40,34,30,.72);}
.t-go{position:absolute;left:0;right:0;bottom:14vh;text-align:center;font-size:min(2.5vh,2.3vw);letter-spacing:.5em;color:rgba(30,26,22,.8);animation:breathe 2.8s ease-in-out infinite;}
.t-note{position:absolute;left:0;right:0;bottom:9vh;text-align:center;font-size:min(1.7vh,1.6vw);letter-spacing:.35em;color:rgba(60,52,46,.55);}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
#caps{position:absolute;right:calc(3vw + min(7vh,6vw));top:9vh;display:flex;flex-direction:row-reverse;gap:min(1.6vh,1.4vw);}
.col{writing-mode:vertical-rl;font-size:min(3.6vh,3.1vw);letter-spacing:.22em;color:rgba(26,22,19,.92);text-shadow:0 0 3px rgba(246,240,228,1),0 0 9px rgba(246,240,228,.95),0 0 18px rgba(246,240,228,.9),0 0 32px rgba(246,240,228,.8);}
.col.light{color:rgba(240,232,218,.95);text-shadow:0 0 10px rgba(0,0,0,.6);}
.ch{display:inline-block;opacity:0;animation:inkin 1.5s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes inkin{0%{opacity:0;filter:blur(9px);transform:scale(1.35)}55%{opacity:.85;filter:blur(1.2px)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
.col.out{animation:inkout 1.5s ease forwards;}
@keyframes inkout{to{opacity:0;filter:blur(10px);transform:translateY(-1vh)}}
#mark{position:absolute;right:3vw;top:9vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh;opacity:0;transition:opacity 1.4s ease;}
#mark.on{opacity:1;}
#mark .seal{width:min(5.2vh,4.6vw);height:min(5.2vh,4.6vw);background:#b3261e;color:#f4ecdc;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:min(3.4vh,3vw);transform:rotate(2deg);box-shadow:inset 0 0 6px rgba(80,0,0,.35);}
#mark .mk{writing-mode:vertical-rl;font-size:min(2vh,1.8vw);letter-spacing:.4em;color:rgba(40,34,30,.7);text-shadow:0 0 8px rgba(246,240,228,.9);}
#hint{position:absolute;left:0;right:0;bottom:6.5vh;text-align:center;font-size:min(2.3vh,2.1vw);letter-spacing:.32em;color:rgba(28,24,21,.86);opacity:0;transition:opacity 1.2s ease;text-shadow:0 0 8px rgba(246,240,228,1),0 0 16px rgba(246,240,228,.9);}
#hint.on{opacity:1;}
#hint::before{content:"";display:block;width:3.2em;height:1px;margin:0 auto 1.1vh;background:rgba(40,34,30,.35);}
#final{position:absolute;left:0;right:0;bottom:15vh;text-align:center;color:rgba(238,230,214,.94);font-size:min(2.7vh,2.4vw);letter-spacing:.3em;line-height:2.1;text-shadow:0 1px 12px rgba(0,0,0,.8);}
#final .ln{opacity:0;transition:opacity 1.8s ease,filter 1.8s ease;filter:blur(6px);}
#final .ln.on{opacity:1;filter:blur(0);}
#final .big{font-size:1.45em;letter-spacing:.5em;margin-top:.5em;}
#btns{position:fixed;left:0;right:0;bottom:6vh;display:flex;justify-content:center;gap:2.4vw;opacity:0;pointer-events:none;transition:opacity 1.5s ease;}
#btns.on{opacity:1;pointer-events:auto;}
#btns button,#mute{font-family:inherit;cursor:none;}
#btns button{background:rgba(240,232,216,.06);border:1px solid rgba(240,232,216,.45);color:rgba(240,232,216,.92);font-size:min(2.1vh,1.9vw);letter-spacing:.4em;padding:.75em 1.3em .75em 1.7em;border-radius:2px;transition:background .3s,border-color .3s;}
#btns button:hover{background:rgba(240,232,216,.16);border-color:rgba(240,232,216,.85);}
#mute{position:fixed;right:2.2vw;bottom:3vh;width:44px;height:44px;border-radius:50%;border:1px solid rgba(60,50,44,.35);background:rgba(246,240,228,.55);display:flex;align-items:center;justify-content:center;padding:0;z-index:5;transition:background .3s,opacity .5s;backdrop-filter:blur(3px);}
#mute:hover{background:rgba(246,240,228,.9);}
#mute svg{width:22px;height:22px;stroke:#2a241f;fill:none;stroke-width:1.6;stroke-linecap:round;}
#mute .off{display:none;}
#mute.muted .on{display:none;}#mute.muted .off{display:inline;}
#cursor,#ghost{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;pointer-events:none;z-index:9;transition:width .15s,height .15s,margin .15s,background .2s,border-color .4s,opacity .4s;}
#cursor{border:1.5px solid rgba(30,25,21,.7);background:rgba(30,25,21,.06);opacity:0;}
#cursor.on{opacity:1;}
#cursor.down{width:14px;height:14px;margin:-7px 0 0 -7px;background:rgba(30,25,21,.55);}
#cursor.light{border-color:rgba(240,232,216,.8);background:rgba(240,232,216,.08);}
#cursor.red::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#b3261e;}
#ghost{width:30px;height:30px;margin:-15px 0 0 -15px;border:1px dashed rgba(30,25,21,.4);background:radial-gradient(circle,rgba(30,25,21,.35) 0,rgba(30,25,21,.08) 45%,transparent 70%);opacity:0;}
#ghost.on{opacity:1;}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#eee;font-size:20px;letter-spacing:.2em;background:#141210;}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="title">
    <div class="t-main">留白</div>
    <div class="t-seal"><span>一卷</span></div>
    <div class="t-sub">一卷由你落笔的水墨短片</div>
    <div class="t-go">点击纸面　落下第一滴墨</div>
    <div class="t-note">约三分钟　·　请打开声音</div>
  </div>
  <div id="mark"></div>
  <div id="caps"></div>
  <div id="hint"></div>
  <div id="final"></div>
</div>
<div id="btns"><button id="again">再画一卷</button><button id="save">收藏此卷</button></div>
<button id="mute" aria-label="静音" title="静音（M）"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
<div id="cursor"></div><div id="ghost"></div>
<div id="err">此作品需要支持 WebGL2 的新版 Chrome</div>
<script>
(()=>{
'use strict';
/* ==================== 基础工具 ==================== */
const Q=new URLSearchParams(location.search);
const SPEED=Math.max(0.1,parseFloat(Q.get('speed')||'1'));
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const SEED=(Math.random()*1e9)|0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(SEED);
const rand=(a=0,b=1)=>a+(b-a)*rnd();
const SO=(SEED%9973)*0.731;
function hash1(n){const s=Math.sin(n*127.1+SO)*43758.5453;return s-Math.floor(s);}
function noise1(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i+s*57.31),hash1(i+1+s*57.31),u);}
function fbm1(x,s){let v=0,a=.5,f=1;for(let k=0;k<5;k++){v+=a*noise1(x*f,s+k*13.7);f*=2.03;a*=.5;}return v/0.97;}
const bump=(x,c,w,a)=>{const u=(x-c)/w;return a*Math.exp(-u*u);};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const approach=(v,t,r)=>v+(t-v)*Math.min(1,r);

/* ==================== 世界常量 ==================== */
const L=11.3, WATER=0.33, N=2048;
const C1=10.2, C2=8.2, C3=6.2, C4=4.2, C5=2.2, CCOL=0.95;
const LAYER_W=5.4;
const xi=i=>i/(N-1)*L, ix=x=>clamp(Math.round(x/L*(N-1)),0,N-1);

/* ==================== WebGL ==================== */
const canvas=$('#gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){$('#err').style.display='flex';return;}
const hasCBF=!!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const aniso=gl.getExtension('EXT_texture_filter_anisotropic');
const MAXTEX=gl.getParameter(gl.MAX_TEXTURE_SIZE);

const VS=`#version 300 es
layout(location=0) in vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(s);console.error(log);throw new Error('shader: '+log);}return s;}
function program(fs,vs=VS){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){throw new Error('link: '+gl.getProgramInfoLog(p));}
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const info=gl.getActiveUniform(p,i);u[info.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,info.name);}return{p,u};}
const quadVAO=gl.createVertexArray();gl.bindVertexArray(quadVAO);
const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function blit(target){if(target){gl.bindFramebuffer(gl.FRAMEBUFFER,target.fb);gl.viewport(0,0,target.w,target.h);}else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);}gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);}
function texParams(filter,wrap){gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter===gl.LINEAR_MIPMAP_LINEAR?gl.LINEAR:filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrap);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrap);}
function createFBO(w,h,internal,format,type,filter){
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);texParams(filter,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,format,type,null);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  return{tex,fb,w,h,tx:1/w,ty:1/h};}
function createDouble(w,h,i,f,t,fl){let a=createFBO(w,h,i,f,t,fl),b=createFBO(w,h,i,f,t,fl);return{w,h,tx:1/w,ty:1/h,get read(){return a;},get write(){return b;},swap(){const c=a;a=b;b=c;},del(){for(const o of[a,b]){gl.deleteTexture(o.tex);gl.deleteFramebuffer(o.fb);}}};}
function bindTex(unit,tex){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);return unit;}

/* ---------- 流体着色器 ---------- */
const P_SPLAT=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTarget;uniform float uAspect,uRadius,uRadial;uniform vec2 uPoint;uniform vec4 uColor;
void main(){vec2 p=vUv-uPoint;p.x*=uAspect;float g=exp(-dot(p,p)/uRadius);vec4 a=uColor*g;if(uRadial!=0.){a.xy+=p/(length(p)+1e-4)*uRadial*g;}o=texture(uTarget,vUv)+a;}`);
const P_ADV=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uVelocity,uSource;uniform vec2 uTexel,uShift;uniform float uDt,uDiss;
void main(){vec2 c=vUv-uDt*texture(uVelocity,vUv).xy*uTexel+uShift;float inb=step(0.,c.x)*step(c.x,1.)*step(0.,c.y)*step(c.y,1.);o=texture(uSource,c)*inb/(1.+uDiss*uDt);}`);
const P_CURL=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uVelocity;uniform vec2 uTexel;
void main(){float L=texture(uVelocity,vUv-vec2(uTexel.x,0.)).y,R=texture(uVelocity,vUv+vec2(uTexel.x,0.)).y,T=texture(uVelocity,vUv+vec2(0.,uTexel.y)).x,B=texture(uVelocity,vUv-vec2(0.,uTexel.y)).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`);
const P_VORT=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uVelocity,uCurl;uniform vec2 uTexel;uniform float uCurlAmt,uDt;
void main(){float L=texture(uCurl,vUv-vec2(uTexel.x,0.)).x,R=texture(uCurl,vUv+vec2(uTexel.x,0.)).x,T=texture(uCurl,vUv+vec2(0.,uTexel.y)).x,B=texture(uCurl,vUv-vec2(0.,uTexel.y)).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=uCurlAmt*C;f.y*=-1.;vec2 v=texture(uVelocity,vUv).xy+f*uDt;o=vec4(clamp(v,-1000.,1000.),0.,1.);}`);
const P_DIV=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uVelocity;uniform vec2 uTexel;
void main(){float L=texture(uVelocity,vUv-vec2(uTexel.x,0.)).x,R=texture(uVelocity,vUv+vec2(uTexel.x,0.)).x,T=texture(uVelocity,vUv+vec2(0.,uTexel.y)).y,B=texture(uVelocity,vUv-vec2(0.,uTexel.y)).y;vec2 C=texture(uVelocity,vUv).xy;
if(vUv.x-uTexel.x<0.)L=-C.x;if(vUv.x+uTexel.x>1.)R=-C.x;if(vUv.y+uTexel.y>1.)T=-C.y;if(vUv.y-uTexel.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`);
const P_PRES=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uPressure,uDiv;uniform vec2 uTexel;
void main(){float L=texture(uPressure,vUv-vec2(uTexel.x,0.)).x,R=texture(uPressure,vUv+vec2(uTexel.x,0.)).x,T=texture(uPressure,vUv+vec2(0.,uTexel.y)).x,B=texture(uPressure,vUv-vec2(0.,uTexel.y)).x;o=vec4((L+R+B+T-texture(uDiv,vUv).x)*.25,0.,0.,1.);}`);
const P_GRAD=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uPressure,uVelocity;uniform vec2 uTexel;
void main(){float L=texture(uPressure,vUv-vec2(uTexel.x,0.)).x,R=texture(uPressure,vUv+vec2(uTexel.x,0.)).x,T=texture(uPressure,vUv+vec2(0.,uTexel.y)).x,B=texture(uPressure,vUv-vec2(0.,uTexel.y)).x;o=vec4(texture(uVelocity,vUv).xy-vec2(R-L,T-B),0.,1.);}`);
const P_MUL=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform float uValue;void main(){o=uValue*texture(uTex,vUv);}`);

/* ---------- 噪声纹理（GPU 生成，可平铺） ---------- */
const P_NOISE=program(`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform float uSeed;
float hi(vec2 i,float k){return fract(sin(dot(i+k*17.13,vec2(12.9898,78.233))+uSeed)*43758.5453);}
float vn(vec2 p,vec2 per,float k){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
float a=hi(mod(i,per),k),b=hi(mod(i+vec2(1.,0.),per),k),c=hi(mod(i+vec2(0.,1.),per),k),d=hi(mod(i+vec2(1.,1.),per),k);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
float fbm(vec2 uv,vec2 per,int oc,float k){float s=0.,a=.5,n=0.;for(int j=0;j<6;j++){if(j>=oc)break;s+=a*vn(uv*per,per,k+float(j));n+=a;per*=2.;a*=.5;}return s/n;}
float st(float v,float c){return clamp((v-.5)*c+.5,0.,1.);}
void main(){vec2 uv=vUv;
float r=st(fbm(uv,vec2(6.),5,1.),2.3);
float g=st(fbm(uv,vec2(10.),5,9.),2.3);
float b=st(fbm(uv,vec2(48.,5.),4,21.),2.6);
float a=st(fbm(uv,vec2(40.),3,33.),2.);
o=vec4(r,g,b,a);}`);
function makeNoiseTex(){const S=512;const f=createFBO(S,S,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR);gl.useProgram(P_NOISE.p);gl.uniform1f(P_NOISE.u.uSeed,(SEED%1000)*0.01);blit(f);
  gl.bindTexture(gl.TEXTURE_2D,f.tex);texParams(gl.LINEAR_MIPMAP_LINEAR,gl.REPEAT);gl.generateMipmap(gl.TEXTURE_2D);if(aniso)gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,8);return f.tex;}
const noiseTex=makeNoiseTex();

/* ---------- 宣纸纹理（Canvas 生成，可平铺） ---------- */
function makePaperTex(){
  const S=1024,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='rgb(128,128,128)';x.fillRect(0,0,S,S);
  const wrapDraw=(bx,by,r,fn)=>{const ox=[0],oy=[0];if(bx-r<0)ox.push(S);if(bx+r>S)ox.push(-S);if(by-r<0)oy.push(S);if(by+r>S)oy.push(-S);for(const a of ox)for(const b of oy){x.save();x.translate(a,b);fn();x.restore();}};
  for(let i=0;i<300;i++){const bx=rand(0,S),by=rand(0,S),r=rand(25,170),d=rnd()<.5;const al=rand(.025,.07);
    wrapDraw(bx,by,r,()=>{const g=x.createRadialGradient(bx,by,0,bx,by,r);g.addColorStop(0,d?`rgba(0,0,0,${al})`:`rgba(255,255,255,${al})`);g.addColorStop(1,'rgba(128,128,128,0)');x.fillStyle=g;x.beginPath();x.arc(bx,by,r,0,6.2832);x.fill();});}
  for(let i=0;i<2200;i++){const bx=rand(0,S),by=rand(0,S),len=rand(12,120),a=rand(0,6.2832),bend=rand(-.5,.5);
    const ex=bx+Math.cos(a)*len,ey=by+Math.sin(a)*len,mx=(bx+ex)/2+Math.cos(a+1.57)*len*bend*.3,my=(by+ey)/2+Math.sin(a+1.57)*len*bend*.3;
    const light=rnd()<.62;const al=rand(.04,.15);
    wrapDraw(bx,by,len+5,()=>{x.strokeStyle=light?`rgba(255,255,255,${al})`:`rgba(40,40,40,${al*.8})`;x.lineWidth=rand(.4,1.3);x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(mx,my,ex,ey);x.stroke();});}

function geeseUpdate(dt,tx,ty){
  const b=GS.b;if(!b.length)return;const L0=b[0];const st=GS.settle;
  if(st<1){
    let dx=tx-L0.x,dy=ty-L0.y;const d=Math.hypot(dx,dy)+1e-6;const sp=Math.min(.34,d*1.5);let dvx=dx/d*sp-L0.vx,dvy=dy/d*sp-L0.vy;const ac=Math.hypot(dvx,dvy),mx=.9*dt;if(ac>mx){dvx*=mx/ac;dvy*=mx/ac;}

    if(lsp>.04){const h=Math.atan2(L0.vy,L0.vx);let dh=h-GS.heading;while(dh>Math.PI)dh-=6.2832;while(dh<-Math.PI)dh+=6.2832;GS.heading+=dh*Math.min(1,dt*2.5);}
    const hx=Math.cos(GS.heading),hy=Math.sin(GS.heading);let err=0;
    for(let i=1;i<b.length;i++){const g=b[i];const side=i%2?1:-1,rank=Math.ceil(i/2);
      const sx=L0.x-hx*rank*.034-hy*side*rank*.026+Math.sin(D.t*1.3+i)*.003,sy=L0.y-hy*rank*.034+hx*side*rank*.026+Math.cos(D.t*1.1+i*2)*.003;
      let ex=sx-g.x,ey=sy-g.y;err+=Math.hypot(ex,ey);let vx=ex*3,vy=ey*3;const vm=Math.hypot(vx,vy);if(vm>.55){vx*=.55/vm;vy*=.55/vm;}
      for(let j=0;j<b.length;j++){if(j===i)continue;const ox=g.x-b[j].x,oy=g.y-b[j].y,od=Math.hypot(ox,oy);if(od<.016&&od>1e-5){vx+=ox/od*(.016-od)*12;vy+=oy/od*(.016-od)*12;}}

    err/=b.length-1;

  }

    g.ph+=dt*(5+s*16)*(1-st*.8);g.flap=Math.sin(g.ph)*(1-st);}
}

  const l1=h>.5?(r>.5?'千峰削立':'青峰入云'):(r>.5?'远岫参差':'远山如黛');
  let cover=0,cn=0;for(let i=ix(6.95);i<=ix(9.3);i++){cover+=lush[i];cn++;}cover/=cn||1;
  const l2=(s.thunder||0)>0?'惊雷落江':cover>.32?'一江急雨':cover>.12?'半江烟雨':'微雨润林';
  const l3=GS.formed?'雁字横秋':D.part.geese?'雁随人去':'雁过长空';
  const n=PL.count;const l4=n<=10&&n>0?'寒梅'+cnNum(n)+'朵':'梅开满枝';
  return[l1,l2,l3,l4,'一舟载月归'];}
function poemStart(t){
  const lines=makePoem();D.poem=lines;let x=1.05;const top=.86;
  for(const ln of lines){for(let k=0;k<ln.length;k++){queueChar(ln[k],x,top-k*.088,.074,t,true);t+=.36;}x-=.106;t+=.3;}
  const d=new Date();const date=ganzhi(d.getFullYear())+'年'+cnNum(d.getMonth()+1)+'月　观者题于屏前';
  const dx=x+.015;for(let k=0;k<date.length;k++){queueChar(date[k],dx,.80-k*.043,.036,t,false);t+=.09;}
  SEAL_DEF=[dx,Math.max(.12,.80-date.length*.043-.055)];
  return t+.4;}
function goto(k){const prev=CH[D.ch];if(prev&&prev.exit)prev.exit();D.ch=k;D.lt=0;const c=CH[k];c._ei=0;if(c.enter)c.enter.call(c);}
function director(dt){
  for(let i=D.timers.length-1;i>=0;i--){if(D.t>=D.timers[i][0]){const f=D.timers[i][1];D.timers.splice(i,1);f();}}
  const c=CH[D.ch];D.lt+=dt;const ev=c.ev||[];while(c._ei<ev.length){let j=-1;for(let k=0;k<ev.length;k++){if(!ev[k].done&&ev[k][0]<=D.lt&&(j<0||ev[k][0]<ev[j][0]))j=k;}if(j<0)break;ev[j].done=true;c._ei++;ev[j][1].call(c);}
  if(c.update)c.update.call(c,D.lt,dt);
  if(D.ch<CH.length-1&&((c.next&&c.next.call(c,D.lt))||D.lt>=c.dur))goto(D.ch+1);}

/* ==================== 终章：卷轴展开 ==================== */
let FIN=null;
function overviewKey(){const asp=W/H;const tanH=.3;const need=(L+1.15)*1.06;const dist=Math.max(need/(2*tanH*asp),3);const dir=norm([0,-.3,1]);const T=[L/2-.06,.5-.19*2*dist*tanH,0];return{P:[T[0]+dir[0]*dist,T[1]+dir[1]*dist,T[2]+dir[2]*dist],T,tanH};}
function finaleEnter(){
  D.end=true;hintHide();ghostHide();capClear();$('#mark').classList.remove('on');
  for(let i=0;i<N;i++)for(let c=0;c<4;c++)if(revStart[i*4+c]<0)revStart[i*4+c]=D.t+rand(0,.5);
  gl.bindTexture(gl.TEXTURE_2D,LY.tex);flushLayer();gl.bindTexture(gl.TEXTURE_2D,LY.tex);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);if(aniso)gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,8);
  const K0={P:[cam.cx,cam.cy,2],T:[cam.cx,cam.cy,0],tanH:cam.vh/4};
  FIN={keys:[K0,{P:[.2,-.85,1.25],T:[1.7,.5,0],tanH:.36},{P:[4.4,-.95,1.15],T:[6.0,.5,0],tanH:.36},{P:[8.6,-.9,1.2],T:[10.1,.5,0],tanH:.35},null],times:[0,5,10.5,15.5,22],T:22};
  cam.mode='free';cursorEl.classList.add('light');
  MUS.pool=[50,57,62,66,69,74];MUS.density=.22;MUS.rate=1.3;padChord([38,45,54,62,69],.05,4);
  const p=D.part;const lines=[p.mtn?'山，是你画的；':'山，自己生了出来；',p.rain?'雨，是你唤来的；':'雨，自己落下；',p.geese?'雁，是你领的路；':'雁，自己找到了方向；',p.plum?'梅，是你点开的。':'梅，自己开了。'];
  const fe=$('#final');fe.innerHTML='';lines.forEach(t=>{const d=document.createElement('div');d.className='ln';d.textContent=t;fe.appendChild(d);});
  const big=document.createElement('div');big.className='ln big';big.textContent='世上只此一卷';fe.appendChild(big);
  const any=p.mtn||p.rain||p.geese||p.plum;let extra=null;if(!any){extra=document.createElement('div');extra.className='ln';extra.textContent='下一次，换你落笔。';fe.appendChild(extra);}
  const els=[...fe.children];els.forEach((e,i)=>later(18.5+i*1.9+(e===big?.8:0)+(e===extra?1.4:0),()=>{e.classList.add('on');pluck([62,66,69,74,78,81,86][i%7],.16,0);}));
  later(18.5+els.length*1.9+2.5,()=>{$('#btns').classList.add('on');});
  finaleUpdate(0);
}
function cr(a,b,c,d,t){const t2=t*t,t3=t2*t;return .5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);}
function finaleUpdate(lt){
  FIN.keys[4]=overviewKey();const K=FIN.keys,TT=FIN.times;const s=easeSine(clamp(lt/FIN.T,0,1))*FIN.T;
  let k=0;while(k<TT.length-2&&s>TT[k+1])k++;const u=clamp((s-TT[k])/(TT[k+1]-TT[k]),0,1);
  const g=i=>K[clamp(i,0,K.length-1)];const a=g(k-1),b=g(k),c=g(k+1),d=g(k+2);
  const P=[0,1,2].map(j=>cr(a.P[j],b.P[j],c.P[j],d.P[j],u)),T=[0,1,2].map(j=>cr(a.T[j],b.T[j],c.T[j],d.T[j],u));
  const th=cr(a.tanH,b.tanH,c.tanH,d.tanH,u);
  if(lt>FIN.T){const e=lt-FIN.T;P[0]+=Math.sin(e*.12)*.25;P[1]+=Math.sin(e*.09)*.08;}
  cam.P=P;cam.T=T;cam.tanH=th;D.dyeAmt=Math.max(0,1-lt/2.5);}

/* ==================== 收藏此卷 ==================== */
function saveScroll(){
  try{const Wimg=Math.min(8192,MAXTEX),view=L+1.35;const Himg=Math.round(Wimg*1.45/view);
    const f=createFBO(Wimg,Himg,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,gl.LINEAR);
    drawMain(f,{P:[L/2-.065,.5,2],T:[L/2-.065,.5,0],tanH:(view*Himg/Wimg)/4},Wimg/Himg,0);
    const px=new Uint8Array(Wimg*Himg*4);gl.bindFramebuffer(gl.FRAMEBUFFER,f.fb);gl.readPixels(0,0,Wimg,Himg,gl.RGBA,gl.UNSIGNED_BYTE,px);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteTexture(f.tex);gl.deleteFramebuffer(f.fb);
    const cv=document.createElement('canvas');cv.width=Wimg;cv.height=Himg;const c=cv.getContext('2d');const im=c.createImageData(Wimg,Himg);
    for(let y=0;y<Himg;y++)im.data.set(px.subarray((Himg-1-y)*Wimg*4,(Himg-y)*Wimg*4),y*Wimg*4);c.putImageData(im,0,0);
    cv.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='留白·只此一卷.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);},'image/png');
  }catch(e){console.warn(e);}}

/* ==================== 渲染 ==================== */
function drawMain(target,K,aspect,dyeAmt){
  const P=P_MAIN,u=P.u;gl.useProgram(P.p);gl.disable(gl.BLEND);
  const B=camBasis(K.P,K.T);
  gl.uniform3fv(u.uCamPos,K.P);gl.uniform3fv(u.uCamR,B.r);gl.uniform3fv(u.uCamU,B.u);gl.uniform3fv(u.uCamF,B.f);
  gl.uniform1f(u.uTanH,K.tanH);gl.uniform1f(u.uAspect,aspect);gl.uniform1f(u.uL,L);gl.uniform1f(u.uT,D.t);gl.uniform1f(u.uWater,WATER);
  gl.uniform1f(u.uDyeAmt,dyeAmt);gl.uniform1f(u.uFlash,target?0:D.flash);gl.uniform1f(u.uLayerW,LAYER_W);gl.uniform1f(u.uWind,windV);gl.uniform1f(u.uGS,1.5);
  gl.uniform2f(u.uDyeTexel,dye.tx,dye.ty);
  gl.uniform4f(u.uBoat,BOAT.x,BOAT.y+Math.sin(D.t*1.3)*.0018,BOAT.rot,BOAT.a);gl.uniform4f(u.uMoon,MOON.x,MOON.y,MOON.r,MOON.a);
  const gn=geesePack();gl.uniform4fv(u.uGeese,GU);gl.uniform1i(u.uGeeseN,gn);
  gl.uniform1i(u.uPaper,bindTex(0,paperTex));gl.uniform1i(u.uNoise,bindTex(1,noiseTex));gl.uniform1i(u.uData,bindTex(2,dataTex));gl.uniform1i(u.uLayer,bindTex(3,LY.tex));gl.uniform1i(u.uDye,bindTex(4,dye.read.tex));
  blit(target);}
function drawParticles(){
  const n=Math.min(PS.length,PMAX);if(!n)return;
  for(let i=0;i<n;i++){const p=PS[i],o=i*7;pbuf[o]=p.x;pbuf[o+1]=p.y;pbuf[o+2]=p.s;pbuf[o+3]=p.r;pbuf[o+4]=p.type;pbuf[o+5]=p.a*(p.fade!==undefined?p.fade:1);pbuf[o+6]=p.e;}
  gl.bindBuffer(gl.ARRAY_BUFFER,pvb);gl.bufferSubData(gl.ARRAY_BUFFER,0,pbuf,0,n*7);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  const P=P_PART;gl.useProgram(P.p);gl.uniform2f(P.u.uCam,cam.cx,cam.cy);gl.uniform1f(P.u.uVH,cam.vh);gl.uniform1f(P.u.uAspect,W/H);gl.uniform1f(P.u.uH,canvas.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.bindVertexArray(pVAO);gl.drawArrays(gl.POINTS,0,n);gl.bindVertexArray(null);gl.disable(gl.BLEND);}

/* ==================== 每帧更新 ==================== */
function updateReveal(){
  if(D.autoReveal&&cam.mode==='film'){const hw=halfW();const vl=cam.cx-hw-.3,vr=cam.cx+hw+.04;const i0=ix(vl),i1=ix(vr);
    for(let i=i0;i<=i1;i++){const x=xi(i);for(let c=0;c<4;c++){if(revStart[i*4+c]>=0)continue;revStart[i*4+c]=D.t+.15+(vr-x)*.08+c*.45+fbm1(x*2.5,11+c)*.6;}}}
  const t=D.t;for(let i=0;i<N;i++){for(let c=0;c<4;c++){const s=revStart[i*4+c];let v=s<0?0:clamp((t-s)/revDur[c],0,1);if(c===3)v=Math.min(v,treeCap[i])+lush[i];DATA[REV+i*4+c]=v;}}}
function updateSystems(dt){
  const t=D.t;
  // 雨
  if(RN.I>.01){const n=RN.I*330*dt;RN.acc+=n;const top=cam.cy+cam.vh/2+.03;
    while(RN.acc>=1){RN.acc--;const x=RN.x+(rnd()+rnd()+rnd()-1.5)*.24;addP({type:0,x,y:top+rand(0,.08),vx:-.12,vy:-rand(1.9,2.5),s:rand(.035,.055),r:.05,vr:0,a:rand(.25,.5),max:3,e:0,sy:rand(.02,WATER-.01)});}
    const i0=ix(RN.x-.3),i1=ix(RN.x+.3);for(let i=i0;i<=i1;i++){const dx=(xi(i)-RN.x)/.2;lush[i]=Math.min(.85,lush[i]+dt*.2*RN.I*Math.exp(-dx*dx));}}
  if(AU.ctx){const ct=AU.ctx.currentTime;AU.rain.g.gain.setTargetAtTime(RN.I*.42,ct,.3);AU.wind.g.gain.setTargetAtTime(clamp(Math.abs(windV)*.35+(CH[D.ch]&&CH[D.ch].name==='雁'?.04:0)+snowI*.03,0,.3),ct,.25);AU.wind.f.frequency.setTargetAtTime(380+Math.abs(windV)*500,ct,.3);}
  // 风
  const pvx=(D.t-PTR.moved<.3)?PTR.vx/W*cam.vh*(W/H):0;windV=lerp(windV,clamp(pvx*.5,-1.5,1.5)-.08+Math.sin(t*.7)*.06,Math.min(1,dt*1.5));
  // 秋叶
  const chn=CH[D.ch]?CH[D.ch].name:'';
  if(chn==='雁'&&D.lt>3){leafRate+=dt*(2.5+Math.abs(windV)*7);while(leafRate>=1){leafRate--;const hw=halfW();addP({type:2,x:cam.cx+rand(-hw,hw*1.1),y:rand(.55,1.02),vx:windV*.3,vy:-rand(.04,.09),s:rand(.011,.02),r:rand(0,6),vr:rand(-3,3),a:rand(.55,.85),max:14,e:rnd(),ph:rand(0,6)});}}
  // 雪
  const snowTarget=chn==='梅'&&D.lt>2?1:chn==='归'&&D.lt<3?.5:0;snowI=approach(snowI,snowTarget,dt*.4);
  if(snowI>.01){D.snowAcc=(D.snowAcc||0)+snowI*75*dt;const hw=halfW();while(D.snowAcc>=1){D.snowAcc--;addP({type:1,x:cam.cx+rand(-hw*1.1,hw*1.2),y:cam.cy+cam.vh/2+rand(.01,.05),vx:0,vy:-rand(.05,.11),s:rand(.004,.009),r:0,vr:0,a:rand(.7,1),max:20,e:0,ph:rand(0,6)});}}
  // 花瓣
  if(PL.blossoms.length&&chn==='梅'&&rnd()<dt*.5){const b=PL.blossoms[(rnd()*PL.blossoms.length)|0];if(!b.bud&&D.t>b.t0+1)addP({type:3,x:b.x,y:b.y,vx:rand(-.02,.02),vy:-rand(.03,.06),s:rand(.009,.013),r:rand(0,6),vr:rand(-2,2),a:.9,max:12,e:0,ph:rand(0,6)});}
  // 粒子运动
  for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.life+=dt;let dead=p.life>p.max;
    if(p.type===0){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<p.sy){dead=true;if(p.sy>bankTop(p.x)&&p.x>1.3&&rnd()<.4)ripple(p.x,p.sy,false);}}
    else if(p.type===1){p.ph+=dt;p.x+=(Math.sin(p.ph*1.3)*.02+windV*.05)*dt;p.y+=p.vy*dt;if(p.y<-.02)dead=true;}
    else if(p.type===2||p.type===3){p.ph+=dt*2;p.vx=lerp(p.vx,windV*.35+Math.sin(p.ph)*.05,Math.min(1,dt));p.x+=p.vx*dt;p.y+=(p.vy+Math.cos(p.ph*1.3)*.02)*dt;p.r+=p.vr*dt;
      if(p.y<WATER&&p.y>bankTop(p.x)&&!p.landed&&p.y<rand(.1,WATER)){p.landed=true;p.vy=0;p.vr=0;ripple(p.x,p.y,false);p.max=p.life+3;}if(p.landed){p.vx*=.95;p.fade=clamp(p.max-p.life,0,1);}if(p.y<-.05)dead=true;}
    else if(p.type===4){const f=p.life/p.max;p.s=lerp(p.s,p.gs,Math.min(1,dt*1.8));p.fade=1-f;}
    if(dead){PS[i]=PS[PS.length-1];PS.pop();}}
  // 舟
  if(BOAT.show){BOAT.a=Math.min(1,BOAT.a+dt*.4);const d=BOAT.target-BOAT.x;BOAT.x+=clamp(d*.5,-.34,.34)*dt;}
  BOAT.rot=.025*Math.sin(t*1.1)+RN.I*.03*Math.sin(t*3.1);
  // 月
  if(MOON.rise>0){const p=clamp((t-MOON.rise)/9,0,1);MOON.y=lerp(.42,.8,easeSine(p));MOON.a=Math.min(1,(t-MOON.rise)/1.5);}
  // 雁（篇章外仍保持定格）
  if(GS.b.length&&chn!=='雁'&&GS.settle<1){GS.settle=1;}
  // 闪电
  D.flash=Math.max(0,D.flash-dt*2.2);
  // 墨滴续流
  if(feed&&D.t<feed.until){splat(feed.u+rand(-.004,.004),feed.v+rand(-.004,.004),rand(-.05,.05),rand(-.05,.05),[.14,.14,.15,0],.0005,22);}
  cam.shake=Math.max(0,cam.shake-dt*3);
}

/* ==================== 尺寸与性能 ==================== */
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=Math.max(2,Math.round(W*DPR*rscale));canvas.height=Math.max(2,Math.round(H*DPR*rscale));}
let rsT=null;addEventListener('resize',()=>{resize();clearTimeout(rsT);rsT=setTimeout(()=>{initFluid();},180);});
resize();initFluid();
const perf={acc:0,n:0,t:0};
function adapt(ms){perf.acc+=ms;perf.n++;perf.t+=ms;if(perf.t<2500)return;const avg=perf.acc/perf.n;perf.acc=0;perf.n=0;perf.t=0;
  if(avg>20.5&&rscale>.55){rscale=Math.max(.55,rscale-.12);resize();}else if(avg<14.5&&rscale<1){rscale=Math.min(1,rscale+.06);resize();}}

/* ==================== 开场 ==================== */
function start(){
  D.started=true;D.t=0;auInit();
  $('#title').classList.add('gone');setTimeout(()=>$('#title').remove(),2000);
  const u=PTR.x/W,v=1-PTR.y/H;inkDrop(u,v,true);dropSnd();D.lastAct=0;
  goto(0);
}

/* ==================== 主循环 ==================== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rms=now-last;last=now;const rdt=Math.min(.05,rms/1000);const dt=rdt*SPEED;
  try{
    if(D.started){D.t+=dt;director(dt);musicTick();}
    if(cam.mode==='film'){cam.prevCx=cam.cx;cam.prevCy=cam.cy;let x=cam.dur>0?lerp(cam.from,cam.to,easeSine(clamp((D.t-cam.t0)/cam.dur,0,1))):cam.to;x+=Math.sin(D.t*.13)*.004;cam.cx=clampCx(x);
      cam.cy=.5+Math.sin(D.t*.11)*.002+(cam.shake>0?Math.sin(D.t*90)*cam.shake*.004:0);}
    updateSystems(dt);updateReveal();updateLayer();uploadData();flushLayer();
    if(D.dyeAmt>0){const vw=cam.vh*W/H;fluidStep(Math.min(rdt*Math.min(SPEED,2),1/30),cam.mode==='film'?(cam.cx-cam.prevCx)/vw:0,cam.mode==='film'?(cam.cy-cam.prevCy)/cam.vh:0);}
    const K=cam.mode==='film'?{P:[cam.cx,cam.cy,2],T:[cam.cx,cam.cy,0],tanH:cam.vh/4}:{P:cam.P,T:cam.T,tanH:cam.tanH};
    drawMain(null,K,W/H,D.dyeAmt);
    if(cam.mode==='film')drawParticles();
  }catch(e){console.error(e);}
  if(rms<100)adapt(rms);
}
requestAnimationFrame(frame);
window.__liubai={D,CH,cam,MT,PL,GS,RN,DATA,revStart,AU,KS,goto,halfW,ix,get fps(){return perf;},get rscale(){return rscale;}};
})();
