<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风的形状</title>
<style>
:root{
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun","宋体",serif;
  --kai:"STKaiti","Kaiti SC","KaiTi","楷体","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:var(--serif);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000;--u:19.2px;touch-action:none}
#stage.live{cursor:none}
#gl,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.ui{position:absolute;pointer-events:none}
#scrim{left:0;right:0;bottom:0;height:36%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.4));opacity:0;transition:opacity 2s}
#scrim.on{opacity:1}

.chars span{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(7px);
  transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.2s ease;transition-delay:calc(var(--i)*60ms)}
.chars.on span{opacity:.97;transform:none;filter:none}
.chars.off span{opacity:0;transform:translate(1.1em,-.25em);filter:blur(9px);
  transition:opacity .8s ease,transform 1s cubic-bezier(.5,0,.8,.4),filter .8s ease;transition-delay:calc(var(--i)*24ms)}

#cap{left:0;right:0;bottom:9.5%;text-align:center;font-size:calc(var(--u)*1.72);letter-spacing:.34em;text-indent:.34em;
  white-space:nowrap;text-shadow:0 0 calc(var(--u)*.9) rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.55)}
#title{left:0;right:0;top:30%;text-align:center}
#title h1{font-family:var(--kai);font-weight:400;font-size:calc(var(--u)*6.6);letter-spacing:.42em;text-indent:.42em;
  text-shadow:0 0 calc(var(--u)*2.4) rgba(20,10,30,.45),0 2px 6px rgba(0,0,0,.25)}
#title h1 span{transition-delay:calc(var(--i)*260ms)}
#title.off h1 span{transition-delay:calc(var(--i)*70ms)}
#title p{margin-top:calc(var(--u)*1.1);font-size:calc(var(--u)*1.02);letter-spacing:.9em;text-indent:.9em;
  text-shadow:0 0 calc(var(--u)*.8) rgba(0,0,0,.5)}
#title p span{transition-delay:calc(1.4s + var(--i)*50ms)}
#title.off p span{transition-delay:0s}

#chap{left:3.2%;top:7%;font-size:calc(var(--u)*1.0);letter-spacing:.5em;opacity:0;transition:opacity 2s ease;
  text-shadow:0 0 calc(var(--u)*.6) rgba(0,0,0,.6);display:flex;align-items:center;gap:calc(var(--u)*.7)}
#chap b{font-family:var(--kai);font-weight:400;font-size:calc(var(--u)*1.7);letter-spacing:0}
#chap i{display:block;width:calc(var(--u)*2.2);height:1px;background:rgba(255,255,255,.7)}
#chap.on{opacity:.92}
#chap.dim{opacity:.38}

#hint,#auto,#gate .k,#gate .n,#end .s,#end .c{font-family:var(--sans);font-weight:300}
#hint{left:0;right:0;bottom:3.4%;text-align:center;font-size:calc(var(--u)*.8);letter-spacing:.42em;text-indent:.42em;opacity:0;
  transition:opacity 1.4s ease;text-shadow:0 0 8px rgba(0,0,0,.7)}
#hint.on{opacity:.72}
#auto{right:3.2%;bottom:3.4%;font-size:calc(var(--u)*.74);letter-spacing:.3em;opacity:0;transition:opacity 1.2s ease;text-shadow:0 0 8px rgba(0,0,0,.7)}
#auto.on{opacity:.6}
#prog{left:0;bottom:0;height:2px;width:100%;background:rgba(255,255,255,.08);opacity:0;transition:opacity 2s}
#prog.on{opacity:1}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.75))}

#btns{right:2.4%;top:5.5%;display:flex;gap:calc(var(--u)*.5);pointer-events:auto;opacity:.55;transition:opacity .4s}
#btns:hover{opacity:1}
#btns button{width:calc(var(--u)*2.1);height:calc(var(--u)*2.1);min-width:30px;min-height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.22);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#btns button:hover{background:rgba(255,255,255,.18)}
#btns svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mute.muted .wave{display:none}
#mute:not(.muted) .cross{display:none}

#gate{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;
  background:radial-gradient(ellipse at 50% 58%,rgba(6,8,18,.35),rgba(0,0,0,.9) 75%);transition:opacity 2.2s ease}
#gate.gone{opacity:0;pointer-events:none}
#gate .k{font-size:calc(var(--u)*.86);letter-spacing:1em;text-indent:1em;opacity:.6}
#gate .go{position:relative;margin:calc(var(--u)*2.6) 0 calc(var(--u)*2.4);width:calc(var(--u)*9);height:calc(var(--u)*9);display:flex;align-items:center;justify-content:center;
  font-family:var(--kai);font-size:calc(var(--u)*1.9);letter-spacing:.3em;text-indent:.3em}
#gate .go::before,#gate .go::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);animation:breathe 3.6s ease-in-out infinite}
#gate .go::after{animation-delay:-1.8s;border-color:rgba(255,255,255,.25)}
@keyframes breathe{0%,100%{transform:scale(.86);opacity:.9}50%{transform:scale(1.08);opacity:.25}}
#gate .n{font-size:calc(var(--u)*.8);letter-spacing:.42em;text-indent:.42em;opacity:.55;line-height:2.1;text-align:center}

#end{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5.5%;opacity:0;transition:opacity 3s ease}
#end.on{opacity:1}
#end .a{font-size:calc(var(--u)*1.05);letter-spacing:.6em;text-indent:.6em;opacity:.72;text-shadow:0 0 10px rgba(0,0,0,.8)}
#end .b{font-family:var(--kai);font-size:calc(var(--u)*2.7);letter-spacing:.32em;text-indent:.32em;margin-top:.45em;text-shadow:0 0 16px rgba(0,0,0,.8)}
#end .s{font-size:calc(var(--u)*.8);letter-spacing:.2em;opacity:.66;margin-top:1.3em;text-shadow:0 0 8px rgba(0,0,0,.9)}
#again{pointer-events:none;cursor:pointer;margin-top:1.5em;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.05);color:#fff;
  font-family:inherit;font-size:calc(var(--u)*.92);letter-spacing:.5em;text-indent:.5em;padding:.62em 2.1em;border-radius:99px;transition:background .3s,border-color .3s}
#end.on #again{pointer-events:auto}
#again:hover{background:rgba(255,255,255,.18);border-color:#fff}
#end .c{font-size:calc(var(--u)*.62);letter-spacing:.3em;opacity:.38;margin-top:1.5em}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:18px;letter-spacing:.2em;text-align:center;line-height:2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="scrim" class="ui"></div>
  <div id="chap" class="ui"><b id="chapN"></b><i></i><span id="chapT"></span></div>
  <div id="title" class="ui"><h1 class="chars" id="titleH"></h1><p class="chars" id="titleP"></p></div>
  <div id="cap" class="ui chars"></div>
  <div id="hint" class="ui"></div>
  <div id="auto" class="ui">风在自己走　动一动鼠标，接过它</div>
  <div id="prog" class="ui"><i id="progI"></i></div>
  <div id="end" class="ui">
    <div class="a" id="endA">没有人见过风。</div>
    <div class="b" id="endB">这，是你的形状。</div>
    <div class="s" id="endS"></div>
    <button id="again">再吹一次</button>
    <div class="c">全部画面与声音，由一个文件实时生成</div>
  </div>
  <div id="btns" class="ui">
    <button id="mute" title="静音 (M)" aria-label="静音"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button id="full" title="全屏 (F)" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="gate" class="ui">
    <div class="k">一部要你动手的短片</div>
    <div class="go">点一下</div>
    <div class="n">请打开声音　·　全程约三分半<br>只需要一只鼠标</div>
  </div>
</div>
<div id="fail">这部短片需要支持 WebGL2 的浏览器<br>请使用桌面版最新 Chrome 打开</div>
<script>
(()=>{'use strict';
/* ============================================================
   风的形状 —— 一部由观众吹动的互动短片
   画面：WebGL2 实时渲染　声音：Web Audio 实时合成　无任何外部资源
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const TAU=Math.PI*2, RAD=Math.PI/180;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(i,j){let h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const rnd=Math.random;

/* ---------------- 时间线 ---------------- */
const T={awake:13,noon:58,dusk:100,night:142,coda:181,card:200};
function speedAt(t){let v=lerp(0.12,3.0,sstep(13,20,t));v=lerp(v,4.6,sstep(97,104,t));v=lerp(v,2.8,sstep(138,146,t));v=lerp(v,0.2,sstep(178,191,t));return v}
const ZT=new Float32Array(5200);{let z=0;for(let i=0;i<ZT.length;i++){ZT[i]=z;z+=speedAt(i*0.05)*0.05}}
function zAt(t){const f=clamp(t/0.05,0,ZT.length-1.001),i=Math.floor(f);return lerp(ZT[i],ZT[i+1],f-i)}
const Z={dand0:3,dand1:zAt(50)+6,wheat0:zAt(50),wheat1:zAt(97)-10,pin0:zAt(62),pin1:zAt(95),lake0:zAt(101.5),lake1:zAt(140.5),fire0:zAt(143)};
const WATER_Y=-2.3,LAKE_FLOOR=-3.6;

const KEYS=[
{t:0,  zen:[.022,.035,.10],hor:[.10,.10,.20],sun:[.20,.20,.34],amb:[.055,.07,.13],glow:[.25,.16,.22],sunEl:-9,sunAz:20,disk:0,stars:.8,cover:.34,cLit:[.16,.15,.27],cShd:[.045,.05,.11],fog:.021,mtn:[.03,.035,.08],moon:0,shadow:0,wind:0,bloom:1,pitch:-.03},
{t:13, zen:[.09,.15,.36],hor:[.80,.46,.40],sun:[.62,.42,.40],amb:[.15,.16,.26],glow:[.9,.42,.25],sunEl:-3,stars:.22,cLit:[.98,.56,.48],cShd:[.24,.21,.37],mtn:[.17,.15,.28],wind:.9,pitch:-.05},
{t:25, zen:[.20,.38,.70],hor:[1.0,.72,.48],sun:[1.25,.86,.52],amb:[.25,.27,.38],glow:[1.0,.62,.3],sunEl:4.5,sunAz:19,disk:1,stars:0,cover:.32,cLit:[1,.8,.62],cShd:[.48,.4,.52],fog:.017,mtn:[.34,.3,.44],shadow:.1,wind:1.1,pitch:-.07},
{t:46, zen:[.17,.44,.86],hor:[.80,.88,.96],sun:[1.12,1.0,.82],amb:[.30,.38,.48],glow:[.9,.8,.6],sunEl:17,sunAz:16,cover:.36,cLit:[1,.97,.92],cShd:[.6,.66,.78],fog:.010,mtn:[.42,.5,.64],shadow:.35,wind:1.2},
{t:72, zen:[.12,.40,.86],hor:[.70,.86,.98],sun:[1.14,1.08,.96],amb:[.34,.43,.54],glow:[.8,.8,.75],sunEl:50,sunAz:4,cover:.44,cLit:[1,1,1],cShd:[.62,.7,.82],fog:.0065,mtn:[.4,.52,.68],shadow:.5,wind:1.5},
{t:96, zen:[.16,.38,.80],hor:[.96,.84,.66],sun:[1.2,.96,.7],amb:[.32,.36,.45],glow:[1,.75,.4],sunEl:19,sunAz:-9,cover:.42,cLit:[1,.92,.78],cShd:[.58,.56,.68],fog:.0075,mtn:[.42,.42,.56],shadow:.4,wind:1.3},
{t:110,zen:[.19,.28,.60],hor:[1.0,.60,.30],sun:[1.3,.72,.36],amb:[.28,.25,.35],glow:[1.1,.55,.22],sunEl:8,sunAz:-8,cover:.46,cLit:[1,.64,.38],cShd:[.40,.28,.42],fog:.0085,mtn:[.34,.24,.36],shadow:.2,wind:1.0},
{t:131,zen:[.12,.14,.42],hor:[1.0,.40,.24],sun:[1.1,.42,.26],amb:[.20,.17,.30],glow:[1.2,.42,.2],sunEl:1.2,sunAz:-7,cLit:[1,.42,.34],cShd:[.28,.18,.35],fog:.0095,mtn:[.18,.11,.24],shadow:0,wind:.9},
{t:143,zen:[.035,.055,.19],hor:[.36,.24,.42],sun:[.22,.22,.40],amb:[.09,.10,.21],glow:[.5,.22,.3],sunEl:-6,sunAz:-6,disk:0,stars:.45,cover:.66,cLit:[.30,.25,.42],cShd:[.07,.07,.16],fog:.011,mtn:[.06,.05,.14],moon:.4,wind:1.0,pitch:-.04},
{t:153,zen:[.010,.018,.065],hor:[.05,.08,.19],sun:[.26,.34,.56],amb:[.045,.065,.13],glow:[.06,.09,.2],sunEl:-18,stars:1,cover:.84,cLit:[.12,.15,.26],cShd:[.03,.04,.085],mtn:[.018,.025,.065],moon:1,pitch:.07},
{t:181,cover:.78,wind:.9,pitch:.09},
{t:197,cover:.6,wind:.1,pitch:.13},
{t:210,cover:.5,wind:.07,pitch:.3},
{t:400}
];
const KP=Object.keys(KEYS[0]).filter(k=>k!=='t');
for(let i=1;i<KEYS.length;i++)for(const k of KP)if(KEYS[i][k]===undefined)KEYS[i][k]=KEYS[i-1][k];
const env={};
function evalKeys(t){
  let i=0;while(i<KEYS.length-2&&KEYS[i+1].t<=t)i++;
  const a=KEYS[i],b=KEYS[i+1],u=sstep(0,1,(t-a.t)/(b.t-a.t));
  for(const k of KP){const x=a[k],y=b[k];
    if(typeof x==='number')env[k]=lerp(x,y,u);
    else{const e=env[k]||(env[k]=[0,0,0]);e[0]=lerp(x[0],y[0],u);e[1]=lerp(x[1],y[1],u);e[2]=lerp(x[2],y[2],u)}}
}
function dirFrom(el,az,out){el*=RAD;az*=RAD;out[0]=Math.sin(az)*Math.cos(el);out[1]=Math.sin(el);out[2]=Math.cos(az)*Math.cos(el);return out}

/* ---------------- 地形（与着色器内完全一致）---------------- */
function shoreN(x){return Math.sin(x*0.031)*7+Math.sin(x*0.083+1.7)*3}
function lakeMask(x,z){const a=sstep(Z.lake0-14,Z.lake0+10,z+shoreN(x)),b=1-sstep(Z.lake1-10,Z.lake1+14,z+shoreN(x+91));return a*b}
function hills(x,z){return 1.2*Math.sin(x*0.021+1.3)*Math.cos(z*0.017)+0.7*Math.sin(x*0.05+z*0.043)+0.25*Math.sin(x*0.13-z*0.11+2.0)}
function terrainH(x,z){const m=lakeMask(x,z);return hills(x,z)*(1-m)+LAKE_FLOOR*m}
function groundH(x,z){return Math.max(terrainH(x,z),WATER_Y)}

/* ---------------- WebGL ---------------- */
const stage=$('stage'),canvas=$('gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){$('fail').style.display='flex';stage.style.display='none';return}
const HDR=!!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const MAXS=gl.getParameter(gl.MAX_SAMPLES)|0;

const HEAD=`#version 300 es
precision highp float;
precision highp sampler2D;
`;
const UNI=`
uniform float uTime;
uniform vec3 uCam;
uniform mat4 uVP;
uniform vec4 uLake;
uniform vec4 uZone;
uniform sampler2D uWind;
uniform sampler2D uNoise;
uniform sampler2D uClear;
uniform vec4 uAmb;
uniform vec2 uAmbOff;
uniform vec4 uShock[4];
uniform vec3 uSunCol,uAmbCol,uLightDir,uSunDir,uHorizon,uZenith,uGlowCol;
uniform vec4 uFog;
uniform vec4 uPL;
uniform vec3 uPLCol;
uniform vec4 uCloud;
uniform vec3 uCloudLit,uCloudShd,uMtn,uMoonDir;
uniform vec4 uSkyP;
`;
const G_TERRAIN=`
float shoreN(float x){return sin(x*0.031)*7.0+sin(x*0.083+1.7)*3.0;}
float lakeMask(vec2 p){
  float a=smoothstep(uLake.x-14.0,uLake.x+10.0,p.y+shoreN(p.x));
  float b=1.0-smoothstep(uLake.y-10.0,uLake.y+14.0,p.y+shoreN(p.x+91.0));
  return a*b;}
float hills(vec2 p){return 1.2*sin(p.x*0.021+1.3)*cos(p.y*0.017)+0.7*sin(p.x*0.05+p.y*0.043)+0.25*sin(p.x*0.13-p.y*0.11+2.0);}
float terrainH(vec2 p){return mix(hills(p),uLake.w,lakeMask(p));}
`;
const G_WIND=`
vec2 windAt(vec2 p){
  vec2 w=textureLod(uWind,p/128.0,0.0).xy*(1.0-smoothstep(84.0,96.0,distance(p,uCam.xz)));
  float g=textureLod(uNoise,p*0.0055-uAmbOff*0.035,0.0).r;
  float g2=textureLod(uNoise,p*0.021-uAmbOff*0.09,0.0).g;
  w+=uAmb.xy*uAmb.z*(0.2+2.4*g*g+0.5*g2);
  for(int i=0;i<4;i++){vec4 s=uShock[i];float age=uTime-s.z;
    if(s.w>0.0&&age>0.0&&age<5.0){vec2 d=p-s.xy;float r=length(d)+1e-3;float fr=age*13.0+1.0;
      float q=(r-fr)/(1.8+age*0.9);float gg=exp(-q*q)*s.w*exp(-age*0.75);w+=d/r*gg*9.0;}}
  return w;}
`;
const G_LIGHT=`
vec3 hazeCol(vec3 rd){float sd=max(dot(rd,uSunDir),0.0);return uHorizon+uGlowCol*(pow(sd,6.0)*0.20+pow(sd,2.5)*0.08);}
vec3 fogged(vec3 col,vec3 wp){vec3 v=wp-uCam;float d=length(v);float f=1.0-exp(-d*uFog.x);return mix(col,hazeCol(v/d),f);}
float cloudShadow(vec2 p){float c=textureLod(uNoise,p*0.0032+uCloud.yz*1.3,0.0).r;return 1.0-uFog.y*smoothstep(0.48,0.66,c);}
float wheatAmt(vec2 p){float n=textureLod(uNoise,p*0.004,0.0).b;float z=p.y+(n-0.5)*36.0;
  return smoothstep(uZone.x,uZone.x+20.0,z)*(1.0-smoothstep(uZone.y-18.0,uZone.y,z));}
`;
const G_SKY=`
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec3 starField(vec3 rd){
  vec3 acc=vec3(0.0);
  vec3 mwn=normalize(vec3(0.6,0.75,-0.19));
  float band=dot(rd,mwn);float mw=exp(-band*band*24.0);
  vec2 base=rd.xz/(rd.y+0.55);
  for(int L=0;L<2;L++){
    float sc=L==0?46.0:104.0;
    vec2 uv=base*sc;vec2 id=floor(uv);vec2 f=fract(uv)-0.5;
    float h=hash21(id+float(L)*17.0);
    vec2 o=(vec2(hash21(id+3.1),hash21(id+7.7))-0.5)*0.7;
    float d=length(f-o);
    float thr=(L==0?0.80:0.60)-mw*0.2;
    float b=max(h-thr,0.0)/(1.0-thr);
    float tw=0.72+0.28*sin(uTime*(1.5+h*5.0)+h*80.0);
    float rad=L==0?0.12:0.17;
    float s=smoothstep(rad,0.0,d);
    vec3 tint=mix(vec3(0.72,0.84,1.0),vec3(1.0,0.9,0.74),hash21(id+1.3));
    acc+=tint*s*s*b*b*tw*(L==0?3.6:1.2);
  }
  vec2 muv=vec2(dot(rd,normalize(vec3(0.76,-0.6,0.25))),band)*1.25;
  float mn=texture(uNoise,muv).r;float mn2=texture(uNoise,muv*3.1+0.37).g;
  acc+=mw*(0.22+0.55*mn)*(0.55+0.6*mn2)*vec3(0.36,0.44,0.74)*0.4;
  acc+=mw*mw*smoothstep(0.30,0.62,mn*mn2*2.0)*vec3(0.95,0.72,0.5)*0.1;
  return acc;}
vec3 skyColor(vec3 rd){
  float y=rd.y;

const propList=[];

  const cx=(C.x*0.5+0.5)*W,cy=(0.5-C.y*0.5)*H,vx=(cx-pcx)/Math.max(dt,1e-3),vy=(cy-pcy)/Math.max(dt,1e-3),sp=Math.hypot(vx,vy);pcx=cx;pcy=cy;
  if(S.awake&&sp<W*12){wAcc+=Math.min(sp/d,2600)*dt*0.028+C.charge*dt*26;
    while(wAcc>1){wAcc-=1;if(wisps.length>150)break;
      if(C.down){const a=rnd()*TAU,r=(14+rnd()*26)*d;wisps.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:-Math.sin(a)*240*d,vy:Math.cos(a)*240*d,age:0,life:0.35+rnd()*0.3,sw:1})}
      else wisps.push({x:cx+(rnd()-.5)*52*d,y:cy+(rnd()-.5)*52*d,vx:vx*(0.22+rnd()*0.3),vy:vy*(0.22+rnd()*0.3),age:0,life:0.45+rnd()*0.6,sw:0})}}
  fc.lineCap='round';fc.lineWidth=1.1*d;
  for(let i=wisps.length-1;i>=0;i--){const w=wisps[i];w.age+=dt;if(w.age>w.life){wisps[i]=wisps[wisps.length-1];wisps.pop();continue}
    if(w.sw){const dx=w.x-cx,dy=w.y-cy,r=Math.hypot(dx,dy)+1;w.vx+=(-dx/r*900*d)*dt;w.vy+=(-dy/r*900*d)*dt}
    w.x+=w.vx*dt;w.y+=w.vy*dt;const k=Math.exp(-dt*2.6);w.vx*=k;w.vy*=k;
    const a=Math.sin(Math.PI*w.age/w.life)*0.46;
    fc.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';fc.beginPath();fc.moveTo(w.x,w.y);fc.lineTo(w.x-w.vx*0.085,w.y-w.vy*0.085);fc.stroke()}
  const ca=S.ended?0.35:(C.user?0.75:0.3);
  fc.strokeStyle='rgba(255,255,255,'+ca+')';fc.lineWidth=1.2*d;fc.beginPath();fc.arc(cx,cy,(5+3*S.energy-2*C.charge)*d,0,TAU);fc.stroke();
  if(C.charge>0.02){fc.strokeStyle='rgba(255,236,190,0.85)';fc.lineWidth=1.6*d;fc.beginPath();fc.arc(cx,cy,(15+9*C.charge)*d,S.clock*5,S.clock*5+C.charge*TAU*0.92);fc.stroke()}
}
function onResized(){if(shape.on){shapeStart();shape.t0=S.clock-20;shape.done=false}}

/* ---------------- 流程 ---------------- */
function start(){
  if(S.started)return;audioInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  S.started=true;S.t=0;S.tEnv=0;P.lastMove=S.clock;P.acc=0;
  $('gate').classList.add('gone');stage.classList.add('live');$('scrim').classList.add('on');$('prog').classList.add('on');
}
function resetWorld(){
  S.t=0;S.tEnv=0;S.awake=false;S.ended=false;S.camX=0;S.steer=0;S.yaw=0;S.energy=0;S.ambRamp=0;S.stats={dand:0,pin:0,lan:0,fly:0};
  parts.length=0;dandCells.clear();pinCells.clear();lanCells.clear();streamT=0;gold.on=false;gold.trail.length=0;gold.light=0;gold.landSet=false;
  wu.fill(0);wv.fill(0);wu2.fill(0);wv2.fill(0);clearF.fill(0);shocks.fill(0);
  rec.pts.length=0;rec.bursts.length=0;rec.total=rec.user=0;rec.lx=rec.ly=9;shape.on=false;shape.done=false;
  A.on=false;A.holding=0;C.charge=0;C.fresh=true;C.down=false;P.acc=0;P.lastMove=S.clock;
  evalKeys(0);updateCamera(0,true);
}
function restart(){
  resetWorld();sceneFade=0;AU.chordKey='';prevMusT=0;capCur=-1;chapCur=-1;
  elEnd.classList.remove('on');elCap.classList.remove('on');elCap.classList.add('off');hideTitle();$('prog').classList.add('on');
}
function seek(t){ // 调试用：直接跳到某个时间点
  if(!S.started)start();
  if(t<S.t)resetWorld();
  S.t=t;S.tEnv=t;if(t>=T.awake&&!S.awake){S.awake=true;S.ambRamp=1;S.awakeClock=S.clock-30}
  if(t<T.card){S.ended=false;elEnd.classList.remove('on');shape.on=false}
  evalKeys(t);updateCamera(0,true);streamT=0;prevMusT=t;
}
let lastNow=0,ema=0.016,slowT=0,frames=0;
function frame(now){
  requestAnimationFrame(frame);
  let raw=(now-lastNow)/1000;lastNow=now;if(!(raw>0)||raw>1)raw=0.016;const dt=Math.min(raw,0.05);
  S.clock+=dt;frames++;
  if(S.started)S.t=Math.min(S.t+dt,T.card+34);
  S.tEnv+=(S.t-S.tEnv)*(1-Math.exp(-dt*(S.t-S.tEnv>2?1.1:3.2)));
  evalKeys(S.tEnv);
  dirFrom(env.sunEl,env.sunAz,sunDir);
  {const k=sstep(139,147,S.tEnv);dirFrom(Math.max(env.sunEl,6),env.sunAz,lightDir);
    lightDir[0]=lerp(lightDir[0],moonDir[0],k);lightDir[1]=lerp(lightDir[1],moonDir[1],k);lightDir[2]=lerp(lightDir[2],moonDir[2],k);
    const l=Math.hypot(lightDir[0],lightDir[1],lightDir[2]);lightDir[0]/=l;lightDir[1]/=l;lightDir[2]/=l}
  cloudOff[0]+=amb.x*dt*0.0035*(0.3+amb.amp);cloudOff[1]+=amb.z*dt*0.0035*(0.3+amb.amp);
  updateCamera(dt,false);updateCursor(dt);windStep(dt);updateProps(dt);updateParts(dt);updateGold(dt);
  const fadeT=S.started?(S.ended?0.62:1):0.45;sceneFade+=(fadeT-sceneFade)*(1-Math.exp(-dt*(S.ended?0.5:0.7)));
  render();drawFx(dt);updateUI();audioUpdate(dt);
  // 自适应画质：持续掉帧就降一档
  ema=ema*0.95+raw*0.05;
  if(S.clock>2.5&&ema>0.0215&&RT.q<QUAL.length-1){slowT+=dt;if(slowT>1.5){RT.q++;slowT=0;ema=0.016;resize()}}else slowT=Math.max(0,slowT-dt*0.5);
}

/* ---------------- 事件 ---------------- */
function ptr(e){const r=stage.getBoundingClientRect(),nx=clamp((e.clientX-r.left)/r.width*2-1,-1,1),ny=clamp(1-(e.clientY-r.top)/r.height*2,-1,1);
  if(S.started){P.acc+=Math.hypot(nx-P.x,ny-P.y);P.lastMove=S.clock}P.x=nx;P.y=ny}
addEventListener('pointermove',ptr,{passive:true});
stage.addEventListener('pointerdown',e=>{if(!S.started||e.target.closest('button'))return;ptr(e);P.down=true;P.lastMove=S.clock;P.acc+=0.2});
addEventListener('pointerup',()=>{P.down=false});addEventListener('pointercancel',()=>{P.down=false});addEventListener('blur',()=>{P.down=false});
stage.addEventListener('contextmenu',e=>e.preventDefault());
$('gate').addEventListener('click',start);
$('again').addEventListener('click',e=>{e.stopPropagation();restart()});
$('mute').addEventListener('click',e=>{e.stopPropagation();setMute(!AU.muted)});
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
$('full').addEventListener('click',e=>{e.stopPropagation();toggleFull()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='m')setMute(!AU.muted);else if(k==='f')toggleFull();
  else if((k==='enter'||k===' ')&&!S.started){e.preventDefault();start()}});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else if(S.started)AU.ctx.resume()});

evalKeys(0);resize();updateCamera(0,true);
window.__film={S,C,P,env,rec,AU,RT,Z,clearF,gold,glerr:()=>gl.getError(),resize,bench:n=>{const t=performance.now();for(let i=0;i<n;i++)render();const px=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);return(performance.now()-t)/n},seek,start,restart,parts,zAt,info:()=>({t:S.t,q:RT.q,ms:RT.ms,hdr:HDR,w:RT.w,h:RT.h,parts:parts.length,ema,frames,stats:S.stats,awake:S.awake,auto:S.auto,cam:[S.camX,S.camY,S.camZ]})};
{const m=/[?&]t=([\d.]+)/.exec(location.search);if(m)$('gate').addEventListener('click',()=>seek(parseFloat(m[1])),{once:true})}
requestAnimationFrame(t=>{lastNow=t;requestAnimationFrame(frame)});
})();
</script>
